// Settled means the person has actually been paid back.
// Where each person stands: what they spent, what has been squared up, and
// whether anything is still owed. Standard reimbursement reconciliation.
function partnerPositions(expenses){
  const m = {};
  (expenses||[]).forEach(e => {
    const k = e.paidBy || "Not set";
    if (!m[k]) m[k] = { person:k, count:0, spent:0, viaClaim:0, viaDirect:0, owed:0, rows:[] };
    const amt = Number(e.amount||0);
    const g = m[k];
    g.count++; g.spent += amt; g.rows.push(e);
    if (e.claimId) g.viaClaim += amt;
    else if (String(e.paidDate||"").trim()) g.viaDirect += amt;
    else g.owed += amt;
  });
  return Object.values(m).map(g => {
    const settled = g.viaClaim + g.viaDirect;
    return {
      ...g,
      settled,
      status: g.owed < 0.5 ? "Fully reconciled"
            : settled > 0.5 ? "Part settled"
            : "Nothing settled",
    };
  }).sort((a,b) => b.owed - a.owed || b.spent - a.spent);
}

function promoteSalaryLedgers(vendors, entries){
  let changed = false;
  const promote = new Set();
  entries.forEach(r => {
    if (!r.vendorId) return;
    if (!looksLikeSalary(r.category, r.subCategory)) return;
    const v = vendors.find(x => x.id === r.vendorId);
    // Only promote ledgers still on the default type. A deliberate Owner or
    // Partner is never overwritten by a stray salary entry.
    if (v && (!v.ledgerType || v.ledgerType === "Vendor")) { promote.add(v.id); changed = true; }
  });
  if (!changed) return null;
  return {
    vendors: vendors.map(v => promote.has(v.id) ? { ...v, ledgerType:"Employee" } : v),
    names: vendors.filter(v => promote.has(v.id)).map(v => v.name),

// Within one day, money in is counted before money out. A cash book works this
// way: you cannot spend at 11am from a withdrawal made at 4pm, but the day's
// takings are what fund the day's spending, so counting spends first would show
// a negative balance that never actually happened.
const CASH_ORDER = { Refill: 0, Return: 1, Spend: 2 };

// Two ways to read a cash book.
//  "entry" - the order the lines were written, which is what a running balance
//            in a hand-kept book follows. Imports keep the file's row order, so
//            this reproduces the sheet line for line.
//  "date"  - strict date order, with money in counted before money out on the
//            same day.
function cashOrderBy(mode){
  if (mode === "date") {
    return (a, b) => {
      const da = a.date || "9999-99-99", db = b.date || "9999-99-99";
      const d = String(da).localeCompare(String(db));
      if (d) return d;
      const t = (CASH_ORDER[a.type] ?? 3) - (CASH_ORDER[b.type] ?? 3);
      if (t) return t;
      return (a.createdAt||0) - (b.createdAt||0);
    };
  }
  return (a, b) =>
    (Number(a.createdAt||0) - Number(b.createdAt||0)) ||
    (Number(a.seq||0) - Number(b.seq||0));
}

function cashOrder(a, b){
  // A cash book is written in order and its running balance follows that order,
  // so when we know the line number we use it and reproduce the sheet exactly.
  const sa = Number(a.seq || 0), sb = Number(b.seq || 0);
  if (sa && sb) return sa - sb;
  // Otherwise by date. A blank date goes last rather than first, so undated
  // entries never appear before the money that funded them.
  const da = a.date || "9999-99-99", db = b.date || "9999-99-99";
  const d = String(da).localeCompare(String(db));
  if (d) return d;
  // Same day: money in before money out.
  const t = (CASH_ORDER[a.type] ?? 3) - (CASH_ORDER[b.type] ?? 3);
  if (t) return t;
  return (a.createdAt||0) - (b.createdAt||0);
}

// The lowest the balance ever goes. If that is below zero, cash in hand went
// negative, which cannot happen - so either the opening balance is missing or
// an entry is out of order.
function lowestBalance(card, txns, mode){
  let bal = 0, low = 0;
  txns.filter(t => t.cardId === card.id).sort(cashOrderBy(mode)).forEach(t => {
    bal += t.type === "Refill" ? Number(t.amount||0) : -Number(t.amount||0);
    if (bal < low) low = bal;
  });
  return low;
}

function cardBalance(card, txns){
  let bal = 0;
  txns.forEach(t => {
    if (t.cardId !== card.id) return;
    const amt = Number(t.amount || 0);
    if (t.type === "Refill") bal += amt;
    else bal -= amt;              // Spend and Return both reduce cash in hand
  });
  return bal;
}

// litres per hour, or km per litre, from consecutive meter readings
function machineEfficiency(machineId, entries, meterType){
  const rows = entries
    .filter(e => e.type === "Issue" && e.machineId === machineId && e.meterReading !== "" && e.meterReading != null)
    .sort((a,b) => String(a.date||"").localeCompare(String(b.date||"")));
  if (rows.length < 2) return null;
  const first = Number(rows[0].meterReading || 0);
  const last  = Number(rows[rows.length-1].meterReading || 0);
  const span  = last - first;
  if (span <= 0) return null;
  // fuel counted after the first reading, since that reading is the baseline
  const litres = rows.slice(1).reduce((s,e)=>s+Number(e.litres||0), 0);
  if (litres <= 0) return null;
  return meterType === "Kilometres"
    ? { value: span / litres, unit: "km/L", span, litres }
    : { value: litres / span, unit: "L/hr", span, litres };
}

const emptyLedgerEntry = { id:"", vendorId:"", date:"", kind:"Advance to them", amount:"", note:"", createdAt:0 };
const LEDGER_KINDS = [
  { k:"Advance to them",   side:"they", help:"Money paid before any bill. They owe it back in goods or cash." },
  { k:"Received from them", side:"they-", help:"Money they returned or a credit note they issued." },

  { k:"Opening - they owe", side:"they", help:"What they already owed you when you started." },
];

function partyBalance(vendor, reqs, entries){
  const mine = (r) => r.vendorId === vendor.id ||
    (!r.vendorId && String(r.name||"").trim().toLowerCase() === String(vendor.name||"").trim().toLowerCase());
  const rows = (reqs||[]).filter(r => mine(r) && !isRolledUp(r));

  const billed = rows.reduce((a,r)=>a+Number(r.amount||0), 0);
  const paid = rows.filter(isInRegister)
    .reduce((a,r)=>a+Number(r.paidAmount === "" || r.paidAmount == null ? r.amount : r.paidAmount || 0), 0);
  const openReqs = rows.filter(r => !isInRegister(r)).reduce((a,r)=>a+Number(r.amount||0), 0);
  const overpaid = rows.reduce((a,r)=>a+excessPaid(r), 0);

  let weOwe = openReqs, theyOwe = overpaid;
  (entries||[]).filter(e => e.vendorId === vendor.id).forEach(e => {
    const amt = Number(e.amount||0);
    const def = LEDGER_KINDS.find(x => x.k === e.kind);
    if (!def) return;
    if (def.side === "we") weOwe += amt;
    else if (def.side === "they") theyOwe += amt;
    else if (def.side === "they-") theyOwe -= amt;
  });

  const net = weOwe - theyOwe;
  return { billed, paid, openReqs, overpaid, weOwe, theyOwe, net,
           side: Math.abs(net) < 0.5 ? "settled" : (net > 0 ? "creditor" : "debtor"),
           rows };
}

// Reference numbers are the guard against the same payment being entered twice.
// The month comes from the entry's own date, and the number is checked against
// every reference already in use, so two entries can never share one.
function nextRefNo(reqs, dateStr){
  const taken = new Set((reqs||[]).map(r => r && r.refNo).filter(Boolean));
  const ym = (dateStr && /^\d{4}-\d{2}/.test(dateStr) ? dateStr : todayStr()).slice(0,7).replace("-","");
  const prefix = `PR-${ym}-`;
  let max = 0;
  taken.forEach(ref => {
    if (String(ref).startsWith(prefix)) {
      const n = parseInt(String(ref).slice(prefix.length), 10);
      if (!isNaN(n) && n > max) max = n;
    }
  });
  let n = max + 1, ref;
  do { ref = prefix + String(n).padStart(4, "0"); n++; } while (taken.has(ref));
  return ref;
}

// Two entries that share a date, payee and amount are almost always the same
// payment entered twice. Same UTR is certain.
function duplicateKeyOf(r){
  return [r.date||"", String(r.site||"").trim().toLowerCase(),
          String(r.name||"").trim().toLowerCase(), Number(r.amount||0)].join("|");
}
function findDuplicateReqs(reqs){
  const list = (reqs||[]).filter(r => !isRolledUp(r));
  const groups = [];
  const seen = new Set();

  // Signature of a group, so one you have already dismissed stays dismissed.
  const sigOf = (rows) => rows.map(r=>r.id).sort().join(",");
  const dismissed = (rows) => {
    const sig = sigOf(rows);
    return rows.every(r => Array.isArray(r.dupOk) && r.dupOk.includes(sig));
  };

  const push = (rows, level, why) => {
    if (rows.length < 2) return;
    const sig = sigOf(rows);
    if (seen.has(sig) || dismissed(rows)) return;
    seen.add(sig);
    groups.push({ sig, level, why, rows });
  };

  const bucket = (keyFn) => {
    const m = {};
    list.forEach(r => { const k = keyFn(r); if (k) (m[k] = m[k] || []).push(r); });
    return Object.values(m);
  };

  // Certain. A bank issues one UTR, and a reference number is ours to keep unique.
  bucket(r => { const u = String(r.utr||"").trim().toLowerCase(); return u ? "u|"+u : ""; })
    .forEach(g => push(g, "certain", "same UTR"));
  bucket(r => { const f = String(r.refNo||"").trim().toLowerCase(); return f ? "f|"+f : ""; })
    .forEach(g => push(g, "certain", "same reference number"));

  // Very likely. Same day, same site, same payee, same amount and the same wording.
  bucket(r => {
    const d = String(r.date||"").trim();
    if (!d) return "";
    return ["k", d, String(r.site||"").trim().toLowerCase(),
            String(r.name||"").trim().toLowerCase(), Number(r.amount||0),
            String(r.description||"").trim().toLowerCase()].join("|");
  }).forEach(g => push(g, "likely", "same date, site, payee, amount and description"));

  // Worth a look. Everything matches except the wording, which often means a
  // second genuine payment - a second load, a second week's labour.
  bucket(r => {
    const d = String(r.date||"").trim();
    if (!d) return "";
    return ["p", d, String(r.site||"").trim().toLowerCase(),
            String(r.name||"").trim().toLowerCase(), Number(r.amount||0)].join("|");
  }).forEach(g => push(g, "possible", "same date, site, payee and amount, but different wording"));

  const rank = { certain:0, likely:1, possible:2 };
  return groups.sort((a,b) => rank[a.level] - rank[b.level]);
}

function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,8); }
function todayStr(){ return new Date().toISOString().slice(0,10); }
function makeSalt(){
  return Math.random().toString(36).slice(2, 12) + Date.now().toString(36);
}
async function hashPin(pin, salt){
  const text = String(salt) + "|" + String(pin);
  if (window.crypto && window.crypto.subtle) {
    try {
      const buf = await window.crypto.subtle.digest("SHA-256", new TextEncoder().encode(text));
      return "s2-" + Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2,"0")).join("");
    } catch(e) { /* not available from a local file — use the fallback */ }
  }
  let h1 = 0x811c9dc5, h2 = 0x01000193;
  for (let i = 0; i < text.length; i++) {
    const c = text.charCodeAt(i);
    h1 = Math.imul(h1 ^ c, 0x01000193) >>> 0;
    h2 = Math.imul(h2 ^ c, 0x85ebca6b) >>> 0;
  }
  return "fb-" + h1.toString(16) + h2.toString(16);
}

function fmtDate(iso){
  if (!iso) return "";
  const t = String(iso).trim();
  const m = t.match(/^(\d{4})-(\d{2})-(\d{2})/);
  return m ? `${m[3]}-${m[2]}-${m[1]}` : t;
}
function fmtINR(n){ return (Number(n)||0).toLocaleString("en-IN", { maximumFractionDigits: 2 }); }
const PER_MONTH = { Monthly:1, Quarterly:1/3, "Half-Yearly":1/6, Yearly:1/12, "One-time":0 };

// Frequencies arrive from spreadsheets in every possible spelling. Anything we
// cannot recognise is treated as Monthly and flagged, never silently valued at zero.
function monthlyFactor(freq){
  const f = String(freq || "").trim().toLowerCase();
  if (!f) return { factor:1, assumed:true };
  if (PER_MONTH[freq] !== undefined) return { factor:PER_MONTH[freq], assumed:false };
  if (f.indexOf("quarter") >= 0) return { factor:1/3, assumed:false };
  if (f.indexOf("half") >= 0 || f.indexOf("semi") >= 0) return { factor:1/6, assumed:false };
  if (f.indexOf("year") >= 0 || f.indexOf("annual") >= 0) return { factor:1/12, assumed:false };
  if (f.indexOf("one") >= 0 || f.indexOf("once") >= 0) return { factor:0, assumed:false };
  if (f.indexOf("week") >= 0) return { factor:52/12, assumed:false };
  if (f.indexOf("day") >= 0 || f.indexOf("daily") >= 0) return { factor:30, assumed:false };
  if (f.indexOf("month") >= 0) return { factor:1, assumed:false };
  return { factor:1, assumed:true };
}

const emptyRecurring = { id:"", name:"", type:"House Rent", costGroup:"", vendorId:"", ownerName:"",

const COST_GROUPS = ["Rent", "Instalment", "Other"];
// Guess from the type text, but the saved costGroup always wins.
function inferGroup(r){
  const t = String(r.type || "") + " " + String(r.name || "");
  if (/instal|emi|loan|financ|hypothec/i.test(t)) return "Instalment";
  if (/rent|lease|hire/i.test(t)) return "Rent";
  return "Other";
}
function costGroupOf(r){
  return COST_GROUPS.includes(r.costGroup) ? r.costGroup : inferGroup(r);
}
function isInstalment(r){ return costGroupOf(r) === "Instalment"; }
function isRent(r){ return costGroupOf(r) === "Rent"; }
function instalmentDone(r){
  const total = Number(r.totalInstallments || 0);
  const paid  = Number(r.installmentsPaid || 0);
  return total > 0 && paid >= total;
}
// Rent and instalments are different animals, so they are never added together.
function commitmentSplit(recurring){
  const live = (recurring || []).filter(r => r.active !== false && !instalmentDone(r));
  const monthlyOf = (r) => Number(r.amount || 0) * monthlyFactor(r.frequency).factor;
  const assumedFreq = live.filter(r => monthlyFactor(r.frequency).assumed && Number(r.amount||0) > 0);
  const zeroAmount = live.filter(r => !Number(r.amount || 0));

  const rents  = live.filter(r => costGroupOf(r) === "Rent");
  const emis   = live.filter(r => costGroupOf(r) === "Instalment");
  const others = live.filter(r => costGroupOf(r) === "Other");

  const oneTime = live.filter(r => r.frequency === "One-time");

  const emiOutstanding = emis.reduce((s,r) => {
    const total = Number(r.totalInstallments || 0);
    const paid  = Number(r.installmentsPaid || 0);
    const left  = total > 0 ? Math.max(0, total - paid) : 0;
    return s + left * Number(r.amount || 0);
  }, 0);

  const rentMonthly  = rents.reduce((s,r)=>s+monthlyOf(r), 0);
  const emiMonthly   = emis.reduce((s,r)=>s+monthlyOf(r), 0);
  const otherMonthly = others.reduce((s,r)=>s+monthlyOf(r), 0);

  return {
    rents, emis, others, oneTime,
    rentMonthly, emiMonthly, otherMonthly,
    totalMonthly: rentMonthly + emiMonthly + otherMonthly,
    emiOutstanding,
    oneTimeTotal: oneTime.reduce((s,r)=>s+Number(r.amount||0), 0),
    emisWithoutSchedule: emis.filter(r => !Number(r.totalInstallments)).length,
    liveCount: live.length,
    excluded: (recurring||[]).filter(r => r.active === false || instalmentDone(r)),
    assumedFreq, zeroAmount,
    rentTotalValue: rents.reduce((s,r)=>s+Number(r.amount||0), 0),
    emiTotalValue: emis.reduce((s,r)=>s+Number(r.amount||0), 0),
  };
}

function addInterval(dateStr, frequency){
  const d = new Date(dateStr + "T00:00:00");
  if (frequency==="Monthly") d.setMonth(d.getMonth()+1);
  else if (frequency==="Quarterly") d.setMonth(d.getMonth()+3);
  else if (frequency==="Half-Yearly") d.setMonth(d.getMonth()+6);
  else if (frequency==="Yearly") d.setFullYear(d.getFullYear()+1);
  return d.toISOString().slice(0,10);
}
function daysUntil(dateStr){
  if (!dateStr) return 9999;
  const today = new Date(todayStr() + "T00:00:00");
  const due = new Date(dateStr + "T00:00:00");
  return Math.round((due - today) / (1000*60*60*24));
}
function generateRequisitionFromRecurring(item, reqs, setReqs, recurring, setRecurring, showToast){
  const record = {
    ...emptyReq, id: uid(), refNo: nextRefNo(reqs), date: todayStr(), site: item.site,
    category: item.category || item.type, subCategory: item.subCategory,
    vendorId: item.vendorId, name: item.ownerName || item.name, amount: item.amount,
    description: `Recurring — ${item.type}${item.frequency!=="One-time" ? " ("+item.frequency+")" : ""}`,
    paymentStatus: "Pending", accNo: item.accNo, ifsc: item.ifsc,
    exported:false, createdAt: Date.now(), recurringId: item.id,
  };
  setReqs([...reqs, record]);
  const updatedItem = { ...item };
  if (item.frequency === "One-time") { updatedItem.active = false; }
  else { updatedItem.nextDueDate = addInterval(item.nextDueDate, item.frequency); }
  if (item.type === "Machinery Installment" && item.installmentsPaid !== "") {
    updatedItem.installmentsPaid = (Number(item.installmentsPaid)||0) + 1;
    if (Number(item.totalInstallments) && updatedItem.installmentsPaid >= Number(item.totalInstallments)) updatedItem.active = false;
  }
  setRecurring(recurring.map(r => r.id===item.id ? updatedItem : r));
  showToast(`Requisition created for ${item.name} — go to Export tab to send it`);
}

const FS_SUPPORTED = typeof window !== "undefined" && typeof window.showSaveFilePicker === "function";
const IDB_NAME = "erp-store", IDB_STORE = "handles", HANDLE_KEY = "dataFileHandle";

function idbOpen(){
  return new Promise((res, rej) => {
    const r = indexedDB.open(IDB_NAME, 1);
    r.onupgradeneeded = () => { r.result.createObjectStore(IDB_STORE); };
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
  });
}
async function idbSet(key, val){
  const db = await idbOpen();
  return new Promise((res, rej) => {
    const tx = db.transaction(IDB_STORE, "readwrite");
    tx.objectStore(IDB_STORE).put(val, key);
    tx.oncomplete = () => res(true);
    tx.onerror = () => rej(tx.error);
  });
}
async function idbGet(key){
  const db = await idbOpen();
  return new Promise((res, rej) => {
    const tx = db.transaction(IDB_STORE, "readonly");
    const rq = tx.objectStore(IDB_STORE).get(key);
    rq.onsuccess = () => res(rq.result);
    rq.onerror = () => rej(rq.error);
  });
}
async function idbDel(key){
  const db = await idbOpen();
  return new Promise((res, rej) => {
    const tx = db.transaction(IDB_STORE, "readwrite");
    tx.objectStore(IDB_STORE).delete(key);
    tx.oncomplete = () => res(true);
    tx.onerror = () => rej(tx.error);
  });
}
async function verifyPermission(handle){
  try {
    const opts = { mode: "readwrite" };
    if ((await handle.queryPermission(opts)) === "granted") return true;
    if ((await handle.requestPermission(opts)) === "granted") return true;
    return false;
  } catch(e){ return false; }
}

function jsonpFetch(url, timeoutMs){
  return new Promise((resolve, reject) => {
    const cb = "erpcb_" + Math.random().toString(36).slice(2, 10);
    const script = document.createElement("script");
    let done = false;
    const cleanup = () => {
      try { delete window[cb]; } catch(e) { window[cb] = undefined; }
      if (script.parentNode) script.parentNode.removeChild(script);
    };
    const timer = setTimeout(() => {
      if (done) return;
      done = true; cleanup();
      reject(new Error("The sheet did not respond. Check the web app URL and that access is set to Anyone."));
    }, timeoutMs || 25000);
    window[cb] = (data) => {
      if (done) return;
      done = true; clearTimeout(timer); cleanup(); resolve(data);
    };
    script.onerror = () => {
      if (done) return;
      done = true; clearTimeout(timer); cleanup();
      reject(new Error("Could not reach the sheet. Check your internet connection and the URL."));
    };
    script.src = url + (url.indexOf("?") >= 0 ? "&" : "?") + "callback=" + cb + "&t=" + Date.now();
    document.body.appendChild(script);
  });
}

/* ---------- Google Drive backup: loaded only when actually used, so the
   app's normal offline operation never depends on this being reachable ---------- */
function loadGisScript(){
  return new Promise((resolve, reject) => {
    if (window.google && window.google.accounts && window.google.accounts.oauth2) { resolve(); return; }
    const existing = document.getElementById("gis-client-script");
    if (existing) {
      existing.addEventListener("load", () => resolve());
      existing.addEventListener("error", () => reject(new Error("Could not load Google sign-in — check your internet connection")));
      return;
    }
    const s = document.createElement("script");
    s.id = "gis-client-script";
    s.src = "https://accounts.google.com/gsi/client";
    s.async = true; s.defer = true;
    s.onload = () => resolve();
    s.onerror = () => reject(new Error("Could not load Google sign-in — check your internet connection"));
    document.head.appendChild(s);
  });
}
function loadPickerLibrary(){
  return new Promise((resolve, reject) => {
    if (window.google && window.google.picker) { resolve(); return; }
    const afterGapi = () => {
      window.gapi.load("picker", { callback: resolve, onerror: () => reject(new Error("Could not load Google's folder picker")) });
    };
    if (window.gapi && window.gapi.load) { afterGapi(); return; }
    const existing = document.getElementById("gapi-client-script");
    if (existing) {
      existing.addEventListener("load", afterGapi);
      existing.addEventListener("error", () => reject(new Error("Could not load Google's folder picker — check your internet connection")));
      return;
    }
    const s = document.createElement("script");
    s.id = "gapi-client-script";
    s.src = "https://apis.google.com/js/api.js";
    s.async = true; s.defer = true;
    s.onload = afterGapi;
    s.onerror = () => reject(new Error("Could not load Google's folder picker — check your internet connection"));
    document.head.appendChild(s);
  });
}
async function driveApiFetch(url, token, options){
  const res = await fetch(url, { ...options, headers: { ...(options && options.headers), Authorization: `Bearer ${token}` } });
  if (!res.ok) {
    let detail = "";
    try {
      const body = await res.clone().json();
      detail = (body && body.error && body.error.message) || "";
    } catch (e) { /* response wasn't JSON — fall back to the status code below */ }
    const err = new Error(detail ? `Drive: ${detail}` : `Drive API ${res.status}`);
    err.status = res.status;
    throw err;
  }
  return res;
}

/* ---------- save status chip (header) ---------- */
function daysSince(iso){
  if (!iso) return null;
  return Math.floor((Date.now() - new Date(iso).getTime()) / (1000*60*60*24));
}
function friendlyTime(iso){
  if (!iso) return "never";
  const d = new Date(iso);
  const days = daysSince(iso);
  if (days === 0) return `today ${d.toLocaleTimeString("en-IN", { hour:"2-digit", minute:"2-digit" })}`;
  if (days === 1) return "yesterday";
  return `${days} days ago`;
}

function SaveChip({ fileHandle, needsReconnect, dirty, saving, lastSaved, onTap,
                     driveConnected, driveSyncing, driveError, driveLastSynced }){
  let bg = "#3C7A5A", label = "Saved";
  if (saving || driveSyncing) { bg = MUTED; label = "Saving…"; }
  else if (needsReconnect) { bg = RED; label = "Reconnect"; }
  else if (driveConnected && driveError) { bg = RED; label = "Drive sync issue"; }
  else if (driveConnected) { bg = "#3C7A5A"; label = `Synced ${friendlyTime(driveLastSynced)}`; }
  else if (!fileHandle) { bg = AMBER; label = daysSince(lastSaved) === null ? "Not backed up" : `Backup ${friendlyTime(lastSaved)}`; }
  else if (dirty) { bg = AMBER; label = "Saving…"; }

    <button onClick={onTap}

  const hasAutoBackup = fileHandle || (driveConnected && !driveError);

    action = "Check Drive backup";

/* ---------- PIN lock screen ---------- */
function LockScreen({ settings, onUnlock, onForgot }){
  const [pin, setPin] = useState("");
  const [error, setError] = useState("");
  const [tries, setTries] = useState(0);
  const [waitUntil, setWaitUntil] = useState(0);
  const [, tick] = useState(0);

  useEffect(() => {
    if (!waitUntil) return;
    const t = setInterval(() => tick(x => x + 1), 500);
    return () => clearInterval(t);
  }, [waitUntil]);

  const cooling = waitUntil > Date.now();
  const secsLeft = cooling ? Math.ceil((waitUntil - Date.now()) / 1000) : 0;

  async function submit(value){
    if (cooling) return;
    const hash = await hashPin(value, settings.pinSalt);
    if (hash === settings.pinHash) { setPin(""); setError(""); setTries(0); onUnlock(); return; }
    const n = tries + 1;
    setTries(n);
    setPin("");
    if (n >= 5) {
      setWaitUntil(Date.now() + 30000);
      setError("Too many wrong attempts. Wait 30 seconds.");
    } else {
      setError(`Wrong PIN. ${5 - n} attempt${5-n===1?"":"s"} before a pause.`);
    }
  }

  function press(d){
    if (cooling) return;
    setError("");
    const next = (pin + d).slice(0, 6);
    setPin(next);
    if (next.length === (settings.pinLength || 4)) submit(next);
  }

  const len = settings.pinLength || 4;

  return (
    <div style={{ minHeight:"100vh", background:INK, display:"flex", flexDirection:"column",
      alignItems:"center", justifyContent:"center", padding:"24px 20px" }}>
      <div style={{ color:"#fff", fontWeight:700, fontSize:20 }}>Business Ledger</div>
      <div style={{ color:"#8FA0BC", fontSize:13, marginTop:4, marginBottom:28 }}>Enter your PIN</div>

      <div style={{ display:"flex", gap:14, marginBottom:18 }}>
        {Array.from({ length: len }).map((_, i) => (
          <div key={i} style={{ width:16, height:16, borderRadius:"50%",
            background: i < pin.length ? AMBER : "transparent",
            border: `2px solid ${i < pin.length ? AMBER : "#2A3A5C"}` }} />
        ))}
      </div>

      <div style={{ minHeight:22, color: cooling ? "#FF9A8A" : "#FF9A8A", fontSize:13, fontWeight:600, marginBottom:14, textAlign:"center" }}>
        {cooling ? `Please wait ${secsLeft}s` : error}
      </div>

      <div style={{ display:"grid", gridTemplateColumns:"repeat(3, 74px)", gap:14, justifyContent:"center" }}>
        {["1","2","3","4","5","6","7","8","9"].map(d => (
          <button key={d} onClick={()=>press(d)} disabled={cooling}
            style={{ width:74, height:74, borderRadius:"50%", fontSize:26, fontWeight:600,
              background:"#1C2740", color:"#fff", border:"none", cursor: cooling ? "default":"pointer",
              opacity: cooling ? 0.4 : 1 }}>
            {d}
          </button>

/* ---------- shared list tools: selection, sorting, bulk actions ---------- */
function useSel(){
  const [sel, setSel] = useState(new Set());
  return {
    sel,
    size: sel.size,
    has: (id) => sel.has(id),
    toggle: (id) => setSel(prev => { const n = new Set(prev); n.has(id) ? n.delete(id) : n.add(id); return n; }),
    setAll: (ids) => setSel(new Set(ids)),
    clear: () => setSel(new Set()),
  };
}

function cmp(a, b){
  if (a === b) return 0;
  if (a === undefined || a === null || a === "") return 1;   // blanks last
  if (b === undefined || b === null || b === "") return -1;
  if (typeof a === "number" && typeof b === "number") return a - b;
  return String(a).localeCompare(String(b), undefined, { numeric:true, sensitivity:"base" });
}
function sortBy(list, getter, desc){
  const out = [...list].sort((x,y) => cmp(getter(x), getter(y)));
  return desc ? out.reverse() : out;
}

function matchText(q, parts){
  const t = String(q||"").trim().toLowerCase();
  if (!t) return true;
  const hay = parts.filter(x => x !== null && x !== undefined && x !== "").join(" ").toLowerCase();
  // every word must appear, so "steel cement" narrows rather than widens
  return t.split(/\s+/).every(w => hay.indexOf(w) >= 0);
}

function groupRows(list, keyFn, amountFn){
  const map = new Map();
  list.forEach(r => {
    const k = keyFn(r) || "Not set";
    if (!map.has(k)) map.set(k, { key:k, rows:[], total:0 });
    const g = map.get(k);
    g.rows.push(r);
    g.total += Number(amountFn ? amountFn(r) : (r.amount||0));
  });
  return [...map.values()];
}

// Dates are stored as 2026-08-15 but read as 15-08-2026, so both forms are
// searchable, along with the month on its own.
function dateTerms(...dates){
  const out = [];
  dates.filter(Boolean).forEach(d => {
    const t = String(d);
    out.push(t, fmtDate(t));
    const m = t.match(/^(\d{4})-(\d{2})-(\d{2})/);
    if (m) out.push(`${m[3]}-${m[2]}`, `${m[2]}-${m[1]}`, `${m[3]}/${m[2]}/${m[1]}`, monthLabel(t.slice(0,7)));
  });
  return out.join(" ");
}

function matches(query, ...fields){
  const q = String(query||"").trim().toLowerCase();
  if (!q) return true;
  const hay = fields.map(f => String(f==null?"":f)).join(" ").toLowerCase();
  return q.split(/\s+/).every(w => hay.indexOf(w) >= 0);
}

    const localVendors = loadKey("erp:vendors", []);
    const localReqs = loadKey("erp:requisitions", []);
    const localRecurring = loadKey("erp:recurring", []);
    const localSettings = loadKey("erp:settings", { gstApiKey:"" });
    setVendorsState(localVendors);
    setReqsState(localReqs);
    setRecurringState(localRecurring);
    setSettingsState(localSettings);
    setExpensesState(loadKey("erp:expenses", []));
    setSheetsState(loadKey("erp:sheets", []));
    setCardsState(loadKey("erp:cards", []));
    setCashTxnsState(loadKey("erp:cashTxns", []));
    setCashCountsState(loadKey("erp:cashCounts", []));
    setMachinesState(loadKey("erp:machines", []));
    setDieselState(loadKey("erp:diesel", []));
    setUtilitiesState(loadKey("erp:utilities", []));
    setLedgerEntriesState(loadKey("erp:ledgerEntries", []));
    setCompanyState(loadKey("erp:company", DEFAULT_COMPANY));
    setListsState(loadKey("erp:lists", DEFAULT_LISTS));
    setLoaded(true);

    if (!FS_SUPPORTED) return;
    idbGet(HANDLE_KEY).then(async (h) => {
      if (!h) return;
      setFileName(h.name || "your data file");
      let perm = "denied";
      try { perm = await h.queryPermission({ mode:"readwrite" }); } catch(e){}
      if (perm !== "granted") { setNeedsReconnect(true); return; }
      setFileHandle(h);
      // the file is the source of truth — pull from it if it has data this browser doesn't
      try {
        const data = await readFromFileHandle(h);
        if (!isValidPayload(data)) return;
        const localEmpty = localVendors.length === 0 && localReqs.length === 0 && localRecurring.length === 0;
        const localStamp = loadKey("erp:lastSaved", null);
        const fileNewer = data.savedAt && localStamp && new Date(data.savedAt) > new Date(localStamp);
        if (localEmpty || fileNewer) {
          const c = payloadCounts(data);
          if (localEmpty || confirm(
            `Your data file has a newer version.\n\nSaved: ${new Date(data.savedAt).toLocaleString("en-IN")}\nVendors: ${c.vendors}\nRequisitions: ${c.requisitions}\nRecurring: ${c.recurring}\n\nLoad it?`
          )) {
            applyPayload(data);
            setLastSaved(data.savedAt || null);
            saveKey("erp:lastSaved", data.savedAt || null);
            setDirty(false);
          }
        }
      } catch(e){ /* unreadable file — leave local data alone */ }
    }).catch(()=>{});
  }, []);

  const markDirty = useCallback(() => setDirty(true), []);

  // re-lock after the app has been away for a while
  useEffect(() => {
    function onVis(){
      if (!settings.pinEnabled || !settings.pinHash) return;
      if (document.hidden) { hiddenAtRef.current = Date.now(); return; }
      const mins = settings.autoLockMin === undefined ? 5 : Number(settings.autoLockMin);
      if (mins <= 0) { setLocked(true); return; }
      if (hiddenAtRef.current && Date.now() - hiddenAtRef.current > mins * 60000) setLocked(true);
    }
    document.addEventListener("visibilitychange", onVis);
    return () => document.removeEventListener("visibilitychange", onVis);
  }, [settings.pinEnabled, settings.pinHash, settings.autoLockMin]);

  // warn before leaving with unsaved changes
  useEffect(() => {
    function onBeforeUnload(e){
      if (!dirty) return;
      e.preventDefault();
      e.returnValue = "";
      return "";
    }
    window.addEventListener("beforeunload", onBeforeUnload);
    return () => window.removeEventListener("beforeunload", onBeforeUnload);
  }, [dirty]);

  const saveToFile = useCallback(async (silent) => {
    if (!fileHandle) return false;
    setSaving(true);
    try {
      const ok = await verifyPermission(fileHandle);
      if (!ok) { setNeedsReconnect(true); setSaving(false); return false; }
      const payload = buildBackupPayload();
      await writeToFileHandle(fileHandle, payload);
      const stamp = new Date().toISOString();
      setLastSaved(stamp); saveKey("erp:lastSaved", stamp);
      setDirty(false);
      setSaving(false);
      if (!silent) showToast("Saved to your data file");
      return true;
    } catch(e){
      setSaving(false);
      setNeedsReconnect(true);
      showToast("Could not write to the data file — reconnect it in Settings", "error");
      return false;
    }
  }, [fileHandle, showToast]);

  // debounced auto-save whenever data changes
  useEffect(() => {
    if (!loaded || !dirty || !fileHandle) return;
    const t = setTimeout(() => { saveToFile(true); }, 1200);
    return () => clearTimeout(t);
  }, [dirty, loaded, fileHandle, saveToFile]);

  // --- Google Drive backup ---
  const driveEnsureTokenClient = useCallback(async () => {
    await loadGisScript();
    if (!window.google || !google.accounts || !google.accounts.oauth2) {
      throw new Error("Google sign-in did not load");
    }
    if (!driveTokenClientRef.current) {
      driveTokenClientRef.current = google.accounts.oauth2.initTokenClient({
        client_id: GOOGLE_DRIVE_CLIENT_ID,
        scope: GOOGLE_DRIVE_SCOPE,
        callback: () => {}, // replaced per-request below
      });
    }
    return driveTokenClientRef.current;
  }, []);

  const driveGetFreshToken = useCallback(async (interactive) => {
    if (driveTokenRef.current && driveTokenRef.current.expires_at > Date.now()) {
      return driveTokenRef.current.access_token;
    }
    const tokenClient = await driveEnsureTokenClient();
    return new Promise((resolve, reject) => {
      tokenClient.callback = (resp) => {
        if (resp && resp.error) { reject(new Error(resp.error)); return; }
        driveTokenRef.current = {
          access_token: resp.access_token,
          expires_at: Date.now() + (Number(resp.expires_in || 3600) * 1000) - 60000,
        };
        resolve(driveTokenRef.current.access_token);
      };
      tokenClient.requestAccessToken({ prompt: interactive ? "consent" : "" });
    });
  }, [driveEnsureTokenClient]);

  const driveSyncNow = useCallback(async (isInitial) => {
    if (!isInitial && !driveConnected) return;
    if (driveSyncingRef.current) return;
    if (!GOOGLE_DRIVE_CLIENT_ID || GOOGLE_DRIVE_CLIENT_ID.indexOf("PASTE_YOUR") === 0) return;
    driveSyncingRef.current = true;
    setDriveSyncing(true);
    try {
      const token = await driveGetFreshToken(false);
      const payload = buildBackupPayload();
      const content = JSON.stringify(payload, null, 2);
      let fileId = driveFileId || loadKey("erp:driveFileId", "");

      const folderId = driveFolderId || loadKey("erp:driveFolderId", "");
      if (!fileId) {
        const metadata = { name: "ERP-Data.json", mimeType: "application/json" };
        if (folderId) metadata.parents = [folderId];
        const form = new FormData();
        form.append("metadata", new Blob([JSON.stringify(metadata)], { type: "application/json" }));
        form.append("file", new Blob([content], { type: "application/json" }));
        const res = await driveApiFetch(
          "https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id",
          token, { method: "POST", body: form }
        );
        const j = await res.json();
        fileId = j.id;
        setDriveFileId(fileId); saveKey("erp:driveFileId", fileId);
      } else {
        try {
          await driveApiFetch(
            `https://www.googleapis.com/upload/drive/v3/files/${fileId}?uploadType=media`,
            token, { method: "PATCH", headers: { "Content-Type": "application/json" }, body: content }
          );
        } catch (e) {
          if (e && e.status === 404) {
            // the file was removed on Drive's side — drop the stale id, next sync recreates it
            setDriveFileId(""); saveKey("erp:driveFileId", "");
          }
          throw e;
        }
      }

      const stamp = new Date().toISOString();
      setDriveLastSynced(stamp); saveKey("erp:driveLastSynced", stamp);
      setDriveError("");
      setDirty(false);
    } catch (e) {
      if (e && e.status === 401) {
        // Google rejected the saved sign-in — throw it away so the very next attempt
        // (auto-retry, Sync Now, or reopening the app) fetches a fresh one instead of
        // silently repeating the same rejected token until its hour-long timer runs out.
        driveTokenRef.current = null;
      }
      setDriveError((e && e.message) || "Sync failed");
    } finally {
      driveSyncingRef.current = false;
      setDriveSyncing(false);
    }
  }, [driveConnected, driveFileId, driveFolderId, driveGetFreshToken]);

  const driveChooseFolder = useCallback(async () => {
    if (!GOOGLE_DRIVE_PICKER_API_KEY || GOOGLE_DRIVE_PICKER_API_KEY.indexOf("PASTE_YOUR") === 0) {
      showToast("The folder picker isn't set up in this copy of the app yet — see README.md", "error");
      return;
    }
    try {
      const token = await driveGetFreshToken(true); // interactive — must run from this tap
      await loadPickerLibrary();
      await new Promise((resolve) => {
        const view = new google.picker.DocsView(google.picker.ViewId.FOLDERS)
          .setSelectFolderEnabled(true)
          .setIncludeFolders(true)
          .setMimeTypes("application/vnd.google-apps.folder");
        const picker = new google.picker.PickerBuilder()
          .addView(view)
          .setOAuthToken(token)
          .setDeveloperKey(GOOGLE_DRIVE_PICKER_API_KEY)
          .setOrigin(window.location.protocol + "//" + window.location.host)
          .setTitle("Choose the folder to back up into")
          .setCallback((data) => {
            if (data.action === google.picker.Action.PICKED && data.docs && data.docs[0]) {
              const folder = data.docs[0];
              (async () => {
                // If a backup file already exists somewhere else, move it into the
                // newly chosen folder instead of leaving a stray copy behind.
                const existingId = driveFileId || loadKey("erp:driveFileId", "");
                if (existingId) {
                  try {
                    const t2 = await driveGetFreshToken(false);
                    const metaRes = await driveApiFetch(
                      `https://www.googleapis.com/drive/v3/files/${existingId}?fields=parents`, t2
                    );
                    const meta = await metaRes.json();
                    const oldParents = (meta.parents || []).join(",");
                    const qs = `addParents=${folder.id}` + (oldParents ? `&removeParents=${oldParents}` : "");
                    await driveApiFetch(
                      `https://www.googleapis.com/drive/v3/files/${existingId}?${qs}`, t2, { method: "PATCH" }
                    );
                  } catch (e) { /* best-effort move — a fresh sync below still lands it right if this fails */ }
                }
                setDriveFolderId(folder.id); saveKey("erp:driveFolderId", folder.id);
                setDriveFolderName(folder.name || ""); saveKey("erp:driveFolderName", folder.name || "");
                showToast(`Backup folder set to ${folder.name || "the chosen folder"}`);
                driveSyncNow(true);
                resolve();
              })();
            } else if (data.action === google.picker.Action.CANCEL) {
              resolve();
            }
          })
          .build();
        picker.setVisible(true);
      });
    } catch (e) {
      showToast("Could not open the folder picker — try again", "error");
    }
  }, [driveGetFreshToken, driveFileId, driveSyncNow, showToast]);

  const connectDrive = useCallback(async () => {
    if (!GOOGLE_DRIVE_CLIENT_ID || GOOGLE_DRIVE_CLIENT_ID.indexOf("PASTE_YOUR") === 0) {
      showToast("Google Drive isn't set up in this copy of the app yet — see README.md", "error");
      return;
    }
    setDriveError("");
    try {
      const token = await driveGetFreshToken(true); // interactive — must run from this tap
      let email = "";
      try {
        const res = await driveApiFetch("https://www.googleapis.com/drive/v3/about?fields=user", token);
        const j = await res.json();
        email = (j.user && j.user.emailAddress) || "";
      } catch (e) { /* best-effort only */ }
      setDriveConnected(true); saveKey("erp:driveConnected", true);
      setDriveEmail(email); saveKey("erp:driveEmail", email);
      showToast("Google Drive connected");
      await driveSyncNow(true);
    } catch (e) {
      showToast("Could not connect Google Drive — try again", "error");
    }
  }, [driveGetFreshToken, driveSyncNow, showToast]);

  const disconnectDrive = useCallback(() => {
    try {
      if (driveTokenRef.current && window.google) {
        google.accounts.oauth2.revoke(driveTokenRef.current.access_token, () => {});
      }
    } catch (e) { /* ignore */ }
    driveTokenRef.current = null;
    setDriveConnected(false); saveKey("erp:driveConnected", false);
    setDriveEmail(""); saveKey("erp:driveEmail", "");
    setDriveError("");
    showToast("Google Drive disconnected");
  }, [showToast]);

  // debounced auto-backup to Drive shortly after each change
  useEffect(() => {
    if (!loaded || !dirty || !driveConnected) return;
    const t = setTimeout(() => { driveSyncNow(false); }, 10000);
    return () => clearTimeout(t);
  }, [dirty, loaded, driveConnected, driveSyncNow]);

  // catch up on reconnecting to the internet or returning to the app
  useEffect(() => {
    if (!driveConnected) return;
    const trySync = () => { if (dirty || driveError) driveSyncNow(false); };
    window.addEventListener("online", trySync);
    document.addEventListener("visibilitychange", trySync);
    return () => {
      window.removeEventListener("online", trySync);
      document.removeEventListener("visibilitychange", trySync);
    };
  }, [driveConnected, dirty, driveError, driveSyncNow]);

  const setVendors = useCallback((next) => {
    setVendorsState(next);
    if (!saveKey("erp:vendors", next)) showToast("Could not save vendor data", "error");
    markDirty();
  }, [showToast, markDirty]);
  const setReqs = useCallback((next) => {
    setReqsState(next);
    if (!saveKey("erp:requisitions", next)) showToast("Could not save requisition data", "error");
    markDirty();
  }, [showToast, markDirty]);
  const setRecurring = useCallback((next) => {
    setRecurringState(next);
    if (!saveKey("erp:recurring", next)) showToast("Could not save recurring payment data", "error");
    markDirty();
  }, [showToast, markDirty]);
  const setExpenses = useCallback((next) => {
    setExpensesState(next);
    if (!saveKey("erp:expenses", next)) showToast("Could not save expense data", "error");
    markDirty();
  }, [showToast, markDirty]);
  const setCards = useCallback((next) => {
    setCardsState(next);
    if (!saveKey("erp:cards", next)) showToast("Could not save card data", "error");
    markDirty();
  }, [showToast, markDirty]);
  const setCashTxns = useCallback((next) => {
    setCashTxnsState(next);
    if (!saveKey("erp:cashTxns", next)) showToast("Could not save cash entries", "error");
    markDirty();
  }, [showToast, markDirty]);
  const setCashCounts = useCallback((next) => {
    setCashCountsState(next);
    if (!saveKey("erp:cashCounts", next)) showToast("Could not save the count", "error");
    markDirty();
  }, [showToast, markDirty]);
  const setMachines = useCallback((next) => {
    setMachinesState(next);
    if (!saveKey("erp:machines", next)) showToast("Could not save machinery data", "error");
    markDirty();
  }, [showToast, markDirty]);
  const setDiesel = useCallback((next) => {
    setDieselState(next);
    if (!saveKey("erp:diesel", next)) showToast("Could not save diesel data", "error");
    markDirty();
  }, [showToast, markDirty]);
  const setUtilities = useCallback((next) => {
    setUtilitiesState(next);
    if (!saveKey("erp:utilities", next)) showToast("Could not save utility data", "error");
    markDirty();
  }, [showToast, markDirty]);
  const setLedgerEntries = useCallback((next) => {
    setLedgerEntriesState(next);
    if (!saveKey("erp:ledgerEntries", next)) showToast("Could not save the ledger entry", "error");
    markDirty();
  }, [showToast, markDirty]);
  const setSheets = useCallback((next) => {
    setSheetsState(next);
    if (!saveKey("erp:sheets", next)) showToast("Could not save sheet settings", "error");
    markDirty();
  }, [showToast, markDirty]);
  const setSettings = useCallback((next) => {
    setSettingsState(next);
    saveKey("erp:settings", next);
    markDirty();
  }, [markDirty]);
  const setCompany = useCallback((next) => {
    setCompanyState(next);
    if (!saveKey("erp:company", next)) showToast("Could not save company details", "error");
    markDirty();
  }, [showToast, markDirty]);
  const setLists = useCallback((next) => {
    setListsState(next);
    if (!saveKey("erp:lists", next)) showToast("Could not save list changes", "error");
    markDirty();
  }, [showToast, markDirty]);

  // connect (or change) the data file — must be called from a user tap
  const connectDataFile = useCallback(async () => {
    if (!FS_SUPPORTED) { showToast("This browser can't auto-save to a file — use Save a Copy instead", "error"); return; }
    try {
      const handle = await window.showSaveFilePicker({
        suggestedName: "ERP-Data.json",
        types: [{ description: "ERP data file", accept: { "application/json": [".json"] } }],
      });
      await idbSet(HANDLE_KEY, handle);
      setFileHandle(handle);
      setFileName(handle.name || "ERP-Data.json");
      setNeedsReconnect(false);
      const payload = buildBackupPayload();
      await writeToFileHandle(handle, payload);
      const stamp = new Date().toISOString();
      setLastSaved(stamp); saveKey("erp:lastSaved", stamp);
      setDirty(false);
      showToast("Data file connected — changes now save automatically");
    } catch(e){
      if (e && e.name === "AbortError") return;
      showToast("Could not connect that file — try again", "error");
    }
  }, [showToast]);

  const reconnectDataFile = useCallback(async () => {
    try {
      const h = await idbGet(HANDLE_KEY);
      if (!h) { connectDataFile(); return; }
      const ok = await verifyPermission(h);
      if (ok) { setFileHandle(h); setNeedsReconnect(false); showToast("Reconnected — auto-save is on again"); }
      else showToast("Permission denied — tap again and allow access", "error");
    } catch(e){ showToast("Could not reconnect — pick the file again", "error"); }
  }, [connectDataFile, showToast]);

  const openExistingDataFile = useCallback(async () => {
    if (!FS_SUPPORTED) { showToast("Use Restore From a Saved File instead", "error"); return; }
    try {
      const [handle] = await window.showOpenFilePicker({
        types: [{ description: "ERP data file", accept: { "application/json": [".json"] } }],
        multiple: false,
      });
      const data = await readFromFileHandle(handle);
      if (!isValidPayload(data)) { showToast("That doesn't look like an ERP data file", "error"); return; }
      const c = payloadCounts(data);
      const ok = confirm(
        `Load this data file?\n\nSaved: ${data.savedAt ? new Date(data.savedAt).toLocaleString("en-IN") : "unknown"}\nVendors: ${c.vendors}\nRequisitions: ${c.requisitions}\nRecurring: ${c.recurring}\n\nThis replaces what's currently in the app, and future changes will save to this file.`
      );
      if (!ok) return;
      await idbSet(HANDLE_KEY, handle);
      setFileHandle(handle);
      setFileName(handle.name || "ERP-Data.json");
      setNeedsReconnect(false);
      applyPayload(data);
      setLastSaved(data.savedAt || null);
      saveKey("erp:lastSaved", data.savedAt || null);
      setDirty(false);
      showToast("Data file loaded — auto-save is on");
    } catch(e){
      if (e && e.name === "AbortError") return;
      showToast("Could not open that file — try again", "error");
    }
  }, [applyPayload, showToast]);

  const disconnectDataFile = useCallback(async () => {
    await idbDel(HANDLE_KEY).catch(()=>{});
    setFileHandle(null); setFileName(""); setNeedsReconnect(false);
    showToast("Data file disconnected");
  }, [showToast]);

  if (!loaded) {
    return <div style={{height:"100vh",display:"flex",alignItems:"center",justifyContent:"center",background:CREAM}}>
      <Icon name="loader" size={28} color={AMBER} />
    </div>;
  }

  if (locked && settings.pinEnabled && settings.pinHash) {
    return <LockScreen settings={settings}
      onUnlock={()=>setLocked(false)}
      onForgot={()=>{
        const ok = confirm(
          "Reset the PIN?\n\nThis unlocks the app and removes the PIN. Your data is not touched.\n\n" +
          "The PIN is a deterrent against someone picking up your unlocked phone — it is not encryption, " +
          "so it can be reset this way rather than risk locking you out of your own records."
        );
        if (!ok) return;
        const next = { ...settings, pinEnabled:false, pinHash:"", pinSalt:"" };
        setSettings(next);
        setLocked(false);
      }} />;
  }

  const TAB_TITLES = { dashboard:"Overview", vendors:"Ledgers", requisition:"New Payment Requisition", export:"Requisitions & Export", settings:"Settings", recurring:"Rent & EMI", company:"Company Details", payments:"Payment Register", import:"Import from Excel", receivables:"Receivables", expenses:"Expenses", sheets:"Sync from Google Sheets", statement:"Monthly Statement", sitesummary:"Site Summary", employees:"Employee Master", cash:"Cash & Card", diesel:"Diesel & Machinery", utilities:"Utilities", changelog:"What is New", fixedcost:"Fixed Cost Summary" };

  const openImport = (kind, cardId) => { setImportFocus(kind || ""); setImportCardHint(cardId || ""); setTab("import"); };
  const toPayCount = reqs.filter(r => r.paymentStatus !== "Paid" || !r.paymentDate).length;

  const syncProps = {
    fsSupported: FS_SUPPORTED, fileHandle, fileName, needsReconnect, dirty, lastSaved, saving,
    connectDataFile, reconnectDataFile, disconnectDataFile, saveToFile,
    applyRestoredData: applyPayload, openExistingDataFile,
    driveConnected, driveEmail, driveSyncing, driveLastSynced, driveError,
    driveFolderId, driveFolderName,
    connectDrive, disconnectDrive, driveSyncNow, driveChooseFolder,
  };

  return (
    <div style={{ minHeight:"100vh", width:"100%", display:"flex", flexDirection:"column", background:CREAM }}>
      <div style={{ position:"sticky", top:0, zIndex:40, padding:"16px 20px", background:GRAD_INK, boxShadow:"0 1px 0 rgba(255,255,255,0.06) inset, 0 6px 24px -12px rgba(11,18,32,0.6)" }}>
        <div style={{ maxWidth:720, margin:"0 auto", display:"flex", alignItems:"center", gap:10 }}>
          <button onClick={()=>setMenuOpen(true)}
            style={{ flexShrink:0, background:"none", border:"none", cursor:"pointer", padding:"7px 5px",
              display:"flex", alignItems:"center" }}>
            <Icon name="menu" size={22} color="#fff" />
          </button>
          <div style={{ flex:1, minWidth:0 }}>
            <div style={{ color:"#fff", fontWeight:700, fontSize:18, lineHeight:1.2 }}>{TAB_TITLES[tab]}</div>
            <div style={{ fontSize:12, color:"#8FA0BC" }}>Your Business Ledger</div>
          </div>
          <button onClick={()=>setTab("company")}
            title="Company details"
            style={{ flexShrink:0, width:34, height:34, borderRadius:"50%", border:`1.5px solid ${tab==="company"?AMBER:"#2A3A5C"}`,
              background: tab==="company"?AMBER:"transparent", color:"#fff", fontSize:15, cursor:"pointer",
              display:"flex", alignItems:"center", justifyContent:"center" }}>
            <Icon name="account" size={17} color="#fff" />
          </button>
          <SaveChip {...syncProps} onTap={()=>setTab("settings")} />
        </div>
      </div>

      <main style={{ flex:1, maxWidth:720, width:"100%", margin:"0 auto", padding:"16px 16px 112px" }}>
        {tab==="dashboard" && <Dashboard vendors={vendors} reqs={reqs} setReqs={setReqs} recurring={recurring} setRecurring={setRecurring} expenses={expenses} cashTxns={cashTxns} goTo={navigate} showToast={showToast} sync={syncProps} />}
        {tab==="vendors" && <VendorsTab vendors={vendors} setVendors={setVendors} reqs={reqs} lists={lists} setLists={setLists} showToast={showToast} goTo={navigate} openImport={openImport} />}
        {tab==="requisition" && <RequisitionForm vendors={vendors} setVendors={setVendors} reqs={reqs} setReqs={setReqs} expenses={expenses} setExpenses={setExpenses} lists={lists} setLists={setLists} goTo={navigate} openImport={openImport} showToast={showToast} />}
        {tab==="export" && <ExportTab reqs={reqs} setReqs={setReqs} vendors={vendors} setVendors={setVendors} lists={lists} setLists={setLists} expenses={expenses} setExpenses={setExpenses} goTo={navigate} openImport={openImport} showToast={showToast} />}
        {tab==="recurring" && <RecurringTab vendors={vendors} setVendors={setVendors} recurring={recurring} setRecurring={setRecurring} reqs={reqs} setReqs={setReqs} lists={lists} setLists={setLists} showToast={showToast} goTo={navigate} openImport={openImport} />}
        {tab==="import" && <ImportTab focusKind={importFocus} clearFocus={()=>setImportFocus("")} presetCardId={importCardHint} vendors={vendors} setVendors={setVendors} reqs={reqs} setReqs={setReqs} recurring={recurring} setRecurring={setRecurring} expenses={expenses} setExpenses={setExpenses} cards={cards} setCards={setCards} cashTxns={cashTxns} setCashTxns={setCashTxns} machines={machines} setMachines={setMachines} diesel={diesel} setDiesel={setDiesel} utilities={utilities} setUtilities={setUtilities} lists={lists} setLists={setLists} showToast={showToast} goTo={navigate} />}
        {tab==="fixedcost" && <FixedCostTab recurring={recurring} vendors={vendors} machines={machines} showToast={showToast} goTo={navigate} />}
        {tab==="changelog" && <ChangelogTab settings={settings} setSettings={setSettings} goTo={navigate} />}
        {tab==="utilities" && <UtilitiesTab utilities={utilities} setUtilities={setUtilities} cards={cards}
          lists={lists} setLists={setLists} showToast={showToast} goTo={navigate} />}
        {tab==="diesel" && <DieselTab machines={machines} setMachines={setMachines} diesel={diesel} setDiesel={setDiesel}
          recurring={recurring} vendors={vendors} lists={lists} setLists={setLists} showToast={showToast} goTo={navigate} openImport={openImport} />}
        {tab==="cash" && <CashTab cards={cards} setCards={setCards} cashTxns={cashTxns} setCashTxns={setCashTxns}
          cashCounts={cashCounts} setCashCounts={setCashCounts} vendors={vendors}
          lists={lists} setLists={setLists} showToast={showToast} goTo={navigate} openImport={openImport} />}
        {tab==="employees" && <EmployeesTab vendors={vendors} setVendors={setVendors} reqs={reqs} lists={lists} setLists={setLists} showToast={showToast} goTo={navigate} openImport={openImport} />}
        {tab==="statement" && <MonthlyStatementTab reqs={reqs} expenses={expenses} cashTxns={cashTxns} cards={cards} showToast={showToast} goTo={navigate} />}
        {tab==="sitesummary" && <SiteSummaryTab reqs={reqs} expenses={expenses} cashTxns={cashTxns} cards={cards} diesel={diesel} utilities={utilities} machines={machines} vendors={vendors} showToast={showToast} goTo={navigate} />}
        {tab==="sheets" && <SheetSyncTab sheets={sheets} setSheets={setSheets} reqs={reqs} setReqs={setReqs} vendors={vendors} setVendors={setVendors} lists={lists} setLists={setLists} showToast={showToast} goTo={navigate} expenses={expenses} setExpenses={setExpenses} recurring={recurring} setRecurring={setRecurring} />}
        {tab==="expenses" && <ExpensesTab expenses={expenses} setExpenses={setExpenses} reqs={reqs} setReqs={setReqs} lists={lists} setLists={setLists} showToast={showToast} goTo={navigate} openImport={openImport} />}
        {tab==="receivables" && <ReceivablesTab reqs={reqs} setReqs={setReqs} showToast={showToast} goTo={navigate} />}
        {tab==="payments" && <PaymentRegisterTab reqs={reqs} setReqs={setReqs} vendors={vendors} expenses={expenses} setExpenses={setExpenses} cashTxns={cashTxns} cards={cards} lists={lists} setLists={setLists} showToast={showToast} goTo={navigate} />}
        {tab==="company" && <CompanyTab company={company} setCompany={setCompany} showToast={showToast} />}
        {tab==="settings" && <SettingsTab settings={settings} setSettings={setSettings} vendors={vendors} reqs={reqs} recurring={recurring} expenses={expenses} sheets={sheets} cashTxns={cashTxns} cards={cards} machines={machines} diesel={diesel} utilities={utilities} lists={lists} setLists={setLists} showToast={showToast} sync={syncProps} />}
      </main>

      <div style={{ position:"fixed", bottom:0, left:0, right:0, zIndex:40, background:"rgba(255,255,255,0.92)", backdropFilter:"blur(14px)", WebkitBackdropFilter:"blur(14px)", borderTop:`1px solid ${SAND}` }}>
        <div style={{ maxWidth:720, margin:"0 auto", display:"grid", gridTemplateColumns:"repeat(5,1fr)" }}>
          {[
            {id:"dashboard",icon:"home",label:"Home"},
            {id:"export",icon:"sheet",label:"Requests"},
            {id:"requisition",icon:"plus",label:"New", big:true},
            {id:"payments",icon:"bank",label:"Payments"},
            {id:"__more",icon:"settings",label:"More"},
          ].map(it => {
            const active = it.id === "__more" ? menuOpen : tab===it.id;
            const onTap = () => it.id === "__more" ? setMenuOpen(true) : setTab(it.id);
            if (it.big) {
              return (
                <button key={it.id} onClick={onTap}
                  style={{ display:"flex", flexDirection:"column", alignItems:"center", gap:4, padding:"6px 0 10px", background:"none", border:"none", cursor:"pointer" }}>
                  <div style={{ width:52,height:52,borderRadius:18,display:"flex",alignItems:"center",justifyContent:"center",
                    background:GRAD, boxShadow:"0 6px 18px -6px rgba(79,70,229,0.65)", marginTop:-8 }}>
                    <Icon name="plus" size={24} color="#fff" />
                  </div>
                  <span style={{ fontSize:11, fontWeight:700, color:INK }}>{it.label}</span>
                </button>
              );
            }
            return (
              <button key={it.id} onClick={onTap}
                style={{ display:"flex", flexDirection:"column", alignItems:"center", gap:4, padding:"10px 0", background:"none", border:"none", cursor:"pointer" }}>
                <div style={{ position:"relative", width:44,height:44,borderRadius:16,display:"flex",alignItems:"center",justifyContent:"center", background: active?AMBER:"transparent" }}>
                  <Icon name={it.icon} size={20} color={active?"#fff":MUTED} />
                  {it.id==="payments" && toPayCount > 0 && (
                    <span style={{ position:"absolute", top:2, right:2, minWidth:17, height:17, borderRadius:999,
                      background:RED, color:"#fff", fontSize:10, fontWeight:700, display:"flex",
                      alignItems:"center", justifyContent:"center", padding:"0 4px" }}>
                      {toPayCount > 99 ? "99+" : toPayCount}
                    </span>
                  )}
                </div>
                <span style={{ fontSize:11, fontWeight:500, color: active?INK:MUTED }}>{it.label}</span>
              </button>
            );
          })}
        </div>
      </div>
      <NavDrawer open={menuOpen} tab={tab} onPick={navigate} onClose={()=>setMenuOpen(false)}
        canLock={!!(settings.pinEnabled && settings.pinHash)}
        unseenUpdate={settings.lastSeenVersion !== APP_VERSION}
        onLock={()=>{ setMenuOpen(false); setLocked(true); }} />
      <Toast toast={toast} />
    </div>
  );
}

/* ================= DASHBOARD ================= */
function Dashboard({ vendors, reqs, setReqs, recurring, setRecurring, expenses, cashTxns, goTo, showToast, sync }){
  const [trueCost, setTrueCost] = useState(false);
  const stats = useMemo(() => {
    const totalPending = reqs.filter(r=>r.paymentStatus==="Pending").reduce((s,r)=>s+Number(r.amount||0),0);
    const totalApproved = reqs.filter(r=>r.paymentStatus==="Approved").reduce((s,r)=>s+Number(r.amount||0),0);
    const totalPaid = reqs.filter(r=>r.paymentStatus==="Paid").reduce((s,r)=>s+Number(r.amount||0),0);
    const totalOnHold = reqs.filter(r=>r.paymentStatus==="On Hold").reduce((s,r)=>s+Number(r.amount||0),0);
    const notExported = reqs.filter(r=>!r.exported).length;
    return { totalPending, totalApproved, totalPaid, totalOnHold, notExported };
  }, [reqs]);

  const pipeline = useMemo(() => ({
    pending:  reqs.filter(r => r.paymentStatus === "Pending").length,
    approved: reqs.filter(r => r.paymentStatus === "Approved").length,
    paid:     reqs.filter(isInRegister).length,
    awaiting: reqs.filter(r => !isInRegister(r) && r.paymentStatus !== "On Hold").length,
  }), [reqs]);

  const cashAlert = useMemo(() => {
    const noBill = (cashTxns||[]).filter(t => t.type === "Spend" && !t.hasBill);
    if (noBill.length) {
      const v = noBill.reduce((s,t)=>s+Number(t.amount||0),0);
      return `₹${fmtINR(v)} of cash spending has no bill on file`;
    }
    return "";
  }, [cashTxns]);

  const unclaimedExpense = useMemo(
    () => (expenses||[]).filter(e=>!e.claimId).reduce((s,e)=>s+Number(e.amount||0),0), [expenses]);
  const totalReceivable = useMemo(
    () => reqs.filter(r => !r.recovered).reduce((s,r)=>s+excessPaid(r), 0), [reqs]);
  const split = useMemo(() => commitmentSplit(recurring), [recurring]);
  const activeRecurring = useMemo(
    () => (recurring||[]).filter(r => r.active !== false && !instalmentDone(r)), [recurring]);
  const nextDue = useMemo(() => {
    const sorted = [...activeRecurring].filter(r=>r.nextDueDate).sort((a,b)=>a.nextDueDate.localeCompare(b.nextDueDate));
    return sorted[0] || null;
  }, [activeRecurring]);

  const dueSoon = useMemo(() => {
    return (recurring||[])
      .filter(r => r.active !== false && !instalmentDone(r))
      .map(r => ({ ...r, days: daysUntil(r.nextDueDate) }))
      .filter(r => r.days <= 3)
      .sort((a,b) => a.days - b.days);
  }, [recurring]);

  // In true-cost view a reimbursement lump is replaced by the expense lines it covers,
  // so the same rupee is never counted twice.
  const costSource = useMemo(() => {
    if (!trueCost) return reqs.map(r => ({ site:r.site, category:r.category, amount:Number(r.amount||0) }));
    const claimedIds = new Set((expenses||[]).filter(e=>e.claimId).map(e=>e.claimId));
    const kept = reqs
      .filter(r => !(r.isReimbursement && claimedIds.has(r.claimId)))
      .map(r => ({ site:r.site, category:r.category, amount:Number(r.amount||0) }));
    const lines = (expenses||[]).filter(e=>e.claimId)
      .map(e => ({ site:e.site||"Unspecified", category:e.category||e.expenseType, amount:Number(e.amount||0) }));
    return [...kept, ...lines];
  }, [reqs, expenses, trueCost]);

  const hasReimbursements = useMemo(
    () => reqs.some(r => r.isReimbursement) || (expenses||[]).some(e => e.claimId), [reqs, expenses]);

  const bySite = useMemo(() => {
    const map = {};
    costSource.forEach(r => { const key = r.site||"Unspecified"; map[key]=(map[key]||0)+r.amount; });
    return Object.entries(map).sort((a,b)=>b[1]-a[1]).slice(0,6);
  }, [costSource]);

  const byCategory = useMemo(() => {
    const map = {};
    costSource.forEach(r => { const key = r.category||"Unspecified"; map[key]=(map[key]||0)+r.amount; });
    return Object.entries(map).sort((a,b)=>b[1]-a[1]).slice(0,6);
  }, [costSource]);

  const monthlyTrend = useMemo(() => {
    const map = {};
    reqs.forEach(r => {
      if (!r.date) return;
      const key = r.date.slice(0,7); // YYYY-MM
      map[key] = (map[key]||0) + Number(r.amount||0);
    });
    return Object.entries(map).sort((a,b)=>a[0].localeCompare(b[0])).slice(-6)
      .map(([key, amt]) => {
        const [y,m] = key.split("-");
        const label = new Date(Number(y), Number(m)-1, 1).toLocaleDateString("en-IN", { month:"short" });
        return { label, amt };
      });
  }, [reqs]);

  const salaryMonthly = useMemo(
    () => (vendors||[]).filter(v => (v.ledgerType||"")==="Employee" && (v.empStatus||"Active")!=="Left")
                       .reduce((s,v)=>s+Number(v.salary||0),0), [vendors]);
  const fixedMonthly = split.rentMonthly + split.emiMonthly + split.otherMonthly + salaryMonthly;

  const alerts = [];
  dueSoon.forEach(d => alerts.push({
    tone:"red", label: d.days < 0 ? `${d.name} is ${Math.abs(d.days)} day(s) overdue` : `${d.name} due ${d.days === 0 ? "today" : "in "+d.days+" days"}`,
    value:`₹${fmtINR(d.amount)}`, go:"recurring" }));
  if (pipeline.awaiting > 0) alerts.push({ tone:"amber", label:`${pipeline.awaiting} requisition(s) waiting to be paid`, value:`₹${fmtINR(stats.totalPending + stats.totalApproved)}`, go:"payments" });
  if (cashAlert) alerts.push({ tone:"red", label:"Cash spending with no bill on file", value:"", go:"cash" });
  if (unclaimedExpense > 0) alerts.push({ tone:"amber", label:"Spent but not yet claimed", value:`₹${fmtINR(unclaimedExpense)}`, go:"expenses" });
  if (totalReceivable > 0) alerts.push({ tone:"blue", label:"Overpaid and due back", value:`₹${fmtINR(totalReceivable)}`, go:"receivables" });
  if (stats.notExported > 0) alerts.push({ tone:"amber", label:`${stats.notExported} not yet sent to accounts`, value:"", go:"export" });

  const tiles = [
    { id:"requisition", label:"New Request",  tone:AMBER },
    { id:"payments",    label:"Record Payment", tone:GREEN },
    { id:"cash",        label:"Cash & Card",  tone:INK },
    { id:"diesel",      label:"Diesel",       tone:INK },
    { id:"recurring",   label:"Rent & EMI",   tone:INK },
    { id:"fixedcost",   label:"Fixed Costs",  tone:INK },
  ];

  return (
    <div>
      <BackupBanner sync={sync} goToSettings={()=>goTo("settings")} />

      {vendors.length === 0 && reqs.length === 0 && (
        <div style={{ background:SURFACE, borderRadius:20, padding:20, marginBottom:14, border:`1.5px solid ${AMBER}`, boxShadow:SHADOW }}>
          <div style={{ fontWeight:700, fontSize:17, color:INK, marginBottom:6 }}>Start here</div>
          <p style={{ fontSize:13, color:MUTED, lineHeight:1.6, marginBottom:14 }}>
            Bring your existing Excel data in first — ledgers, then requisitions.
          </p>
          <BigButton icon="download" label="Import from Excel" onClick={()=>goTo("import")} tone="amber" full />
        </div>
      )}

      {/* headline */}
      <button onClick={()=>goTo("payments")}
        style={{ width:"100%", textAlign:"left", background:GRAD_INK, borderRadius:24, padding:24, marginBottom:12,
          border:"none", cursor:"pointer", boxShadow:SHADOW_LG }}>
        <div style={{ fontSize:11.5, fontWeight:600, color:"#8FA0BC", textTransform:"uppercase", letterSpacing:"0.09em" }}>
          Waiting to be paid
        </div>
        <div className="num" style={{ fontSize:36, fontWeight:800, color:"#fff", marginTop:6, lineHeight:1.05 }}>
          ₹{fmtINR(stats.totalPending + stats.totalApproved)}
        </div>
        <div style={{ display:"flex", alignItems:"center", gap:10, marginTop:14, flexWrap:"wrap" }}>
          <span style={{ fontSize:12, fontWeight:600, padding:"5px 11px", borderRadius:999,
            background:"rgba(255,255,255,0.12)", color:"#fff" }}>
            {pipeline.awaiting} open
          </span>
          <span style={{ fontSize:12, fontWeight:600, padding:"5px 11px", borderRadius:999,
            background:"rgba(255,255,255,0.12)", color:"#fff" }}>
            {pipeline.paid} paid
          </span>
          <span style={{ marginLeft:"auto", fontSize:12.5, fontWeight:700, color:AMBER }}>Record payments →</span>
        </div>
      </button>

      {/* key figures */}
      <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:10, marginBottom:12 }}>
        <div style={{ background:SURFACE, borderRadius:18, padding:15, border:`1px solid ${SAND}`, boxShadow:SHADOW }}>
          <div style={{ fontSize:11.5, color:MUTED, fontWeight:600 }}>Pending</div>
          <div className="num" style={{ fontSize:17, fontWeight:700, color:RED, marginTop:2 }}>₹{fmtINR(stats.totalPending)}</div>
        </div>
        <div style={{ background:SURFACE, borderRadius:18, padding:15, border:`1px solid ${SAND}`, boxShadow:SHADOW }}>
          <div style={{ fontSize:11.5, color:MUTED, fontWeight:600 }}>Approved</div>
          <div className="num" style={{ fontSize:17, fontWeight:700, color:AMBER, marginTop:2 }}>₹{fmtINR(stats.totalApproved)}</div>
        </div>
        <div style={{ background:SURFACE, borderRadius:18, padding:15, border:`1px solid ${SAND}`, boxShadow:SHADOW }}>
          <div style={{ fontSize:11.5, color:MUTED, fontWeight:600 }}>Paid to date</div>
          <div className="num" style={{ fontSize:17, fontWeight:700, color:GREEN, marginTop:2 }}>₹{fmtINR(stats.totalPaid)}</div>
        </div>
        <button onClick={()=>goTo("fixedcost")}
          style={{ textAlign:"left", background:SURFACE, borderRadius:18, padding:15, border:`1px solid ${SAND}`, boxShadow:SHADOW, cursor:"pointer" }}>
          <div style={{ fontSize:11.5, color:MUTED, fontWeight:600 }}>Fixed cost / month</div>
          <div className="num" style={{ fontSize:17, fontWeight:700, color:INK, marginTop:2 }}>₹{fmtINR(fixedMonthly)}</div>
        </button>
      </div>

      {/* everything that needs attention, in one place */}
      {alerts.length > 0 && (
        <div style={{ background:SURFACE, borderRadius:20, padding:"16px 18px", marginBottom:12, border:`1px solid ${SAND}`, boxShadow:SHADOW }}>
          <div style={{ fontWeight:700, color:INK, fontSize:14, marginBottom:4 }}>Needs attention</div>
          {alerts.slice(0,6).map((a,i) => (
            <button key={i} onClick={()=>goTo(a.go)}
              style={{ width:"100%", display:"flex", alignItems:"center", gap:10, padding:"11px 0",
                borderTop:`1px solid ${SAND}`, background:"none", border:"none", cursor:"pointer", textAlign:"left" }}>
              <span style={{ width:8, height:8, borderRadius:"50%", flexShrink:0,
                background: a.tone==="red" ? RED : a.tone==="blue" ? AMBER : "#F0A020" }} />
              <span style={{ flex:1, fontSize:13.5, color:INK, minWidth:0 }}>{a.label}</span>
              {a.value && <span className="num" style={{ fontSize:13, fontWeight:700, color:INK, flexShrink:0 }}>{a.value}</span>}
              <Icon name="chevron" size={16} color="#B6C2D4" />
            </button>
          ))}
        </div>
      )}

      {/* rent vs emi */}
      {split.liveCount > 0 && (
        <button onClick={()=>goTo("recurring")}
          style={{ width:"100%", textAlign:"left", background:SURFACE, borderRadius:20, padding:18, marginBottom:12,
            border:`1px solid ${SAND}`, boxShadow:SHADOW, cursor:"pointer" }}>
          <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:12 }}>
            <span style={{ fontWeight:700, color:INK }}>Rent &amp; EMI</span>
            <Icon name="chevron" size={16} color="#B6C2D4" />
          </div>
          <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:10 }}>
            <div style={{ background:"#F1F4F9", borderRadius:14, padding:"11px 13px" }}>
              <div style={{ fontSize:11, color:MUTED, fontWeight:600 }}>Rent · {split.rents.length}</div>
              <div className="num" style={{ fontSize:16, fontWeight:700, color:INK }}>₹{fmtINR(split.rentMonthly)}</div>
            </div>
            <div style={{ background:"#F1F4F9", borderRadius:14, padding:"11px 13px" }}>
              <div style={{ fontSize:11, color:MUTED, fontWeight:600 }}>Instalments · {split.emis.length}</div>
              <div className="num" style={{ fontSize:16, fontWeight:700, color:INK }}>₹{fmtINR(split.emiMonthly)}</div>
            </div>
          </div>
          {split.emiOutstanding > 0 && (
            <div style={{ display:"flex", justifyContent:"space-between", fontSize:12.5, marginTop:10 }}>
              <span style={{ color:MUTED }}>Instalments still owed</span>
              <span className="num" style={{ fontWeight:700, color:AMBER }}>₹{fmtINR(split.emiOutstanding)}</span>
            </div>
          )}
        </button>
      )}

      {/* quick actions */}
      <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr 1fr", gap:10, marginBottom:12 }}>
        {tiles.map(t => (
          <button key={t.id} onClick={()=>goTo(t.id)}
            style={{ background: t.tone===AMBER ? GRAD : t.tone===GREEN ? "linear-gradient(135deg,#0D9F7F,#17B891)" : SURFACE,
              color: t.tone===INK ? INK : "#fff",
              border: t.tone===INK ? `1px solid ${SAND}` : "none",
              boxShadow: t.tone===INK ? SHADOW : "0 6px 16px -8px rgba(79,70,229,0.5)",
              borderRadius:16, padding:"16px 6px", fontSize:12.5, fontWeight:700, cursor:"pointer", lineHeight:1.3 }}>
            {t.label}
          </button>
        ))}
      </div>

      {/* charts */}
      {(stats.totalPending+stats.totalApproved+stats.totalPaid+stats.totalOnHold) > 0 && (
        <div style={{ background:SURFACE, borderRadius:20, padding:20, marginBottom:12, border:`1px solid ${SAND}`, boxShadow:SHADOW }}>
          <div style={{ fontWeight:700, marginBottom:14, color:INK }}>Status Breakdown</div>
          <StatusDonut stats={stats} />
        </div>
      )}

      {hasReimbursements && (
        <div style={{ display:"flex", gap:8, marginBottom:12 }}>
          <button onClick={()=>setTrueCost(false)}
            style={{ flex:1, padding:"10px 0", borderRadius:12, fontSize:12.5, fontWeight:600, cursor:"pointer",
              background: !trueCost?INK:SURFACE, color: !trueCost?"#fff":INK, border:`1px solid ${!trueCost?INK:SAND}` }}>
            As requisitioned
          </button>
          <button onClick={()=>setTrueCost(true)}
            style={{ flex:1, padding:"10px 0", borderRadius:12, fontSize:12.5, fontWeight:600, cursor:"pointer",
              background: trueCost?INK:SURFACE, color: trueCost?"#fff":INK, border:`1px solid ${trueCost?INK:SAND}` }}>
            True cost by site
          </button>
        </div>
      )}

      {bySite.length > 0 && (
        <div style={{ background:SURFACE, borderRadius:20, padding:20, marginBottom:12, border:`1px solid ${SAND}`, boxShadow:SHADOW }}>
          <div style={{ fontWeight:700, marginBottom:12, color:INK }}>Spend by Site</div>
          <BarList data={bySite} color={AMBER} />
        </div>
      )}

      {byCategory.length > 0 && (
        <div style={{ background:SURFACE, borderRadius:20, padding:20, marginBottom:12, border:`1px solid ${SAND}`, boxShadow:SHADOW }}>
          <div style={{ fontWeight:700, marginBottom:12, color:INK }}>Spend by Category</div>
          <BarList data={byCategory} color={GREEN} />
        </div>
      )}

      {monthlyTrend.length > 1 && (
        <div style={{ background:SURFACE, borderRadius:20, padding:20, marginBottom:12, border:`1px solid ${SAND}`, boxShadow:SHADOW }}>
          <div style={{ fontWeight:700, marginBottom:14, color:INK }}>Monthly Trend</div>
          <div style={{ display:"flex", alignItems:"flex-end", gap:10, height:120 }}>
            {monthlyTrend.map(m => {
              const max = Math.max(...monthlyTrend.map(x=>x.amt), 1);
              return (
                <div key={m.label} style={{ flex:1, display:"flex", flexDirection:"column", alignItems:"center", gap:6 }}>
                  <div style={{ width:"100%", maxWidth:32, height: Math.max((m.amt/max)*90, 3), borderRadius:8, background:GRAD }} />
                  <div style={{ fontSize:11, color:MUTED }}>{m.label}</div>
                </div>
              );
            })}
          </div>
        </div>
      )}

      <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:10, marginBottom:24 }}>
        <BigButton icon="sheet" label="Monthly Statement" onClick={()=>goTo("statement")} tone="ink" full />
        <BigButton icon="home" label="Site Summary" onClick={()=>goTo("sitesummary")} tone="ink" full />
      </div>
    </div>
  );
}

function StatusDonut({ stats }){
  const parts = [
    { label:"Pending", value:stats.totalPending, color:RED },
    { label:"Approved", value:stats.totalApproved, color:AMBER },
    { label:"Paid", value:stats.totalPaid, color:GREEN },
    { label:"On Hold", value:stats.totalOnHold, color:MUTED },
  ].filter(p => p.value > 0);
  const total = parts.reduce((s,p)=>s+p.value, 0) || 1;
  let acc = 0;
  const stops = parts.map(p => {
    const start = (acc/total)*360;
    acc += p.value;
    const end = (acc/total)*360;
    return `${p.color} ${start}deg ${end}deg`;
  }).join(", ");

  return (
    <div style={{ display:"flex", alignItems:"center", gap:20 }}>
      <div style={{ width:96, height:96, borderRadius:"50%", background:`conic-gradient(${stops})`, flexShrink:0, position:"relative" }}>
        <div style={{ position:"absolute", inset:14, borderRadius:"50%", background:SURFACE }} />
      </div>
      <div style={{ flex:1 }}>
        {parts.map(p => (
          <div key={p.label} style={{ display:"flex", alignItems:"center", gap:8, marginBottom:6 }}>
            <div style={{ width:10, height:10, borderRadius:3, background:p.color, flexShrink:0 }} />
            <span style={{ fontSize:13, color:INK, flex:1 }}>{p.label}</span>
            <span style={{ fontSize:13, fontWeight:600, color:INK }}>₹{fmtINR(p.value)}</span>
          </div>
        ))}
      </div>
    </div>
  );
}
function StatCard({ label, value, color, plain }) {
