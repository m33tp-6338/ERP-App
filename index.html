              <button key={x} onClick={()=>setSiteFilter(x)}
                style={{ padding:"7px 13px", borderRadius:12, fontSize:13, fontWeight:600, whiteSpace:"nowrap", cursor:"pointer",
                  background: on?GREEN:SURFACE, color: on?"#fff":INK, border:`1px solid ${on?GREEN:SAND}` }}>
                {x === "All" ? "All sites" : x}
              </button>
            );
          })}
        </div>
      )}

      {sorted.length > 0 && (
        <React.Fragment>
          <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", padding:"10px 14px",
            background:"#F1F4F9", borderRadius:14, marginBottom:10 }}>
            <span style={{ fontSize:13, color:MUTED, fontWeight:600 }}>{sorted.length} shown</span>
            <span className="num" style={{ fontSize:14, fontWeight:700, color:INK }}>₹{fmtINR(filteredMonthly)} / month</span>
          </div>
      <SearchBox value={query} onChange={setQuery} placeholder="Search name, payee, type" />
          <SortBar sortKey={sortKey} onSortKey={setSortKey} options={REC_SORTS} desc={desc} onDesc={setDesc} />
          <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:10 }}>
            <button onClick={()=>setSelected(selected.size === sorted.length ? new Set() : new Set(sorted.map(r=>r.id)))}
              style={{ fontSize:13.5, fontWeight:700, color:AMBER, background:"none", border:"none", cursor:"pointer", padding:0 }}>
              {selected.size === sorted.length ? "Clear selection" : `Select all (${sorted.length})`}
            </button>
            <span style={{ fontSize:12, color:MUTED }}>Tap a row to open it</span>
          </div>
        </React.Fragment>
      )}

      <div style={{ display:"flex", flexDirection:"column", gap:12 }}>
        {sorted.length===0 && <EmptyState text={
          recurring.length === 0
            ? "Nothing here yet. Add house rent, land rent, machinery rent or machinery instalments."
            : "Nothing matches these filters."} />}
        {sorted.map(item => {
          const days = daysUntil(item.nextDueDate);
          const finished = instalmentDone(item);
          const dueColor = (!item.active || finished) ? "#9AA7BC" : days < 0 ? RED : days <= 3 ? AMBER : GREEN;
          return (
            <div key={item.id} onClick={()=>setOpenItem(item)}
              style={{ background:SURFACE, borderRadius:20, padding:16,
                border:`1.5px solid ${selected.has(item.id) ? AMBER : SAND}`, boxShadow:SHADOW,
                opacity: item.active ? 1 : 0.6, cursor:"pointer" }}>
              <div style={{ display:"flex", justifyContent:"space-between", alignItems:"flex-start", gap:10 }}>
                <div onClick={(e)=>{ e.stopPropagation(); toggleSel(item.id); }}
                  style={{ width:22, height:22, borderRadius:6, marginTop:2, flexShrink:0, cursor:"pointer",
                    display:"flex", alignItems:"center", justifyContent:"center",
                    background: selected.has(item.id) ? AMBER : SURFACE,
                    border:`2px solid ${selected.has(item.id) ? AMBER : "#C7D0DE"}` }}>
                  {selected.has(item.id) && <Icon name="check" size={13} color="#fff" />}
                </div>
                <div style={{ minWidth:0, flex:1 }}>
                  <div style={{ fontWeight:700, color:INK }}>{item.name}</div>
                  <span style={{ display:"inline-block", marginTop:4, fontSize:11, fontWeight:600, padding:"2px 8px", borderRadius:999, background:SAND, color:INK }}>{item.type}</span>
                  {item.ownerName && (
                    <div style={{ fontSize:12, color:MUTED, marginTop:4 }}>Pay to: {item.ownerName}</div>
                  )}
                  {(() => {
                    const g = costGroupOf(item);
                    const mf = monthlyFactor(item.frequency);
                    return (
                      <div style={{ display:"flex", alignItems:"center", gap:6, marginTop:6, flexWrap:"wrap" }}>
                        <span style={{ fontSize:11, fontWeight:700, padding:"2px 8px", borderRadius:999,
                          background: g==="Rent" ? "#EEF0FE" : g==="Instalment" ? "#E6F7F2" : SAND,
                          color: g==="Rent" ? AMBER : g==="Instalment" ? GREEN : INK }}>
                          {g}
                        </span>
                        <span className="num" style={{ fontSize:11.5, color:MUTED }}>
                          ₹{fmtINR(Number(item.amount||0) * mf.factor)} / month
                        </span>
                        {mf.assumed && (
                          <span style={{ fontSize:11, fontWeight:600, color:RED }}>frequency unclear</span>
                        )}
                      </div>
                    );
                  })()}
                  {item.type==="Machinery Installment" && item.totalInstallments && (
                    <span style={{ marginLeft:6, fontSize:11, color:MUTED }}>Installment {(Number(item.installmentsPaid)||0)+1} of {item.totalInstallments}</span>
                  )}
                </div>
                <div style={{ display:"flex", gap:8, flexShrink:0 }}>
                  <button onClick={(e)=>{e.stopPropagation(); openEdit(item);}} style={{ padding:8, borderRadius:12, background:SAND, border:"none", cursor:"pointer" }}><Icon name="edit" size={16} color={INK} /></button>
                  <button onClick={(e)=>{e.stopPropagation(); remove(item.id);}} style={{ padding:8, borderRadius:12, background:"#FDECEE", border:"none", cursor:"pointer" }}><Icon name="trash" size={16} color={RED} /></button>
                </div>
              </div>
              <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginTop:12, paddingTop:12, borderTop:`1px solid ${SAND}` }}>
                <div>
                  <div style={{ fontWeight:700, color:INK }}>₹{fmtINR(item.amount)} <span style={{ fontWeight:400, fontSize:12, color:MUTED }}>/ {item.frequency}</span></div>
                  <div style={{ fontSize:12, fontWeight:600, color:dueColor, marginTop:2 }}>
                    {finished ? "Completed" : !item.active ? "Paused" : days<0 ? `${Math.abs(days)} day(s) overdue` : days===0 ? "Due today" : `Due ${fmtDate(item.nextDueDate)} (${days} day${days===1?"":"s"})`}
                  </div>
                </div>
                <div style={{ display:"flex", gap:8 }}>
                  <button onClick={(e)=>{e.stopPropagation(); toggleActive(item);}} style={{ fontSize:12, fontWeight:600, padding:"8px 10px", borderRadius:10, background:SAND, color:INK, border:"none", cursor:"pointer" }}>
                    {item.active ? "Pause" : "Resume"}
                  </button>
                  {item.active && (
                    <button onClick={(e)=>{e.stopPropagation(); generateRequisitionFromRecurring(item, reqs, setReqs, recurring, setRecurring, showToast);}}
                      style={{ fontSize:12, fontWeight:700, padding:"8px 12px", borderRadius:10, background:GREEN, color:"#fff", border:"none", cursor:"pointer" }}>
                      Generate Now
                    </button>
                  )}
                </div>
              </div>
            </div>
          );
        })}
      </div>

      {selected.size > 0 && (
        <div style={{ position:"fixed", bottom:76, left:0, right:0, padding:"0 16px", zIndex:30 }}>
          <div style={{ maxWidth:720, margin:"0 auto", background:INK, borderRadius:16, padding:"12px 14px",
            display:"flex", alignItems:"center", gap:10, boxShadow:SHADOW_LG }}>
            <div style={{ flex:1, minWidth:0 }}>
              <div style={{ color:"#fff", fontWeight:700, fontSize:14 }}>{selected.size} selected</div>
              <div className="num" style={{ color:"#8FA0BC", fontSize:12 }}>
                ₹{fmtINR(recurring.filter(r=>selected.has(r.id))
                  .reduce((sum,r)=>sum+Number(r.amount||0)*monthlyFactor(r.frequency).factor,0))} / month
              </div>
            </div>
            <button onClick={()=>setBulkOpen(true)}
              style={{ padding:"10px 16px", borderRadius:12, fontWeight:700, fontSize:14, background:AMBER, color:"#fff", border:"none", cursor:"pointer" }}>
              Options
            </button>
          </div>
        </div>
      )}

      {bulkOpen && (
        <ActionSheet
          title={`${selected.size} selected`}
          subtitle="Choose what to do with them"
          onClose={()=>setBulkOpen(false)}
          actions={[
            { label:"Export to Excel", icon:"download",
              onPress: ()=>exportRecurring(recurring.filter(r=>selected.has(r.id)), "Selected") },
            { label:"Create requisitions now", icon:"check", onPress: bulkGenerate },
            { label:"Pause", icon:"close", onPress: ()=>bulkSetActive(false) },
            { label:"Resume", icon:"check", onPress: ()=>bulkSetActive(true) },
            { label:"Clear selection", icon:"close", onPress: ()=>setSelected(new Set()) },
            { label:"Delete", icon:"trash", danger:true, onPress: bulkDelete },
          ]}
        />
      )}
    </div>
  );
}

function CommitmentDetail({ item, reqs, vendors, onBack, onEdit, onGenerate, onToggle, showToast }){
  const history = useMemo(() => reqs
    .filter(r => r.recurringId === item.id)
    .sort((a,b) => String(b.date||"").localeCompare(String(a.date||""))), [reqs, item.id]);

  const paidRows = history.filter(isInRegister);
  const paidTotal = paidRows.reduce((s,r)=>s+Number(r.paidAmount || r.amount || 0), 0);
  const openRows = history.filter(r => !isInRegister(r));
  const openTotal = openRows.reduce((s,r)=>s+Number(r.amount||0), 0);
  const days = daysUntil(item.nextDueDate);
  const vendor = vendors.find(v => v.id === item.vendorId);

  const total = Number(item.totalInstallments||0);
  const done = Number(item.installmentsPaid||0);
  const pct = total ? Math.min(100, Math.round((done/total)*100)) : 0;
  const remaining = total ? Math.max(0, total - done) : 0;

  function exportHistory(){
    if (history.length === 0) { showToast("Nothing raised for this yet", "error"); return; }
    const rows = history.map(r => ({
      "Ref No.":r.refNo||"", Date:fmtDate(r.date), Site:r.site, Name:r.name,
      Amount:Number(r.amount)||0, "Payment Status":r.paymentStatus,
      "Paid On":fmtDate(r.paymentDate), "Amount Paid":r.paidAmount||"",
      "Payment Mode":r.paymentMode||"", "UTR":r.utr||"",
    }));
    const ws = XLSX.utils.json_to_sheet(rows);
    ws["!cols"] = [{wch:16},{wch:12},{wch:16},{wch:22},{wch:14},{wch:14},{wch:12},{wch:14},{wch:14},{wch:22}];
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, "History");
    XLSX.writeFile(wb, `RentEMI_${String(item.name).replace(/[^A-Za-z0-9]+/g,"_")}.xlsx`);
    showToast("History exported");
  }

  const dueColor = !item.active ? MUTED : days < 0 ? RED : days <= 3 ? AMBER : GREEN;

  return (
    <div>
      <button onClick={onBack}
        style={{ display:"flex", alignItems:"center", gap:6, marginBottom:16, fontSize:14, fontWeight:600, color:INK, background:"none", border:"none", cursor:"pointer" }}>
        <Icon name="close" size={16} /> Back to list
      </button>

      <div style={{ background:GRAD_INK, borderRadius:22, padding:22, marginBottom:14, boxShadow:SHADOW_LG }}>
        <div style={{ fontSize:12, fontWeight:600, color:"#8FA0BC", letterSpacing:"0.06em", textTransform:"uppercase" }}>
          {item.type}
        </div>
        <div style={{ fontSize:20, fontWeight:700, color:"#fff", marginTop:6, lineHeight:1.25 }}>{item.name}</div>
        <div style={{ fontSize:30, fontWeight:800, color:"#fff", marginTop:12 }} className="num">
          ₹{fmtINR(item.amount)}
          <span style={{ fontSize:13, fontWeight:500, color:"#8FA0BC" }}> / {item.frequency}</span>
        </div>
        <div style={{ marginTop:14, display:"flex", alignItems:"center", gap:8, flexWrap:"wrap" }}>
          <span style={{ fontSize:12, fontWeight:700, padding:"6px 12px", borderRadius:999,
            background: item.active ? "rgba(255,255,255,0.12)" : "rgba(255,255,255,0.06)",
            color: item.active ? "#fff" : "#8FA0BC" }}>
            {!item.active ? "Paused"
              : days < 0 ? `${Math.abs(days)} day(s) overdue`
              : days === 0 ? "Due today"
              : `Due in ${days} day${days===1?"":"s"}`}
          </span>
          <span style={{ fontSize:12, fontWeight:600, padding:"6px 12px", borderRadius:999,
            background:"rgba(255,255,255,0.12)", color:"#fff" }}>
            {fmtDate(item.nextDueDate)}
          </span>
        </div>
      </div>

      <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:12, marginBottom:14 }}>
        <div style={{ background:SURFACE, borderRadius:18, padding:16, border:`1px solid ${SAND}`, boxShadow:SHADOW }}>
          <div style={{ fontSize:12, fontWeight:500, color:MUTED }}>Paid so far</div>
          <div className="num" style={{ fontSize:19, fontWeight:700, color:GREEN }}>₹{fmtINR(paidTotal)}</div>
          <div style={{ fontSize:11, color:MUTED, marginTop:2 }}>{paidRows.length} payment(s)</div>
        </div>
        <div style={{ background:SURFACE, borderRadius:18, padding:16, border:`1px solid ${SAND}`, boxShadow:SHADOW }}>
          <div style={{ fontSize:12, fontWeight:500, color:MUTED }}>Awaiting payment</div>
          <div className="num" style={{ fontSize:19, fontWeight:700, color: openTotal ? AMBER : INK }}>₹{fmtINR(openTotal)}</div>
          <div style={{ fontSize:11, color:MUTED, marginTop:2 }}>{openRows.length} raised</div>
        </div>
      </div>

      {total > 0 && (
        <div style={{ background:SURFACE, borderRadius:20, padding:20, marginBottom:14, border:`1px solid ${SAND}`, boxShadow:SHADOW }}>
          <div style={{ display:"flex", justifyContent:"space-between", marginBottom:10 }}>
            <span style={{ fontWeight:700, color:INK }}>Instalments</span>
            <span className="num" style={{ fontWeight:700, color:INK }}>{done} of {total}</span>
          </div>
          <div style={{ height:10, borderRadius:999, background:SAND, overflow:"hidden" }}>
            <div style={{ height:10, width:`${pct}%`, background:GRAD, borderRadius:999 }} />
          </div>
          <div style={{ display:"flex", justifyContent:"space-between", fontSize:12, color:MUTED, marginTop:8 }}>
            <span>{pct}% complete</span>
            <span>{remaining} left · ₹{fmtINR(remaining * Number(item.amount||0))} to go</span>
          </div>
        </div>
      )}

      <div style={{ background:SURFACE, borderRadius:20, padding:"4px 20px 16px", marginBottom:14, border:`1px solid ${SAND}`, boxShadow:SHADOW }}>
        <div style={{ paddingTop:16 }}><SectionLabel>Details</SectionLabel></div>
        <DetailRow label="Pay to" value={item.ownerName || (vendor ? vendor.name : "")} />
        <DetailRow label="Site" value={item.site} />
        <DetailRow label="Category" value={item.category} />
        <DetailRow label="Sub-Category" value={item.subCategory} />
        <DetailRow label="A/c No." value={item.accNo} copyable showToast={showToast} mono />
        <DetailRow label="IFSC" value={item.ifsc} copyable showToast={showToast} mono />
      </div>

      <div style={{ background:SURFACE, borderRadius:20, padding:16, marginBottom:14, border:`1px solid ${SAND}`, boxShadow:SHADOW }}>
        <div style={{ fontWeight:700, color:INK, fontSize:14, marginBottom:10 }}>
          Payment history ({history.length})
        </div>
        {history.length === 0 ? (
          <div style={{ fontSize:13, color:MUTED, lineHeight:1.6 }}>
            Nothing raised yet. Use Generate Now, or wait for the reminder three days before it is due.
          </div>
        ) : history.slice(0,24).map((r,i) => (
          <div key={r.id} style={{ padding:"9px 0", borderTop: i? `1px solid ${SAND}`:"none" }}>
            <div style={{ display:"flex", justifyContent:"space-between", gap:8 }}>
              <span style={{ fontSize:13, color:INK, fontWeight:600 }}>{fmtDate(r.paymentDate || r.date)}</span>
              <span className="num" style={{ fontSize:14, fontWeight:700, color:INK }}>₹{fmtINR(r.paidAmount || r.amount)}</span>
            </div>
            <div style={{ display:"flex", alignItems:"center", gap:8, marginTop:4 }}>
              <span style={{ fontSize:11, fontWeight:600, padding:"2px 8px", borderRadius:999, color:"#fff", background:STATUS_COLOR[r.paymentStatus] }}>
                {r.paymentStatus}
              </span>
              <span style={{ fontSize:11, color:MUTED }}>{r.refNo}</span>
              {r.utr && <span style={{ fontSize:11, color:MUTED }}>UTR {r.utr}</span>}
            </div>
          </div>
        ))}
      </div>

      <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:10, marginBottom:10 }}>
        {item.active
          ? <BigButton icon="check" label="Generate Now" onClick={onGenerate} tone="green" full />
          : <BigButton icon="check" label="Resume" onClick={onToggle} tone="green" full />}
        <BigButton icon="edit" label="Edit" onClick={onEdit} tone="amber" full />
      </div>
      <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:10 }}>
        <BigButton icon="download" label="Export" onClick={exportHistory} tone="ink" full />
        {item.active && <BigButton icon="close" label="Pause" onClick={onToggle} tone="ink" full />}
      </div>
    </div>
  );
}

function RecurringForm({ item, vendors, lists, setLists, reqs, onCancel, onSave }){
  const [v, setV] = useState({ ...item, costGroup: costGroupOf(item) });
  const [showMore, setShowMore] = useState(false);
  const L = lists || DEFAULT_LISTS;
  function set(k, val){ setV(prev => ({ ...prev, [k]: val })); }

  const group = v.costGroup || "Rent";
  const isEmi = group === "Instalment";

  const payees = useMemo(
    () => vendors.filter(x => PAYEE_TYPES.includes(x.ledgerType || "")), [vendors]);
  const [showAllLedgers, setShowAllLedgers] = useState(false);
  const ledgerList = showAllLedgers ? vendors : payees;

  function pickVendor(id){
    const vend = vendors.find(x => x.id === id);
    if (!vend) { setV(prev => ({ ...prev, vendorId:"", ownerName:"" })); return; }
    setV(prev => ({
      ...prev, vendorId: vend.id, ownerName: vend.name,
      accNo: prev.accNo || vend.accNo, ifsc: prev.ifsc || vend.ifsc,
      name: prev.name && prev.name.trim() ? prev.name : `${group === "Rent" ? "Rent" : "EMI"} - ${vend.name}`,
    }));
  }

  function chooseGroup(g){
    setV(prev => ({
      ...prev, costGroup: g,
      type: (!prev.type || COST_GROUPS.includes(costGroupOf(prev)) === false || prev.type === "House Rent" ||
             prev.type === "Machinery Installment" || prev.type === "Other")
            ? (g === "Rent" ? "House Rent" : g === "Instalment" ? "Machinery Installment" : "Other")
            : prev.type,
    }));
  }

  const amount = Number(v.amount || 0);
  const mf = monthlyFactor(v.frequency);
  const perMonth = amount * mf.factor;
  const total = Number(v.totalInstallments || 0);
  const paid  = Number(v.installmentsPaid || 0);
  const left  = total > 0 ? Math.max(0, total - paid) : 0;
  const owed  = left * amount;

  function endDate(){
    if (!isEmi || !total || !v.nextDueDate || left <= 0) return "";
    const d = new Date(v.nextDueDate + "T00:00:00");
    if (isNaN(d)) return "";
    const stepMonths = v.frequency === "Quarterly" ? 3 : v.frequency === "Half-Yearly" ? 6
      : v.frequency === "Yearly" ? 12 : 1;
    d.setMonth(d.getMonth() + stepMonths * (left - 1));
    return d.toLocaleDateString("en-IN", { month:"short", year:"numeric" });
  }

  function submit(){
    if (!v.name.trim()) return alert("Give this a name, for example 'Office Rent - Mr Sharma'.");
    if (!amount || amount <= 0) return alert("Enter the amount of one payment.");
    if (!v.nextDueDate) return alert("Enter the date of the next payment.");
    onSave({ ...v, costGroup: group });
  }

  const bigBtn = (label, on, onClick, sub) => (
    <button type="button" onClick={onClick}
      style={{ flex:1, borderRadius:14, padding:"14px 6px", cursor:"pointer",
        border:`2px solid ${on?AMBER:SAND}`, background:on?AMBER:SURFACE, color:on?"#fff":INK }}>
      <div style={{ fontSize:14, fontWeight:700 }}>{label}</div>
      {sub && <div style={{ fontSize:10.5, marginTop:2, opacity:0.85 }}>{sub}</div>}
    </button>
  );

  return (
    <div>
      <button onClick={onCancel}
        style={{ display:"flex", alignItems:"center", gap:6, marginBottom:16, fontSize:14, fontWeight:600, color:INK, background:"none", border:"none", cursor:"pointer" }}>
        <Icon name="close" size={16} /> Cancel
      </button>

      {/* 1. what kind */}
      <div style={{ background:SURFACE, borderRadius:20, padding:20, marginBottom:12, border:`1px solid ${SAND}`, boxShadow:SHADOW }}>
        <div style={{ fontSize:15, fontWeight:700, color:INK, marginBottom:4 }}>1. What are you paying?</div>
        <div style={{ fontSize:12.5, color:MUTED, marginBottom:14, lineHeight:1.5 }}>
          This decides which total it lands in.
        </div>
        <div style={{ display:"flex", gap:8 }}>
          {bigBtn("Rent", group==="Rent", ()=>chooseGroup("Rent"), "house, land, machine")}
          {bigBtn("Loan / EMI", group==="Instalment", ()=>chooseGroup("Instalment"), "instalments")}
          {bigBtn("Other", group==="Other", ()=>chooseGroup("Other"), "anything else")}
        </div>
      </div>

      {/* 2. who and what */}
      <div style={{ background:SURFACE, borderRadius:20, padding:20, marginBottom:12, border:`1px solid ${SAND}`, boxShadow:SHADOW }}>
        <div style={{ fontSize:15, fontWeight:700, color:INK, marginBottom:14 }}>2. Who do you pay?</div>

        <Field label="Pay to" hint={isEmi ? "The bank or finance company" : "The landlord or machine owner"}>
          <select style={inputStyle} value={v.vendorId} onChange={e=>pickVendor(e.target.value)}>
            <option value="">— choose —</option>
            {ledgerList.map(x => (
              <option key={x.id} value={x.id}>{x.name}{x.ledgerType && x.ledgerType!=="Owner" ? ` (${x.ledgerType})` : ""}</option>
            ))}
          </select>
          {ledgerList.length === 0 && (
            <div style={{ marginTop:8, fontSize:12.5, color:AMBER, fontWeight:600, lineHeight:1.5 }}>
              No Owner or Financier ledgers yet. You can still type a name below and create the ledger later.
            </div>
          )}
          <button type="button" onClick={()=>setShowAllLedgers(!showAllLedgers)}
            style={{ marginTop:8, fontSize:12, fontWeight:600, color:MUTED, background:"none", border:"none",
              cursor:"pointer", padding:0, textDecoration:"underline" }}>
            {showAllLedgers ? "Show only Owners and financiers" : "Not in the list? Show all ledgers"}
          </button>
        </Field>

        <Field label="Name this payment" required hint="How you will recognise it in the list">
          <input style={inputStyle} value={v.name} onChange={e=>set("name", e.target.value)}
            placeholder={isEmi ? "e.g. JCB EMI - HDFC" : "e.g. Office Rent - Mr Sharma"} />
        </Field>
      </div>

      {/* 3. how much */}
      <div style={{ background:SURFACE, borderRadius:20, padding:20, marginBottom:12, border:`1px solid ${SAND}`, boxShadow:SHADOW }}>
        <div style={{ fontSize:15, fontWeight:700, color:INK, marginBottom:14 }}>3. How much, how often?</div>

        <Field label={isEmi ? "One instalment amount" : "Amount of one payment"} required
          hint="Not the yearly total - just what leaves your account each time">
          <input type="number" inputMode="decimal" style={{...inputStyle, fontWeight:700, fontSize:22}}
            value={v.amount} onChange={e=>set("amount", e.target.value)} placeholder="0" />
        </Field>

        <Field label="How often" required>
          <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:8 }}>
            {FREQUENCIES.map(f => {
              const on = v.frequency === f;
              return (
                <button key={f} type="button" onClick={()=>set("frequency", f)}
                  style={{ borderRadius:12, padding:"12px 4px", fontSize:13.5, fontWeight:600, cursor:"pointer",
                    border:`2px solid ${on?AMBER:SAND}`, background:on?AMBER:SURFACE, color:on?"#fff":INK }}>
                  {f}
                </button>
              );
            })}
          </div>
        </Field>

        {amount > 0 && (
          <div style={{ background:"#E6F7F2", border:`1px solid ${GREEN}`, borderRadius:14, padding:14, marginBottom:16 }}>
            <div style={{ fontSize:12.5, color:MUTED, fontWeight:600 }}>This will be counted as</div>
            <div className="num" style={{ fontSize:21, fontWeight:800, color:INK, marginTop:2 }}>
              ₹{fmtINR(perMonth)} <span style={{ fontSize:13, fontWeight:600, color:MUTED }}>per month</span>
            </div>
            <div style={{ fontSize:12, color:MUTED, marginTop:4, lineHeight:1.5 }}>
              {v.frequency === "One-time"
                ? "One-time payments are shown separately, not in the monthly total."
                : `₹${fmtINR(amount)} ${String(v.frequency||"Monthly").toLowerCase()} under ${group === "Instalment" ? "Instalments" : group === "Rent" ? "Rent" : "Other"}.`}
            </div>
          </div>
        )}

        <Field label="Next payment due" required>
          <input type="date" style={inputStyle} value={v.nextDueDate}
            onChange={e=>set("nextDueDate", e.target.value)} />
        </Field>
      </div>

      {/* 4. instalment schedule — shown for every EMI, whatever it is called */}
      {isEmi && (
        <div style={{ background:SURFACE, borderRadius:20, padding:20, marginBottom:12, border:`1px solid ${SAND}`, boxShadow:SHADOW }}>
          <div style={{ fontSize:15, fontWeight:700, color:INK, marginBottom:4 }}>4. The schedule</div>
          <div style={{ fontSize:12.5, color:MUTED, marginBottom:14, lineHeight:1.5 }}>
            Fill these in and the app knows how much is still owed, and stops reminding you once it finishes.
          </div>
          <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:12 }}>
            <Field label="Total instalments">
              <input type="number" inputMode="numeric" style={inputStyle} value={v.totalInstallments}
                onChange={e=>set("totalInstallments", e.target.value)} placeholder="e.g. 36" />
            </Field>
            <Field label="Already paid">
              <input type="number" inputMode="numeric" style={inputStyle} value={v.installmentsPaid}
                onChange={e=>set("installmentsPaid", e.target.value)} placeholder="e.g. 10" />
            </Field>
          </div>
          {total > 0 && (
            <div style={{ background:"#EEF0FE", border:`1px solid ${AMBER}`, borderRadius:14, padding:14 }}>
              <div style={{ display:"flex", justifyContent:"space-between", fontSize:13.5, marginBottom:6 }}>
                <span style={{ color:MUTED }}>Left to pay</span>
                <span className="num" style={{ fontWeight:700, color:INK }}>{left} of {total}</span>
              </div>
              <div style={{ display:"flex", justifyContent:"space-between", fontSize:13.5 }}>
                <span style={{ color:MUTED }}>Still owed</span>
                <span className="num" style={{ fontWeight:800, color:AMBER }}>₹{fmtINR(owed)}</span>
              </div>
              {endDate() && (
                <div style={{ fontSize:12, color:MUTED, marginTop:8 }}>Finishes around {endDate()}</div>
              )}
              {left === 0 && (
                <div style={{ fontSize:12.5, color:GREEN, fontWeight:600, marginTop:8 }}>
                  Fully paid — it will stop appearing in your monthly total.
                </div>
              )}
            </div>
          )}
          {total === 0 && (
            <div style={{ fontSize:12.5, color:MUTED, lineHeight:1.55 }}>
              Leave blank if it has no fixed end. The monthly figure still works; only the amount
              still owed cannot be shown.
            </div>
          )}
        </div>
      )}

      {/* optional */}
      <button onClick={()=>setShowMore(!showMore)}

/* ---------- payment state helpers ---------- */
function excessPaid(r){
  const billed = Number(r.amount||0);
  const paid = (r.paidAmount === "" || r.paidAmount === undefined || r.paidAmount === null)
    ? billed : Number(r.paidAmount||0);
  return Math.max(0, paid - billed);
}
function shortPaid(r){
  const billed = Number(r.amount||0);
  const paid = (r.paidAmount === "" || r.paidAmount === undefined || r.paidAmount === null)
    ? billed : Number(r.paidAmount||0);
  return Math.max(0, billed - paid);
}
// A payment counts as complete once we know it was paid and when.
// Mode is captured when marking Paid in the app, but historical imports may not have it.
function isInRegister(r){
  return r.paymentStatus === "Paid" && !!r.paymentDate;
}
// A requisition that was settled inside a single larger payment. It stays on
// file for the audit trail but must never be counted as money out a second time.
function isRolledUp(r){ return !!r.coveredById; }
// A register entry the company did not fund. A partner paid it, so it is still
// owed back to them and belongs in the list of things a later payment can settle.
// Money out comes from two places: the bank, and cash held at site.
// A card refill is the bank funding the cash, so if that refill is also sitting
// in the register as a payment, it is the same money twice. Refills that match a
// register payment on date and amount are counted once, and the rest are shown
// separately so a missing bank statement is obvious rather than silently wrong.
function combinedSpending(reqs, cashTxns, monthFilter, siteFilter, cards){
  const inMonth = (d) => monthFilter === "all" || String(d||"").slice(0,7) === monthFilter;
  const cardSiteOf = (t) => t.site || ((cards||[]).find(c => c.id === t.cardId)||{}).site || "";
  const onSite = (site) => siteFilter === "all" || site === siteFilter;

  const bankRows = (reqs||[]).filter(r =>
    isInRegister(r) && !isRolledUp(r) &&
    inMonth(r.paymentDate || r.date) && onSite(r.site));
  const bank = bankRows.reduce((a,r)=>a+Number(r.amount||0), 0);

  const cashRows = (cashTxns||[]).filter(t =>
    t.type === "Spend" && inMonth(t.date) && onSite(cardSiteOf(t)));
  const cash = cashRows.reduce((a,t)=>a+Number(t.amount||0), 0);

  const refillRows = (cashTxns||[]).filter(t =>
    t.type === "Refill" && inMonth(t.date) && onSite(cardSiteOf(t)));

  // a refill is already in the bank column if a register payment shares its date and amount
  const used = new Set();
  let matched = 0, matchedCount = 0;
  refillRows.forEach(t => {
    const hit = bankRows.find(r => !used.has(r.id) &&
      Number(r.amount||0) === Number(t.amount||0) &&
      String(r.paymentDate || r.date || "") === String(t.date || ""));
    if (hit) { used.add(hit.id); matched += Number(t.amount||0); matchedCount++; }
  });
  const refills = refillRows.reduce((a,t)=>a+Number(t.amount||0), 0);

  return { bank, bankCount: bankRows.length,
           cash, cashCount: cashRows.length,
           refills, refillCount: refillRows.length,
           matched, matchedCount,
           total: bank + cash - matched };
}

// Where a ledger stands with us. Anything unpaid is money we owe them, a
// creditor. Anything overpaid and not yet recovered is money they owe us, a
// debtor. A ledger can be both at once, so the net decides which it is today.
function ledgerRows(v, reqs){
  const nm = String(v.name||"").trim().toLowerCase();
  return (reqs||[]).filter(r =>
    !isRolledUp(r) &&
    (r.vendorId === v.id || (nm && String(r.name||"").trim().toLowerCase() === nm)));
}
function ledgerPosition(v, reqs){
  const rows = ledgerRows(v, reqs);
  const billed = rows.reduce((a,r)=>a+Number(r.amount||0), 0);
  const paidRows = rows.filter(isInRegister);
  const paid = paidRows.reduce((a,r)=>a+Number(r.paidAmount || r.amount || 0), 0);
  const payable = rows
    .filter(r => !isInRegister(r) && r.paymentStatus !== "On Hold")
    .reduce((a,r)=>a+Number(r.amount||0), 0);
  const onHold = rows
    .filter(r => !isInRegister(r) && r.paymentStatus === "On Hold")
    .reduce((a,r)=>a+Number(r.amount||0), 0);
  const receivable = rows.filter(r => !r.recovered).reduce((a,r)=>a+excessPaid(r), 0);
  const net = payable - receivable;
  return { rows, billed, paid, payable, onHold, receivable, net,
           side: net > 0.5 ? "Creditor" : net < -0.5 ? "Debtor" : "Settled",
           both: payable > 0.5 && receivable > 0.5 };
}

function isPartnerPaid(r){
  const by = String(r.paidBy || "").trim();
  return !!by && by.toLowerCase() !== "company";
}

function PaymentDetailsModal({ req, onCancel, onSave }){
  const [date, setDate] = useState(req.paymentDate || todayStr());
  const [mode, setMode] = useState(req.paymentMode || "");
  const [utr, setUtr] = useState(req.utr || "");
  const [paid, setPaid] = useState(
    req.paidAmount === "" || req.paidAmount === undefined || req.paidAmount === null
      ? String(req.amount || "") : String(req.paidAmount));

  const billed = Number(req.amount||0);
  const paidNum = Number(paid||0);
  const diff = paidNum - billed;

  function submit(){
    if (!date) { alert("Please enter the payment date."); return; }
    if (!mode) { alert("Please choose the payment mode."); return; }
    if (!paid || paidNum <= 0) { alert("Please enter the amount actually paid."); return; }
    onSave({ paymentDate: date, paymentMode: mode, utr: utr.trim(), paidAmount: paidNum });
  }

  return (
    <div onClick={onCancel}
      style={{ position:"fixed", inset:0, zIndex:75, background:"rgba(24,35,53,0.45)", display:"flex", alignItems:"flex-end", justifyContent:"center" }}>
      <div onClick={e=>e.stopPropagation()}
        style={{ width:"100%", maxWidth:720, background:SURFACE, borderTopLeftRadius:24, borderTopRightRadius:24,
          padding:"12px 20px 24px", maxHeight:"90vh", overflowY:"auto", boxShadow:"0 -4px 24px rgba(0,0,0,0.15)" }}>
        <div style={{ width:40, height:4, borderRadius:999, background:SAND, margin:"0 auto 16px" }} />

        <div style={{ fontWeight:700, fontSize:17, color:INK }}>Payment details</div>
        <div style={{ fontSize:13, color:MUTED, marginTop:2, marginBottom:16 }}>
          {req.name} · ₹{fmtINR(req.amount)}
        </div>

        <Field label="Payment Date" required>
          <input type="date" style={inputStyle} value={date} onChange={e=>setDate(e.target.value)} />
        </Field>
        <Field label="Payment Mode" required>
          <select style={inputStyle} value={mode} onChange={e=>setMode(e.target.value)}>
            <option value="">— choose —</option>
            {PAYMENT_MODES.map(m => <option key={m} value={m}>{m}</option>)}
          </select>
        </Field>
        <Field label="Amount Actually Paid" required hint={`Requisition amount is ₹${fmtINR(billed)}`}>
          <input type="number" inputMode="decimal" style={{...inputStyle, fontWeight:700}} value={paid} onChange={e=>setPaid(e.target.value)} />
        </Field>
        {diff > 0 && (
          <div style={{ background:"#EEF0FE", border:`1.5px solid #3F6CA8`, borderRadius:12, padding:12, marginBottom:16, fontSize:13, color:INK, lineHeight:1.5 }}>
            <strong>₹{fmtINR(diff)} paid extra.</strong> This will be recorded as receivable from {req.name} in the Receivables page.
          </div>
        )}
        {diff < 0 && (
          <div style={{ background:"#EEF0FE", border:`1.5px solid ${AMBER}`, borderRadius:12, padding:12, marginBottom:16, fontSize:13, color:INK, lineHeight:1.5 }}>
            <strong>₹{fmtINR(Math.abs(diff))} still unpaid</strong> against this requisition.
          </div>
        )}

        <Field label="UTR / Transaction Ref" hint="Leave blank if you don't have it yet — you can add it later or import it from the sheet accounts returns.">
          <input style={inputStyle} value={utr} onChange={e=>setUtr(e.target.value)} placeholder="Optional for now" />
        </Field>

        <div style={{ background:"#F7FBF8", border:`1px solid ${SAND}`, borderRadius:12, padding:12, marginBottom:16, fontSize:13, color:INK, lineHeight:1.5 }}>
          Saving this moves the entry out of Requisitions and into the Payment Register.
        </div>

        <BigButton icon="check" label="Save & Move to Register" onClick={submit} tone="green" full />
        <button onClick={onCancel}
          style={{ width:"100%", marginTop:10, padding:"14px 0", borderRadius:16, fontSize:15, fontWeight:600,
            border:`1.5px solid ${SAND}`, background:SURFACE, color:MUTED, cursor:"pointer" }}>
          Cancel
        </button>
      </div>
    </div>
  );
}

                      {Number(v.salary||0) ? `₹${fmtINR(v.salary)}` : "not set"}
                    </span>
                  </div>
                ))}
          </div>

          {sp.excluded.length > 0 && (
            <div style={{ background:SURFACE, borderRadius:20, padding:18, marginBottom:12, border:`1px solid ${SAND}`, boxShadow:SHADOW }}>
              <SectionLabel>Left out of the total</SectionLabel>
              <div style={{ fontSize:12, color:MUTED, marginBottom:8, lineHeight:1.6 }}>
                Paused items and instalments that have finished. Nothing here is counted.
              </div>
              {sp.excluded.slice(0,20).map(r => (
                <div key={r.id} style={{ display:"flex", justifyContent:"space-between", padding:"6px 0", fontSize:13, color:MUTED }}>
                  <span>{r.name}</span>
                  <span>{instalmentDone(r) ? "finished" : "paused"}</span>
                </div>
              ))}
            </div>
          )}
        </React.Fragment>
      )}

      <BigButton icon="download" label="Export Fixed Cost Summary" onClick={exportFixed} tone="green" full />
    </div>
  );
}
