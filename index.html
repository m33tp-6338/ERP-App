function PaymentRegisterTab({ reqs, setReqs, vendors, expenses, setExpenses, cashTxns, cards, lists, setLists, showToast, goTo }){
  const [month, setMonth] = useState("all");
  const [site, setSite] = useState("all");
  const [preview, setPreview] = useState(null);
  const [mode, setMode] = useState("topay");     // topay | register
  const [payTarget, setPayTarget] = useState(null);
  const [showDupes, setShowDupes] = useState(false);
  const [selected, setSelected] = useState(new Set());
  const [bulkOpen, setBulkOpen] = useState(false);
  const [query, setQuery] = useState("");
  const [adding, setAdding] = useState(null);
  const [openReq, setOpenReq] = useState(null);
  const [editReq, setEditReq] = useState(null);

  const paid = useMemo(() => reqs.filter(r => isInRegister(r) && !isRolledUp(r)), [reqs]);

  // everything still awaiting payment, oldest first so nothing quietly ages
  const toPay = useMemo(() => reqs
    .filter(r => !isInRegister(r) && !isRolledUp(r) && r.paymentStatus !== "On Hold")
    .sort((a,b) => String(a.date||"").localeCompare(String(b.date||""))), [reqs]);
  const toPayTotal = toPay.reduce((s,r)=>s+Number(r.amount||0), 0);

  // A payment made straight from the bank, never raised as a requisition.
  // It is stored as a requisition already marked Paid, so it behaves like any other.
  function saveDirectPayment(f){
    if (!f.name.trim()) return showToast("Enter who was paid", "error");
    if (!Number(f.amount)) return showToast("Enter the amount", "error");
    if (!f.paymentDate) return showToast("Enter the date it was paid", "error");
    const record = {
      ...emptyReq, ...f,
      id: uid(),
      refNo: f.refNo || nextRefNo(reqs, f.paymentDate),
      date: f.date || f.paymentDate,
      paymentStatus: "Paid",
      exported: true,
      createdAt: Date.now(),
    };
    const clash = reqs.filter(r => duplicateKeyOf(r) === duplicateKeyOf(record));
    if (clash.length && !confirm(
      `This looks like a payment you already have.\n\n${record.name} - ₹${fmtINR(record.amount)} - ${fmtDate(record.date)}\n` +
      `Already on file as ${clash.map(r=>r.refNo||"no ref").join(", ")}\n\nAdd it anyway?`
    )) return;
    setReqs([...reqs, record]);
    setAdding(null);
    showToast(`${record.refNo} added to the register`);
  }

  // Deleting a payment has to release whatever was hanging off it, or expenses
  // stay marked settled against a payment that no longer exists.
  function deleteSelected(){
    const rows = reqs.filter(r => selected.has(r.id));
    if (!rows.length) return;
    const ids = new Set(rows.map(r => r.id));
    const claimIds = new Set(rows.map(r => r.claimId).filter(Boolean));
    const attachedExp = (expenses||[]).filter(e => e.claimId && claimIds.has(e.claimId));
    const rolled = reqs.filter(r => r.coveredById && ids.has(r.coveredById));
    const total = rows.reduce((a,r)=>a+Number(r.amount||0), 0);
    if (!confirm(
      `Delete ${rows.length} payment(s) totalling ₹${fmtINR(total)}?\n\n` +
      (attachedExp.length ? `${attachedExp.length} attached expense(s) go back to waiting to be repaid.\n` : "") +
      (rolled.length ? `${rolled.length} requisition(s) settled inside these will stand on their own again.\n` : "") +
      `\nThis cannot be undone.`
    )) return;
    if (attachedExp.length) {
      setExpenses((expenses||[]).map(e => (e.claimId && claimIds.has(e.claimId))
        ? { ...e, claimId:"", claimRef:"" } : e));
    }
    setReqs(reqs
      .filter(r => !ids.has(r.id))
      .map(r => (r.coveredById && ids.has(r.coveredById))
        ? { ...r, coveredById:"", coveredByRef:"" } : r));
    setSelected(new Set());
    setBulkOpen(false);
    showToast(`${rows.length} payment(s) deleted`);
  }

  function exportSelectedRows(){
    const rows = reqs.filter(r => selected.has(r.id));
    if (!rows.length) return;
    const ws = XLSX.utils.json_to_sheet(rows.map(r => ({
      "Ref No.":r.refNo||"", Date:fmtDate(r.date), Site:r.site||"", Category:r.category||"",
      "Sub Category":r.subCategory||"", Name:r.name||"", Amount:Number(r.amount)||0,
      Description:r.description||"",
      "Payment Status": isInRegister(r) ? fmtDate(r.paymentDate) : "Pending",
      "Payment Mode":r.paymentMode||"", UTR:r.utr||"",
    })));
    ws["!cols"] = [{wch:16},{wch:12},{wch:16},{wch:14},{wch:14},{wch:22},{wch:12},{wch:28},{wch:15},{wch:14},{wch:22}];
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, "Payments");
    XLSX.writeFile(wb, `Payments_selected_${todayStr()}.xlsx`);
    showToast(`Exported ${rows.length} payment(s)`);
  }

  function markPaid(details){
    if (!payTarget) return;
    setReqs(reqs.map(r => r.id === payTarget.id ? { ...r, paymentStatus:"Paid", ...details } : r));
    setPayTarget(null);
    showToast("Moved to Payment Register");
  }

  const months = useMemo(() => {
    const set = new Set();
    paid.forEach(r => { const d = r.paymentDate || r.date; if (d) set.add(d.slice(0,7)); });
    return [...set].sort().reverse();
  }, [paid]);

  const sites = useMemo(() => [...new Set(paid.map(r=>r.site).filter(Boolean))].sort(), [paid]);

  const filtered = useMemo(() => {
    return paid.filter(r => {
      const d = r.paymentDate || r.date || "";
      if (month !== "all" && d.slice(0,7) !== month) return false;
      if (site !== "all" && r.site !== site) return false;
      if (!matches(query, dateTerms(r.date, r.paymentDate), r.name, r.refNo, r.site, r.category, r.subCategory,
                   r.description, r.amount, r.utr, r.paymentMode, r.paidBy)) return false;
      return true;
    }).sort((a,b) => (b.paymentDate||b.date||"").localeCompare(a.paymentDate||a.date||""));
  }, [paid, month, site, query]);

  const total = filtered.reduce((s,r)=>s+Number(r.amount||0), 0);
  const missingUtr = filtered.filter(r => !r.utr).length;

  const bySite = useMemo(() => {
    const map = {};
    filtered.forEach(r => { const k = r.site||"Unspecified"; map[k]=(map[k]||0)+Number(r.amount||0); });
    return Object.entries(map).sort((a,b)=>b[1]-a[1]);
  }, [filtered]);

  function handleImport(e){
    const file = e.target.files[0];
    e.target.value = "";
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (ev) => {
      try {
        const wb = XLSX.read(ev.target.result, { type:"array" });
        const ws = wb.Sheets[wb.SheetNames[0]];
        const rows = XLSX.utils.sheet_to_json(ws, { defval:"" });
        if (rows.length === 0) { showToast("That sheet has no rows", "error"); return; }

        const sample = rows[0];
        const cRef  = pickCol(sample, ["Ref No.","Ref No","RefNo","Reference","Ref"]);
        const cUtr  = pickCol(sample, ["UTR","UTR No","UTR Number","Transaction ID","Txn ID","Reference No"]);
        const cDate = pickCol(sample, ["Payment Date","Paid On","Date of Payment","Txn Date"]);
        const cMode = pickCol(sample, ["Payment Mode","Mode","Payment Type"]);
        const cName = pickCol(sample, ["Name","Vendor","Party","Payee"]);
        const cAmt  = pickCol(sample, ["Amount","Amt","Paid Amount"]);

        if (!cUtr && !cDate && !cMode) {
          showToast("No UTR / Payment Date / Mode column found in that file", "error");
          return;
        }

        const matched = [], unmatched = [], ambiguous = [];
        const usedIds = new Set();

        rows.forEach((row, i) => {
          const utr  = cUtr  ? String(row[cUtr]||"").trim()  : "";
          const pDate= cDate ? excelToDateStr(row[cDate])    : "";
          const mode = cMode ? String(row[cMode]||"").trim() : "";
          if (!utr && !pDate && !mode) return;   // nothing to apply

          let candidates = [];
          const refVal = cRef ? String(row[cRef]||"").trim() : "";
          if (refVal) {
            candidates = reqs.filter(r => r.refNo && r.refNo.toLowerCase() === refVal.toLowerCase());
          } else if (cName && cAmt) {
            const nm = String(row[cName]||"").trim().toLowerCase();
            const amt = Number(String(row[cAmt]).replace(/[^0-9.\-]/g,""));
            candidates = reqs.filter(r =>
              String(r.name||"").trim().toLowerCase() === nm &&
              Math.abs(Number(r.amount||0) - amt) < 0.01 &&
              !usedIds.has(r.id)
            );
          }

          const label = refVal || `${cName?row[cName]:"row"} ${cAmt?row[cAmt]:""}`.trim();
          if (candidates.length === 1) {
            usedIds.add(candidates[0].id);
            matched.push({ target: candidates[0], utr, paymentDate: pDate, paymentMode: mode, label });
          } else if (candidates.length > 1) {
            ambiguous.push({ label, count: candidates.length, rowNum: i+2 });
          } else {
            unmatched.push({ label, rowNum: i+2 });
          }
        });

        setPreview({ matched, unmatched, ambiguous, usedRef: !!cRef, fileName: file.name });
      } catch(err){
        showToast("Could not read that file — is it a valid Excel file?", "error");
      }
    };
    reader.readAsArrayBuffer(file);
  }

  function applyImport(){
    if (!preview || preview.matched.length === 0) return;
    const map = new Map();
    preview.matched.forEach(m => map.set(m.target.id, m));
    const next = reqs.map(r => {
      const m = map.get(r.id);
      if (!m) return r;
      return {
        ...r,
        paymentStatus: "Paid",
        utr: m.utr || r.utr,
        paymentDate: m.paymentDate || r.paymentDate || todayStr(),
        paymentMode: m.paymentMode || r.paymentMode,
      };
    });
    setReqs(next);
    showToast(`${preview.matched.length} payment(s) updated`);
    setPreview(null);
  }

  function exportRegister(){
    if (filtered.length === 0) { showToast("Nothing to export for this filter", "error"); return; }
    const data = filtered.map(r => ({
      "Ref No.":r.refNo||"", Date:fmtDate(r.date), Site:r.site,
      Category:r.category, "Sub Category":r.subCategory, Name:r.name,
      Amount:Number(r.amount)||0, Description:r.description||"",
      "Payment Status": isInRegister(r) ? fmtDate(r.paymentDate) : "Pending",
      "Payment Mode":r.paymentMode||"", "UTR":r.utr||"",
      "A/c No.":r.accNo||"", "IFSC Code":r.ifsc||"",
    }));
    const ws = XLSX.utils.json_to_sheet(data);
    ws["!cols"] = [{wch:16},{wch:12},{wch:16},{wch:14},{wch:14},{wch:22},{wch:12},{wch:28},{wch:15},{wch:14},{wch:22},{wch:18},{wch:14}];
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, "Payments Made");
    const tag = `${month==="all"?"All":month}${site==="all"?"":"_"+site.replace(/\s+/g,"")}`;
    XLSX.writeFile(wb, `Payments_${tag}.xlsx`);
    showToast(`Exported ${filtered.length} payment(s)`);
  }

  // ---- import preview screen ----
  if (preview) {
    return (
      <div>
        <button onClick={()=>setPreview(null)}
          style={{ display:"flex", alignItems:"center", gap:6, marginBottom:16, fontSize:14, fontWeight:600, color:INK, background:"none", border:"none", cursor:"pointer" }}>
          <Icon name="close" size={16} /> Cancel import
        </button>

        <div style={{ background:SURFACE, borderRadius:16, padding:20, marginBottom:16, border:`1px solid ${SAND}` }}>
          <SectionLabel>Check before applying</SectionLabel>
          <div style={{ fontSize:13, color:MUTED, marginBottom:12 }}>{preview.fileName}</div>
          {!preview.usedRef && (
            <div style={{ background:"#EEF0FE", border:`1px solid ${AMBER}`, borderRadius:12, padding:12, marginBottom:12, fontSize:13, color:INK, lineHeight:1.5 }}>
              No <strong>Ref No.</strong> column found, so rows were matched on name and amount instead.
              That is less reliable — ask accounts to keep the Ref No. column in the sheet they return.
            </div>
          )}
          <ReviewRow label="Will be marked Paid" value={preview.matched.length} />
          <ReviewRow label="No match found" value={preview.unmatched.length} />
          <ReviewRow label="Matched more than one" value={preview.ambiguous.length} />
        </div>

        {preview.matched.length > 0 && (
          <div style={{ background:SURFACE, borderRadius:16, padding:16, marginBottom:16, border:`1px solid ${SAND}` }}>
            <div style={{ fontWeight:700, color:GREEN, fontSize:14, marginBottom:10 }}>Will be updated</div>
            {preview.matched.map((m,i) => (
              <div key={i} style={{ padding:"8px 0", borderTop: i? `1px solid ${SAND}`:"none" }}>
                <div style={{ fontWeight:600, fontSize:14, color:INK }}>{m.target.name} · ₹{fmtINR(m.target.amount)}</div>
                <div style={{ fontSize:12, color:MUTED, marginTop:2 }}>
                  {m.target.refNo || "no ref"} → {fmtDate(m.paymentDate)||"date unchanged"} · {m.paymentMode||"mode unchanged"} · UTR {m.utr||"—"}
                </div>
              </div>
            ))}
          </div>
        )}

        {(preview.unmatched.length > 0 || preview.ambiguous.length > 0) && (
          <div style={{ background:SURFACE, borderRadius:16, padding:16, marginBottom:16, border:`1.5px solid ${RED}` }}>
            <div style={{ fontWeight:700, color:RED, fontSize:14, marginBottom:6 }}>Will be skipped</div>
            <div style={{ fontSize:12, color:MUTED, marginBottom:10, lineHeight:1.5 }}>
              These rows are left completely untouched. Nothing is created or guessed.
            </div>
            {preview.ambiguous.map((u,i) => (
              <div key={"a"+i} style={{ fontSize:13, color:INK, padding:"4px 0" }}>
                Row {u.rowNum}: {u.label} — matches {u.count} entries, too risky to pick one
              </div>
            ))}
            {preview.unmatched.map((u,i) => (
              <div key={"u"+i} style={{ fontSize:13, color:INK, padding:"4px 0" }}>
                Row {u.rowNum}: {u.label} — no matching requisition
              </div>
            ))}
          </div>
        )}

        <BigButton
          icon="check"
          label={preview.matched.length ? `Apply ${preview.matched.length} Update(s)` : "Nothing to apply"}
          onClick={applyImport} tone="green" full disabled={preview.matched.length===0} />
      </div>
    );
  }

  // ---- to-pay screen ----
  if (mode === "topay") {
    return (
      <div>
        {payTarget && (
          <PaymentDetailsModal req={payTarget} onCancel={()=>setPayTarget(null)} onSave={markPaid} />
        )}

        <div style={{ display:"flex", gap:8, marginBottom:14 }}>
          <button onClick={()=>setMode("topay")}
            style={{ flex:1, padding:"11px 0", borderRadius:12, fontSize:14, fontWeight:700, cursor:"pointer",
              background:INK, color:"#fff", border:`1px solid ${INK}` }}>
            To Pay ({toPay.length})
          </button>
          <button onClick={()=>setMode("register")}
            style={{ flex:1, padding:"11px 0", borderRadius:12, fontSize:14, fontWeight:600, cursor:"pointer",
              background:SURFACE, color:INK, border:`1px solid ${SAND}` }}>
            Paid ({paid.length})
          </button>
        </div>

        <div style={{ background:SURFACE, borderRadius:16, padding:20, marginBottom:14, border:`1.5px solid ${toPay.length ? AMBER : SAND}` }}>
          <div style={{ fontSize:12, fontWeight:600, color:MUTED }}>Awaiting payment</div>
          <div style={{ fontSize:26, fontWeight:700, color: toPay.length ? AMBER : INK }}>₹{fmtINR(toPayTotal)}</div>
          <div style={{ fontSize:12, color:MUTED, marginTop:2 }}>{toPay.length} requisition(s)</div>
        </div>

        {toPay.length === 0 ? (
          <EmptyState text="Nothing waiting to be paid. New requisitions appear here until you record the payment." />
        ) : (
          <div style={{ display:"flex", flexDirection:"column", gap:8, marginBottom:20 }}>
            {toPay.map(r => {
              const age = daysUntil(r.date);
              const daysOld = age < 0 ? Math.abs(age) : 0;
              return (
                <div key={r.id} style={{ background:SURFACE, borderRadius:16, padding:14, border:`1px solid ${SAND}`, boxShadow:SHADOW }}>
                  <div style={{ display:"flex", justifyContent:"space-between", gap:8 }}>
                    <div style={{ fontWeight:700, color:INK, overflow:"hidden", textOverflow:"ellipsis", whiteSpace:"nowrap" }}>
                      {r.name || "Unnamed"}
                    </div>
                    <div style={{ fontWeight:700, color:INK, flexShrink:0 }}>₹{fmtINR(r.amount)}</div>
                  </div>
                  <div style={{ fontSize:12, color:MUTED, marginTop:3 }}>
                    {fmtDate(r.date)} · {r.site} · {r.refNo || "no ref"}
                  </div>
                  <div style={{ display:"flex", alignItems:"center", gap:6, marginTop:8, flexWrap:"wrap" }}>
                    <span style={{ fontSize:11, fontWeight:600, padding:"3px 8px", borderRadius:999, color:"#fff", background:STATUS_COLOR[r.paymentStatus] }}>
                      {r.paymentStatus}
                    </span>
                    {daysOld > 7 && (
                      <span style={{ fontSize:11, fontWeight:600, padding:"3px 8px", borderRadius:999, background:"#FDECEE", color:RED }}>
                        {daysOld} days old
                      </span>
                    )}
                    {!r.accNo && (
                      <span style={{ fontSize:11, fontWeight:600, padding:"3px 8px", borderRadius:999, background:"#EEF0FE", color:AMBER }}>
                        No bank details
                      </span>
                    )}
                  </div>
                  <div style={{ display:"flex", gap:8, marginTop:12 }}>
                    <button onClick={()=>setPayTarget(r)}
                      style={{ flex:1, padding:"12px 0", borderRadius:12, fontSize:15, fontWeight:700,
                        background:GREEN, color:"#fff", border:"none", cursor:"pointer" }}>
                      Record Payment
                    </button>
                    <button onClick={()=>{
                        if (!confirm(
                          `Delete this requisition?\n\n${r.name} - ₹${fmtINR(r.amount)}\n${r.refNo || "no ref"} - ${fmtDate(r.date) || "no date"}\n\n` +
                          `It has not been paid, so nothing in the register changes. This cannot be undone.`
                        )) return;
                        setReqs(reqs.filter(x => x.id !== r.id));
                        showToast("Requisition deleted");
                      }}
                      style={{ flexShrink:0, padding:"12px 16px", borderRadius:12, background:"#FDECEE",
                        border:`1px solid ${RED}`, cursor:"pointer", display:"flex", alignItems:"center" }}>
                      <Icon name="trash" size={17} color={RED} />
                    </button>
                  </div>
                </div>
              );
            })}
          </div>
        )}

        <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:10 }}>
          <BigButton icon="sheet" label="Requisitions" onClick={()=>goTo("export")} tone="ink" full />
          <BigButton icon="download" label="Import Payments" onClick={()=>goTo("import:register")} tone="ink" full />
        </div>
      </div>
    );
  }

  if (adding) {
    return <DirectPaymentForm f={adding} setF={setAdding} vendors={vendors} lists={lists} setLists={setLists}
      onCancel={()=>setAdding(null)} onSave={saveDirectPayment} />;
  }

  if (editReq) {
    return <RequisitionForm vendors={vendors} setVendors={()=>{}} reqs={reqs} setReqs={setReqs}
      expenses={expenses} setExpenses={setExpenses} lists={lists} setLists={setLists}
      showToast={showToast} editItem={editReq} onDone={()=>setEditReq(null)} />;
  }

  if (openReq) {
    const live = reqs.find(r => r.id === openReq.id);
    if (!live) { setOpenReq(null); return null; }
    return <RequisitionDetail req={live} vendors={vendors} reqs={reqs} setReqs={setReqs}
      expenses={expenses} setExpenses={setExpenses} lists={lists} setLists={setLists} goTo={goTo} showToast={showToast}
      onBack={()=>setOpenReq(null)}
      onEdit={()=>{ setOpenReq(null); setEditReq(live); }}
      onExport={()=>{}} onDuplicate={()=>{}} />;
  }

  // ---- register screen ----
  return (
    <div>
      <div style={{ display:"flex", gap:8, marginBottom:14 }}>
        <button onClick={()=>setMode("topay")}
          style={{ flex:1, padding:"11px 0", borderRadius:12, fontSize:14, fontWeight:600, cursor:"pointer",
            background:SURFACE, color:INK, border:`1px solid ${SAND}` }}>
          To Pay ({toPay.length})
        </button>
        <button onClick={()=>setMode("register")}
          style={{ flex:1, padding:"11px 0", borderRadius:12, fontSize:14, fontWeight:700, cursor:"pointer",
            background:INK, color:"#fff", border:`1px solid ${INK}` }}>
          Paid ({paid.length})
        </button>
      </div>

      {(() => {
        const dupes = findDuplicateReqs(reqs);
        const noRef = reqs.filter(r => !String(r.refNo||"").trim());
        if (!dupes.length && !noRef.length) return null;
        return (
          <div style={{ background:"#EEF0FE", border:`1.5px solid ${AMBER}`, borderRadius:18, padding:16, marginBottom:14 }}>
            <div style={{ fontWeight:700, color:INK, fontSize:14, marginBottom:6 }}>
              {dupes.length
                ? (() => {
                    const c = dupes.filter(g=>g.level==="certain").length;
                    const l = dupes.filter(g=>g.level==="likely").length;
                    const p = dupes.filter(g=>g.level==="possible").length;
                    return [c ? `${c} certain` : "", l ? `${l} very likely` : "", p ? `${p} worth a look` : ""]
                      .filter(Boolean).join(" · ");
                  })()
                : "Some entries have no reference number"}
            </div>
            <div style={{ fontSize:13, color:INK, lineHeight:1.6, marginBottom:12 }}>
              {dupes.length
                ? "Ranked by how sure it is. A shared UTR or reference is certain. Same date, site, payee, amount and wording is very likely. Everything matching except the wording is only worth a look, since a second load or a second week's labour looks the same."
                : `${noRef.length} entr${noRef.length===1?"y":"ies"} have no reference number, so a repeat could slip in unnoticed.`}
            </div>
            <div style={{ display:"grid", gridTemplateColumns: (dupes.length && noRef.length) ? "1fr 1fr" : "1fr", gap:8 }}>
              {dupes.length > 0 && (
                <button onClick={()=>setShowDupes(!showDupes)}
                  style={{ borderRadius:12, padding:"11px 8px", fontSize:13, fontWeight:700,
                    background: showDupes ? INK : AMBER, color:"#fff", border:"none", cursor:"pointer" }}>
                  {showDupes ? "Hide them" : "Review them"}
                </button>
              )}
              {noRef.length > 0 && (
                <button onClick={()=>{
                    if (!confirm(`Give ${noRef.length} entr${noRef.length===1?"y":"ies"} a reference number?\n\nEach follows the month of its own date, and nothing already in use is repeated.`)) return;
                    let out = [...reqs];
                    noRef.forEach(r => {
                      const ref = nextRefNo(out, r.date);
                      out = out.map(x => x.id === r.id ? { ...x, refNo: ref } : x);
                    });
                    setReqs(out);
                    showToast(`${noRef.length} reference number(s) added`);
                  }}
                  style={{ borderRadius:12, padding:"11px 8px", fontSize:13, fontWeight:700,
                    background:GREEN, color:"#fff", border:"none", cursor:"pointer" }}>
                  Number them
                </button>
              )}
            </div>

            {showDupes && dupes.slice(0,30).map((g,gi) => {
              const tone = g.level === "certain" ? RED : g.level === "likely" ? AMBER : MUTED;
              const heading = g.level === "certain" ? "Certain"
                : g.level === "likely" ? "Very likely" : "Worth a look";
              return (
              <div key={g.sig} style={{ background:SURFACE, borderRadius:14, padding:12, marginTop:10,
                border:`1px solid ${g.level === "possible" ? SAND : tone}` }}>
                <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", gap:8, marginBottom:8 }}>
                  <div style={{ fontSize:11.5, fontWeight:700, color:tone, textTransform:"uppercase", letterSpacing:"0.05em" }}>
                    {heading}
                  </div>
                  <button onClick={()=>{
                      setReqs(reqs.map(r => g.rows.some(x=>x.id===r.id)
                        ? { ...r, dupOk: [...(Array.isArray(r.dupOk)?r.dupOk:[]), g.sig] }
                        : r));
                      showToast("Marked as not a duplicate");
                    }}
                    style={{ fontSize:11.5, fontWeight:700, color:MUTED, background:"none", border:"none",
                      cursor:"pointer", padding:0, textDecoration:"underline" }}>
                    Not a duplicate
                  </button>
                </div>
                <div style={{ fontSize:11.5, color:MUTED, marginBottom:8 }}>{g.why}</div>
                {g.rows.map((r, ri) => (
                  <div key={r.id} style={{ display:"flex", justifyContent:"space-between", alignItems:"center",
                    gap:8, padding:"7px 0", borderTop: ri ? `1px solid ${SAND}` : "none" }}>
                    <div style={{ minWidth:0, flex:1 }}>
                      <div style={{ fontSize:13, fontWeight:600, color:INK, overflow:"hidden",
                        textOverflow:"ellipsis", whiteSpace:"nowrap" }}>{r.name}</div>
                      <div style={{ fontSize:11, color:MUTED, marginTop:2 }}>
                        {r.refNo || "no ref"} · {fmtDate(r.paymentDate || r.date)}{r.utr ? ` · ${r.utr}` : ""}

async function copyText(text, label, showToast){
  if (!text) { showToast(`${label} is empty — add it first`, "error"); return; }
  // 1. modern API — only available on https, not on a local file
  if (navigator.clipboard && window.isSecureContext) {
    try { await navigator.clipboard.writeText(text); showToast(`${label} copied`); return; }
    catch(e) { /* fall through */ }
  }
  // 2. old API — needs a visible, selectable element on mobile
  try {
    const ta = document.createElement("textarea");
    ta.value = text;
    ta.setAttribute("readonly", "");
    ta.style.position = "fixed";
    ta.style.left = "0"; ta.style.top = "0";
    ta.style.width = "1px"; ta.style.height = "1px";
    ta.style.padding = "0"; ta.style.border = "none";
    ta.style.opacity = "0.01";           // not 0 — Android ignores fully hidden elements
    document.body.appendChild(ta);
    ta.focus();
    ta.select();
    ta.setSelectionRange(0, text.length);
    const ok = document.execCommand("copy");
    document.body.removeChild(ta);
    if (ok) { showToast(`${label} copied`); return; }
  } catch(e) { /* fall through */ }
  showToast("Copy blocked by the browser — use Select All, then Copy", "error");
}

function downloadText(text, filename){
  const blob = new Blob([text], { type:"text/plain" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

/* ---------- managed dropdown (choose from list or add to it) ---------- */
function ManagedSelect({ label, required, hint, value, onChange, options, onAddOption, addPrompt }){
  function handle(e){
    const v = e.target.value;
    if (v === "__add__") {
      const name = (prompt(addPrompt || `Add a new ${label.toLowerCase()}:`) || "").trim();
      if (!name) return;
      if (options.some(o => o.toLowerCase() === name.toLowerCase())) {
        onChange(options.find(o => o.toLowerCase() === name.toLowerCase()));
        return;
      }
      onAddOption(name);
      onChange(name);
      return;
    }
    onChange(v);
  }
  const missing = value && !options.includes(value);
  return (
    <Field label={label} required={required} hint={hint}>
      <select style={inputStyle} value={missing ? value : (value || "")} onChange={handle}>
        <option value="">— choose —</option>
        {missing && <option value={value}>{value}</option>}
        {options.map(o => <option key={o} value={o}>{o}</option>)}
        <option value="__add__">+ Add new…</option>
      </select>
    </Field>
  );
}

/* ---------- list helpers ---------- */
function addToList(lists, setLists, kind, name, parent){
  const next = { ...lists, sites:[...(lists.sites||[])], categories:[...(lists.categories||[])],
                 subCategories:{...(lists.subCategories||{})}, types:[...(lists.types||DEFAULT_LISTS.types)],
                 ledgerTypes:[...(lists.ledgerTypes||DEFAULT_LISTS.ledgerTypes)],
                 expenseTypes:[...(lists.expenseTypes||DEFAULT_LISTS.expenseTypes)],
                 people:[...(lists.people||[])],
                 utilityTypes:[...(lists.utilityTypes||DEFAULT_LISTS.utilityTypes)],
                 companies:[...(lists.companies||DEFAULT_LISTS.companies)] };
  if (kind === "type" && !next.types.includes(name)) next.types = [...next.types, name];
  if (kind === "ledgerType" && !next.ledgerTypes.includes(name)) next.ledgerTypes = [...next.ledgerTypes, name];
  if (kind === "expenseType" && !next.expenseTypes.includes(name)) next.expenseTypes = [...next.expenseTypes, name];
  if (kind === "person" && !next.people.includes(name)) next.people = [...next.people, name].sort();
  if (kind === "utilityType" && !next.utilityTypes.includes(name)) next.utilityTypes = [...next.utilityTypes, name];
  if (kind === "company" && !next.companies.includes(name)) next.companies = [...next.companies, name];
  if (kind === "site" && !next.sites.includes(name)) next.sites = [...next.sites, name].sort();
  if (kind === "category" && !next.categories.includes(name)) next.categories = [...next.categories, name].sort();
  if (kind === "subCategory") {
    const key = parent || "General";
    const cur = next.subCategories[key] || [];
    if (!cur.includes(name)) next.subCategories = { ...next.subCategories, [key]: [...cur, name].sort() };
  }
  setLists(next);
}

        if (!confirm(summary)) return;
        applyRestoredData(data);

function PinSettings({ settings, setSettings, showToast }){
  const on = !!(settings.pinEnabled && settings.pinHash);
  const [mode, setMode] = useState("");      // "" | set | change | remove
  const [current, setCurrent] = useState("");
  const [pin1, setPin1] = useState("");
  const [pin2, setPin2] = useState("");
  const [len, setLen] = useState(settings.pinLength || 4);

  function reset(){ setMode(""); setCurrent(""); setPin1(""); setPin2(""); }

  async function checkCurrent(){
    const h = await hashPin(current, settings.pinSalt);
    return h === settings.pinHash;
  }

  async function save(){
    if (mode !== "set" && !(await checkCurrent())) { showToast("Current PIN is wrong", "error"); return; }
    if (mode === "remove") {
      setSettings({ ...settings, pinEnabled:false, pinHash:"", pinSalt:"" });
      reset();
      showToast("PIN removed");
      return;
    }
    if (!/^[0-9]+$/.test(pin1) || pin1.length !== Number(len)) {
      showToast(`Enter ${len} digits`, "error"); return;
    }
    if (pin1 !== pin2) { showToast("The two PINs do not match", "error"); return; }
    if (/^(\d)\1+$/.test(pin1) || pin1 === "1234" || pin1 === "123456") {
      if (!confirm("That PIN is very easy to guess. Use it anyway?")) return;
    }
    const salt = makeSalt();
    const hash = await hashPin(pin1, salt);
    setSettings({ ...settings, pinEnabled:true, pinHash:hash, pinSalt:salt, pinLength:Number(len),
      autoLockMin: settings.autoLockMin === undefined ? 5 : settings.autoLockMin });
    reset();
    showToast("PIN set");
  }

  const numStyle = { ...inputStyle, letterSpacing:6, fontSize:20, fontWeight:700, textAlign:"center" };

  return (
    <div style={{ background:SURFACE, borderRadius:16, padding:20, border:`1px solid ${on ? GREEN : SAND}` }}>
      <SectionLabel>App lock</SectionLabel>

      <div style={{ display:"flex", alignItems:"center", gap:8, marginBottom:12 }}>
        <span style={{ width:10, height:10, borderRadius:"50%", background: on ? GREEN : "#9AA7BC" }} />
        <span style={{ fontWeight:700, color:INK }}>{on ? "PIN is on" : "No PIN set"}</span>
      </div>

      <p style={{ fontSize:13, color:MUTED, lineHeight:1.65, marginBottom:14 }}>
        Asks for a PIN when the app opens, so someone holding your unlocked phone cannot browse your
        payments. It is a deterrent, not encryption — the data underneath is not scrambled, and the PIN
        can be reset from the lock screen so you can never be shut out of your own records.
      </p>

      {mode === "" && (
        <div style={{ display:"flex", flexDirection:"column", gap:10 }}>
          {!on && <BigButton icon="check" label="Set a PIN" onClick={()=>setMode("set")} tone="green" full />}
          {on && (
            <React.Fragment>
              <Field label="Lock again after being away for">
                <select style={inputStyle}
                  value={settings.autoLockMin === undefined ? 5 : settings.autoLockMin}
                  onChange={e=>setSettings({ ...settings, autoLockMin: Number(e.target.value) })}>
                  <option value={0}>Straight away</option>
                  <option value={1}>1 minute</option>
                  <option value={5}>5 minutes</option>
                  <option value={15}>15 minutes</option>
                  <option value={60}>1 hour</option>
                  <option value={-1}>Only when reopened</option>
                </select>
              </Field>
              <button onClick={()=>setMode("change")}
                style={{ borderRadius:16, padding:"14px 20px", fontSize:15, fontWeight:600, background:SAND, color:INK, border:"none", cursor:"pointer" }}>
                Change PIN
              </button>
              <button onClick={()=>setMode("remove")}
                style={{ borderRadius:16, padding:"14px 20px", fontSize:15, fontWeight:600, background:SURFACE, color:RED, border:`1.5px solid ${SAND}`, cursor:"pointer" }}>
                Remove PIN
              </button>
            </React.Fragment>
          )}
        </div>
      )}

      {mode !== "" && (
        <div>
          {mode !== "set" && (
            <Field label="Current PIN" required>
              <input type="password" inputMode="numeric" style={numStyle} value={current}
                onChange={e=>setCurrent(e.target.value.replace(/\D/g,""))} maxLength={6} />
            </Field>
          )}
          {mode !== "remove" && (
            <React.Fragment>
              <Field label="PIN length">
                <select style={inputStyle} value={len} onChange={e=>{ setLen(Number(e.target.value)); setPin1(""); setPin2(""); }}>
                  <option value={4}>4 digits</option>
                  <option value={6}>6 digits</option>
                </select>
              </Field>
              <Field label="New PIN" required>
                <input type="password" inputMode="numeric" style={numStyle} value={pin1}
                  onChange={e=>setPin1(e.target.value.replace(/\D/g,"").slice(0,Number(len)))} maxLength={Number(len)} />
              </Field>
              <Field label="Confirm New PIN" required>
                <input type="password" inputMode="numeric" style={numStyle} value={pin2}
                  onChange={e=>setPin2(e.target.value.replace(/\D/g,"").slice(0,Number(len)))} maxLength={Number(len)} />
              </Field>
            </React.Fragment>
          )}
          <BigButton icon="check"
            label={mode === "remove" ? "Remove PIN" : mode === "change" ? "Change PIN" : "Save PIN"}
            onClick={save} tone={mode === "remove" ? "red" : "green"} full />
          <button onClick={reset}
            style={{ width:"100%", marginTop:10, padding:"14px 0", borderRadius:16, fontSize:15, fontWeight:600,
              border:`1.5px solid ${SAND}`, background:SURFACE, color:MUTED, cursor:"pointer" }}>
            Cancel
          </button>
        </div>
      )}
    </div>
  );
}

function ListManager({ lists, setLists, reqs, showToast }){
  const L = lists || DEFAULT_LISTS;
  const [openCat, setOpenCat] = useState("");

  function usageCount(kind, name, parent){
    if (kind==="type" || kind==="ledgerType" || kind==="expenseType" || kind==="person") return 0;
    if (kind==="site") return reqs.filter(r=>r.site===name).length;
    if (kind==="category") return reqs.filter(r=>r.category===name).length;
    return reqs.filter(r=>r.subCategory===name && (!parent || r.category===parent)).length;
  }
  function removeItem(kind, name, parent){
    const used = usageCount(kind, name, parent);
    const msg = used > 0
      ? `"${name}" is used by ${used} existing entry(s).\n\nRemoving it only takes it off the dropdown — those entries keep their value and are not changed.\n\nRemove from the list?`
      : `Remove "${name}" from the list?`;
    if (!confirm(msg)) return;
    const next = { ...L, sites:[...(L.sites||[])], categories:[...(L.categories||[])],
                   subCategories:{...(L.subCategories||{})}, types:[...(L.types||DEFAULT_LISTS.types)],
                   ledgerTypes:[...(L.ledgerTypes||DEFAULT_LISTS.ledgerTypes)] };
    if (kind==="type") next.types = next.types.filter(x=>x!==name);
    if (kind==="ledgerType") next.ledgerTypes = next.ledgerTypes.filter(x=>x!==name);
    if (kind==="expenseType") next.expenseTypes = next.expenseTypes.filter(x=>x!==name);
    if (kind==="person") next.people = next.people.filter(x=>x!==name);
    if (kind==="site") next.sites = next.sites.filter(x=>x!==name);
    if (kind==="category") {
      next.categories = next.categories.filter(x=>x!==name);
      const sc = {...next.subCategories}; delete sc[name]; next.subCategories = sc;
    }
    if (kind==="subCategory") {
      next.subCategories = { ...next.subCategories, [parent]: (next.subCategories[parent]||[]).filter(x=>x!==name) };
    }
    setLists(next);
    showToast("Removed from list");
  }
  function addItem(kind, parent){
    const name = (prompt(kind==="site" ? "Name of the new site:" : kind==="category" ? "Name of the new category:" : kind==="type" ? "Name of the new type:" : kind==="ledgerType" ? "Name of the new ledger type:" : kind==="expenseType" ? "Name of the new expense type:" : kind==="person" ? "Name of the person:" : `New sub-category under ${parent}:`) || "").trim();
    if (!name) return;
    addToList(L, setLists, kind, name, parent);
    showToast("Added");
  }

  const chip = (name, onRemove) => (
    <span key={name} style={{ display:"inline-flex", alignItems:"center", gap:6, background:SAND, color:INK,
      borderRadius:999, padding:"6px 8px 6px 12px", fontSize:13, fontWeight:600, margin:"0 6px 6px 0" }}>
      {name}
      <button onClick={onRemove} style={{ border:"none", background:"none", cursor:"pointer", padding:2, lineHeight:1, color:MUTED }}>
        <Icon name="close" size={12} color={MUTED} />
      </button>
    </span>
  );

  return (
    <div style={{ background:SURFACE, borderRadius:20, padding:20, border:`1px solid ${SAND}`, boxShadow:SHADOW }}>
      <SectionLabel>Dropdown lists</SectionLabel>
      <p style={{ fontSize:13, color:MUTED, lineHeight:1.5, marginBottom:16 }}>
        These are the options you pick from when creating a requisition. You can also add new ones directly from the form.
        Removing an option here never changes entries you have already saved.
      </p>

      <div style={{ marginBottom:18 }}>
        <div style={{ fontWeight:700, fontSize:14, color:INK, marginBottom:8 }}>People who claim expenses</div>
        <div>{(L.people || []).map(x => chip(x, ()=>removeItem("person", x)))}</div>
        <button onClick={()=>addItem("person")}
          style={{ marginTop:4, fontSize:13, fontWeight:700, color:AMBER, background:"none", border:"none", cursor:"pointer", padding:0 }}>
          + Add person
        </button>
      </div>

      <div style={{ marginBottom:18 }}>
        <div style={{ fontWeight:700, fontSize:14, color:INK, marginBottom:8 }}>Expense types</div>
        <div>{(L.expenseTypes || DEFAULT_LISTS.expenseTypes).map(x => chip(x, ()=>removeItem("expenseType", x)))}</div>
        <button onClick={()=>addItem("expenseType")}
          style={{ marginTop:4, fontSize:13, fontWeight:700, color:AMBER, background:"none", border:"none", cursor:"pointer", padding:0 }}>
          + Add expense type
        </button>
      </div>

      <div style={{ marginBottom:18 }}>
        <div style={{ fontWeight:700, fontSize:14, color:INK, marginBottom:8 }}>Ledger types</div>
        <div>{(L.ledgerTypes || DEFAULT_LISTS.ledgerTypes).map(x => chip(x, ()=>removeItem("ledgerType", x)))}</div>
        <button onClick={()=>addItem("ledgerType")}
          style={{ marginTop:4, fontSize:13, fontWeight:700, color:AMBER, background:"none", border:"none", cursor:"pointer", padding:0 }}>
          + Add ledger type
        </button>
      </div>

      <div style={{ marginBottom:18 }}>
        <div style={{ fontWeight:700, fontSize:14, color:INK, marginBottom:8 }}>Rent &amp; EMI types</div>
        <div>{(L.types || DEFAULT_LISTS.types).map(x => chip(x, ()=>removeItem("type", x)))}</div>
        <button onClick={()=>addItem("type")}
          style={{ marginTop:4, fontSize:13, fontWeight:700, color:AMBER, background:"none", border:"none", cursor:"pointer", padding:0 }}>
          + Add type
        </button>
      </div>

      <div style={{ marginBottom:18 }}>
        <div style={{ fontWeight:700, fontSize:14, color:INK, marginBottom:8 }}>Sites</div>
        <div>{(L.sites||[]).map(x => chip(x, ()=>removeItem("site", x)))}</div>
        <button onClick={()=>addItem("site")}
          style={{ marginTop:4, fontSize:13, fontWeight:700, color:AMBER, background:"none", border:"none", cursor:"pointer", padding:0 }}>
          + Add site
        </button>
      </div>

      <div>
        <div style={{ fontWeight:700, fontSize:14, color:INK, marginBottom:8 }}>Categories &amp; sub-categories</div>
        {(L.categories||[]).length===0 && <div style={{ fontSize:13, color:MUTED, marginBottom:8 }}>No categories yet.</div>}
        {(L.categories||[]).map(cat => (
          <div key={cat} style={{ border:`1px solid ${SAND}`, borderRadius:12, padding:12, marginBottom:8 }}>
            <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center" }}>
              <button onClick={()=>setOpenCat(openCat===cat ? "" : cat)}
                style={{ flex:1, textAlign:"left", background:"none", border:"none", cursor:"pointer", fontWeight:700, fontSize:14, color:INK, padding:0 }}>
                {cat} <span style={{ fontWeight:400, fontSize:12, color:MUTED }}>({((L.subCategories||{})[cat]||[]).length})</span>
              </button>
              <button onClick={()=>removeItem("category", cat)}
                style={{ border:"none", background:"#FDECEE", borderRadius:8, padding:6, cursor:"pointer" }}>
                <Icon name="trash" size={13} color={RED} />
              </button>
            </div>
            {openCat===cat && (
              <div style={{ marginTop:10 }}>
                <div>{((L.subCategories||{})[cat]||[]).map(sc => chip(sc, ()=>removeItem("subCategory", sc, cat)))}</div>
                <button onClick={()=>addItem("subCategory", cat)}
                  style={{ marginTop:4, fontSize:13, fontWeight:700, color:AMBER, background:"none", border:"none", cursor:"pointer", padding:0 }}>
                  + Add sub-category
                </button>
              </div>
            )}
          </div>
        ))}
        <button onClick={()=>addItem("category")}
          style={{ marginTop:4, fontSize:13, fontWeight:700, color:AMBER, background:"none", border:"none", cursor:"pointer", padding:0 }}>
          + Add category
        </button>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<ERPApp />);
</script>

  // Installable / offline support. Safe to no-op when opened as a plain
  // local file (file://) or on a browser that doesn't support it.
  if ("serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "localhost")) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("sw.js").catch(() => {});
    });
  }
</script>
</body>
</html>
