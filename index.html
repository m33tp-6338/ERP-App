/* ================= CASH & CARD ================= */
function CashTab({ cards, setCards, cashTxns, setCashTxns, cashCounts, setCashCounts,
                   vendors, lists, setLists, showToast, goTo, openImport }){
  const L = lists || DEFAULT_LISTS;
  const [cardFilter, setCardFilter] = useState("All");
  const [monthFilter, setMonthFilter] = useState("all");
  const [onlyMissingBill, setOnlyMissingBill] = useState(false);
  const [editing, setEditing] = useState(null);
  const [editingCard, setEditingCard] = useState(null);
  const [counting, setCounting] = useState(null);
  const [sortKey, setSortKey] = useState("date");
  const [desc, setDesc] = useState(true);
  const [query, setQuery] = useState("");
  const [groupBy, setGroupBy] = useState("date");
  const [balOrder, setBalOrder] = useState("entry");   // entry | date

  // Balance in hand after each entry, worked out per card in date order.
  // Independent of how the list is currently sorted or filtered.
  const balanceAfter = useMemo(() => {
    const out = {}; const running = {};
    [...cashTxns].sort(cashOrderBy(balOrder))
      .forEach(t => {
        if (running[t.cardId] === undefined) {
          const c = cards.find(x => x.id === t.cardId);
          running[t.cardId] = 0;
        }
        running[t.cardId] += t.type === "Refill" ? Number(t.amount||0) : -Number(t.amount||0);
        out[t.id] = running[t.cardId];
      });
    return out;
  }, [cashTxns, cards, balOrder]);

  const CASH_SORTS = [
    { k:"entry",  label:"As entered", get:t=>Number(t.seq||0) || Number(t.createdAt||0) },
    { k:"date",   label:"Date",     get:t=>t.date||"" },
    { k:"amount", label:"Amount",   get:t=>Number(t.amount||0) },
    { k:"type",   label:"Type",     get:t=>t.type||"" },
    { k:"payee",  label:"Paid to",  get:t=>String(t.vendorName||"").toLowerCase() },
    { k:"site",   label:"Site",     get:t=>t.site||"" },
  ];
  const [selected, setSelected] = useState(new Set());
  const [bulkOpen, setBulkOpen] = useState(false);

  const activeCards = cards.filter(c => c.active !== false);

  const months = useMemo(() => {
    const set = new Set();
    cashTxns.forEach(t => { if (t.date) set.add(t.date.slice(0,7)); });
    return [...set].sort().reverse();
  }, [cashTxns]);

  const visibleRaw = useMemo(() => cashTxns
    .filter(t => {
      if (cardFilter !== "All" && t.cardId !== cardFilter) return false;
      if (monthFilter !== "all" && (t.date||"").slice(0,7) !== monthFilter) return false;
      if (onlyMissingBill && !(t.type === "Spend" && !t.hasBill)) return false;
      if (!matches(query, dateTerms(t.date), t.vendorName, t.description, t.category, t.subCategory, t.site, t.billNo, t.ref, t.authorisedBy, t.amount)) return false;
      return true;
    }), [cashTxns, cardFilter, monthFilter, onlyMissingBill]);
  const visible = useMemo(
    () => sortBy(visibleRaw, (CASH_SORTS.find(x=>x.k===sortKey)||CASH_SORTS[0]).get, desc),
    [visibleRaw, sortKey, desc]);

  const sections = useMemo(() => {
    const label = (t) => groupBy === "date" ? (t.date || "No date")
      : groupBy === "category" ? (t.category || t.type || "Not set")
      : groupBy === "site" ? (t.site || "No site")
      : (t.type || "Not set");
    const signed = (t) => t.type === "Refill" ? -Number(t.amount||0) : Number(t.amount||0);
    const gs = groupRows(visible, label, signed);
    if (groupBy === "date") gs.sort((a,b)=>String(b.key).localeCompare(String(a.key)));
    else gs.sort((a,b)=>b.total-a.total);
    return gs.map(g => ({ ...g, label: groupBy === "date" ? fmtDate(g.key) || g.key : g.key }));
  }, [visible, groupBy]);

  const catBreak = useMemo(() => {
    const m = {};
    visible.filter(t=>t.type==="Spend").forEach(t => {
      const k = t.category || "Unclassified";
      m[k] = (m[k]||0) + Number(t.amount||0);
    });
    return Object.entries(m).sort((a,b)=>b[1]-a[1]).slice(0,8);
  }, [visible]);

  const scope = cardFilter === "All" ? cashTxns : cashTxns.filter(t => t.cardId === cardFilter);
  const scopeMonth = monthFilter === "all" ? scope : scope.filter(t => (t.date||"").slice(0,7) === monthFilter);
  const refilled = scopeMonth.filter(t=>t.type==="Refill").reduce((s,t)=>s+Number(t.amount||0),0);
  const spent    = scopeMonth.filter(t=>t.type==="Spend").reduce((s,t)=>s+Number(t.amount||0),0);
  const returned = scopeMonth.filter(t=>t.type==="Return").reduce((s,t)=>s+Number(t.amount||0),0);
  // opening and closing balance for whatever period is on screen
  const period = useMemo(() => {
    const inOrder = [...scopeMonth].sort(cashOrderBy(balOrder));
    if (!inOrder.length) return null;
    const first = inOrder[0], last = inOrder[inOrder.length-1];
    const closing = balanceAfter[last.id];
    const firstDelta = first.type === "Refill" ? Number(first.amount||0) : -Number(first.amount||0);
    const opening = balanceAfter[first.id] - firstDelta;
    return { opening, closing };
  }, [scopeMonth, balanceAfter, balOrder]);

  const missingBills = scope.filter(t => t.type==="Spend" && !t.hasBill);
  const missingBillValue = missingBills.reduce((s,t)=>s+Number(t.amount||0),0);

  function saveTxn(t){
    if (!t.date) return showToast("Enter the date", "error");
    if (!t.cardId) return showToast("Choose a card", "error");
    if (!t.amount || Number(t.amount) <= 0) return showToast("Enter a valid amount", "error");
    const exists = cashTxns.some(x => x.id === t.id);
    const nextSeq = cashTxns.reduce((m,x)=>Math.max(m, Number(x.seq||0)), 0) + 1;
    setCashTxns(exists ? cashTxns.map(x => x.id===t.id ? t : x)
                       : [...cashTxns, { ...t, seq: Number(t.seq) || nextSeq, createdAt: Date.now() }]);
    setEditing(null);
    showToast(exists ? "Entry updated" : "Entry added");
  }
  function removeTxn(t){
    if (!confirm(`Delete this ₹${fmtINR(t.amount)} ${t.type.toLowerCase()}?`)) return;
    setCashTxns(cashTxns.filter(x => x.id !== t.id));
    showToast("Deleted");
  }
  function toggleSel(id){
    setSelected(prev => { const n = new Set(prev); n.has(id) ? n.delete(id) : n.add(id); return n; });
  }
  function bulkDeleteTxns(){
    const picked = cashTxns.filter(t => selected.has(t.id));
    const net = picked.reduce((s,t)=>s + (t.type==="Refill" ? Number(t.amount||0) : -Number(t.amount||0)), 0);
    if (!confirm(`Delete ${picked.length} entry(s)?\n\nCard balances will change by ${net >= 0 ? "-" : "+"}Rs ${fmtINR(Math.abs(net))}.\n\nThis cannot be undone.`)) return;
    setCashTxns(cashTxns.filter(t => !selected.has(t.id)));
    setSelected(new Set());
    showToast(`${picked.length} deleted`);
  }
  function bulkMarkBill(has){
    setCashTxns(cashTxns.map(t => selected.has(t.id) && t.type === "Spend" ? { ...t, hasBill: has } : t));
    setSelected(new Set());
    showToast(has ? "Marked as having a bill" : "Marked as no bill");
  }

  function saveCard(c){
    if (!c.name.trim()) return showToast("Give the card a name", "error");
    const exists = cards.some(x => x.id === c.id);
    setCards(exists ? cards.map(x => x.id===c.id ? c : x) : [...cards, c]);
    setEditingCard(null);
    showToast("Card saved");
  }

  function exportCash(){
    if (cashTxns.length === 0) { showToast("Nothing to export", "error"); return; }
    const nameOf = (id) => (cards.find(c=>c.id===id)||{}).name || "";
    const rows = (cardFilter === "All" ? cashTxns : scope)
      .slice().sort((a,b)=>String(a.date||"").localeCompare(String(b.date||"")))
      .map(t => ({
        Date:fmtDate(t.date), Card:nameOf(t.cardId), Type:t.type,
        Amount:Number(t.amount)||0, Site:t.site||"", Category:t.category||"",
        "Sub-Category":t.subCategory||"", "Paid To":t.vendorName||"",
        Description:t.description||"", "Bill No":t.billNo||"",
        "Bill Attached": t.hasBill ? "Yes" : "No",
        "Authorised By":t.authorisedBy||"", Reference:t.ref||"",
      }));
    const ws = XLSX.utils.json_to_sheet(rows);
    ws["!cols"] = [{wch:12},{wch:18},{wch:10},{wch:14},{wch:16},{wch:16},{wch:16},{wch:22},{wch:30},{wch:14},{wch:13},{wch:18},{wch:18}];
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, "Cash Entries");

    const summary = cards.map(c => {
      const t = cashTxns.filter(x=>x.cardId===c.id);
      return {
        Card:c.name, Site:c.site||"", Holder:c.holder||"",
        "Refilled":t.filter(x=>x.type==="Refill").reduce((s,x)=>s+Number(x.amount||0),0),
        "Spent":t.filter(x=>x.type==="Spend").reduce((s,x)=>s+Number(x.amount||0),0),
        "Returned":t.filter(x=>x.type==="Return").reduce((s,x)=>s+Number(x.amount||0),0),
        "Balance in hand":cardBalance(c, cashTxns),
        "Spends without bill":t.filter(x=>x.type==="Spend" && !x.hasBill).length,
      };
    });
    const sws = XLSX.utils.json_to_sheet(summary);
    sws["!cols"] = [{wch:18},{wch:16},{wch:18},{wch:14},{wch:14},{wch:14},{wch:18},{wch:18}];
    XLSX.utils.book_append_sheet(wb, sws, "Card Summary");

    if (missingBills.length) {
      const mws = XLSX.utils.json_to_sheet(missingBills.map(t => ({
        Date:fmtDate(t.date), Card:nameOf(t.cardId), Amount:Number(t.amount)||0,
        "Paid To":t.vendorName||"", Description:t.description||"", Site:t.site||"",
        "Authorised By":t.authorisedBy||"",
      })));
      mws["!cols"] = [{wch:12},{wch:18},{wch:14},{wch:22},{wch:30},{wch:16},{wch:18}];
      XLSX.utils.book_append_sheet(wb, mws, "Bills Missing");
    }
    XLSX.writeFile(wb, `Cash_${todayStr()}.xlsx`);
    showToast(`Exported ${rows.length} entry(s)`);
  }

  /* ---- forms ---- */
  if (editingCard) {
    const c = editingCard;
    return (
      <div>
        <button onClick={()=>setEditingCard(null)}
          style={{ display:"flex", alignItems:"center", gap:6, marginBottom:16, fontSize:14, fontWeight:600, color:INK, background:"none", border:"none", cursor:"pointer" }}>
          <Icon name="close" size={16} /> Cancel
        </button>
        <div style={{ background:SURFACE, borderRadius:20, padding:20, border:`1px solid ${SAND}`, boxShadow:SHADOW }}>
          <SectionLabel>Card</SectionLabel>
          <Field label="Card name" required hint="e.g. Site A Card">
            <input style={inputStyle} value={c.name} onChange={e=>setEditingCard({...c, name:e.target.value})} />
          </Field>
          <ManagedSelect label="Site" value={c.site} onChange={x=>setEditingCard({...c, site:x})}
            options={L.sites || []}
            onAddOption={(n)=>addToList(L, setLists, "site", n)} addPrompt="Name of the new site:" />
          <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:12 }}>
            <Field label="Held by">
              <input style={inputStyle} value={c.holder} onChange={e=>setEditingCard({...c, holder:e.target.value})} />
            </Field>
            <Field label="Last 4 digits">
              <input style={inputStyle} value={c.last4} maxLength={4} inputMode="numeric"
                onChange={e=>setEditingCard({...c, last4:e.target.value.replace(/\D/g,"")})} />
            </Field>
          </div>
          <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:12 }}>
            <Field label="Bank">
              <input style={inputStyle} value={c.bank} onChange={e=>setEditingCard({...c, bank:e.target.value})} />
            </Field>
          </div>
          <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:12 }}>
            <Field label="Card charge %" hint="Surcharge your bank adds on card payments. Used to work out the charge automatically.">
              <input type="number" inputMode="decimal" style={inputStyle} value={c.surchargePct||""}
                onChange={e=>setEditingCard({...c, surchargePct:e.target.value})} placeholder="e.g. 1.8" />
            </Field>
          </div>
          <BigButton icon="check" label="Save Card" onClick={()=>saveCard(c)} tone="green" full />

          {cards.some(x => x.id === c.id) && (
            <button onClick={()=>openImport("cash", c.id)}
              style={{ width:"100%", marginTop:10, borderRadius:16, padding:"14px 20px", fontSize:15, fontWeight:600,
                background:SAND, color:INK, border:"none", cursor:"pointer" }}>
              Import transactions for this card
            </button>
          )}

          {cards.some(x => x.id === c.id) && (() => {
            const mine = cashTxns.filter(t => t.cardId === c.id);
            const spent = mine.filter(t=>t.type==="Spend").reduce((a,t)=>a+Number(t.amount||0),0);
            const inAmt = mine.filter(t=>t.type==="Refill").reduce((a,t)=>a+Number(t.amount||0),0);
            return (
              <div style={{ marginTop:20, paddingTop:18, borderTop:`1px solid ${SAND}` }}>
                <SectionLabel>Remove this card</SectionLabel>
                <p style={{ fontSize:13, color:MUTED, lineHeight:1.6, marginBottom:14 }}>
                  {mine.length
                    ? `This card has ${mine.length} entr${mine.length===1?"y":"ies"} - ₹${fmtINR(inAmt)} in and ₹${fmtINR(spent)} spent. Deleting the card deletes those entries too, since they cannot exist without it.`
                    : "This card has no entries, so nothing else is affected."}
                </p>
                <button onClick={()=>{
                    if (mine.length) {
                      if (!confirm(
                        `Delete "${c.name}" and its ${mine.length} entr${mine.length===1?"y":"ies"}?\n\n` +
                        `₹${fmtINR(inAmt)} in and ₹${fmtINR(spent)} spent will be removed from your records.\n\n` +
                        `If you only want to remove a few wrong entries, cancel and delete those individually instead.\n\n` +
                        `This cannot be undone.`
                      )) return;
                      const second = prompt(`Type the card name to confirm:\n${c.name}`);
                      if (String(second||"").trim() !== c.name.trim()) {
                        showToast("Name did not match - nothing deleted", "error");
                        return;
                      }
                      setCashTxns(cashTxns.filter(t => t.cardId !== c.id));
                    } else if (!confirm(`Delete "${c.name}"?`)) return;
                    setCards(cards.filter(x => x.id !== c.id));
                    setCashCounts((cashCounts||[]).filter(x => x.cardId !== c.id));
                    if (cardFilter === c.id) setCardFilter("All");
                    setEditingCard(null);
                    showToast(mine.length ? `Card and ${mine.length} entr${mine.length===1?"y":"ies"} deleted` : "Card deleted");
                  }}
                  style={{ width:"100%", padding:"14px 0", borderRadius:16, fontSize:15, fontWeight:700,
                    background:SURFACE, color:RED, border:`1.5px solid ${RED}`, cursor:"pointer" }}>
                  Delete Card{mine.length ? ` and ${mine.length} entr${mine.length===1?"y":"ies"}` : ""}
                </button>
              </div>
            );
          })()}
        </div>
      </div>
    );
  }

  if (counting) {
    const card = cards.find(c => c.id === counting.cardId);
    const book = card ? cardBalance(card, cashTxns) : 0;
    const diff = Number(counting.counted || 0) - book;
    return (
      <div>
        <button onClick={()=>setCounting(null)}
          style={{ display:"flex", alignItems:"center", gap:6, marginBottom:16, fontSize:14, fontWeight:600, color:INK, background:"none", border:"none", cursor:"pointer" }}>
          <Icon name="close" size={16} /> Cancel
        </button>
        <div style={{ background:SURFACE, borderRadius:20, padding:20, border:`1px solid ${SAND}`, boxShadow:SHADOW }}>
          <SectionLabel>Count the cash</SectionLabel>
          <Field label="Card" required>
            <select style={inputStyle} value={counting.cardId} onChange={e=>setCounting({...counting, cardId:e.target.value})}>
              <option value="">— choose —</option>
              {activeCards.map(c => <option key={c.id} value={c.id}>{c.name}</option>)}
            </select>
          </Field>
          <Field label="Date" required>
            <input type="date" style={inputStyle} value={counting.date} onChange={e=>setCounting({...counting, date:e.target.value})} />
          </Field>
          <Field label="Cash actually counted" required>
            <input type="number" inputMode="decimal" style={{...inputStyle, fontWeight:700, fontSize:20}}
              value={counting.counted} onChange={e=>setCounting({...counting, counted:e.target.value})} />
          </Field>
          {card && (
            <div style={{ background: Math.abs(diff) < 1 ? "#E6F7F2" : "#FDECEE",
              border:`1px solid ${Math.abs(diff) < 1 ? GREEN : RED}`, borderRadius:14, padding:14, marginBottom:16 }}>
              <div style={{ display:"flex", justifyContent:"space-between", fontSize:14, marginBottom:4 }}>
                <span style={{ color:MUTED }}>Book balance</span>
                <span className="num" style={{ fontWeight:700, color:INK }}>₹{fmtINR(book)}</span>
              </div>
              <div style={{ display:"flex", justifyContent:"space-between", fontSize:14 }}>
                <span style={{ color:MUTED }}>Difference</span>
                <span className="num" style={{ fontWeight:700, color: Math.abs(diff)<1 ? GREEN : RED }}>
                  {diff > 0 ? "+" : ""}₹{fmtINR(diff)}
                </span>
              </div>
              <div style={{ fontSize:12, color:INK, marginTop:8, lineHeight:1.55 }}>
                {Math.abs(diff) < 1 ? "Matches. Nothing to explain."
                  : diff > 0 ? "More cash than the book says — an entry may be missing."
                  : "Less cash than the book says — a spend may not have been recorded."}
              </div>
            </div>
          )}
          <Field label="Note">
            <input style={inputStyle} value={counting.note} onChange={e=>setCounting({...counting, note:e.target.value})}
              placeholder="Anything worth remembering" />
          </Field>
          <BigButton icon="check" label="Record Count" onClick={()=>{
            if (!counting.cardId) return showToast("Choose a card", "error");
            if (counting.counted === "") return showToast("Enter the counted amount", "error");
            setCashCounts([...(cashCounts||[]), { ...counting, createdAt: Date.now() }]);
            setCounting(null);
            showToast("Count recorded");
          }} tone="green" full />
        </div>
      </div>
    );
  }

  if (editing) {
    return <CashTxnForm txn={editing} cards={activeCards} vendors={vendors} lists={L} setLists={setLists}
      onCancel={()=>setEditing(null)} onSave={saveTxn} />;
  }

  /* ---- main ---- */
  return (
    <div>
      <button onClick={()=>goTo("dashboard")}
        style={{ display:"flex", alignItems:"center", gap:6, marginBottom:16, fontSize:14, fontWeight:600, color:INK, background:"none", border:"none", cursor:"pointer" }}>
        <Icon name="close" size={16} /> Back to dashboard
      </button>

      {cards.length === 0 ? (
        <div style={{ marginBottom:14 }}>
          <EmptyState text="No cards yet. Add one card per site, then record every ATM refill and every spend against it." />
        </div>
      ) : (
        <div style={{ display:"flex", flexDirection:"column", gap:10, marginBottom:14 }}>
          {cards.map(c => {
            const bal = cardBalance(c, cashTxns);
            const miss = cashTxns.filter(t => t.cardId===c.id && t.type==="Spend" && !t.hasBill).length;
            const lastCount = (cashCounts||[]).filter(x=>x.cardId===c.id)
              .sort((a,b)=>String(b.date||"").localeCompare(String(a.date||"")))[0];
            return (
              <div key={c.id} onClick={()=>setCardFilter(cardFilter === c.id ? "All" : c.id)}
                style={{ background:GRAD_INK, borderRadius:20, padding:18, boxShadow:SHADOW_LG, cursor:"pointer",
                  outline: cardFilter === c.id ? `2.5px solid ${AMBER}` : "none", outlineOffset:2 }}>
                <div style={{ display:"flex", justifyContent:"space-between", alignItems:"flex-start", gap:10 }}>
                  <div style={{ minWidth:0 }}>
                    <div style={{ color:"#fff", fontWeight:700, fontSize:16 }}>{c.name}</div>
                    <div style={{ color:"#8FA0BC", fontSize:12, marginTop:3 }}>
                      {[c.site, c.holder, c.last4 ? "**** "+c.last4 : ""].filter(Boolean).join(" · ")}
                    </div>
                  </div>
                  <div style={{ display:"flex", gap:7, flexShrink:0 }}>
                    <button onClick={(e)=>{ e.stopPropagation(); setCardFilter(cardFilter === c.id ? "All" : c.id); }}
                      style={{ background: cardFilter === c.id ? AMBER : "rgba(255,255,255,0.12)", border:"none",
                        borderRadius:10, padding:"8px 11px", cursor:"pointer", fontSize:12, fontWeight:700, color:"#fff" }}>
                      {cardFilter === c.id ? "Showing" : "Entries"}
                    </button>
                    <button onClick={(e)=>{ e.stopPropagation(); setEditingCard(c); }}
                      style={{ background:"rgba(255,255,255,0.12)", border:"none", borderRadius:10, padding:8, cursor:"pointer" }}>
                      <Icon name="edit" size={14} color="#fff" />
                    </button>
                  </div>
                </div>
                <div className="num" style={{ color:"#fff", fontWeight:800, fontSize:26, marginTop:12 }}>
                  ₹{fmtINR(bal)}
                </div>
                <div style={{ color:"#8FA0BC", fontSize:12 }}>cash in hand</div>
                <div style={{ display:"flex", gap:8, marginTop:12, flexWrap:"wrap" }}>
                  {miss > 0 && (
                    <span style={{ fontSize:11, fontWeight:700, padding:"4px 10px", borderRadius:999, background:"rgba(225,75,84,0.25)", color:"#FFB4B4" }}>
                      {miss} without bill
                    </span>
                  )}
                  {lastCount && (
                    <span style={{ fontSize:11, fontWeight:600, padding:"4px 10px", borderRadius:999, background:"rgba(255,255,255,0.12)", color:"#fff" }}>
                      counted {fmtDate(lastCount.date)}
                    </span>
                  )}
                  {bal < 0 && (
                    <span style={{ fontSize:11, fontWeight:700, padding:"4px 10px", borderRadius:999, background:"rgba(225,75,84,0.25)", color:"#FFB4B4" }}>
                      negative — check entries
                    </span>
                  )}
                </div>
              </div>
            );
          })}
        </div>
      )}

      {(() => {
        const bad = cards.map(c => ({ card:c, low: lowestBalance(c, cashTxns, balOrder) }))
                         .filter(x => x.low < -0.5);
        if (!bad.length) return null;
        return (
          <div style={{ background:"#EEF0FE", border:`1.5px solid ${AMBER}`, borderRadius:18, padding:16, marginBottom:14 }}>
            <div style={{ fontWeight:700, color:INK, fontSize:14, marginBottom:6 }}>
              Running balance dips below zero
            </div>
            <div style={{ fontSize:13, color:INK, lineHeight:1.65, marginBottom:12 }}>
              This affects only the figure shown beside each row. Cash in hand above is a plain
              credit minus debit and is unaffected. A dip means money was spent before the credit
              that funded it appears in the book.
            </div>
            {bad.map(({card, low}) => (
              <div key={card.id} style={{ background:SURFACE, borderRadius:13, padding:13, marginBottom:9 }}>
                <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", gap:8, marginBottom:9 }}>
                  <span style={{ fontWeight:700, color:INK, fontSize:13.5 }}>{card.name}</span>
                  <span className="num" style={{ fontWeight:700, color:AMBER, fontSize:13.5 }}>
                    lowest {fmtINR(low)}
                  </span>
                </div>
                <button onClick={()=>{ setCardFilter(card.id); setSortKey("entry"); setDesc(false); }}
                  style={{ width:"100%", borderRadius:11, padding:"10px 6px", fontSize:12.5, fontWeight:600,
                    background:SAND, color:INK, border:"none", cursor:"pointer" }}>
                  Show its entries in written order
                </button>
              </div>
            ))}
            <div style={{ fontSize:12, color:MUTED, lineHeight:1.6 }}>
              Try the <strong>As entered</strong> and <strong>By date</strong> buttons above to see
              which order matches your book.
            </div>
          </div>
        );
      })()}

      <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:10, marginBottom:14 }}>
        <BigButton icon="plus" label="Add Entry"
          onClick={()=>{
            if (activeCards.length === 0) { showToast("Add a card first", "error"); return; }
            setEditing({ ...emptyCashTxn, id: uid(), date: todayStr(),
              cardId: cardFilter !== "All" ? cardFilter : (activeCards.length===1 ? activeCards[0].id : ""),
              site: (cards.find(c=>c.id===cardFilter)||{}).site || "" });
          }} tone="amber" full />
        <BigButton icon="vendors" label="Add Card"
          onClick={()=>setEditingCard({ ...emptyCard, id: uid() })} tone="ink" full />
      </div>

      <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr 1fr", gap:8, marginBottom:14 }}>
        <button onClick={()=>setCounting({ ...emptyCashCount, id: uid(), date: todayStr(),
            cardId: cardFilter !== "All" ? cardFilter : (activeCards[0] ? activeCards[0].id : "") })}
          style={{ borderRadius:14, padding:"12px 6px", fontSize:13, fontWeight:600, background:SAND, color:INK, border:"none", cursor:"pointer" }}>
          Count cash
        </button>
        <button onClick={()=>openImport("cash", cardFilter !== "All" ? cardFilter : "")}
          style={{ borderRadius:14, padding:"12px 6px", fontSize:13, fontWeight:600, background:SAND, color:INK, border:"none", cursor:"pointer" }}>
          Import
        </button>
        <button onClick={exportCash}
          style={{ borderRadius:14, padding:"12px 6px", fontSize:13, fontWeight:700, background:GREEN, color:"#fff", border:"none", cursor:"pointer" }}>
          Export
        </button>
      </div>

      {cards.length > 0 && (
        <div style={{ display:"flex", gap:8, marginBottom:10, overflowX:"auto", paddingBottom:4 }}>
          {["All", ...cards.map(c=>c.id)].map(id => {
            const label = id === "All" ? "All cards" : (cards.find(c=>c.id===id)||{}).name;
            const on = cardFilter === id;
            return (
              <button key={id} onClick={()=>setCardFilter(id)}
                style={{ padding:"8px 14px", borderRadius:12, fontSize:14, fontWeight:600, whiteSpace:"nowrap", cursor:"pointer",
                  background: on?INK:SURFACE, color: on?"#fff":INK, border:`1px solid ${on?INK:SAND}` }}>
                {label}
              </button>
            );
          })}
        </div>
      )}

      <div style={{ display:"grid", gridTemplateColumns:"1fr auto", gap:8, marginBottom:14 }}>
        <select style={inputStyle} value={monthFilter} onChange={e=>setMonthFilter(e.target.value)}>
          <option value="all">All months</option>
          {months.map(m => <option key={m} value={m}>{monthLabel(m)}</option>)}
        </select>
        <button onClick={()=>setOnlyMissingBill(!onlyMissingBill)}
          style={{ borderRadius:14, padding:"0 14px", fontSize:13, fontWeight:600, whiteSpace:"nowrap", cursor:"pointer",
            background: onlyMissingBill?RED:SURFACE, color: onlyMissingBill?"#fff":INK, border:`1px solid ${onlyMissingBill?RED:SAND}` }}>
          No bill{missingBills.length ? ` (${missingBills.length})` : ""}
        </button>
      </div>

      <div style={{ background:SURFACE, borderRadius:20, padding:18, marginBottom:14, border:`1px solid ${SAND}`, boxShadow:SHADOW }}>
        <div style={{ fontSize:11.5, fontWeight:700, color:AMBER, textTransform:"uppercase",
          letterSpacing:"0.08em", marginBottom:12 }}>
          {monthFilter === "all" ? "All time" : monthLabel(monthFilter)}
          {cardFilter !== "All" ? ` · ${(cards.find(c=>c.id===cardFilter)||{}).name || ""}` : ""}
        </div>

        {period && (
          <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center",
            paddingBottom:10, marginBottom:10, borderBottom:`1px solid ${SAND}` }}>
            <span style={{ fontSize:13, color:MUTED, fontWeight:600 }}>Opening balance</span>
            <span className="num" style={{ fontSize:15, fontWeight:700, color:INK }}>₹{fmtINR(period.opening)}</span>
          </div>
        )}

        <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", padding:"5px 0" }}>
          <span style={{ display:"flex", alignItems:"center", gap:8, fontSize:13.5, color:INK }}>
            <span style={{ width:7, height:7, borderRadius:"50%", background:GREEN }} />
            Money in
          </span>
          <span className="num" style={{ fontSize:15, fontWeight:700, color:GREEN }}>+ ₹{fmtINR(refilled)}</span>
        </div>
        <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", padding:"5px 0" }}>
          <span style={{ display:"flex", alignItems:"center", gap:8, fontSize:13.5, color:INK }}>
            <span style={{ width:7, height:7, borderRadius:"50%", background:AMBER }} />
            Spent
          </span>
          <span className="num" style={{ fontSize:15, fontWeight:700, color:INK }}>- ₹{fmtINR(spent)}</span>
        </div>
        {returned > 0 && (
          <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", padding:"5px 0" }}>
            <span style={{ display:"flex", alignItems:"center", gap:8, fontSize:13.5, color:INK }}>
              <span style={{ width:7, height:7, borderRadius:"50%", background:"#9AA7BC" }} />
              Returned
            </span>
            <span className="num" style={{ fontSize:15, fontWeight:700, color:MUTED }}>- ₹{fmtINR(returned)}</span>
          </div>
        )}

        {period && (
          <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center",
            paddingTop:11, marginTop:8, borderTop:`2px solid ${INK}` }}>
            <span style={{ fontSize:14, fontWeight:700, color:INK }}>Should be in hand</span>
            <span className="num" style={{ fontSize:19, fontWeight:800, color: period.closing < 0 ? RED : INK }}>
              ₹{fmtINR(period.closing)}
            </span>
          </div>
        )}

        <div style={{ marginTop:14, paddingTop:12, borderTop:`1px solid ${SAND}` }}>
          <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:8 }}>
            <span style={{ fontSize:11.5, fontWeight:700, color:MUTED, textTransform:"uppercase", letterSpacing:"0.07em" }}>
              Cash in hand, all entries
            </span>
            <div style={{ display:"flex", gap:5 }}>
              {[["entry","As entered"],["date","By date"]].map(([k,lbl]) => (
                <button key={k} onClick={()=>setBalOrder(k)}
                  style={{ padding:"5px 10px", borderRadius:9, fontSize:11, fontWeight:700, cursor:"pointer",
                    background: balOrder===k?INK:SURFACE, color: balOrder===k?"#fff":MUTED,
                    border:`1px solid ${balOrder===k?INK:SAND}` }}>
                  {lbl}
                </button>
              ))}
            </div>
          </div>
          {(() => {
            const all = cardFilter === "All" ? cashTxns : cashTxns.filter(t => t.cardId === cardFilter);
            const inAll  = all.filter(t=>t.type==="Refill").reduce((a,t)=>a+Number(t.amount||0),0);
            const outAll = all.filter(t=>t.type!=="Refill").reduce((a,t)=>a+Number(t.amount||0),0);
            const openAll = 0;
            return (
              <React.Fragment>
                <div style={{ display:"flex", justifyContent:"space-between", fontSize:13, padding:"3px 0" }}>
                  <span style={{ color:MUTED }}>Total credit ({all.filter(t=>t.type==="Refill").length})</span>
                  <span className="num" style={{ fontWeight:700, color:GREEN }}>{fmtINR(inAll)}</span>
                </div>
                <div style={{ display:"flex", justifyContent:"space-between", fontSize:13, padding:"3px 0" }}>
                  <span style={{ color:MUTED }}>Total debit ({all.filter(t=>t.type!=="Refill").length})</span>
                  <span className="num" style={{ fontWeight:700, color:INK }}>{fmtINR(outAll)}</span>
                </div>
                {openAll !== 0 && (
                  <div style={{ display:"flex", justifyContent:"space-between", fontSize:13, padding:"3px 0" }}>
                    <span style={{ color:MUTED }}>Opening balance</span>
                    <span className="num" style={{ fontWeight:700, color:INK }}>{fmtINR(openAll)}</span>
                  </div>
                )}
                <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center",
                  paddingTop:9, marginTop:5, borderTop:`2px solid ${INK}` }}>
                  <span style={{ fontWeight:700, color:INK, fontSize:14 }}>Cash in hand</span>
                  <span className="num" style={{ fontWeight:800, fontSize:19,
                    color: (openAll + inAll - outAll) < 0 ? RED : INK }}>
                    {fmtINR(openAll + inAll - outAll)}
                  </span>
                </div>
                <div style={{ fontSize:11.5, color:MUTED, marginTop:6, lineHeight:1.5 }}>
                  Credit minus debit. This total never depends on the order entries are in.
                </div>
              </React.Fragment>
            );
          })()}
        </div>

        {missingBillValue > 0 && (
          <button onClick={()=>setOnlyMissingBill(true)}
            style={{ width:"100%", marginTop:12, padding:"10px 12px", borderRadius:12, cursor:"pointer",
              background:"#FDECEE", border:`1px solid ${RED}`, textAlign:"left",
              display:"flex", justifyContent:"space-between", alignItems:"center" }}>
            <span style={{ fontSize:12.5, fontWeight:600, color:INK }}>
              {missingBills.length} spend(s) with no bill
            </span>
            <span className="num" style={{ fontSize:13, fontWeight:700, color:RED }}>₹{fmtINR(missingBillValue)}</span>
          </button>
        )}
      </div>

      <SearchBox value={query} onChange={setQuery} placeholder="Search payee, description, bill no" />
      <GroupBar value={groupBy} onChange={setGroupBy} options={[
        {k:"date",label:"Date"},{k:"category",label:"Category"},{k:"site",label:"Site"},{k:"type",label:"Type"}]} />
      <SortBar sortKey={sortKey} onSortKey={setSortKey} options={CASH_SORTS} desc={desc} onDesc={setDesc} />
      <SelectAllBar count={selected.size} total={visible.length}
        onToggleAll={()=>setSelected(selected.size===visible.length ? new Set() : new Set(visible.map(t=>t.id)))} />

      {visible.length === 0 ? (
        <EmptyState text={onlyMissingBill ? "Every spend has a bill recorded." : "No entries for this filter yet."} />
      ) : (
        <React.Fragment>
          {catBreak.length > 1 && (
            <div style={{ background:SURFACE, borderRadius:20, padding:18, marginBottom:12, border:`1px solid ${SAND}`, boxShadow:SHADOW }}>
              <div style={{ fontWeight:700, marginBottom:12, color:INK }}>Where the money went</div>
              <BarList data={catBreak} color={AMBER} />
            </div>
          )}

          <div style={{ display:"flex", flexDirection:"column", gap:6, marginBottom: selected.size ? 150 : 24 }}>
            {sections.map(g => (
              <React.Fragment key={g.key}>
                <GroupHead label={g.label} count={g.rows.length} total={g.total}
                  tone={g.total < 0 ? GREEN : INK} />
                {g.rows.map(t => {
                  const card = cards.find(c=>c.id===t.cardId);
                  const isIn = t.type === "Refill";
                  const noBill = t.type === "Spend" && !t.hasBill;
                  return (
                    <div key={t.id} onClick={()=>setEditing(t)}
                      style={{ background:SURFACE, borderRadius:14, padding:"12px 14px", display:"flex", gap:11,
                        alignItems:"center", cursor:"pointer",
                        border:`1.5px solid ${selected.has(t.id) ? AMBER : SAND}`,
                        borderLeft:`4px solid ${isIn ? GREEN : t.type==="Return" ? "#9AA7BC" : noBill ? RED : AMBER}`,
                        boxShadow:SHADOW }}>
                      <SelectCheck on={selected.has(t.id)} onToggle={()=>toggleSel(t.id)} />
                      <div style={{ flex:1, minWidth:0 }}>
                        <div style={{ fontWeight:650, fontSize:14.5, color:INK, overflow:"hidden",
                          textOverflow:"ellipsis", whiteSpace:"nowrap" }}>
                          {t.vendorName || t.description || t.type}
                        </div>
                        <div style={{ fontSize:12, color:MUTED, marginTop:2, overflow:"hidden",
                          textOverflow:"ellipsis", whiteSpace:"nowrap" }}>
                          {[groupBy === "date" ? (t.category || t.type) : fmtDate(t.date),
                            t.site, card ? card.name : null,
                            t.vendorName && t.description ? t.description : null
                          ].filter(Boolean).join(" · ")}
                        </div>
                      </div>
                      <div style={{ textAlign:"right", flexShrink:0 }}>
                        <div className="num" style={{ fontWeight:750, fontSize:15,
                          color: isIn ? GREEN : INK }}>
                          {isIn ? "+" : "-"}₹{fmtINR(t.amount)}
                        </div>
                        {balanceAfter[t.id] !== undefined && (
                          <div className="num" style={{ fontSize:10.5, color:MUTED, marginTop:2 }}>
                            bal {fmtINR(balanceAfter[t.id])}
                          </div>
                        )}
                        {noBill && (
                          <div style={{ fontSize:10.5, fontWeight:700, color:RED, marginTop:2 }}>no bill</div>
                        )}
                        {t.billNo && (
                          <div style={{ fontSize:10.5, color:MUTED, marginTop:2 }}>#{t.billNo}</div>
                        )}
                      </div>
                      <button onClick={(e)=>{e.stopPropagation(); removeTxn(t);}}
                        style={{ padding:5, borderRadius:8, background:"transparent", border:"none", cursor:"pointer", flexShrink:0 }}>
                        <Icon name="trash" size={14} color="#C7D0DE" />
                      </button>
                    </div>
                  );
                })}
              </React.Fragment>
            ))}
          </div>
        </React.Fragment>
      )}

      {selected.size > 0 && (() => {
        const rows = cashTxns.filter(t => selected.has(t.id));
        const inAmt = rows.filter(t=>t.type==="Refill").reduce((a,t)=>a+Number(t.amount||0),0);
        const outAmt = rows.filter(t=>t.type!=="Refill").reduce((a,t)=>a+Number(t.amount||0),0);
        return (
          <React.Fragment>
            <BulkBar count={selected.size}
              subtitle={`${inAmt ? "+ Rs "+fmtINR(inAmt)+"   " : ""}${outAmt ? "- Rs "+fmtINR(outAmt) : ""}`}
              onOptions={()=>setBulkOpen(true)} />
            {bulkOpen && (
              <ActionSheet
                title={`${selected.size} entr${selected.size===1?"y":"ies"} selected`}
                subtitle="Choose what to do with them"
                onClose={()=>setBulkOpen(false)}
                actions={[
                  { label:"Mark bill as on file", icon:"check", onPress: ()=>{
                      setCashTxns(cashTxns.map(t => selected.has(t.id) ? { ...t, hasBill:true } : t));
                      setSelected(new Set());
                      showToast(`${rows.length} marked as having a bill`);
                    } },
                  { label:"Clear selection", icon:"close", onPress: ()=>setSelected(new Set()) },
                  { label:"Delete", icon:"trash", danger:true, onPress: ()=>{
                      if (!confirm(
                        `Delete ${rows.length} entr${rows.length===1?"y":"ies"}?\n\n` +
                        `${inAmt ? "Money in: Rs "+fmtINR(inAmt)+"\n" : ""}${outAmt ? "Spent: Rs "+fmtINR(outAmt)+"\n" : ""}` +
                        `\nBalances will be worked out again without them. This cannot be undone.`
                      )) return;
                      setCashTxns(cashTxns.filter(t => !selected.has(t.id)));
                      setSelected(new Set());
                      showToast(`${rows.length} deleted`);
                    } },
                ]}
              />
            )}
          </React.Fragment>
        );
      })()}

    </div>
  );
}

function CashTxnForm({ txn, cards, vendors, lists, setLists, onCancel, onSave }){
  const [t, setT] = useState(txn);
  const L = lists || DEFAULT_LISTS;
  function set(k,v){ setT(prev => ({...prev, [k]:v})); }

  const siteOptions = useMemo(()=>[...new Set(L.sites||[])].sort(), [L.sites]);
  const categoryOptions = useMemo(()=>[...new Set(L.categories||[])].sort(), [L.categories]);
  const subCategoryOptions = useMemo(()=>{
    const forCat = t.category ? ((L.subCategories||{})[t.category] || []) : [];
    return [...new Set(forCat)].sort();
  }, [L.subCategories, t.category]);
  const isSpend = t.type === "Spend";

  return (
    <div>
      <button onClick={onCancel}
        style={{ display:"flex", alignItems:"center", gap:6, marginBottom:16, fontSize:14, fontWeight:600, color:INK, background:"none", border:"none", cursor:"pointer" }}>
        <Icon name="close" size={16} /> Cancel
      </button>
      <div style={{ background:SURFACE, borderRadius:20, padding:20, border:`1px solid ${SAND}`, boxShadow:SHADOW }}>
        <Field label="Type" required>
          <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr 1fr", gap:8 }}>
            {CASH_TYPES.map(x => {
              const on = t.type === x;
              return (
                <button key={x} type="button" onClick={()=>set("type", x)}
                  style={{ borderRadius:12, padding:"12px 0", fontSize:14, fontWeight:600, cursor:"pointer",
                    border:`2px solid ${on?AMBER:SAND}`, background:on?AMBER:SURFACE, color:on?"#fff":INK }}>
                  {x}
                </button>
              );
            })}
          </div>
        </Field>

        <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:12 }}>
          <Field label="Date" required>
            <input type="date" style={inputStyle} value={t.date} onChange={e=>set("date", e.target.value)} />
          </Field>
          <Field label="Amount" required>
            <input type="number" inputMode="decimal" style={{...inputStyle, fontWeight:700}} value={t.amount}
              onChange={e=>set("amount", e.target.value)} />
          </Field>
        </div>

        <Field label="Card" required>
          <select style={inputStyle} value={t.cardId}
            onChange={e=>{
              const c = cards.find(x=>x.id===e.target.value);
              setT(prev => ({...prev, cardId:e.target.value, site: prev.site || (c ? c.site : "")}));
            }}>
            <option value="">— choose —</option>
            {cards.map(c => <option key={c.id} value={c.id}>{c.name}</option>)}
          </select>
        </Field>

        {t.type === "Refill" && (
          <Field label="Withdrawn from / reference" hint="ATM, branch or transfer reference">
            <input style={inputStyle} value={t.ref} onChange={e=>set("ref", e.target.value)} />
          </Field>
        )}

        {isSpend && (
          <React.Fragment>
            <Field label="Paid to" hint="Shop or supplier — free text is fine for local purchases">
              <input style={inputStyle} list="cash-vendors" value={t.vendorName}
                onChange={e=>set("vendorName", e.target.value)} />
              <datalist id="cash-vendors">
                {vendors.map(v => <option key={v.id} value={v.name} />)}
              </datalist>
            </Field>

            <ManagedSelect label="Site" value={t.site} onChange={x=>set("site",x)}
              options={siteOptions} onAddOption={(n)=>addToList(L, setLists, "site", n)}
              addPrompt="Name of the new site:" />

            <ManagedSelect label="Category" value={t.category}
              onChange={x=>setT(prev=>({...prev, category:x, subCategory:""}))}
              options={categoryOptions} onAddOption={(n)=>addToList(L, setLists, "category", n)}
              addPrompt="Name of the new category:" />

            <ManagedSelect label="Sub-Category" value={t.subCategory} onChange={x=>set("subCategory",x)}
              options={subCategoryOptions}
              onAddOption={(n)=>addToList(L, setLists, "subCategory", n, t.category)}
              addPrompt="Name of the new sub-category:" />

            <Field label="Authorised by" hint="Who approved this purchase — important when there is no PO">
              <input style={inputStyle} list="cash-people" value={t.authorisedBy}
                onChange={e=>set("authorisedBy", e.target.value)} />
              <datalist id="cash-people">
                {(L.people||[]).map(x => <option key={x} value={x} />)}
              </datalist>
            </Field>

            <div style={{ background: t.hasBill ? "#E6F7F2" : "#FDECEE",
              border:`1px solid ${t.hasBill ? GREEN : RED}`, borderRadius:14, padding:14, marginBottom:16 }}>
              <label style={{ display:"flex", alignItems:"center", gap:10, cursor:"pointer" }}>
                <input type="checkbox" checked={!!t.hasBill} onChange={e=>set("hasBill", e.target.checked)}
                  style={{ width:20, height:20 }} />
                <span style={{ fontWeight:700, color:INK, fontSize:14 }}>Bill or receipt is on file</span>
              </label>
              {t.hasBill && (
                <div style={{ marginTop:12 }}>
                  <Field label="Bill / invoice number">
                    <input style={inputStyle} value={t.billNo} onChange={e=>set("billNo", e.target.value)} />
                  </Field>
                </div>
              )}
              {!t.hasBill && (
                <div style={{ fontSize:12, color:INK, marginTop:8, lineHeight:1.55 }}>
                  Cash spent without a bill cannot be claimed against tax and is the first thing an
                  auditor picks up. Tick this once you have the receipt.
                </div>
              )}
            </div>
          </React.Fragment>
        )}

        <Field label="Description">
          <textarea style={{...inputStyle, resize:"vertical"}} rows={2} value={t.description}
            onChange={e=>set("description", e.target.value)} placeholder="What it was for" />
        </Field>

        <BigButton icon="check" label="Save Entry" onClick={()=>onSave(t)} tone="green" full />
      </div>
    </div>
  );
}

/* ================= EMPLOYEE MASTER ================= */
function EmployeesTab({ vendors, setVendors, reqs, lists, setLists, showToast, goTo, openImport }){
  const [query, setQuery] = useState("");
  const [siteFilter, setSiteFilter] = useState("All");
  const [statusFilter, setStatusFilter] = useState("Active");
  const [rollFilter, setRollFilter] = useState("All");
  const [sortKey, setSortKey] = useState("name");
  const [desc, setDesc] = useState(false);
  const EMP_SORTS = [
    { k:"name",   label:"Name",          get:v=>String(v.name||"").toLowerCase() },
    { k:"code",   label:"Employee code", get:v=>v.empCode||"" },
    { k:"salary", label:"Salary",        get:v=>Number(v.salary||0) },
    { k:"desig",  label:"Designation",   get:v=>v.designation||"" },
    { k:"doj",    label:"Date joined",   get:v=>v.doj||"" },
    { k:"roll",   label:"Roll type",     get:v=>v.rollType||"On Roll" },
  ];
  const [openEmp, setOpenEmp] = useState(null);
  const [editing, setEditing] = useState(null);
  const [selected, setSelected] = useState(new Set());
  const [bulkOpen, setBulkOpen] = useState(false);

  const allSites = (lists && lists.sites) ? lists.sites : [];
  const employees = useMemo(
    () => vendors.filter(v => (v.ledgerType||"") === "Employee"), [vendors]);

  const filteredRaw = employees.filter(v => {
    const q = (String(v.name||"")+String(v.empCode||"")+String(v.designation||"")+String(v.department||"")).toLowerCase();
    if (!q.includes(query.toLowerCase())) return false;
    if (statusFilter !== "All" && (v.empStatus||"Active") !== statusFilter) return false;
    if (rollFilter !== "All" && (v.rollType||"On Roll") !== rollFilter) return false;
    if (siteFilter === "All") return true;
    if (siteFilter === "Common") return !(v.sites||[]).length;
    return (v.sites||[]).includes(siteFilter) || !(v.sites||[]).length;
  });
  const filtered = sortBy(filteredRaw, (EMP_SORTS.find(x=>x.k===sortKey)||EMP_SORTS[0]).get, desc);

  const activeCount = employees.filter(v => (v.empStatus||"Active") === "Active").length;
  const monthlyWage = employees
    .filter(v => (v.empStatus||"Active") === "Active")
    .reduce((s,v)=>s+Number(v.salary||0), 0);

  function saveEmp(v){
    if (!v.name.trim()) { showToast("Name is required", "error"); return; }
    const exists = vendors.some(x => x.id === v.id);
    setVendors(exists ? vendors.map(x => x.id===v.id ? v : x) : [...vendors, v]);
    setEditing(null);
    showToast("Employee saved");
  }

  function toggleSel(id){
    setSelected(prev => { const n = new Set(prev); n.has(id) ? n.delete(id) : n.add(id); return n; });
  }
  function bulkDeleteEmp(){
    const picked = vendors.filter(v => selected.has(v.id));
    if (!confirm(`Delete ${picked.length} employee(s)? Their salary history stays in the requisitions. This cannot be undone.`)) return;
    setVendors(vendors.filter(v => !selected.has(v.id)));
    setSelected(new Set());
    showToast(`${picked.length} removed`);
  }
  function bulkSetEmpStatus(status){
    setVendors(vendors.map(v => selected.has(v.id) ? { ...v, empStatus: status } : v));
    setSelected(new Set());
    showToast(`Marked ${status}`);
  }
  function bulkSetRoll(roll){
    setVendors(vendors.map(v => selected.has(v.id) ? { ...v, rollType: roll } : v));
    setSelected(new Set());
    showToast(`Set to ${roll}`);
  }

  function exportEmployees(){
    if (employees.length === 0) { showToast("No employees to export", "error"); return; }
    const toRow = (v) => ({
      "Employee Code":v.empCode||"", "Name":v.name||"", "Designation":v.designation||"",
      "Department":v.department||"", "Sites":(v.sites||[]).join(", "), "Status":v.empStatus||"Active", "On Roll/Off Roll":v.rollType||"On Roll",
      "Date of Joining":fmtDate(v.doj), "Date of Leaving":fmtDate(v.dol),
      "Monthly Salary":Number(v.salary)||0, "Phone":v.phone||"", "Email":v.email||"",
      "PAN":v.pan||"", "UAN":v.uan||"", "ESIC":v.esic||"",
      "Bank Name":v.bankName||"", "A/c No.":v.accNo||"", "IFSC Code":v.ifsc||"",
      "Billed":ledgerPosition(v, reqs).billed,
      "Paid":ledgerPosition(v, reqs).paid,
      "We Owe":ledgerPosition(v, reqs).payable,
      "They Owe Us":ledgerPosition(v, reqs).receivable,
      "Position":ledgerPosition(v, reqs).side,
    });
    const cols = [{wch:16},{wch:24},{wch:20},{wch:16},{wch:20},{wch:12},{wch:16},{wch:14},{wch:14},{wch:14},{wch:16},{wch:24},{wch:14},{wch:16},{wch:16},{wch:18},{wch:22},{wch:14}];
    const wb = XLSX.utils.book_new();
    const groups = {};
    employees.forEach(v => { const k = `${v.rollType||"On Roll"}`; (groups[k]=groups[k]||[]).push(v); });
    Object.keys(groups).sort().forEach(k => {
      const ws = XLSX.utils.json_to_sheet(groups[k].map(toRow));
      ws["!cols"] = cols;
      XLSX.utils.book_append_sheet(wb, ws, k.slice(0,28));
    });
    const all = XLSX.utils.json_to_sheet(employees.map(toRow));
    all["!cols"] = cols;
    XLSX.utils.book_append_sheet(wb, all, "All Employees");
    XLSX.writeFile(wb, `Employees_${todayStr()}.xlsx`);
    showToast(`Exported ${employees.length} employee(s)`);
  }

  if (editing) {
    return <VendorForm vendor={editing} lists={lists} setLists={setLists}
      onCancel={()=>setEditing(null)} onSave={saveEmp} />;
  }

  if (openEmp) {
    const live = vendors.find(v => v.id === openEmp.id) || openEmp;
    return <VendorLedger vendor={live} reqs={reqs} showToast={showToast}
      onBack={()=>setOpenEmp(null)}
      onEdit={()=>{ setOpenEmp(null); setEditing(live); }}
      onDelete={()=>{
        if (!confirm(`Delete "${live.name}"? This cannot be undone.`)) return;
        setVendors(vendors.filter(v => v.id !== live.id));
        setOpenEmp(null);
        showToast("Removed");
      }} />;
  }

  return (
    <div>
      <button onClick={()=>goTo("dashboard")}
        style={{ display:"flex", alignItems:"center", gap:6, marginBottom:16, fontSize:14, fontWeight:600, color:INK, background:"none", border:"none", cursor:"pointer" }}>
        <Icon name="close" size={16} /> Back to dashboard
      </button>

      <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:12, marginBottom:14 }}>
        <div style={{ background:SURFACE, borderRadius:20, padding:16, border:`1px solid ${SAND}`, boxShadow:SHADOW }}>
          <div style={{ fontSize:12, fontWeight:500, color:MUTED }}>On roll</div>
          <div style={{ fontSize:20, fontWeight:700, color:INK }}>{activeCount}</div>
        </div>
        <div style={{ background:SURFACE, borderRadius:20, padding:16, border:`1px solid ${SAND}`, boxShadow:SHADOW }}>
          <div style={{ fontSize:12, fontWeight:500, color:MUTED }}>Monthly wage bill</div>
          <div style={{ fontSize:20, fontWeight:700, color:INK }}>₹{fmtINR(monthlyWage)}</div>
        </div>
      </div>

      <div style={{ position:"relative", marginBottom:12 }}>
        <span style={{ position:"absolute", left:14, top:"50%", transform:"translateY(-50%)", color:MUTED }}><Icon name="search" size={18} /></span>

/* ================= REPORTS: MONTHLY STATEMENT & SITE SUMMARY ================= */
function monthLabel(ym){
  if (!ym) return "";
  const [y,m] = ym.split("-");
  return new Date(Number(y), Number(m)-1, 1).toLocaleDateString("en-IN", { month:"long", year:"numeric" });
}
function groupSum(rows, keyFn){
  const map = {};
  rows.forEach(r => { const k = keyFn(r) || "Unspecified"; map[k] = (map[k]||0) + Number(r.amount||0); });
  return Object.entries(map).sort((a,b)=>b[1]-a[1]);
}
function BarList({ data, color, empty }){
  if (!data.length) return <div style={{ fontSize:13, color:MUTED }}>{empty || "Nothing to show."}</div>;
  const max = data[0][1] || 1;
  return (
    <div>
      {data.map(([k,v]) => (
        <div key={k} style={{ marginBottom:10 }}>
          <div style={{ display:"flex", justifyContent:"space-between", fontSize:13, marginBottom:4, gap:10 }}>
            <span style={{ fontWeight:500, color:INK, overflow:"hidden", textOverflow:"ellipsis", whiteSpace:"nowrap" }}>{k}</span>
            <span style={{ color:MUTED, flexShrink:0 }}>₹{fmtINR(v)}</span>
          </div>
          <div style={{ height:8, borderRadius:8, background:SAND }}>
            <div style={{ height:8, borderRadius:8, background:color, width:`${(v/max)*100}%` }} />
          </div>
        </div>
      ))}
    </div>
  );
}
function TotalRow({ label, value, color, bold }){
  return (
    <div style={{ display:"flex", justifyContent:"space-between", alignItems:"baseline", padding:"9px 0",
      borderBottom:`1px solid ${SAND}` }}>
      <span style={{ fontSize:14, color: bold ? INK : MUTED, fontWeight: bold ? 700 : 500 }}>{label}</span>
      <span style={{ fontSize: bold ? 17 : 15, fontWeight:700, color: color || INK }}>₹{fmtINR(value)}</span>
    </div>
  );
}

function MonthlyStatementTab({ reqs, expenses, cashTxns, cards, showToast, goTo }){
  const months = useMemo(() => {
    const set = new Set();
    reqs.forEach(r => { if (r.date) set.add(r.date.slice(0,7)); if (r.paymentDate) set.add(r.paymentDate.slice(0,7)); });
    (expenses||[]).forEach(e => { if (e.date) set.add(e.date.slice(0,7)); });
    return [...set].sort().reverse();
  }, [reqs, expenses]);

  const [month, setMonth] = useState(months[0] || todayStr().slice(0,7));

  const raised = useMemo(() => reqs.filter(r => (r.date||"").slice(0,7) === month), [reqs, month]);
  const settled = useMemo(() => reqs.filter(r => isInRegister(r) && (r.paymentDate||"").slice(0,7) === month), [reqs, month]);
  const monthExpenses = useMemo(() => (expenses||[]).filter(e => (e.date||"").slice(0,7) === month), [expenses, month]);

  const raisedTotal = raised.reduce((s,r)=>s+Number(r.amount||0),0);
  const paidTotal = settled.reduce((s,r)=>s+Number(r.paidAmount || r.amount || 0),0);
  const expenseTotal = monthExpenses.reduce((s,e)=>s+Number(e.amount||0),0);
  const outstanding = raised.filter(r => !isInRegister(r)).reduce((s,r)=>s+Number(r.amount||0),0);
  const excessTotal = settled.reduce((s,r)=>s+excessPaid(r),0);

  const cashSpend = useMemo(
    () => combinedSpending(reqs, cashTxns, month, "all", cards), [reqs, cashTxns, month, cards]);

  const bySite = useMemo(()=>groupSum(settled, r=>r.site), [settled]);
  const byCategory = useMemo(()=>groupSum(settled, r=>r.category), [settled]);
  const byMode = useMemo(()=>groupSum(settled, r=>r.paymentMode||"Not recorded"), [settled]);

  function exportStatement(){
    if (raised.length === 0 && settled.length === 0) { showToast("Nothing recorded for this month", "error"); return; }
    const wb = XLSX.utils.book_new();

    const summary = [
      { Item:"Month", Value: monthLabel(month) },
      { Item:"Requisitions raised", Value: raised.length },
      { Item:"Value raised", Value: raisedTotal },
      { Item:"Payments made", Value: settled.length },
      { Item:"Value paid", Value: paidTotal },
      { Item:"Cash spent at sites", Value: cashSpend.cash },
      { Item:"All money out (bank + cash, refills counted once)", Value: cashSpend.total },
      { Item:"Still outstanding from this month", Value: outstanding },
      { Item:"Reimbursable expenses logged", Value: expenseTotal },
      { Item:"Overpaid (receivable)", Value: excessTotal },
    ];
    const sws = XLSX.utils.json_to_sheet(summary);
    sws["!cols"] = [{wch:34},{wch:20}];
    XLSX.utils.book_append_sheet(wb, sws, "Summary");

    const payRows = settled.map(r => ({
      "Ref No.":r.refNo||"", "Payment Date":fmtDate(r.paymentDate), Site:r.site, Category:r.category,
      "Sub-Category":r.subCategory, Name:r.name, "Requisition Amount":Number(r.amount)||0,
      "Amount Paid":Number(r.paidAmount || r.amount || 0), "Payment Mode":r.paymentMode||"",
      "UTR":r.utr||"", "A/c No.":r.accNo||"", "IFSC Code":r.ifsc||"", Description:r.description||"",
    }));
    const pws = XLSX.utils.json_to_sheet(payRows);
    pws["!cols"] = [{wch:16},{wch:14},{wch:16},{wch:14},{wch:14},{wch:22},{wch:16},{wch:14},{wch:14},{wch:22},{wch:18},{wch:14},{wch:28}];
    XLSX.utils.book_append_sheet(wb, pws, "Payments Made");

    const raisedRows = raised.map(r => ({
      "Ref No.":r.refNo||"", Date:fmtDate(r.date), Site:r.site, Category:r.category, "Sub-Category":r.subCategory,
      Name:r.name, Amount:Number(r.amount)||0, "Payment Status":r.paymentStatus,
      "Paid On":fmtDate(r.paymentDate), Description:r.description||"",
    }));
    const rws = XLSX.utils.json_to_sheet(raisedRows);
    rws["!cols"] = [{wch:16},{wch:12},{wch:16},{wch:14},{wch:14},{wch:22},{wch:14},{wch:14},{wch:14},{wch:28}];
    XLSX.utils.book_append_sheet(wb, rws, "Requisitions Raised");

    const siteWs = XLSX.utils.json_to_sheet(bySite.map(([k,v])=>({ Site:k, "Amount Paid":v })));
    siteWs["!cols"] = [{wch:24},{wch:16}];
    XLSX.utils.book_append_sheet(wb, siteWs, "By Site");

    const catWs = XLSX.utils.json_to_sheet(byCategory.map(([k,v])=>({ Category:k, "Amount Paid":v })));
    catWs["!cols"] = [{wch:24},{wch:16}];
    XLSX.utils.book_append_sheet(wb, catWs, "By Category");

    if (monthExpenses.length) {
      const eWs = XLSX.utils.json_to_sheet(monthExpenses.map(e => ({
        Date:fmtDate(e.date), "Expense Type":e.expenseType, Site:e.site||"", Category:e.category||"",
        Description:e.description||"", Amount:Number(e.amount)||0, "Paid By":e.paidBy||"",
        "Claimed In":e.claimRef||"Not claimed",
      })));
      eWs["!cols"] = [{wch:12},{wch:16},{wch:16},{wch:16},{wch:30},{wch:14},{wch:18},{wch:18}];
      XLSX.utils.book_append_sheet(wb, eWs, "Expenses");
    }

    XLSX.writeFile(wb, `Statement_${month}.xlsx`);
    showToast(`Statement for ${monthLabel(month)} exported`);
  }

  return (
    <div>
      <button onClick={()=>goTo("dashboard")}
        style={{ display:"flex", alignItems:"center", gap:6, marginBottom:16, fontSize:14, fontWeight:600, color:INK, background:"none", border:"none", cursor:"pointer" }}>
        <Icon name="close" size={16} /> Back to dashboard
      </button>

      <Field label="Month">
        <select style={inputStyle} value={month} onChange={e=>setMonth(e.target.value)}>
          {months.length === 0 && <option value={month}>{monthLabel(month)}</option>}
          {months.map(m => <option key={m} value={m}>{monthLabel(m)}</option>)}
        </select>
      </Field>

      <div style={{ background:SURFACE, borderRadius:16, padding:20, marginBottom:14, border:`1px solid ${SAND}` }}>
        <SectionLabel>{monthLabel(month)}</SectionLabel>
        <TotalRow label={`Raised (${raised.length})`} value={raisedTotal} />
        <TotalRow label={`Paid (${settled.length})`} value={paidTotal} color={GREEN} />
        <TotalRow label="Still outstanding" value={outstanding} color={outstanding ? AMBER : INK} />
        {expenseTotal > 0 && <TotalRow label={`Expenses logged (${monthExpenses.length})`} value={expenseTotal} />}
        {excessTotal > 0 && <TotalRow label="Overpaid, due back" value={excessTotal} color={AMBER} />}
        {cashSpend.cash > 0 && (
          <TotalRow label={`Spent in cash (${cashSpend.cashCount})`} value={cashSpend.cash} />
        )}
        {cashSpend.matched > 0 && (
          <TotalRow label={`less card refills already counted (${cashSpend.matchedCount})`}
            value={-cashSpend.matched} color={AMBER} />
        )}
        <div style={{ marginTop:10 }}>
          <TotalRow label="All money out this month" value={cashSpend.total} bold color={INK} />
        </div>
        <div style={{ fontSize:12, color:MUTED, marginTop:10, lineHeight:1.6 }}>
          Bank payments and cash spending are added together. A card refill that is also in the
          register is counted once, not twice.
          Paid is counted on the payment date, raised on the requisition date, so a requisition
          from last month paid this month appears under Paid here.
        </div>
      </div>

      {bySite.length > 0 && (
        <div style={{ background:SURFACE, borderRadius:16, padding:20, marginBottom:14, border:`1px solid ${SAND}` }}>
          <div style={{ fontWeight:700, marginBottom:12, color:INK }}>Paid by Site</div>
          <BarList data={bySite} color={AMBER} />
        </div>
      )}

      {byCategory.length > 0 && (
        <div style={{ background:SURFACE, borderRadius:16, padding:20, marginBottom:14, border:`1px solid ${SAND}` }}>
          <div style={{ fontWeight:700, marginBottom:12, color:INK }}>Paid by Category</div>
          <BarList data={byCategory} color={GREEN} />
        </div>
      )}

      {byMode.length > 0 && (
        <div style={{ background:SURFACE, borderRadius:16, padding:20, marginBottom:14, border:`1px solid ${SAND}` }}>
          <div style={{ fontWeight:700, marginBottom:12, color:INK }}>By Payment Mode</div>
          <BarList data={byMode} color={INK} />
        </div>
      )}

      {settled.length > 0 && (
        <div style={{ background:SURFACE, borderRadius:16, padding:16, marginBottom:14, border:`1px solid ${SAND}` }}>
          <div style={{ fontWeight:700, color:INK, fontSize:14, marginBottom:10 }}>Payments this month ({settled.length})</div>
          {settled.slice(0,40).map((r,i) => (
            <div key={r.id} style={{ padding:"8px 0", borderTop: i? `1px solid ${SAND}`:"none" }}>
              <div style={{ display:"flex", justifyContent:"space-between", gap:8 }}>
                <span style={{ fontWeight:600, fontSize:14, color:INK, overflow:"hidden", textOverflow:"ellipsis", whiteSpace:"nowrap" }}>{r.name}</span>
                <span style={{ fontWeight:700, fontSize:14, color:INK, flexShrink:0 }}>₹{fmtINR(r.paidAmount || r.amount)}</span>
              </div>
              <div style={{ fontSize:12, color:MUTED, marginTop:2 }}>
                {fmtDate(r.paymentDate)} · {r.site} · {r.paymentMode || "mode not recorded"}
              </div>
            </div>
          ))}
          {settled.length > 40 && <div style={{ fontSize:12, color:MUTED, marginTop:8 }}>…and {settled.length-40} more in the export</div>}
        </div>
      )}

      {raised.length === 0 && settled.length === 0 && (
        <EmptyState text="Nothing recorded for this month yet." />
      )}

      <BigButton icon="download" label="Export Statement" onClick={exportStatement} tone="green" full />
    </div>
  );
}

function SiteSummaryTab({ reqs, expenses, cashTxns, cards, diesel, utilities, machines, vendors, showToast, goTo }){
  // A cash entry without a site belongs to whatever site its card is held at.
  const cashSite = (t) => t.site || ((cards||[]).find(c => c.id === t.cardId)||{}).site || "Unspecified";
  const [openSite, setOpenSite] = useState(null);
  const [openHead, setOpenHead] = useState(null);     // which head is expanded

  // Everything that costs money at a site, from every part of the app.
  // Reimbursement requisitions are left out: the expense itself is the cost,
  // the requisition only settles it, so counting both would double up.
  const sourcesFor = (site) => {
    const at = (v) => (v || "Unspecified") === site;
    const rows = (reqs||[]).filter(r => at(r.site) && !r.isReimbursement && !isRolledUp(r));
    const exps = (expenses||[]).filter(e => at(e.site));
    const cash = (cashTxns||[]).filter(t => cashSite(t) === site && t.type !== "Refill");
    const fuel = (diesel||[]).filter(d => at(d.site) && d.type === "Purchase");
    const util = (utilities||[]).filter(u => at(u.site));
    const sum = (list, pick) => list.reduce((x,r)=>x+Number(pick(r)||0), 0);
    return [
      { key:"req",   label:"Requisitions",  rows, total: sum(rows, r=>r.amount), colour:AMBER,
        note:`${rows.filter(isInRegister).length} paid, ${rows.filter(r=>!isInRegister(r)).length} open` },
      { key:"cash",  label:"Cash & Card",   rows: cash, total: sum(cash, t=>t.amount), colour:GREEN,
        note:`${cash.filter(t=>!t.hasBill).length} without a bill` },
      { key:"exp",   label:"Expenses",      rows: exps, total: sum(exps, e=>e.amount), colour:INK,
        note:`${exps.filter(e=>!expenseSettled(e)).length} still to settle` },
      { key:"fuel",  label:"Diesel",        rows: fuel, total: sum(fuel, d=>d.amount), colour:"#8FA0BC",
        note:`${fmtINR(sum(fuel, d=>d.litres))} litres` },
      { key:"util",  label:"Utilities",     rows: util, total: sum(util, u=>utilityDebited(u)), colour:MUTED,
        note:`${util.filter(u=>utilityOutstanding(u)>0).length} still due` },
    ].filter(x => x.rows.length);
  };

  const sites = useMemo(() => {
    const names = new Set();
    // Anything without a site still has to appear somewhere, or it silently vanishes
    // from the totals - which is exactly how cash spending went missing before.
    (reqs||[]).forEach(r => names.add(r.site || "Unspecified"));
    (expenses||[]).forEach(e => names.add(e.site || "Unspecified"));
    (cashTxns||[]).forEach(t => { if (t.type !== "Refill") names.add(cashSite(t)); });
    (diesel||[]).forEach(d => { if (d.type === "Purchase") names.add(d.site || "Unspecified"); });
    (utilities||[]).forEach(u => names.add(u.site || "Unspecified"));
    return [...names].map(site => {
      const parts = sourcesFor(site);
      return { site, parts, total: parts.reduce((a,p)=>a+p.total, 0) };
    }).sort((a,b)=>b.total-a.total);
  }, [reqs, expenses, cashTxns, cards, diesel, utilities]);

  const grand = sites.reduce((s,x)=>s+x.total, 0);

  /* ---------- one site ---------- */
  if (openSite) {
    const parts = sourcesFor(openSite);
    const total = parts.reduce((a,p)=>a+p.total, 0);

    // what each head is made of, whichever part of the app it came from
    const headOf = (p, r) =>
      p.key === "util" ? (r.utilityType || "Utility")
      : p.key === "fuel" ? "Diesel"
      : (r.category || r.expenseType || "Not set");
    const amountOf = (p, r) =>
      p.key === "util" ? utilityDebited(r)
      : Number(r.amount || 0);
    const lineOf = (p, r) => ({
      when: fmtDate(r.date || r.paymentDate || (r.month ? r.month + "-01" : "")) || (r.month ? monthLabel(r.month) : ""),
      who: r.name || r.vendorName || r.supplier || r.provider || r.paidBy || "",
      what: r.description || r.subCategory || r.utilityType || "",
      amount: amountOf(p, r),
    });

    const heads = (() => {
      const map = {};
      parts.forEach(p => p.rows.forEach(r => {
        const k = headOf(p, r);
        if (!map[k]) map[k] = { head:k, total:0, count:0, lines:[] };
        map[k].total += amountOf(p, r);
        map[k].count += 1;
        map[k].lines.push({ ...lineOf(p, r), from:p.label });
      }));
      return Object.values(map).sort((a,b)=>b.total-a.total);
    })();

    function exportSite(){
      const wb = XLSX.utils.book_new();
      const sum = [{ Item:"Site", Value:openSite }];
      parts.forEach(p => sum.push({ Item:p.label, Value:p.total }));
      sum.push({ Item:"TOTAL", Value:total });
      const sws = XLSX.utils.json_to_sheet(sum);
      sws["!cols"] = [{wch:30},{wch:18}];
      XLSX.utils.book_append_sheet(wb, sws, "Summary");

      const hws = XLSX.utils.json_to_sheet(heads.map(h => ({
        Head:h.head, Entries:h.count, Amount:h.total,
        "Share %": total ? +((h.total/total)*100).toFixed(1) : 0,
      })));
      hws["!cols"] = [{wch:26},{wch:12},{wch:16},{wch:12}];
      XLSX.utils.book_append_sheet(wb, hws, "By Head");

      parts.forEach(p => {
        const ws = XLSX.utils.json_to_sheet(p.rows.map(r => {
          const l = lineOf(p, r);
          return { Date:l.when, Head:headOf(p,r), Name:l.who, Details:l.what, Amount:l.amount };
        }));
        ws["!cols"] = [{wch:12},{wch:22},{wch:24},{wch:34},{wch:14}];
        XLSX.utils.book_append_sheet(wb, ws, p.label.slice(0,28));
      });
      XLSX.writeFile(wb, `Site_${String(openSite).replace(/[^A-Za-z0-9]+/g,"_")}.xlsx`);
      showToast("Site summary exported");
    }

    return (
      <div>
        <button onClick={()=>{ setOpenSite(null); setOpenHead(null); }}

          <div style={{ fontSize:12.5, color:MUTED, marginBottom:12 }}>Tap a head to see what is inside it</div>
          {heads.map(h => {
            const on = openHead === h.head;

            return (
              <div key={h.head} style={{ borderTop:`1px solid ${SAND}` }}>

                      .sort((a,b)=>b.amount-a.amount)

                    {h.lines.length > 25 && (
                      <div style={{ fontSize:11.5, color:MUTED, paddingTop:9 }}>
                        Showing the 25 largest of {h.lines.length}. Export for the full list.

        <BigButton icon="download" label="Export This Site" onClick={exportSite} tone="green" full />

  }

  /* ---------- all sites ---------- */
  return (
    <div>
      <button onClick={()=>goTo("dashboard")}
        style={{ display:"flex", alignItems:"center", gap:6, marginBottom:16, fontSize:14, fontWeight:600,
          color:INK, background:"none", border:"none", cursor:"pointer" }}>
        <Icon name="close" size={16} /> Back to dashboard
      </button>

      <div style={{ background:GRAD_INK, borderRadius:22, padding:22, marginBottom:14, boxShadow:SHADOW_LG }}>
        <div style={{ fontSize:11.5, fontWeight:600, color:"#8FA0BC", textTransform:"uppercase", letterSpacing:"0.08em" }}>
          Spent across every site
        </div>
        <div className="num" style={{ fontSize:31, fontWeight:800, color:"#fff", marginTop:6 }}>{fmtINR(grand)}</div>
        <div style={{ fontSize:12, color:"#8FA0BC", marginTop:4 }}>
          requisitions, cash, expenses, diesel and utilities together
        </div>
      </div>

      {sites.length === 0 ? (
        <EmptyState text="Nothing recorded against a site yet." />
      ) : (
        <div style={{ display:"flex", flexDirection:"column", gap:10, marginBottom:20 }}>
          {sites.map(s => (
            <div key={s.site} onClick={()=>{ setOpenSite(s.site); setOpenHead(null); }}
              style={{ background:SURFACE, borderRadius:20, padding:18, border:`1px solid ${SAND}`,
                boxShadow:SHADOW, cursor:"pointer" }}>

                <span style={{ fontWeight:700, color:INK, fontSize:15.5, minWidth:0,
                  overflow:"hidden", textOverflow:"ellipsis", whiteSpace:"nowrap" }}>{s.site}</span>
                <span className="num" style={{ fontWeight:800, color:INK, fontSize:16, flexShrink:0 }}>
                  {fmtINR(s.total)}
                </span>
              </div>
              <div style={{ display:"flex", height:7, borderRadius:99, overflow:"hidden", marginTop:11, background:SAND }}>
                {s.parts.map(p => (
                  <div key={p.key} style={{ width:`${s.total ? (p.total/s.total)*100 : 0}%`, background:p.colour }} />
                ))}
              </div>
              <div style={{ display:"flex", gap:9, marginTop:9, flexWrap:"wrap" }}>
                {s.parts.map(p => (
                  <span key={p.key} style={{ display:"flex", alignItems:"center", gap:5, fontSize:11, color:MUTED }}>
                    <span style={{ width:7, height:7, borderRadius:2, background:p.colour }} />
                    {p.label} {fmtINR(p.total)}
                  </span>
                ))}
              </div>
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

const FREQUENCIES = ["Monthly","Quarterly","Half-Yearly","Yearly","One-time"];

const APPS_SCRIPT_CODE = "function doGet(e) {\n  var out = { ok: true, sheet: \"\", rows: [] };\n  try {\n    var ss = SpreadsheetApp.getActiveSpreadsheet();\n    var wanted = (e && e.parameter && e.parameter.sheet) || \"\";\n    var sh = wanted ? ss.getSheetByName(wanted) : ss.getSheets()[0];\n    if (!sh) throw new Error(\"Sheet not found: \" + wanted);\n    out.sheet = sh.getName();\n    var values = sh.getDataRange().getDisplayValues();\n    if (values.length > 1) {\n      var headers = values[0].map(function (h) { return String(h).trim(); });\n      for (var i = 1; i < values.length; i++) {\n        var row = values[i];\n        if (row.join(\"\").trim() === \"\") continue;\n        var obj = {};\n        for (var c = 0; c < headers.length; c++) {\n          if (headers[c]) obj[headers[c]] = row[c];\n        }\n        out.rows.push(obj);\n      }\n    }\n  } catch (err) {\n    out.ok = false;\n    out.error = String(err);\n  }\n  var json = JSON.stringify(out);\n  var cb = e && e.parameter && e.parameter.callback;\n  if (cb) {\n    return ContentService.createTextOutput(cb + \"(\" + json + \")\")\n      .setMimeType(ContentService.MimeType.JAVASCRIPT);\n  }\n  return ContentService.createTextOutput(json)\n    .setMimeType(ContentService.MimeType.JSON);\n}";

function SheetSyncTab({ sheets, setSheets, reqs, setReqs, vendors, setVendors, lists, setLists, showToast, goTo,
  expenses, setExpenses, recurring, setRecurring }){
  const [editing, setEditing] = useState(null);
  const [busy, setBusy] = useState("");
  const [preview, setPreview] = useState(null);
  const [showSetup, setShowSetup] = useState(false);
  const [folderRows, setFolderRows] = useState([{ site:"", link:"" }, { site:"", link:"" }]);

  function extractId(raw){
    const t = (raw || "").trim();
    if (!t) return "";
    const m = t.match(/\/folders\/([A-Za-z0-9_-]{10,})/);
    if (m) return m[1];
    const q = t.match(/[?&]id=([A-Za-z0-9_-]{10,})/);
    if (q) return q[1];
    if (/^[A-Za-z0-9_-]{20,}$/.test(t)) return t;      // they pasted just the ID
    return "";
  }
  const folderIds = useMemo(() => folderRows.map(r => extractId(r.link)), [folderRows]);
  const readyRows = useMemo(
    () => folderRows.map((r, i) => ({ site: (r.site||"").trim(), id: folderIds[i] }))
                    .filter(r => r.id && r.site),
    [folderRows, folderIds]);

  const readyScript = useMemo(() => {
    if (!readyRows.length) return APPS_SCRIPT_CODE;
    const esc = (t) => String(t).replace(/\\/g, "").replace(/"/g, "'");
    const block = 'var FOLDERS = [\n' +
      readyRows.map(r => '  { site: "' + esc(r.site) + '", id: "' + r.id + '" }').join(',\n') +
      '\n];';
    return APPS_SCRIPT_CODE.replace(/var FOLDERS = \[[\s\S]*?\];/, block);
  }, [readyRows]);

  function urlProblem(url){
    const u = (url || "").trim();
    if (!u) return "Paste the Web app URL here.";
    if (/drive\.google\.com/.test(u)) {
      return "That is a Drive folder link, not the Web app URL. The Web app URL is what Apps Script gives you at the very end of Deploy, and it starts with script.google.com. If this feels like too much, use Import from Excel instead — no setup at all.";
    }
    if (/docs\.google\.com/.test(u)) {
      return "That is a link to the sheet itself. The app needs the Web app URL from Apps Script, starting with script.google.com — or skip all this and use Import from Excel.";
    }
    if (!/^https:\/\/script\.google\.com\//.test(u)) {
      return "The Web app URL should start with https://script.google.com/";
    }
    if (!/\/exec/.test(u)) {
      return "That looks like the editor link. You need the deployment URL, which ends in /exec.";
    }
    return "";
  }

  function saveSheet(sh){
    if (!sh.name.trim()) return showToast("Give this a name first", "error");
    if (urlProblem(sh.url)) return showToast("Check the URL — see the note under the box", "error");
    const exists = sheets.some(x => x.id === sh.id);
    setSheets(exists ? sheets.map(x => x.id===sh.id ? sh : x) : [...sheets, sh]);
    setEditing(null);
    showToast("Saved");
  }

  function removeSheet(sh){
    if (!confirm(`Remove "${sh.name}"? Requisitions already imported are not affected.`)) return;
    setSheets(sheets.filter(x => x.id !== sh.id));
    showToast("Removed");
  }

  function siteStatsFrom(data){
    const map = {};
    (data.files || []).forEach(f => {
      const k = f.folder || "Unnamed";
      if (!map[k]) map[k] = { site:k, files:0, rows:0 };
      map[k].files += 1;
      map[k].rows += Number(f.rows || 0);
    });
    (data.seen || []).forEach(f => {
      const k = f.site || "Unnamed";
      if (!map[k]) map[k] = { site:k, files:0, rows:0 };
    });
    return Object.values(map);
  }

  async function syncSheets(list){
    if (list.length === 0) { showToast("Add your Drive folder first", "error"); return; }
    const collected = [];
    const failures = [];
    const fileReport = [];
    const skippedFiles = [];
    const seenFiles = [];
    const notes = [];
    const statusById = {};
    for (const sh of list) {
      setBusy(sh.name);
      try {
        let url = sh.url.trim();
