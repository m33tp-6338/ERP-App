        <div style={{ position:"fixed", bottom:76, left:0, right:0, padding:"0 16px", zIndex:30 }}>
          <div style={{ maxWidth:720, margin:"0 auto", background:INK, borderRadius:16, padding:"12px 14px",
            display:"flex", alignItems:"center", gap:10, boxShadow:"0 4px 14px rgba(0,0,0,0.2)" }}>
            <div style={{ flex:1, minWidth:0 }}>
              <div style={{ color:"#fff", fontWeight:700, fontSize:14 }}>{selected.size} selected</div>
              <div style={{ color:"#8FA0BC", fontSize:12 }}>
                ₹{fmtINR(selectedTotal)}{selectedPeople.length===1 ? ` · ${selectedPeople[0]}` : " · mixed people"}
              </div>
            </div>
            <button onClick={()=>setBulkOpen(true)}
              style={{ padding:"10px 18px", borderRadius:12, fontWeight:700, fontSize:14, background:AMBER, color:"#fff", border:"none", cursor:"pointer" }}>
              Options
            </button>
          </div>
        </div>
      )}

      {bulkOpen && (
        <ActionSheet
          title={`${selected.size} expense(s) selected`}
          subtitle={`₹${fmtINR(selectedTotal)}${selectedPeople.length===1 ? ` · ${selectedPeople[0]}` : " · mixed people"}`}
          onClose={()=>setBulkOpen(false)}
          actions={(() => {
            const anySettled = selectedRows.some(expenseSettled);
            const acts = [];
            if (!anySettled) {
              acts.push({ label:"Raise a claim to be paid", icon:"plus", onPress: createClaim });
              acts.push({ label:"Add to Payment Register", icon:"sheet", onPress: addToRegister });
              acts.push({ label:"Mark as already paid back", icon:"check", onPress: markSettled });
            } else {
              acts.push({ label:"Undo settlement", icon:"close", onPress: unsettleSelected });
            }
            acts.push({ label:"Export to Excel", icon:"download", onPress: exportSelected });
            acts.push({ label:"Clear selection", icon:"close", onPress: ()=>setSelected(new Set()) });
            acts.push({ label:`Delete all ${selected.size}`, icon:"trash", danger:true, onPress: deleteSelected });
            return acts;
          })()}
        />
      )}
    </div>
  );
}

function ExpenseForm({ exp, lists, setLists, reqs, onCancel, onSave }){
  const [e, setE] = useState(exp);
  const L = lists || DEFAULT_LISTS;
  function set(k, val){ setE(prev => ({ ...prev, [k]: val })); }

  const siteOptions = useMemo(()=>[...new Set([...(L.sites||[]), ...(reqs||[]).map(r=>r.site).filter(Boolean)])].sort(), [L.sites, reqs]);
  const categoryOptions = useMemo(()=>[...new Set([...(L.categories||[]), ...(reqs||[]).map(r=>r.category).filter(Boolean)])].sort(), [L.categories, reqs]);
  const subCategoryOptions = useMemo(()=>{
    const forCat = e.category ? ((L.subCategories||{})[e.category] || []) : [];
    return [...new Set(forCat)].sort();
  }, [L.subCategories, e.category]);

  return (
    <div>
      <button onClick={onCancel}
        style={{ display:"flex", alignItems:"center", gap:6, marginBottom:16, fontSize:14, fontWeight:600, color:INK, background:"none", border:"none", cursor:"pointer" }}>
        <Icon name="close" size={16} /> Cancel
      </button>
      <div style={{ background:SURFACE, borderRadius:20, padding:20, border:`1px solid ${SAND}`, boxShadow:SHADOW }}>
        {e.claimRef && (
          <div style={{ background:"#E6F7F2", border:`1px solid ${GREEN}`, borderRadius:12, padding:12, marginBottom:16, fontSize:13, color:INK, lineHeight:1.5 }}>
            Already claimed in <strong>{e.claimRef}</strong>. Editing the amount here will not change that requisition.
          </div>
        )}
        <Field label="Date" hint="Leave blank if it covers a period rather than one day">
          <input type="date" style={inputStyle} value={e.date} onChange={ev=>set("date", ev.target.value)} />
        </Field>

        {!e.date && (
          <Field label="Period" hint="Free text, e.g. 30.12.25 - 5.1.25, or Sept">
            <input style={inputStyle} value={e.periodText||""} onChange={ev=>set("periodText", ev.target.value)}
              placeholder="e.g. 26.2.26 - 1.3.26" />
          </Field>
        )}

        <ManagedSelect label="Expense Type" required
          value={e.expenseType} onChange={x=>set("expenseType", x)}
          options={L.expenseTypes || DEFAULT_LISTS.expenseTypes}
          onAddOption={(name)=>addToList(L, setLists, "expenseType", name)}
          addPrompt="Name of the new expense type:" />

        <ManagedSelect label="Paid By" required
          hint="The person who spent their own money and will be reimbursed"
          value={e.paidBy} onChange={x=>set("paidBy", x)}
          options={L.people || []}
          onAddOption={(name)=>addToList(L, setLists, "person", name)}
          addPrompt="Name of the person:" />

        <Field label="Amount" required>
          <input type="number" inputMode="decimal" style={{...inputStyle, fontWeight:700}}
            value={e.amount} onChange={ev=>set("amount", ev.target.value)} placeholder="₹ 0" />
        </Field>

        <ManagedSelect label="Site" hint="Which site this cost really belongs to"
          value={e.site} onChange={x=>set("site", x)}
          options={siteOptions}
          onAddOption={(name)=>addToList(L, setLists, "site", name)}
          addPrompt="Name of the new site:" />

        <ManagedSelect label="Category"
          value={e.category} onChange={x=>setE(prev=>({...prev, category:x, subCategory:""}))}
          options={categoryOptions}
          onAddOption={(name)=>addToList(L, setLists, "category", name)}
          addPrompt="Name of the new category:" />

        <ManagedSelect label="Sub-Category"
          value={e.subCategory} onChange={x=>set("subCategory", x)}
          options={subCategoryOptions}
          onAddOption={(name)=>addToList(L, setLists, "subCategory", name, e.category)}
          addPrompt="Name of the new sub-category:" />

        <Field label="Description">
          <textarea style={{...inputStyle, resize:"vertical"}} rows={3} value={e.description}
            onChange={ev=>set("description", ev.target.value)} placeholder="What was bought or where you travelled" />
        </Field>

        <div style={{ background: e.paidDate ? "#E6F7F2" : "#F1F4F9",
          border:`1px solid ${e.paidDate ? GREEN : SAND}`, borderRadius:14, padding:14, marginBottom:16 }}>
          <SectionLabel>Paid back</SectionLabel>
          <Field label="Paid to" hint="Usually the person who spent it. Change it if someone else was reimbursed.">
            <input style={inputStyle} list="settle-people" value={e.settledTo||""}
              onChange={ev=>set("settledTo", ev.target.value)} placeholder={e.paidBy || "name"} />
            <datalist id="settle-people">
              {(L.people||[]).map(x => <option key={x} value={x} />)}
            </datalist>
          </Field>
          <Field label="Date the money was returned"
            hint="Leave blank while it is still owed. Filling this marks it settled without needing a claim.">
            <input type="date" style={inputStyle} value={e.paidDate||""}
              onChange={ev=>set("paidDate", ev.target.value)} />
          </Field>
          {e.claimRef && (
            <div style={{ fontSize:12.5, color:INK, lineHeight:1.5, marginBottom:12 }}>
              Already covered by claim <strong>{e.claimRef}</strong>.
            </div>
          )}

          <div style={{ borderTop:`1px dashed ${SAND}`, paddingTop:12, marginTop:4 }}>
            <div style={{ fontSize:12.5, color:MUTED, lineHeight:1.55, marginBottom:10 }}>
              If two of you travelled together and the company paid one person the whole amount,
              record here who then passed the share on.
            </div>
            <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:12 }}>
              <Field label="Passed on to">
                <input style={inputStyle} list="settle-people" value={e.onwardTo||""}
                  onChange={ev=>set("onwardTo", ev.target.value)} placeholder="the other partner" />
              </Field>
              <Field label="On">
                <input type="date" style={inputStyle} value={e.onwardDate||""}
                  onChange={ev=>set("onwardDate", ev.target.value)} />
              </Field>
            </div>
            {e.onwardTo && (
              <div style={{ background:SURFACE, borderRadius:11, padding:11, fontSize:12.5, color:INK, lineHeight:1.6 }}>
                Spent by <strong>{e.paidBy || "someone"}</strong> ·
                company paid <strong>{e.settledTo || "—"}</strong> ·
                who passed it to <strong>{e.onwardTo}</strong>
                {e.onwardDate ? ` on ${fmtDate(e.onwardDate)}` : ""}
              </div>
            )}
          </div>
        </div>

        <BigButton icon="check" label="Save Expense" onClick={()=>onSave(e)} tone="green" full />
      </div>
    </div>
  );
}

/* ================= RECEIVABLES ================= */
function ReceivablesTab({ reqs, setReqs, showToast, goTo }){
  const [showRecovered, setShowRecovered] = useState(false);

  const items = useMemo(() => reqs
    .filter(r => excessPaid(r) > 0)
    .map(r => ({ r, excess: excessPaid(r) }))
    .sort((a,b) => (b.r.paymentDate||"").localeCompare(a.r.paymentDate||"")),
  [reqs]);

  const open = items.filter(x => !x.r.recovered);
  const done = items.filter(x => x.r.recovered);
  const shown = showRecovered ? done : open;

  const outstanding = open.reduce((s,x)=>s+x.excess, 0);

  const byParty = useMemo(() => {
    const map = {};
    open.forEach(x => { const k = x.r.name || "Unnamed"; map[k] = (map[k]||0) + x.excess; });
    return Object.entries(map).sort((a,b)=>b[1]-a[1]);
  }, [open]);

  function markRecovered(r, val){
    setReqs(reqs.map(x => x.id === r.id ? { ...x, recovered: val } : x));
    showToast(val ? "Marked recovered" : "Moved back to outstanding");
  }

  function exportReceivables(){
    if (shown.length === 0) { showToast("Nothing to export", "error"); return; }
    const data = shown.map(({r, excess}) => ({
      "Ref No.":r.refNo||"", "Party":r.name, Site:r.site,
      "Requisition Amount":Number(r.amount)||0,
      "Amount Paid":Number(r.paidAmount)||0,
      "Excess (Receivable)":excess,
      "Payment Date":fmtDate(r.paymentDate), "UTR":r.utr||"",
      "Status": r.recovered ? "Recovered" : "Outstanding",
    }));
    const ws = XLSX.utils.json_to_sheet(data);
    ws["!cols"] = [{wch:16},{wch:22},{wch:16},{wch:18},{wch:14},{wch:18},{wch:14},{wch:22},{wch:14}];
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, "Receivables");
    XLSX.writeFile(wb, `Receivables_${todayStr()}.xlsx`);
    showToast(`Exported ${shown.length} row(s)`);
  }

  return (
    <div>
      <button onClick={()=>goTo("dashboard")}
        style={{ display:"flex", alignItems:"center", gap:6, marginBottom:16, fontSize:14, fontWeight:600, color:INK, background:"none", border:"none", cursor:"pointer" }}>
        <Icon name="close" size={16} /> Back to dashboard
      </button>

      <div style={{ background:SURFACE, borderRadius:16, padding:20, marginBottom:14, border:`1.5px solid ${outstanding>0 ? AMBER : SAND}` }}>
        <div style={{ fontSize:12, fontWeight:600, color:MUTED }}>Outstanding receivable</div>
        <div style={{ fontSize:26, fontWeight:700, color: outstanding>0 ? AMBER : INK }}>₹{fmtINR(outstanding)}</div>
        <div style={{ fontSize:12, color:MUTED, marginTop:2 }}>
          {open.length} overpayment{open.length===1?"":"s"} to recover
        </div>
        {byParty.length > 0 && (
          <div style={{ marginTop:14, paddingTop:14, borderTop:`1px solid ${SAND}` }}>
            {byParty.map(([party, amt]) => (
              <div key={party} style={{ display:"flex", justifyContent:"space-between", fontSize:14, padding:"5px 0" }}>
                <span style={{ fontWeight:500, color:INK }}>{party}</span>
                <span style={{ fontWeight:700, color:INK }}>₹{fmtINR(amt)}</span>
              </div>
            ))}
          </div>
        )}
      </div>

      <div style={{ display:"flex", gap:8, marginBottom:14 }}>
        <button onClick={()=>setShowRecovered(false)}
          style={{ flex:1, padding:"9px 0", borderRadius:12, fontSize:14, fontWeight:600, cursor:"pointer",
            background: !showRecovered?INK:"#fff", color: !showRecovered?"#fff":INK, border:`1px solid ${!showRecovered?INK:SAND}` }}>
          Outstanding ({open.length})
        </button>
        <button onClick={()=>setShowRecovered(true)}
          style={{ flex:1, padding:"9px 0", borderRadius:12, fontSize:14, fontWeight:600, cursor:"pointer",
            background: showRecovered?INK:"#fff", color: showRecovered?"#fff":INK, border:`1px solid ${showRecovered?INK:SAND}` }}>
          Recovered ({done.length})
        </button>
      </div>

      {shown.length === 0 ? (
        <EmptyState text={showRecovered
          ? "Nothing marked recovered yet."
          : "No overpayments. When the amount actually paid is more than the requisition amount, the difference appears here."} />
      ) : (
        <div style={{ display:"flex", flexDirection:"column", gap:8, marginBottom:16 }}>
          {shown.map(({r, excess}) => (
            <div key={r.id} style={{ background:SURFACE, borderRadius:16, padding:14, border:`1px solid ${SAND}`, boxShadow:SHADOW }}>
              <div style={{ display:"flex", justifyContent:"space-between", gap:8 }}>
                <div style={{ fontWeight:700, color:INK, overflow:"hidden", textOverflow:"ellipsis", whiteSpace:"nowrap" }}>{r.name}</div>
                <div style={{ fontWeight:700, color:AMBER, flexShrink:0 }}>₹{fmtINR(excess)}</div>
              </div>
              <div style={{ fontSize:12, color:MUTED, marginTop:3 }}>
                {r.refNo || "no ref"} · {fmtDate(r.paymentDate || r.date)} · {r.site}
              </div>
              <div style={{ fontSize:12, color:MUTED, marginTop:4 }}>
                Billed ₹{fmtINR(r.amount)} · Paid ₹{fmtINR(r.paidAmount)}
              </div>
              <button onClick={()=>markRecovered(r, !r.recovered)}
                style={{ marginTop:10, width:"100%", padding:"10px 0", borderRadius:12, fontSize:14, fontWeight:600, cursor:"pointer",
                  background: r.recovered ? SAND : GREEN, color: r.recovered ? INK : "#fff", border:"none" }}>
                {r.recovered ? "Move back to outstanding" : "Mark as recovered"}
              </button>
            </div>
          ))}
        </div>
      )}

      <BigButton icon="download" label="Export Receivables" onClick={exportReceivables} tone="ink" full />
    </div>
  );
}

function DetailRow({ label, value, copyable, showToast, mono }){
  if (value === undefined || value === null || String(value).trim() === "") return null;
  return (
    <div style={{ display:"flex", alignItems:"flex-start", gap:12, padding:"11px 0", borderBottom:`1px solid ${SAND}` }}>
      <div style={{ width:118, flexShrink:0, fontSize:12, fontWeight:700, color:MUTED, textTransform:"uppercase", letterSpacing:0.3, paddingTop:2 }}>{label}</div>
      <div style={{ flex:1, minWidth:0, fontSize:15, color:INK, fontWeight:500, wordBreak:"break-word",
        fontFamily: mono ? "ui-monospace, SFMono-Regular, Menlo, monospace" : "inherit" }}>{value}</div>
      {copyable && (
        <button onClick={()=>copyText(String(value), label, showToast)}
          style={{ flexShrink:0, width:34, height:34, borderRadius:10, background:SAND, border:"none", cursor:"pointer",
            display:"flex", alignItems:"center", justifyContent:"center" }}>
          <Icon name="copy" size={14} color={INK} />
        </button>
      )}
    </div>
  );
}

function RequisitionDetail({ req, vendors, reqs, setReqs, expenses, setExpenses, lists, setLists, goTo, showToast, onBack, onEdit, onExport, onDuplicate }){
  const [convert, setConvert] = useState(null);
  const [linking, setLinking] = useState(false);
  const [pick, setPick] = useState(new Set());
  const [pickType, setPickType] = useState("All");
  const [attachTab, setAttachTab] = useState("expenses");   // expenses | payments
  const [payOnlyPartner, setPayOnlyPartner] = useState(false);
  const [attFrom, setAttFrom] = useState("");
  const [attTo, setAttTo] = useState("");
  const [attQuery, setAttQuery] = useState("");
  const vendor = vendors.find(v => v.id === req.vendorId);
  const [askPayment, setAskPayment] = useState(false);

  function setStatus(newStatus){
    if (newStatus === "Paid") { setAskPayment(true); return; }
    setReqs(reqs.map(r => r.id === req.id ? { ...r, paymentStatus: newStatus } : r));
    showToast(`Marked ${newStatus}`);
  }

  function savePayment(details){
    setReqs(reqs.map(r => r.id === req.id ? { ...r, paymentStatus:"Paid", ...details } : r));
    setAskPayment(false);
    showToast("Moved to Payment Register");
    onBack();
  }

  function remove(){
    if (!confirm(`Delete the requisition for ${req.name || "this entry"} (₹${fmtINR(req.amount)})?\n\nThis cannot be undone.`)) return;
    setReqs(reqs.filter(r => r.id !== req.id));
    showToast("Requisition deleted");
    onBack();
  }

  return (
    <div>
      <button onClick={onBack}
        style={{ display:"flex", alignItems:"center", gap:6, marginBottom:16, fontSize:14, fontWeight:600, color:INK, background:"none", border:"none", cursor:"pointer" }}>
        <Icon name="close" size={16} /> Back to list
      </button>

      {/* headline */}
      <div style={{ background:SURFACE, borderRadius:16, padding:20, marginBottom:14, border:`1px solid ${SAND}` }}>
        <div style={{ fontSize:13, color:MUTED, marginBottom:4 }}>{req.refNo || "No reference"}</div>
        <div style={{ fontSize:19, fontWeight:700, color:INK, lineHeight:1.25 }}>{req.name || "Unnamed"}</div>
        <div style={{ fontSize:30, fontWeight:700, color:INK, marginTop:8 }}>₹{fmtINR(req.amount)}</div>
        <div style={{ marginTop:12, display:"flex", alignItems:"center", gap:8, flexWrap:"wrap" }}>
          <span style={{ fontSize:12, fontWeight:700, padding:"5px 12px", borderRadius:999, color:"#fff", background:STATUS_COLOR[req.paymentStatus] }}>
            {req.paymentStatus}
          </span>
          {req.exported && <span style={{ fontSize:12, fontWeight:600, padding:"5px 12px", borderRadius:999, background:SAND, color:INK }}>Exported</span>}
          {isInRegister(req) && <span style={{ fontSize:12, fontWeight:600, padding:"5px 12px", borderRadius:999, background:"#E6F7F2", color:GREEN }}>In Payment Register</span>}
          {req.isReimbursement && <span style={{ fontSize:12, fontWeight:600, padding:"5px 12px", borderRadius:999, background:"#EEF0FE", color:AMBER }}>Reimbursement</span>}
        </div>
      </div>

      {askPayment && (
        <PaymentDetailsModal req={req} onCancel={()=>setAskPayment(false)} onSave={savePayment} />
      )}

      {/* quick status change */}
      <div style={{ background:SURFACE, borderRadius:16, padding:16, marginBottom:14, border:`1px solid ${SAND}` }}>
        <SectionLabel>Change status</SectionLabel>
        <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:8 }}>
          {STATUS_OPTIONS.map(st => (
            <button key={st} onClick={()=>setStatus(st)}
              style={{ borderRadius:12, padding:"11px 0", fontWeight:600, fontSize:14, cursor:"pointer",
                border:`2px solid ${req.paymentStatus===st ? STATUS_COLOR[st] : SAND}`,
                background: req.paymentStatus===st ? STATUS_COLOR[st] : "#fff",
                color: req.paymentStatus===st ? "#fff" : INK }}>
              {st}
            </button>
          ))}
        </div>
      </div>

      {/* details */}
      <div style={{ background:SURFACE, borderRadius:16, padding:"4px 20px 16px", marginBottom:14, border:`1px solid ${SAND}` }}>
        <div style={{ paddingTop:16 }}><SectionLabel>Requisition</SectionLabel></div>
        <DetailRow label="Date" value={fmtDate(req.date)} />
        <DetailRow label="Site" value={req.site} />
        <DetailRow label="Category" value={req.category} />
        <DetailRow label="Sub-Category" value={req.subCategory} />
        <DetailRow label="Description" value={req.description} />
        <DetailRow label="Paid by" value={req.paidBy} />
      </div>

      <div style={{ background:SURFACE, borderRadius:16, padding:"4px 20px 16px", marginBottom:14, border:`1px solid ${SAND}` }}>
        <div style={{ paddingTop:16 }}><SectionLabel>Bank details</SectionLabel></div>
        <DetailRow label="A/c No." value={req.accNo} copyable showToast={showToast} mono />
        <DetailRow label="IFSC" value={req.ifsc} copyable showToast={showToast} mono />
        <DetailRow label="Bank" value={vendor ? vendor.bankName : ""} />
        {!req.accNo && !req.ifsc && (
          <div style={{ fontSize:13, color:AMBER, fontWeight:600, padding:"12px 0" }}>
            No bank details on this entry — accounts will not be able to pay it.
          </div>
        )}
      </div>

      {(req.paymentDate || req.paymentMode || req.utr) && (
        <div style={{ background:"#F7FBF8", borderRadius:16, padding:"4px 20px 16px", marginBottom:14, border:`1px solid ${SAND}` }}>
          <div style={{ paddingTop:16 }}><SectionLabel>Payment made</SectionLabel></div>
          <DetailRow label="Paid on" value={fmtDate(req.paymentDate)} />
          <DetailRow label="Mode" value={req.paymentMode} />
          <DetailRow label="UTR" value={req.utr} copyable showToast={showToast} mono />
          <DetailRow label="Amount paid" value={req.paidAmount !== "" && req.paidAmount !== undefined ? `₹${fmtINR(req.paidAmount)}` : ""} />
          {excessPaid(req) > 0 && (
            <div style={{ marginTop:12, background:"#EEF0FE", border:`1px solid #3F6CA8`, borderRadius:12, padding:12, fontSize:13, color:INK, lineHeight:1.5 }}>
              <strong>₹{fmtINR(excessPaid(req))} paid extra</strong> — {req.recovered ? "marked recovered." : "shown as receivable."}
            </div>
          )}
          {shortPaid(req) > 0 && (
            <div style={{ marginTop:12, background:"#EEF0FE", border:`1px solid ${AMBER}`, borderRadius:12, padding:12, fontSize:13, color:INK, lineHeight:1.5 }}>
              <strong>₹{fmtINR(shortPaid(req))} still unpaid</strong> against this requisition.
            </div>
          )}
        </div>
      )}

      {(() => {
        const covered = (expenses||[]).filter(e => e.claimId && req.claimId && e.claimId === req.claimId);
        const coveredTotal = covered.reduce((a,e)=>a+Number(e.amount||0), 0);
        const coveredReqs = (reqs||[]).filter(r => r.coveredById === req.id);
        const coveredReqTotal = coveredReqs.reduce((a,r)=>a+Number(r.amount||0), 0);

        // Everything is offered, not only what is unsettled. An expense already
        // attached elsewhere is shown but cannot be taken, so it can never end up
        // on two payments.
        const allExp = (expenses||[]);
        const payCandidates = (reqs||[]).filter(r => r.id !== req.id && !isRolledUp(r) && !r.isReimbursement);
        const partnerPaid = payCandidates.filter(isPartnerPaid);
        const attachable = (attachTab === "payments")
          ? (payOnlyPartner ? partnerPaid : payCandidates)
          : allExp;
        if (!attachable.length && !covered.length && !coveredReqs.length) return null;

        const types = [...new Set(allExp.map(e => e.expenseType).filter(Boolean))].sort();
        const inRange = () => true;
        const list = (attachTab === "payments")
          ? attachable
              .filter(inRange)
              .filter(x => matches(attQuery, dateTerms(x.date, x.paymentDate), x.name, x.refNo, x.site, x.category, x.description, x.amount, x.paidBy))
              .sort((a,b) => String(b.date||"").localeCompare(String(a.date||"")))
          : attachable
              .filter(e => pickType === "All" || e.expenseType === pickType)
              .filter(inRange)
              .filter(e => matches(attQuery, dateTerms(e.date, e.paidDate), e.description, e.expenseType, e.paidBy, e.site, e.category, e.amount, e.claimRef))
              .sort((a,b) => String(b.date||"").localeCompare(String(a.date||""))
                          || String(a.paidBy||"").localeCompare(String(b.paidBy||"")));
        const picked = (attachTab === "payments" ? (reqs||[]) : (expenses||[])).filter(x => pick.has(x.id));
        const pickedTotal = picked.reduce((a,x)=>a+Number(x.amount||0), 0);
        const target = Number(req.amount||0);
        const already = coveredTotal + coveredReqTotal;
        const room = target - already - pickedTotal;

        function attachPayments(){
          const rows = (reqs||[]).filter(r => pick.has(r.id));
          if (!rows.length) { showToast("Choose the payments first", "error"); return; }
          const t = rows.reduce((a,r)=>a+Number(r.amount||0), 0);
          if (!confirm(
            `Record ${rows.length} requisition(s) as settled inside ${req.refNo || "this payment"}?\n\n` +
            `Their total: ₹${fmtINR(t)}\nThis payment: ₹${fmtINR(Number(req.amount||0))}\n\n` +
            `They stay on file but stop counting as separate money out, so nothing is doubled. ` +
            `Each is marked paid on ${fmtDate(req.paymentDate || req.date)}.`
          )) return;
          setReqs(reqs.map(r => pick.has(r.id)
            ? { ...r, coveredById: req.id, coveredByRef: req.refNo || "",
                paymentStatus: "Paid",
                paymentDate: r.paymentDate || req.paymentDate || req.date,
                paymentMode: r.paymentMode || req.paymentMode || "" }
            : r));
          setPick(new Set());
          setLinking(false);
          showToast(`${rows.length} payment(s) rolled into ${req.refNo || "this entry"}`);
        }

        function attach(){
          if (attachTab === "payments") return attachPayments();
          if (!pick.size) { showToast("Choose the expenses first", "error"); return; }
          const people = [...new Set(picked.map(e => e.paidBy || "Unassigned"))];
          const claimId = req.claimId || uid();
          const msg =
            `Attach ${pick.size} expense(s) to ${req.refNo || "this payment"}?\n\n` +
            `Payment: ₹${fmtINR(target)}\n` +
            `Expenses being attached: ₹${fmtINR(pickedTotal)}\n` +
            (already ? `Already attached: ₹${fmtINR(already)}\n` : "") +
            `Difference: ₹${fmtINR(Math.abs(room))} ${room > 0 ? "still uncovered" : room < 0 ? "OVER the payment" : "- matches exactly"}\n\n` +
            `Spent by: ${people.join(", ")}\n` +
            `Money went to: ${req.name}\n\n` +
            (people.length > 1 || (people.length === 1 && people[0] !== req.name)
              ? `${req.name} is being repaid for spending by ${people.filter(x=>x!==req.name).join(", ") || people.join(", ")}. That is fine - it is recorded as one payment covering all of it.\n\n`
              : "") +
            `They will be marked settled and locked to this payment.`;
          if (!confirm(msg)) return;
          // The money went to whoever this payment names. That person may have been
          // covering somebody else's spending, so Paid To is the payee, not the spender.
          setExpenses((expenses||[]).map(e => pick.has(e.id)
            ? { ...e, claimId, claimRef: req.refNo || "", settledTo: req.name || e.paidBy || "" }
            : e));
          setReqs(reqs.map(r => r.id === req.id
            ? { ...r, isReimbursement:true, claimId, paidBy: r.paidBy || "Company" }
            : r));
          setPick(new Set());
          setLinking(false);
          showToast(`${pick.size} expense(s) attached to ${req.refNo || "this payment"}`);
        }

        return (
          <div style={{ background:SURFACE, borderRadius:20, padding:18, marginBottom:14,
            border:`1px solid ${SAND}`, boxShadow:SHADOW }}>
            <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", gap:10 }}>
              <div style={{ minWidth:0 }}>
                <div style={{ fontWeight:700, color:INK, fontSize:15 }}>Expenses covered by this payment</div>
                <div style={{ fontSize:12.5, color:MUTED, marginTop:3, lineHeight:1.5 }}>
                  {(covered.length + coveredReqs.length)
                    ? `${covered.length + coveredReqs.length} attached, ₹${fmtINR(coveredTotal + coveredReqTotal)} of ₹${fmtINR(target)}`
                    : `Nothing attached yet. ${attachable.length} expense(s) are waiting to be repaid.`}
                </div>
              </div>
              {attachable.length > 0 && (
                <button onClick={()=>{ setLinking(!linking); setPick(new Set()); }}
                  style={{ flexShrink:0, padding:"10px 14px", borderRadius:12, fontSize:13, fontWeight:700,
                    background: linking ? INK : AMBER, color:"#fff", border:"none", cursor:"pointer" }}>
                  {linking ? "Close" : "Attach"}
                </button>
              )}
            </div>

            {covered.length > 0 && (
              <div style={{ marginTop:12 }}>
                {covered.slice(0,12).map((e,i) => (
                  <div key={e.id} style={{ display:"flex", justifyContent:"space-between", alignItems:"center",
                    gap:8, padding:"7px 0", borderTop: i ? `1px solid ${SAND}` : `1px solid ${SAND}` }}>
                    <div style={{ minWidth:0 }}>
                      <div style={{ fontSize:13, color:INK, overflow:"hidden", textOverflow:"ellipsis", whiteSpace:"nowrap" }}>
                        {e.description || e.expenseType}
                      </div>
                      <div style={{ fontSize:11, color:MUTED, marginTop:1 }}>
                        {e.paidBy}{e.date ? ` · ${fmtDate(e.date)}` : ""}
                      </div>
                    </div>
                    <span className="num" style={{ fontWeight:600, color:INK, flexShrink:0 }}>₹{fmtINR(e.amount)}</span>
                    <button onClick={()=>{
                        if (!confirm(`Detach this expense?\n\nIt goes back to waiting to be repaid.`)) return;
                        setExpenses((expenses||[]).map(x => x.id === e.id
                          ? { ...x, claimId:"", claimRef:"" } : x));
                        showToast("Detached");
                      }}
                      style={{ padding:5, borderRadius:8, background:"#FDECEE", border:"none", cursor:"pointer", flexShrink:0 }}>
                      <Icon name="close" size={12} color={RED} />
                    </button>
                  </div>
                ))}
                <div style={{ display:"flex", justifyContent:"space-between", paddingTop:10, marginTop:6,
                  borderTop:`2px solid ${INK}` }}>
                  <span style={{ fontWeight:700, color:INK, fontSize:13.5 }}>
                    {Math.abs((coveredTotal + coveredReqTotal) - target) < 0.01 ? "Fully covered" : "Covered so far"}
                  </span>
                  <span className="num" style={{ fontWeight:800,
                    color: Math.abs((coveredTotal + coveredReqTotal) - target) < 0.01 ? GREEN : AMBER }}>
                    ₹{fmtINR(coveredTotal + coveredReqTotal)} of ₹{fmtINR(target)}
                  </span>
                </div>
              </div>
            )}

            {covered.length > 0 && (() => {
              const byPerson = {};
              covered.forEach(e => {
                const k = e.paidBy || "Not set";
                byPerson[k] = (byPerson[k]||0) + Number(e.amount||0);
              });
              const names = Object.keys(byPerson);
              const pos = partnerPositions(expenses);
              return (
                <div style={{ background:"#F1F4F9", borderRadius:13, padding:12, marginTop:12 }}>
                  <div style={{ fontSize:11.5, fontWeight:700, color:MUTED, textTransform:"uppercase",
                    letterSpacing:"0.06em", marginBottom:7 }}>
                    On this payment, by who spent it
                  </div>
                  {names.map(n => {
                    const p = pos.find(x => x.person === n);
                    return (
                      <div key={n} style={{ display:"flex", justifyContent:"space-between",
                        alignItems:"baseline", gap:8, padding:"3px 0" }}>
                        <span style={{ fontSize:12.5, color:INK }}>{n}</span>
                        <span style={{ fontSize:11.5, color: p && p.owed > 0.5 ? AMBER : GREEN }}>
                          {p ? (p.owed > 0.5 ? `₹${fmtINR(p.owed)} still owed overall` : "fully reconciled") : ""}
                        </span>
                        <span className="num" style={{ fontSize:12.5, fontWeight:700, color:INK }}>
                          ₹{fmtINR(byPerson[n])}
                        </span>
                      </div>
                    );
                  })}
                </div>
              );
            })()}

            {coveredReqs.length > 0 && (
              <div style={{ marginTop:12, paddingTop:12, borderTop:`1px solid ${SAND}` }}>
                <div style={{ fontSize:11.5, fontWeight:700, color:MUTED, textTransform:"uppercase",
                  letterSpacing:"0.06em", marginBottom:7 }}>
                  Requisitions settled inside this payment
                </div>
                {coveredReqs.map((r,i2) => (
                  <div key={r.id} style={{ display:"flex", justifyContent:"space-between", alignItems:"center",
                    gap:8, padding:"7px 0", borderTop: i2 ? `1px solid ${SAND}` : "none" }}>
                    <div style={{ minWidth:0 }}>
                      <div style={{ fontSize:13, color:INK, overflow:"hidden", textOverflow:"ellipsis", whiteSpace:"nowrap" }}>
                        {r.name}
                      </div>
                      <div style={{ fontSize:11, color:MUTED, marginTop:1 }}>
                        {r.refNo || "no ref"}{r.date ? ` · ${fmtDate(r.date)}` : ""}
                      </div>
                    </div>
                    <span className="num" style={{ fontWeight:600, color:INK, flexShrink:0 }}>₹{fmtINR(r.amount)}</span>
                    <button onClick={()=>{
                        if (!confirm(`Detach ${r.refNo || "this requisition"}?\n\nIt goes back to standing on its own.`)) return;
                        setReqs(reqs.map(x => x.id === r.id ? { ...x, coveredById:"", coveredByRef:"" } : x));
                        showToast("Detached");
                      }}
                      style={{ padding:5, borderRadius:8, background:"#FDECEE", border:"none", cursor:"pointer", flexShrink:0 }}>
                      <Icon name="close" size={12} color={RED} />
                    </button>
                  </div>
                ))}
              </div>
            )}

            {linking && (
              <div style={{ marginTop:12 }}>
                <div style={{ display:"flex", gap:6, marginBottom:10, background:"#E9EDF4", padding:4, borderRadius:12 }}>
                  {[["expenses","Expenses"],["payments","Other payments"]].map(([k,lbl]) => {
                    const on = attachTab === k;
                    return (
                      <button key={k} onClick={()=>{ setAttachTab(k); setPick(new Set()); }}
                        style={{ flex:1, padding:"9px 4px", borderRadius:9, fontSize:12.5, fontWeight:on?700:600,
                          border:"none", cursor:"pointer",
                          background: on ? SURFACE : "transparent", color: on ? INK : MUTED,
                          boxShadow: on ? "0 1px 3px rgba(11,18,32,0.12)" : "none" }}>
                        {lbl}
                      </button>
                    );
                  })}
                </div>
                {pick.size > 0 && (
                  <div style={{ background:"#EEF0FE", borderRadius:13, padding:12, marginBottom:10 }}>
                    <div style={{ display:"flex", justifyContent:"space-between", fontSize:13, marginBottom:4 }}>
                      <span style={{ color:MUTED }}>Selected</span>
                      <span className="num" style={{ fontWeight:700, color:INK }}>₹{fmtINR(pickedTotal)}</span>
                    </div>
                    <div style={{ display:"flex", justifyContent:"space-between", fontSize:13 }}>
                      <span style={{ color:MUTED }}>
                        {room > 0 ? "Still uncovered" : room < 0 ? "Over the payment" : "Matches the payment"}
                      </span>
                      <span className="num" style={{ fontWeight:700,
                        color: room === 0 ? GREEN : room < 0 ? RED : AMBER }}>
                        ₹{fmtINR(Math.abs(room))}
                      </span>
                    </div>
                    {room < 0 && (
                      <div style={{ fontSize:12, color:RED, fontWeight:600, marginTop:8, lineHeight:1.5 }}>
                        More expenses than the payment covers. Allowed, but check it is right.
                      </div>
                    )}
                    {(() => {
                      const spenders = {};
                      picked.forEach(e => { const k = e.paidBy || "Unassigned";
                        spenders[k] = (spenders[k]||0) + Number(e.amount||0); });
                      const names = Object.keys(spenders);
                      if (names.length < 2) return null;
                      return (
                        <div style={{ marginTop:9, paddingTop:9, borderTop:`1px solid ${SAND}` }}>
                          <div style={{ fontSize:11.5, color:MUTED, fontWeight:600, marginBottom:5 }}>
                            Spent by {names.length} people, all repaid through {req.name}
                          </div>
                          {names.map(n => (
                            <div key={n} style={{ display:"flex", justifyContent:"space-between", fontSize:12.5, padding:"2px 0" }}>
                              <span style={{ color:INK }}>{n}</span>
                              <span className="num" style={{ fontWeight:600, color:INK }}>₹{fmtINR(spenders[n])}</span>
                            </div>
                          ))}
                        </div>
                      );
                    })()}
                  </div>
                )}

                <SearchBox value={attQuery} onChange={setAttQuery}
                  placeholder={attachTab === "payments" ? "Search date, payee, reference, amount" : "Search date, description, person, amount"} />

                {attachTab === "payments" && partnerPaid.length > 0 && (
                  <div style={{ display:"flex", gap:7, marginBottom:10 }}>
                    {[[false,`All payments (${payCandidates.length})`],[true,`Paid by a partner (${partnerPaid.length})`]].map(([v,lbl]) => {
                      const on = payOnlyPartner === v;
                      return (
                        <button key={String(v)} onClick={()=>{ setPayOnlyPartner(v); setPick(new Set()); }}
                          style={{ flex:1, padding:"8px 6px", borderRadius:11, fontSize:12, fontWeight:600,
                            cursor:"pointer",
                            background: on?INK:SURFACE, color: on?"#fff":INK, border:`1px solid ${on?INK:SAND}` }}>
                          {lbl}
                        </button>
                      );
                    })}
                  </div>
                )}

                {attachTab === "expenses" && types.length > 1 && (
                  <div style={{ display:"flex", gap:7, marginBottom:10, overflowX:"auto", paddingBottom:4 }}>
                    {["All", ...types].map(t => {
                      const on = pickType === t;
                      return (
                        <button key={t} onClick={()=>setPickType(t)}
                          style={{ padding:"7px 12px", borderRadius:11, fontSize:12.5, fontWeight:600,
                            whiteSpace:"nowrap", cursor:"pointer",
                            background: on?INK:SURFACE, color: on?"#fff":INK, border:`1px solid ${on?INK:SAND}` }}>
                          {t}
                        </button>
                      );
                    })}
                  </div>
                )}

                <div style={{ maxHeight:420, overflowY:"auto", border:`1px solid ${SAND}`, borderRadius:14 }}>
                  {list.map((e, idx) => {
                    const isPay = attachTab === "payments";
                    const mine = isPay ? false : (e.claimId && req.claimId && e.claimId === req.claimId);
                    const elsewhere = isPay
                      ? false
                      : (!!e.claimId && !mine);
                    const settledAlone = !isPay && !e.claimId && !!e.paidDate;
                    const on = pick.has(e.id);
                    const blocked = elsewhere;
                    return (
                      <div key={e.id} onClick={()=>{ if (blocked || mine) return; setPick(prev => {
                          const n = new Set(prev); n.has(e.id) ? n.delete(e.id) : n.add(e.id); return n;
                        }); }}
                        style={{ display:"flex", alignItems:"center", gap:10, padding:"11px 12px",
                          borderTop: idx ? `1px solid ${SAND}` : "none",
                          background: on ? "#EEF0FE" : SURFACE,
                          opacity: blocked ? 0.42 : 1,
                          cursor: (blocked || mine) ? "default" : "pointer" }}>
                        <div style={{ width:20, height:20, borderRadius:6, flexShrink:0,
                          display:"flex", alignItems:"center", justifyContent:"center",
                          background: (on || mine) ? AMBER : SURFACE,
                          border:`2px solid ${(on || mine) ? AMBER : "#C7D0DE"}` }}>
                          {(on || mine) && <Icon name="check" size={12} color="#fff" />}
                        </div>
                        <div style={{ flex:1, minWidth:0 }}>
                          <div style={{ fontSize:13.5, fontWeight:600, color:INK, overflow:"hidden",
                            textOverflow:"ellipsis", whiteSpace:"nowrap" }}>
                            {isPay ? (e.name || "Payment") : (e.description || e.expenseType)}
                          </div>
                          <div style={{ fontSize:11.5, color:MUTED, marginTop:2 }}>
                            {isPay
                              ? `${e.refNo || "no ref"}${e.date ? " · " + fmtDate(e.date) : ""} · ${e.site || "no site"}`
                              : `${e.paidBy || "Unassigned"} · ${e.expenseType}${e.date ? " · " + fmtDate(e.date) : ""}`}
                          </div>
                          {isPay && isPartnerPaid(e) && (
                            <div style={{ fontSize:11, fontWeight:700, color:AMBER, marginTop:2 }}>
                              paid by {e.paidBy} - owed back
                            </div>
                          )}
                          {mine && (
                            <div style={{ fontSize:11, fontWeight:700, color:GREEN, marginTop:2 }}>
                              already on this payment
                            </div>
                          )}
                          {elsewhere && (
                            <div style={{ fontSize:11, fontWeight:700, color:AMBER, marginTop:2 }}>
                              already on {e.claimRef || "another payment"}
                            </div>
                          )}
                          {settledAlone && !mine && (
                            <div style={{ fontSize:11, color:MUTED, marginTop:2 }}>
                              settled {fmtDate(e.paidDate)} - attaching links it here too
                            </div>
                          )}
                        </div>
                        <span className="num" style={{ fontWeight:700, color:INK, flexShrink:0, fontSize:13.5 }}>
                          ₹{fmtINR(e.amount)}
                        </span>
                      </div>
                    );
                  })}
                  {list.length === 0 && (
                    <div style={{ padding:16, fontSize:13, color:MUTED }}>
                      {attachTab === "payments" ? "No other payments to attach." : "Nothing under this type."}
                    </div>
                  )}
                </div>

                <div style={{ marginTop:12 }}>
                  <BigButton icon="check"
                    label={pick.size
                      ? `Attach ${pick.size} ${attachTab === "payments" ? "payment(s)" : "expense(s)"}`
                      : (attachTab === "payments" ? "Choose payments above" : "Choose expenses above")}
                    onClick={attach} tone="green" full disabled={!pick.size} />
                </div>
              </div>
            )}
          </div>
        );
      })()}

      {req.isReimbursement && (() => {
        const covered = (expenses||[]).filter(e => e.claimId && e.claimId === req.claimId);
        const total = covered.reduce((s,e)=>s+Number(e.amount||0), 0);
        const byType = {};
        covered.forEach(e => { byType[e.expenseType] = (byType[e.expenseType]||0) + Number(e.amount||0); });
        return (
          <div style={{ background:SURFACE, borderRadius:16, padding:16, marginBottom:14, border:`1.5px solid ${AMBER}` }}>
            <SectionLabel>Reimbursement</SectionLabel>
            <div style={{ fontSize:13, color:MUTED, lineHeight:1.55, marginBottom:12 }}>
              This is a settlement, not a new cost. It repays {req.name} for {covered.length} expense(s)
              already recorded — the underlying amounts are not counted again.
            </div>
            {Object.entries(byType).map(([k,v]) => (
              <div key={k} style={{ display:"flex", justifyContent:"space-between", fontSize:14, padding:"5px 0" }}>
                <span style={{ color:INK }}>{k}</span>
                <span style={{ fontWeight:600, color:INK }}>₹{fmtINR(v)}</span>
              </div>
            ))}
            <div style={{ display:"flex", justifyContent:"space-between", fontSize:14, paddingTop:10, marginTop:6, borderTop:`1px solid ${SAND}` }}>
              <span style={{ fontWeight:700, color:INK }}>Total covered</span>
              <span style={{ fontWeight:700, color: Math.abs(total - Number(req.amount||0)) < 0.01 ? GREEN : RED }}>
                ₹{fmtINR(total)}
              </span>
            </div>
            {Math.abs(total - Number(req.amount||0)) >= 0.01 && (
              <div style={{ marginTop:10, fontSize:13, color:RED, fontWeight:600, lineHeight:1.5 }}>
                This does not match the requisition amount of ₹{fmtINR(req.amount)}. An expense may have been
                edited or unlinked after the claim was made.
              </div>
            )}
            <button onClick={()=>goTo && goTo("expenses")}
              style={{ marginTop:12, width:"100%", padding:"11px 0", borderRadius:12, fontSize:14, fontWeight:600,
                background:SAND, color:INK, border:"none", cursor:"pointer" }}>
              View the expenses behind this
            </button>
          </div>
        );
      })()}

      {vendor && (
        <div style={{ background:SURFACE, borderRadius:16, padding:16, marginBottom:14, border:`1px solid ${SAND}` }}>
          <SectionLabel>Ledger</SectionLabel>
          <div style={{ fontWeight:700, color:INK }}>{vendor.name}</div>
          {vendor.gstin && <div style={{ fontSize:12, color:MUTED, marginTop:3 }}>GSTIN: {vendor.gstin}</div>}
        </div>
      )}

      {/* actions */}
      <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:10, marginBottom:10 }}>
        <BigButton icon="share" label="Share" onClick={()=>shareRequisitions([req])} tone="ink" full />
        <BigButton icon="edit" label="Edit" onClick={onEdit} tone="amber" full />
      </div>
      <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:10, marginBottom:10 }}>
        <BigButton icon="download" label="Export" onClick={()=>onExport(req)} tone="green" full />
        <BigButton icon="plus" label="Duplicate" onClick={()=>onDuplicate(req)} tone="ink" full />
      </div>
      {!(expenses||[]).some(e => e.fromReqId === req.id) && (
        <div style={{ marginBottom:10 }}>
          <BigButton icon="share" label="Record as a partner expense"
            onClick={()=>setConvert({
              person: isPartnerPaid(req) ? req.paidBy : ((lists && lists.people) ? (lists.people[0]||"") : ""),
              expenseType: ((lists && lists.expenseTypes) ? lists.expenseTypes[0] : "Site Purchase"),
              alreadyRepaid: isInRegister(req),
            })}
            tone="ink" full />
        </div>
      )}

      {(expenses||[]).some(e => e.fromReqId === req.id) && (
        <div style={{ background:"#E6F7F2", border:`1px solid ${GREEN}`, borderRadius:14, padding:13, marginBottom:10,
          fontSize:12.5, color:INK, lineHeight:1.6 }}>
          Recorded as a partner expense. It is counted once, as an expense, not twice.
        </div>
      )}

      <BigButton icon="trash" label="Delete Requisition" onClick={remove} tone="red" full />

      {convert && (() => {
        const people = (lists && lists.people && lists.people.length)
          ? lists.people
          : [...new Set((vendors||[]).filter(v => ["Partner","Owner"].includes(v.ledgerType||"")).map(v=>v.name))];
        const types = (lists && lists.expenseTypes) ? lists.expenseTypes : DEFAULT_LISTS.expenseTypes;

        function doConvert(){
          const who = String(convert.person||"").trim();
          if (!who) { showToast("Say who paid for it", "error"); return; }
          const claimId = req.claimId || uid();
          const expense = {
            ...emptyExpense,
            id: uid(),
            date: req.date || req.paymentDate || "",
            expenseType: convert.expenseType,
            site: req.site || "",
            category: req.category || "",
            subCategory: req.subCategory || "",
            description: req.description || req.name || "",
            amount: Number(req.amount||0),
            paidBy: who,
            fromReqId: req.id,
            createdAt: Date.now(),
          };
          if (convert.alreadyRepaid) {
            expense.claimId = claimId;
            expense.claimRef = req.refNo || "";
            expense.settledTo = who;
            expense.paidDate = req.paymentDate || req.date || "";
          }
          setExpenses([...(expenses||[]), expense]);
          setReqs(reqs.map(r => r.id === req.id
            ? { ...r, paidBy: who, isReimbursement: true, claimId }
            : r));
          setConvert(null);
          showToast(convert.alreadyRepaid
            ? `Recorded as ${who}'s expense, already repaid`
            : `Recorded as ${who}'s expense, still owed`);
        }

        return (
          <div onClick={()=>setConvert(null)}
            style={{ position:"fixed", inset:0, zIndex:70, background:"rgba(11,18,32,0.55)",
              display:"flex", alignItems:"flex-end", justifyContent:"center" }}>
            <div onClick={e=>e.stopPropagation()}
              style={{ width:"100%", maxWidth:520, background:SURFACE, borderRadius:"24px 24px 0 0",
                padding:"22px 20px 26px", boxShadow:SHADOW_LG, maxHeight:"90vh", overflowY:"auto" }}>
              <div style={{ width:40, height:4, borderRadius:99, background:SAND, margin:"0 auto 16px" }} />
              <div style={{ fontSize:17, fontWeight:700, color:INK }}>Record as a partner expense</div>
              <div style={{ fontSize:13, color:MUTED, marginTop:4, lineHeight:1.55 }}>
                For a bill a partner settled themselves - electricity, wifi, anything on their own card.
                The cost moves to Expenses so it is counted once, not as a company payment as well.
              </div>

              <div style={{ background:"#F1F4F9", borderRadius:14, padding:13, margin:"14px 0" }}>
                <div style={{ display:"flex", justifyContent:"space-between", fontSize:13, marginBottom:4 }}>
                  <span style={{ color:MUTED }}>{req.name}</span>
                  <span className="num" style={{ fontWeight:700, color:INK }}>₹{fmtINR(req.amount)}</span>
                </div>
                <div style={{ fontSize:11.5, color:MUTED }}>
                  {req.refNo || "no ref"}{req.date ? ` · ${fmtDate(req.date)}` : ""}{req.site ? ` · ${req.site}` : ""}
                </div>
              </div>

              <Field label="Who paid for it" required>
                <input style={inputStyle} list="convert-people" value={convert.person}
                  onChange={e=>setConvert({...convert, person:e.target.value})}
                  placeholder="partner's name" />
                <datalist id="convert-people">
                  {people.map(x => <option key={x} value={x} />)}
                </datalist>
              </Field>

              <Field label="Expense type">
                <select style={inputStyle} value={convert.expenseType}
                  onChange={e=>setConvert({...convert, expenseType:e.target.value})}>
                  {types.map(x => <option key={x} value={x}>{x}</option>)}
                </select>
              </Field>

              <div style={{ background: convert.alreadyRepaid ? "#E6F7F2" : "#EEF0FE",
                border:`1px solid ${convert.alreadyRepaid ? GREEN : AMBER}`, borderRadius:14, padding:14, marginBottom:16 }}>
                <label style={{ display:"flex", alignItems:"center", gap:10, cursor:"pointer" }}>
                  <input type="checkbox" checked={!!convert.alreadyRepaid}
                    onChange={e=>setConvert({...convert, alreadyRepaid:e.target.checked})}
                    style={{ width:20, height:20 }} />
                  <span style={{ fontWeight:700, color:INK, fontSize:14 }}>They have already been paid back</span>
                </label>
                <div style={{ fontSize:12, color:INK, marginTop:9, lineHeight:1.55 }}>
                  {convert.alreadyRepaid
                    ? `This payment settles it, so the expense is marked repaid to ${convert.person || "them"} straight away.`
                    : "The expense will sit under To settle until you record paying them back."}
                </div>
              </div>

              <BigButton icon="check" label="Record it" onClick={doConvert} tone="green" full />
              <button onClick={()=>setConvert(null)}
                style={{ width:"100%", marginTop:10, padding:"14px 0", borderRadius:16, fontSize:15, fontWeight:600,
                  border:`1.5px solid ${SAND}`, background:SURFACE, color:MUTED, cursor:"pointer" }}>
                Cancel
              </button>
            </div>
          </div>
        );
      })()}
    </div>
  );
}

  { key:"code",       headers:["Code","Machine Code","Asset Code"] },
  { key:"regNo",      headers:["Registration No.","Reg No","Registration","Vehicle No","RC No"], upper:true },
  { key:"ownership",  headers:["Ownership","Owned/Rented","Type of Ownership","Owned"] },
  { key:"category",   headers:["Category","Machine Type","Equipment Type"] },
  { key:"site",       headers:["Site","Location","Deployed At"] },
  { key:"makeModel",  headers:["Make / Model","Make","Model","Make and Model"] },
  { key:"meterType",  headers:["Meter","Meter Type","Measured In"] },
  { key:"ownerName",  headers:["Owner","Rented From","Vendor","Party"] },
  { key:"rentAmount", headers:["Rent","Rent Amount","Monthly Rent","Hire Charges"], number:true },
  { key:"rentBasis",  headers:["Rent Basis","Basis","Per"] },
  { key:"notes",      headers:["Notes","Remarks"] },
];

const DIESEL_TEMPLATE = [
  { key:"id",          headers:["ID","Id","Record ID","RecordID"] },

  { key:"date",         headers:["Date"], date:true, required:true },
  { key:"type",         headers:["Type","Entry Type","Purchase/Issue","Transaction"] },
