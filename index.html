function ImportTab({ focusKind, clearFocus, presetCardId, vendors, setVendors, reqs, setReqs, recurring, setRecurring, expenses, setExpenses, cards, setCards, cashTxns, setCashTxns, machines, setMachines, diesel, setDiesel, utilities, setUtilities, lists, setLists, showToast, goTo }){
  const [mapping, setMapping] = useState(null);   // column-mapping step
  const [preview, setPreview] = useState(null);   // final confirm step
  const [skip, setSkip] = useState(new Set());
  const [forceAdd, setForceAdd] = useState(new Set());   // skipped rows brought back in

  /* ---------- step 1: read the workbook ---------- */
  function readFile(file, kind){
    const reader = new FileReader();
    reader.onload = (ev) => {
      try {
        const wb = XLSX.read(ev.target.result, { type:"array", cellDates:false });
        if (!wb.SheetNames.length) { showToast("That file has no sheets", "error"); return; }
        openSheet(wb, wb.SheetNames[0], kind, file.name, 1);
      } catch(err){
        showToast("Could not read that file — is it a valid Excel or CSV file?", "error");
      }
    };
    reader.onerror = () => showToast("Could not open that file", "error");
    reader.readAsArrayBuffer(file);
  }

  function openSheet(wb, sheetName, kind, fileName, headerRow){
    const ws = wb.Sheets[sheetName];
    const grid = XLSX.utils.sheet_to_json(ws, { header:1, defval:"", blankrows:false });
    if (grid.length === 0) { showToast(`Sheet "${sheetName}" is empty`, "error"); return; }

    const hIdx = Math.max(0, Math.min(headerRow - 1, grid.length - 1));
    const headers = (grid[hIdx] || []).map((h,i) => String(h).trim() || `Column ${i+1}`);
    const dataRows = grid.slice(hIdx + 1)
      .filter(r => r.some(c => String(c).trim() !== ""))
      .map(r => {
        const o = {};
        headers.forEach((h, i) => { o[h] = r[i] !== undefined ? r[i] : ""; });
        return o;
      });

    const tpl = kind === "vendors" ? VENDOR_TEMPLATE : kind === "recurring" ? RECURRING_TEMPLATE : kind === "employees" ? EMPLOYEE_TEMPLATE : kind === "expenses" ? EXPENSE_TEMPLATE : kind === "cash" ? CASH_TEMPLATE : kind === "machinery" ? MACHINE_TEMPLATE : kind === "diesel" ? DIESEL_TEMPLATE : kind === "utilities" ? UTILITY_TEMPLATE : kind === "register" ? REGISTER_TEMPLATE : REQ_TEMPLATE;
    const auto = {};
    tpl.forEach(f => {
      const hit = headers.find(h => f.headers.some(cand => normKey(cand) === normKey(h)));
      auto[f.key] = hit || "";
    });

    const fallbackCardId = kind === "cash"
      ? (presetCardId || (cards.length === 1 ? cards[0].id : ""))
      : undefined;
    setMapping({ wb, kind, fileName, sheetNames: wb.SheetNames, sheetName, headerRow, headers, dataRows, map: auto, fallbackCardId });
  }

  /* ---------- step 2: apply the mapping ---------- */
  function mapRow(row, tpl, map){
    const out = {}; const problems = [];
    tpl.forEach(f => {
      const col = map[f.key];
      let val = col ? row[col] : "";
      if (f.date) val = excelToDateStr(val);
      else if (f.number) {
        const n = Number(String(val).replace(/[^0-9.\-]/g,""));
        val = isNaN(n) ? "" : n;
      } else {
        val = String(val ?? "").trim();
        if (f.upper) val = val.toUpperCase();
      }
      if (f.required && (val === "" || val === null)) problems.push(f.headers[0]);
      out[f.key] = val;
    });
    return { out, problems };
  }

  function buildPreview(){
    const { kind, dataRows, map, fileName } = mapping;
    const tpl = kind === "vendors" ? VENDOR_TEMPLATE : kind === "recurring" ? RECURRING_TEMPLATE : kind === "employees" ? EMPLOYEE_TEMPLATE : kind === "expenses" ? EXPENSE_TEMPLATE : kind === "cash" ? CASH_TEMPLATE : kind === "machinery" ? MACHINE_TEMPLATE : kind === "diesel" ? DIESEL_TEMPLATE : kind === "utilities" ? UTILITY_TEMPLATE : kind === "register" ? REGISTER_TEMPLATE : REQ_TEMPLATE;
    const missingRequired = tpl.filter(f => f.required && !map[f.key]);
    if (missingRequired.length) {
      showToast(`Choose a column for ${missingRequired.map(f=>f.headers[0]).join(", ")}`, "error");
      return;
    }
    if (kind === "cash" && cards.length > 1 && !mapping.fallbackCardId) {
      showToast("Choose which card this file is for, above", "error");
      return;
    }
    const toAdd = [], toUpdate = [], errors = [], duplicates = [];
    const seenRefs = new Set();
    const existingKeys = new Set((kind === "requisitions" || kind === "register") ? reqs.map(importDupKey) : []);
    const seenKeys = new Set();
    const expenseByKey = new Map();
    if (kind === "expenses") {
      (expenses||[]).forEach(e => {
        const k = [e.date || e.periodText, String(e.paidBy||"").toLowerCase(), Number(e.amount||0),
                   String(e.description||"").toLowerCase(), String(e.subCategory||"").toLowerCase()].join("|");
        if (!expenseByKey.has(k)) expenseByKey.set(k, e);
      });
    }
    const seenExpense = new Set();
    const usedExpense = new Set();
    const cardNameOf = (id) => ((cards||[]).find(c=>c.id===id)||{}).name || "";
    const cashByKey = new Map();
    if (kind === "cash") {
      (cashTxns||[]).forEach(t => {
        const k = [String(t.seq||""), t.date, cardNameOf(t.cardId).toLowerCase(), t.type,
                   Number(t.amount||0), String(t.description||"").toLowerCase()].join("|");
        if (!cashByKey.has(k)) cashByKey.set(k, t);
      });
    }
    const seenCash = new Set();
    let lastCashDate = "";
    const extraCashRows = [];
    // An ID carried back from an export always wins, so edits correct the right row.
    const byId = (arr, id) => {
      const k = String(id||"").trim();
      return k ? (arr||[]).find(x => x.id === k) : null;
    };
    const machineNameOf = (id) => ((machines||[]).find(m=>m.id===id)||{}).name || "";
    const dieselByKey = new Map();
    if (kind === "diesel") {
      (diesel||[]).forEach(d => {
        const k = [d.date, d.type, d.site, Number(d.litres||0),
                   machineNameOf(d.machineId).toLowerCase()].join("|");
        if (!dieselByKey.has(k)) dieselByKey.set(k, d);
      });
    }
    const seenDiesel = new Set();
    const offset = mapping.headerRow + 1;

    dataRows.forEach((row, i) => {
      const { out, problems } = mapRow(row, tpl, map);
      if (problems.length) { errors.push({ rowNum:i+offset, why:`missing ${problems.join(", ")}` }); return; }

      if (kind === "utilities") {
        let mth = String(out.month||"").trim();
        const iso = mth.match(/^(\d{4})[-\/](\d{1,2})/);
        if (iso) mth = `${iso[1]}-${String(iso[2]).padStart(2,"0")}`;
        else {
          const d = excelToDateStr(out.month);
          if (d) mth = d.slice(0,7);
        }
        out.month = mth;
        if (!/^\d{4}-\d{2}$/.test(out.month)) {
          errors.push({ rowNum:i+offset, why:`could not read the month "${String(out.month)}"` });
          return;
        }
        const utypes = (lists && lists.utilityTypes) ? lists.utilityTypes : DEFAULT_LISTS.utilityTypes;
        if (!out.utilityType) out.utilityType = utypes[0] || "Electricity";
        const hb = String(out.hasBillRaw||"").trim().toLowerCase();
        out.hasBill = ["yes","y","true","1","available","attached","received"].includes(hb) || !!String(out.billNo||"").trim();
        delete out.hasBillRaw;
        const idHit = byId(utilities, out.id);
        if (idHit) { toUpdate.push({ existing:idHit, data:out, rowNum:i+offset }); return; }
        const existing = (utilities||[]).find(x =>
          x.month === out.month && x.site === out.site && x.utilityType === out.utilityType);
        if (existing) toUpdate.push({ existing, data:out, rowNum:i+offset });
        else toAdd.push({ data:out, rowNum:i+offset });
        return;
      }

      if (kind === "machinery") {
        const ow = String(out.ownership||"").toLowerCase();
        out.ownership = (ow.indexOf("rent")>=0 || ow.indexOf("hire")>=0 || ow.indexOf("lease")>=0) ? "On Rent"
          : (ow.indexOf("instal")>=0 || ow.indexOf("emi")>=0 || ow.indexOf("financ")>=0 || ow.indexOf("loan")>=0) ? "On Instalment"
          : "Owned";
        const mt = String(out.meterType||"").toLowerCase();
        out.meterType = (mt.indexOf("km")>=0 || mt.indexOf("kilo")>=0 || mt.indexOf("odo")>=0) ? "Kilometres"
          : (mt.indexOf("none")>=0 || mt === "-") ? "None" : "Hours";
        if (out.rentBasis) {
          const rb = String(out.rentBasis).toLowerCase();
          out.rentBasis = rb.indexOf("day")>=0 ? "Per Day" : rb.indexOf("hour")>=0 ? "Per Hour"
            : rb.indexOf("trip")>=0 ? "Per Trip" : "Per Month";
        }
        const idHit = byId(machines, out.id);
        if (idHit) { toUpdate.push({ existing:idHit, data:out, rowNum:i+offset }); return; }
        const existing = (machines||[]).find(x =>
          (out.regNo && x.regNo && String(x.regNo).trim().toUpperCase() === out.regNo) ||
          String(x.name||"").trim().toLowerCase() === out.name.trim().toLowerCase());
        if (existing) toUpdate.push({ existing, data:out, rowNum:i+offset });
        else toAdd.push({ data:out, rowNum:i+offset });
        return;
      }

      if (kind === "diesel") {
        const dt = String(out.type||"").toLowerCase();
        out.type = (dt.indexOf("issue")>=0 || dt.indexOf("usage")>=0 || dt.indexOf("consum")>=0
                    || dt.indexOf("out")===0 || !!String(out.machineName||"").trim()) ? "Issue" : "Purchase";
        const hb = String(out.hasBillRaw||"").trim().toLowerCase();
        out.hasBill = ["yes","y","true","1","available","attached","received"].includes(hb) || !!String(out.billNo||"").trim();
        delete out.hasBillRaw;
        if (out.type === "Purchase") {
          const lit = Number(out.litres||0), rate = Number(out.rate||0), amt = Number(out.amount||0);
          if (!amt && rate && lit) out.amount = +(lit*rate).toFixed(2);
          if (!rate && amt && lit) out.rate = +(amt/lit).toFixed(2);
        }
        out.__machineName = String(out.machineName||"").trim();
        delete out.machineName;
        const idHitD = byId(diesel, out.id);
        if (idHitD) { toUpdate.push({ existing:idHitD, data:out, rowNum:i+offset }); return; }
        const dk = [out.date, out.type, out.site, Number(out.litres||0), out.__machineName.toLowerCase()].join("|");
        const sameDiesel = dieselByKey.get(dk);
        if (sameDiesel) { toUpdate.push({ existing:sameDiesel, data:out, rowNum:i+offset }); return; }
        if (seenDiesel.has(dk)) { duplicates.push({ data:out, rowNum:i+offset, why:"repeated in this file" }); return; }
        seenDiesel.add(dk);
        toAdd.push({ data:out, rowNum:i+offset });
        return;
      }

      if (kind === "cash") {
        // Debit and credit columns take priority: debit is money out, credit is money in.
        const dr = Number(out.debit || 0), cr = Number(out.credit || 0);
        delete out.debit; delete out.credit;
        const sheetBal = out.sheetBalance;
        delete out.sheetBalance;
        if (out.voucherNo && !out.billNo) { out.billNo = out.voucherNo; }
        const vch = out.voucherNo; delete out.voucherNo;
        const sr = out.srNo; delete out.srNo;
        if (dr > 0 || cr > 0) {
          out.type = cr > 0 ? "Refill" : "Spend";
          out.amount = cr > 0 ? cr : dr;
          if (dr > 0 && cr > 0) {
            // Both columns filled: record the money in and the money out separately,
            // so neither total is understated.
            const inRow = { ...out, type:"Refill", amount:cr, __pairSuffix:"C" };
            out.type = "Spend"; out.amount = dr; out.__pairSuffix = "D";
            extraCashRows.push({ data:inRow, rowNum:i+offset });
          }
        }
        if (!Number(out.amount)) {
          errors.push({ rowNum:i+offset, why:"no amount, debit or credit on this row" });
          return;
        }
        if (vch) out.ref = [out.ref, "Voucher " + vch].filter(Boolean).join(" / ");
        if (sheetBal !== "" && sheetBal !== undefined) out.__sheetBalance = Number(sheetBal);
        if (sr !== "" && sr !== undefined) out.__srNo = Number(sr) || 0;
        out.__row = i + offset;

        // A cash book writes the date once per day, so a blank date belongs to the day above.
        if (!out.date && lastCashDate) { out.date = lastCashDate; out.__dateCarried = true; }
        else if (out.date) lastCashDate = out.date;

        if (!(dr > 0 || cr > 0)) {
          const t = String(out.type||"").toLowerCase();
          out.type = (t.indexOf("refill")>=0 || t.indexOf("withdraw")>=0 || t.indexOf("deposit")>=0
                      || t.indexOf("credit")>=0 || t.indexOf("in")===0) ? "Refill"
                   : (t.indexOf("return")>=0 || t.indexOf("refund")>=0) ? "Return"
                   : "Spend";
        }
        const hb = String(out.hasBillRaw||"").trim().toLowerCase();
        out.hasBill = ["yes","y","true","1","available","attached","received"].includes(hb) || !!String(out.billNo||"").trim();
        delete out.hasBillRaw;
        const cName = String(out.cardName||"").trim();
        delete out.cardName;
        out.__cardName = cName;
        const idHitC = byId(cashTxns, out.id);
        if (idHitC) { toUpdate.push({ existing:idHitC, data:out, rowNum:i+offset }); return; }
        // A cash book genuinely repeats itself - the same tea, the same amount, the
        // same day. So the line number is part of what makes a row unique. Without
        // it, real repeats were being swallowed and the debit total came out short.
        const lineRef = String(out.__srNo || out.__row || (i + offset)) + (out.__pairSuffix || "");
        const ck = [lineRef, out.date, cName.toLowerCase(), out.type, Number(out.amount||0),
                    String(out.description||"").toLowerCase()].join("|");
        const sameCash = cashByKey.get(ck);
        if (sameCash) { toUpdate.push({ existing:sameCash, data:out, rowNum:i+offset }); return; }
        if (seenCash.has(ck)) { duplicates.push({ data:out, rowNum:i+offset, why:"identical line already in this file" }); return; }
        seenCash.add(ck);
        toAdd.push({ data:out, rowNum:i+offset });
        return;
      }

      if (kind === "expenses") {
        // The date column may hold a range ("30.12.25 - 5.1.25") or a month name.
        // Keep the text as written rather than throwing the row away.
        const raw = String(out.dateRaw || "").trim();
        delete out.dateRaw;
        const parsedDate = excelToDateStr(raw);
        out.date = parsedDate || "";
        out.periodText = parsedDate ? "" : raw;

        const etypes = (lists && lists.expenseTypes) ? lists.expenseTypes : DEFAULT_LISTS.expenseTypes;
        if (!out.expenseType || !etypes.includes(out.expenseType)) {
          const t = String(out.expenseType||"").toLowerCase();
          out.expenseType = t.indexOf("travel")>=0 ? "Travel"
            : t.indexOf("office")>=0 ? "Office"
            : (t.indexOf("purchase")>=0 || t.indexOf("site")>=0) ? "Site Purchase"
            : (out.expenseType || etypes[0] || "Site Purchase");
        }
        // Settling on a date means the money went back to whoever spent it,
        // unless the sheet names someone else.
        if (out.paidDate && !String(out.settledTo||"").trim()) out.settledTo = out.paidBy || "";

        // An ID from an export always wins, so a correction lands on the right row.
        const idHitE = (expenses||[]).find(x => out.id && x.id === String(out.id).trim());
        if (idHitE) { usedExpense.add(idHitE.id); toUpdate.push({ existing:idHitE, data:out, rowNum:i+offset }); return; }

        const ek = [out.date || out.periodText, String(out.paidBy||"").toLowerCase(), Number(out.amount||0),
                    String(out.description||"").toLowerCase(), String(out.subCategory||"").toLowerCase()].join("|");
        const sameRow = expenseByKey.get(ek);
        if (sameRow && !usedExpense.has(sameRow.id)) {
          usedExpense.add(sameRow.id);
          toUpdate.push({ existing:sameRow, data:out, rowNum:i+offset });
          return;
        }

        // The row has no ID and the name has been changed, so the key above misses.
        // Fall back to the date, amount and description, which rarely change,
        // and take each existing row only once so nothing is matched twice.
        const soft = [out.date || out.periodText, Number(out.amount||0),
                      String(out.description||"").trim().toLowerCase()].join("|");
        const softHit = (expenses||[]).find(e => !usedExpense.has(e.id) &&
          [e.date || e.periodText || "", Number(e.amount||0),
           String(e.description||"").trim().toLowerCase()].join("|") === soft);
        if (softHit) {
          usedExpense.add(softHit.id);
          toUpdate.push({ existing:softHit, data:out, rowNum:i+offset });
          return;
        }

        if (seenExpense.has(ek)) { duplicates.push({ data:out, rowNum:i+offset, why:"repeated in this file" }); return; }
        seenExpense.add(ek);
        toAdd.push({ data:out, rowNum:i+offset });
        return;
      }

      if (kind === "employees") {
        const siteList = out.sitesRaw
          ? String(out.sitesRaw).split(/[,;|/]/).map(x=>x.trim()).filter(Boolean) : [];
        delete out.sitesRaw;
        if (out.empStatus) {
          const st = String(out.empStatus).toLowerCase();
          out.empStatus = st.indexOf("leave")>=0 ? "On Leave"
            : (st.indexOf("left")>=0 || st.indexOf("resign")>=0 || st.indexOf("exit")>=0 || st.indexOf("inactive")>=0) ? "Left"
            : "Active";
        }
        if (out.rollType) {
          const rt = String(out.rollType).toLowerCase().replace(/[^a-z]/g,"");
          out.rollType = (rt.indexOf("off")>=0 || rt.indexOf("contract")>=0 || rt.indexOf("agency")>=0 || rt.indexOf("casual")>=0)
            ? "Off Roll" : "On Roll";
        }
        const idHit = byId(vendors, out.id);
        if (idHit) { toUpdate.push({ existing:idHit, data:out, rowNum:i+offset }); return; }
        const existing = vendors.find(v =>
          (out.empCode && v.empCode && String(v.empCode).trim().toLowerCase() === String(out.empCode).trim().toLowerCase()) ||
          String(v.name||"").trim().toLowerCase() === out.name.trim().toLowerCase());
        if (existing) {
          if (siteList.length) out.sites = siteList;
          out.ledgerType = "Employee";
          toUpdate.push({ existing, data:out, rowNum:i+offset });
        } else {
          toAdd.push({ data:{ ...emptyVendor, ...out, ledgerType:"Employee",
            empStatus: out.empStatus || "Active", rollType: out.rollType || "On Roll",
            sites: siteList, id: uid() }, rowNum:i+offset });
        }
        return;
      }

      if (kind === "recurring") {
        const types = (lists && lists.types) ? lists.types : DEFAULT_LISTS.types;
        if (!out.type) out.type = types[0] || "House Rent";
        if (!FREQUENCIES.includes(out.frequency)) {
          const f = String(out.frequency||"").toLowerCase();
          out.frequency = f.indexOf("quarter")>=0 ? "Quarterly"
            : f.indexOf("half")>=0 ? "Half-Yearly"
            : f.indexOf("year")>=0 || f.indexOf("annual")>=0 ? "Yearly"
            : f.indexOf("one")>=0 ? "One-time"
            : "Monthly";
        }
        if (!COST_GROUPS.includes(out.costGroup)) out.costGroup = inferGroup(out);
        const idHit = byId(recurring, out.id);
        if (idHit) { toUpdate.push({ existing:idHit, data:out, rowNum:i+offset }); return; }
        const existing = recurring.find(r =>
          String(r.name||"").trim().toLowerCase() === out.name.trim().toLowerCase());
        if (existing) toUpdate.push({ existing, data:out, rowNum:i+offset });
        else toAdd.push({ data:out, rowNum:i+offset });
        return;
      }

      if (kind === "vendors") {
        const siteList = out.sitesRaw
          ? String(out.sitesRaw).split(/[,;|/]/).map(x=>x.trim()).filter(Boolean)
          : [];
        delete out.sitesRaw;
        const existing = vendors.find(v =>
          (out.gstin && v.gstin && v.gstin.toUpperCase() === out.gstin) ||
          String(v.name||"").trim().toLowerCase() === out.name.trim().toLowerCase()
        );
        if (existing) {
          // only overwrite sites/type when the sheet actually supplies them
          if (siteList.length) out.sites = siteList;
          if (!out.ledgerType) delete out.ledgerType;
          toUpdate.push({ existing, data:out, rowNum:i+offset });
        } else {
          toAdd.push({ data:{ ...emptyVendor, ...out,
            ledgerType: out.ledgerType || "Vendor",
            sites: siteList, id: uid() }, rowNum:i+offset });
        }
      } else {
        // The Payment Status column holds either the date paid, or the word Pending.
        // A blank entry date is filled from the payment date, since a requisition
        // is cleared in the month it is raised.
        settleRequisitionDates(out);
        const existing = out.refNo ? reqs.find(r => r.refNo && r.refNo.toLowerCase() === out.refNo.toLowerCase()) : null;
        if (existing) { toUpdate.push({ existing, data:out, rowNum:i+offset }); return; }
        if (out.refNo && seenRefs.has(out.refNo.toLowerCase())) {
          errors.push({ rowNum:i+offset, why:`duplicate Ref No. ${out.refNo} inside this file` });
          return;
        }
        if (out.refNo) seenRefs.add(out.refNo.toLowerCase());
        const k = importDupKey(out);
        if (existingKeys.has(k)) { duplicates.push({ data:out, rowNum:i+offset, why:"already in the app" }); return; }
        if (seenKeys.has(k)) { duplicates.push({ data:out, rowNum:i+offset, why:"repeated in this file" }); return; }
        seenKeys.add(k);
        toAdd.push({ data:out, rowNum:i+offset });
      }
    });
    // the second half of any row that carried both a debit and a credit
    if (extraCashRows.length) toAdd.push(...extraCashRows);

    const paidCount = kind === "requisitions"
      ? [...toAdd, ...toUpdate].filter(x => x.data.paymentStatus === "Paid" && x.data.paymentDate).length
      : 0;

    // For a cash book, show what the totals will come to before anything is saved,
    // so they can be checked against the sheet rather than discovered afterwards.
    let cashTotals = null;
    if (kind === "cash") {
      const rows = [...toAdd, ...toUpdate].map(x => x.data);
      const credit = rows.filter(r => r.type === "Refill").reduce((a,r)=>a+Number(r.amount||0), 0);
      const debit  = rows.filter(r => r.type !== "Refill").reduce((a,r)=>a+Number(r.amount||0), 0);
      cashTotals = { credit, debit, net: credit - debit,
                     creditRows: rows.filter(r => r.type === "Refill").length,
                     debitRows: rows.filter(r => r.type !== "Refill").length };
    }
    setSkip(new Set());
    setForceAdd(new Set());
    setPreview({ kind, fileName, toAdd, toUpdate, errors, duplicates, paidCount, cashTotals });
  }

  /* ---------- step 3: write ---------- */
  function apply(){
    if (!preview) return;
    // Rows the person unticked on the review screen are left out entirely.
    const kept = {
      toAdd: [
        ...(preview.toAdd||[]).filter((_, n) => !skip.has("a" + n)),
        ...(preview.duplicates||[]).filter((_, n) => forceAdd.has("d" + n)),
      ],
      toUpdate: (preview.toUpdate||[]).filter((_, n) => !skip.has("u" + n)),
    };
    if (!kept.toAdd.length && !kept.toUpdate.length) {
      showToast("Nothing is ticked", "error");
      return;
    }
    if (preview.kind === "utilities") {
      let next = [...(utilities||[])];
      kept.toUpdate.forEach(u => {
        next = next.map(x => x.id === u.existing.id
          ? { ...x, ...Object.fromEntries(Object.entries(u.data).filter(([,val]) => val !== "" && val !== undefined)) }
          : x);
      });
      const added = kept.toAdd.map((a, idx) => ({
        ...emptyUtility, ...a.data, createdAt: Date.now() + idx, id: uid(),
      }));
      setUtilities([...next, ...added]);
      const L = lists || DEFAULT_LISTS;
      const nl = { ...L, sites:[...(L.sites||[])], utilityTypes:[...(L.utilityTypes||DEFAULT_LISTS.utilityTypes)] };
      added.forEach(d => {
        if (d.site && d.site !== "Head Office" && !nl.sites.includes(d.site)) nl.sites.push(d.site);
        if (d.utilityType && !nl.utilityTypes.includes(d.utilityType)) nl.utilityTypes.push(d.utilityType);
      });
      nl.sites.sort(); setLists(nl);
      const chg = added.reduce((s,x)=>s+Number(x.cardCharge||0),0);
      showToast(`${added.length} added, ${kept.toUpdate.length} updated${chg ? ` · ₹${fmtINR(chg)} card charges` : ""}`);
      setPreview(null); setMapping(null);
      return;
    }

    if (preview.kind === "machinery") {
      let next = [...(machines||[])];
      kept.toUpdate.forEach(u => {
        next = next.map(x => x.id === u.existing.id
          ? { ...x, ...Object.fromEntries(Object.entries(u.data).filter(([k,val]) => val !== "" && val !== undefined && k !== "ownerName")) }
          : x);
      });
      const newOwners = [];
      const findOwner = (nm) => {
        const t = String(nm||"").trim().toLowerCase();
        if (!t) return null;
        return vendors.find(v => String(v.name||"").trim().toLowerCase() === t)
            || newOwners.find(v => String(v.name||"").trim().toLowerCase() === t) || null;
      };
      const added = kept.toAdd.map(a => {
        const d = { ...a.data };
        const ownerName = String(d.ownerName||"").trim();
        delete d.ownerName;
        let owner = null;
        if (ownerName && d.ownership === "On Rent") {
          owner = findOwner(ownerName);
          if (!owner) {
            owner = { ...emptyVendor, id: uid(), name: ownerName, ledgerType:"Owner", category:"Machinery Rent" };
            newOwners.push(owner);
          }
        }
        return { ...emptyMachine, ...d, id: uid(), ownerLedgerId: owner ? owner.id : "", active:true };
      });
      setMachines([...next, ...added]);
      if (newOwners.length) setVendors([...vendors, ...newOwners]);
      showToast(`${added.length} added, ${kept.toUpdate.length} updated${newOwners.length ? ` · ${newOwners.length} Owner ledger(s)` : ""}`);
      setPreview(null); setMapping(null);
      return;
    }

    if (preview.kind === "diesel") {
      const newMachines = [];
      const findMachine = (nm) => {
        const t = String(nm||"").trim().toLowerCase();
        if (!t) return null;
        return (machines||[]).find(m => String(m.name||"").trim().toLowerCase() === t
                                     || String(m.regNo||"").trim().toLowerCase() === t)
            || newMachines.find(m => String(m.name||"").trim().toLowerCase() === t) || null;
      };
      let baseDiesel = [...(diesel||[])];
      kept.toUpdate.forEach(u => {
        baseDiesel = baseDiesel.map(x => x.id === u.existing.id
          ? { ...x, ...Object.fromEntries(Object.entries(u.data).filter(([k,v]) => k !== "id" && k !== "__machineName" && v !== "" && v !== undefined)) }
          : x);
      });
      const added = kept.toAdd.map((a, idx) => {
        const d = { ...a.data };
        const mName = d.__machineName || "";
        delete d.__machineName;
        let machine = null;
        if (d.type === "Issue" && mName) {
          machine = findMachine(mName);
          if (!machine) {
            machine = { ...emptyMachine, id: uid(), name: mName, site: d.site || "", ownership:"Owned", active:true };
            newMachines.push(machine);
          }
        }
        return { ...emptyDiesel, ...d, id: uid(), machineId: machine ? machine.id : "", createdAt: Date.now() + idx };
      });
      setDiesel([...baseDiesel, ...added]);
      if (newMachines.length) setMachines([...(machines||[]), ...newMachines]);
      const L = lists || DEFAULT_LISTS;
      const nl = { ...L, sites:[...(L.sites||[])] };
      added.forEach(d => { if (d.site && !nl.sites.includes(d.site)) nl.sites.push(d.site); });
      nl.sites.sort(); setLists(nl);
      const nb = added.filter(x => x.type === "Purchase" && !x.hasBill).length;
      showToast(`${added.length} added${newMachines.length ? ` · ${newMachines.length} machine(s) created` : ""}${nb ? ` · ${nb} without bill` : ""}`);
      setPreview(null); setMapping(null);
      return;
    }

    if (preview.kind === "cash") {
      // any card named in the sheet that does not exist yet is created
      const newCards = [];
      const findCard = (nm) => {
        const t = String(nm||"").trim().toLowerCase();
        if (!t) return null;
        return (cards||[]).find(c => String(c.name||"").trim().toLowerCase() === t)
            || newCards.find(c => String(c.name||"").trim().toLowerCase() === t) || null;
      };
      let baseCash = [...(cashTxns||[])];
      const balanceChecks = [];
      const seqBase = (cashTxns||[]).reduce((m,t)=>Math.max(m, Number(t.seq||0)), 0);
      kept.toUpdate.forEach(u => {
        baseCash = baseCash.map(x => x.id === u.existing.id
          ? { ...x, ...Object.fromEntries(Object.entries(u.data).filter(([k,v]) => k !== "id" && k !== "__cardName" && v !== "" && v !== undefined)) }
          : x);
      });
      const added = [];
      kept.toAdd.forEach((a, idx) => {
        const d = { ...a.data };
        const cName = d.__cardName || "";
        delete d.__cardName;
        let card = findCard(cName);
        if (!cName && !card) {
          // No card named on this row. Use whichever card was chosen on the mapping
          // screen for "if a row doesn't name a card" — set explicitly by the user
          // whenever more than one card exists, so this never silently guesses wrong.
          const chosen = mapping.fallbackCardId && (
            (cards||[]).find(c => c.id === mapping.fallbackCardId) ||
            newCards.find(c => c.id === mapping.fallbackCardId)
          );
          const existing = (cards||[]);
          card = chosen || (existing.length === 1 ? existing[0]
               : findCard("Site Cash")
               || (() => { const c = { ...emptyCard, id: uid(), name:"Site Cash", site: d.site || "" };
                           newCards.push(c); return c; })());
        } else if (cName && !card) {
          card = { ...emptyCard, id: uid(), name: cName, site: d.site || "" };
          newCards.push(card);
        }
        const sheetBal = d.__sheetBalance;
        const lineNo = Number(d.__srNo) || Number(d.__row) || (idx + 1);
        delete d.__sheetBalance; delete d.__srNo; delete d.__dateCarried; delete d.__row;
        const rec = { ...emptyCashTxn, ...d, id: uid(), cardId: card ? card.id : "",
                      seq: seqBase + lineNo, createdAt: Date.now() + idx };
        added.push(rec);
        if (sheetBal !== undefined) balanceChecks.push({ rec, sheetBal });
      });
      setCashTxns([...baseCash, ...added]);
      if (newCards.length) setCards([...(cards||[]), ...newCards]);

      const L = lists || DEFAULT_LISTS;
      const nl = { ...L, sites:[...(L.sites||[])], categories:[...(L.categories||[])], subCategories:{...(L.subCategories||{})} };
      added.forEach(d => {
        if (d.site && !nl.sites.includes(d.site)) nl.sites.push(d.site);
        if (d.category && !nl.categories.includes(d.category)) nl.categories.push(d.category);
        if (d.category && d.subCategory) {
          const cur = nl.subCategories[d.category] || [];
          if (!cur.includes(d.subCategory)) nl.subCategories[d.category] = [...cur, d.subCategory].sort();
        }
      });
      nl.sites.sort(); nl.categories.sort();
      setLists(nl);
      const noBill = added.filter(x => x.type === "Spend" && !x.hasBill).length;

      // If the sheet carried its own running balance, check ours ends up the same.
      let balNote = "";
      if (balanceChecks.length) {
        const last = balanceChecks[balanceChecks.length - 1];
        const cardOfLast = (newCards.concat(cards||[])).find(c => c.id === last.rec.cardId);
        const ours = cardOfLast ? cardBalance(cardOfLast, [...baseCash, ...added]) : null;
        if (ours !== null && Math.abs(ours - last.sheetBal) >= 1) {
          balNote = ` · balance differs by ₹${fmtINR(Math.abs(ours - last.sheetBal))}`;
          setTimeout(() => alert(
            `The closing balance does not match your sheet.\n\n` +
            `Your sheet ends at ₹${fmtINR(last.sheetBal)}\n` +
            `This app works out ₹${fmtINR(ours)}\n` +
            `Difference ₹${fmtINR(Math.abs(ours - last.sheetBal))}\n\n` +
            `Usually this means the card's opening balance is not set, or a row was left out. ` +
            `Open Cash & Card, edit the card and set the opening cash in hand.`
          ), 400);
        } else if (ours !== null) {
          balNote = " · balance matches your sheet";
        }
      }
      showToast(`${added.length} added${newCards.length ? ` · ${newCards.length} card(s) created` : ""}${noBill ? ` · ${noBill} without bill` : ""}${balNote}`);
      setPreview(null); setMapping(null);
      return;
    }

    if (preview.kind === "expenses") {
      let base = [...(expenses||[])];
      kept.toUpdate.forEach(u => {
        base = base.map(x => x.id === u.existing.id
          ? { ...x, ...Object.fromEntries(Object.entries(u.data).filter(([k,v]) => k !== "id" && v !== "" && v !== undefined)) }
          : x);
      });
      const added = kept.toAdd.map((a, idx) => ({
        ...emptyExpense, ...a.data, id: uid(), claimId:"", claimRef:"", createdAt: Date.now() + idx,
      }));
      setExpenses([...base, ...added]);
      const L = lists || DEFAULT_LISTS;
      const nl = { ...L, sites:[...(L.sites||[])], categories:[...(L.categories||[])],
                   expenseTypes:[...(L.expenseTypes||DEFAULT_LISTS.expenseTypes)], people:[...(L.people||[])] };
      added.forEach(d => {
        if (d.site && !nl.sites.includes(d.site)) nl.sites.push(d.site);
        if (d.category && !nl.categories.includes(d.category)) nl.categories.push(d.category);
        if (d.expenseType && !nl.expenseTypes.includes(d.expenseType)) nl.expenseTypes.push(d.expenseType);
        if (d.paidBy && !nl.people.includes(d.paidBy)) nl.people.push(d.paidBy);
      });
      nl.sites.sort(); nl.categories.sort(); nl.people.sort();
      setLists(nl);
      const settledCount = [...added, ...kept.toUpdate.map(u=>u.data)].filter(x => x.paidDate).length;
      showToast(`${added.length} added, ${kept.toUpdate.length} updated${settledCount ? ` · ${settledCount} settled` : ""}`);
      setPreview(null); setMapping(null);
      return;
    }

    if (preview.kind === "recurring") {
      let next = [...recurring];
      kept.toUpdate.forEach(u => {
        next = next.map(r => r.id === u.existing.id
          ? { ...r, ...Object.fromEntries(Object.entries(u.data).filter(([,v]) => v !== "" && v !== undefined)) }
          : r);
      });
      // Any payee not already a ledger is created as an Owner, so it shows up
      // under Owners everywhere without being typed again.
      const newOwners = [];
      const findLedger = (nm) => {
        const t = String(nm||"").trim().toLowerCase();
        if (!t) return null;
        return vendors.find(v => String(v.name||"").trim().toLowerCase() === t)
            || newOwners.find(v => String(v.name||"").trim().toLowerCase() === t)
            || null;
      };
      // Landlords become Owners. Instalments are paid to banks and finance
      // companies, so those become Financiers and stay out of the Owners list.
      const makeLedger = (payTo, row) => {
        let vend = findLedger(payTo);
        if (vend) return vend;
        const group = costGroupOf(row);
        vend = { ...emptyVendor, id: uid(), name: payTo,
                 ledgerType: group === "Instalment" ? "Financier" : "Owner",
                 accNo: row.accNo || "", ifsc: row.ifsc || "", category: row.type || "" };
        newOwners.push(vend);
        return vend;
      };

      const added = [];
      kept.toAdd.forEach(a => {
        const d = { ...a.data };
        const payTo = String(d.payTo || "").trim();
        delete d.payTo;
        const vend = payTo ? makeLedger(payTo, d) : null;
        added.push({
          ...emptyRecurring, ...d,
          id: uid(),
          vendorId: vend ? vend.id : "",
          ownerName: vend ? vend.name : payTo,
          accNo: d.accNo || (vend ? vend.accNo : ""),
          ifsc: d.ifsc || (vend ? vend.ifsc : ""),
          active: true,
        });
      });

      // rows that merely updated an existing entry still need their payee on file
      next = next.map(r => {
        const upd = kept.toUpdate.find(u => u.existing.id === r.id);
        if (!upd) return r;
        const payTo = String(upd.data.payTo || r.ownerName || "").trim();
        if (!payTo) return r;
        const vend = makeLedger(payTo, { ...r, ...upd.data });
        return { ...r, vendorId: r.vendorId || vend.id, ownerName: payTo };
      });

      setRecurring([...next, ...added]);
      if (newOwners.length) setVendors([...vendors, ...newOwners]);

      // grow the managed lists so the dropdowns stay in step
      const L = lists || DEFAULT_LISTS;
      const nl = { ...L, sites:[...(L.sites||[])], categories:[...(L.categories||[])],
                   subCategories:{...(L.subCategories||{})}, types:[...(L.types||DEFAULT_LISTS.types)] };
      [...added, ...kept.toUpdate.map(u=>u.data)].forEach(d => {
        if (d.site && !nl.sites.includes(d.site)) nl.sites.push(d.site);
        if (d.category && !nl.categories.includes(d.category)) nl.categories.push(d.category);
        if (d.type && !nl.types.includes(d.type)) nl.types.push(d.type);
        if (d.category && d.subCategory) {
          const cur = nl.subCategories[d.category] || [];
          if (!cur.includes(d.subCategory)) nl.subCategories[d.category] = [...cur, d.subCategory].sort();
        }
      });
      nl.sites.sort(); nl.categories.sort();
      setLists(nl);

      showToast(`${added.length} added, ${kept.toUpdate.length} updated${newOwners.length ? ` · ${newOwners.length} ledger(s) created` : ""}`);
      setPreview(null);
      setMapping(null);
      return;
    }

    if (preview.kind === "vendors" || preview.kind === "employees") {
      let next = [...vendors];
      kept.toUpdate.forEach(u => {
        next = next.map(v => v.id === u.existing.id
          ? { ...v, ...Object.fromEntries(Object.entries(u.data).filter(([,val]) => val !== "" && val !== undefined)) }
          : v);
      });
      next = [...next, ...kept.toAdd.map(a => a.data)];
      setVendors(next);
      showToast(`${kept.toAdd.length} added, ${kept.toUpdate.length} updated`);
    } else {
      let next = [...reqs];
      kept.toUpdate.forEach(u => {
        next = next.map(r => r.id === u.existing.id
          ? { ...r, ...Object.fromEntries(Object.entries(u.data).filter(([,val]) => val !== "")) }
          : r);
      });
      const added = [];
      const usedRefs = new Set(next.map(r => String(r.refNo||"").trim().toLowerCase()).filter(Boolean));
      kept.toAdd.forEach((a, idx) => {
        const d = a.data;
        const vend = vendors.find(v => String(v.name||"").trim().toLowerCase() === String(d.name).trim().toLowerCase());
        added.push({
          ...emptyReq, ...d,
          id: uid(),
          refNo: (d.refNo && !usedRefs.has(String(d.refNo).trim().toLowerCase()))
            ? d.refNo
            : nextRefNo([...next, ...added], d.date),
          vendorId: vend ? vend.id : "",
          accNo: d.accNo || (vend ? vend.accNo : ""),
          ifsc: d.ifsc || (vend ? vend.ifsc : ""),
          exported: false,
          createdAt: Date.now() + idx,
        });
        usedRefs.add(String(added[added.length-1].refNo).trim().toLowerCase());
      });
      next = [...next, ...added];
      setReqs(next);

      // salary rows mean the party is an employee
      const touched = [...added, ...kept.toUpdate.map(u => ({ ...u.existing, ...u.data }))];
      const promoted = promoteSalaryLedgers(vendors, touched);
      if (promoted) setVendors(promoted.vendors);

      const L = lists || DEFAULT_LISTS;
      const nl = { ...L, sites:[...L.sites], categories:[...L.categories], subCategories:{...L.subCategories} };
      [...kept.toAdd, ...kept.toUpdate].forEach(({data}) => {
        if (data.site && !nl.sites.includes(data.site)) nl.sites.push(data.site);
        if (data.category && !nl.categories.includes(data.category)) nl.categories.push(data.category);
        if (data.category && data.subCategory) {
          const cur = nl.subCategories[data.category] || [];
          if (!cur.includes(data.subCategory)) nl.subCategories[data.category] = [...cur, data.subCategory].sort();
        }
      });
      nl.sites.sort(); nl.categories.sort();
      setLists(nl);
      showToast(`${kept.toAdd.length} added, ${kept.toUpdate.length} updated${promoted ? ` · ${promoted.names.length} ledger(s) set as Employee` : ""}`);
    }
    setPreview(null);
    setMapping(null);
  }

  /* ================= RENDER: confirm step ================= */
  if (preview) {
    const label = preview.kind === "vendors" ? "ledger" : preview.kind === "recurring" ? "rental/installment" : preview.kind === "employees" ? "employee" : preview.kind === "expenses" ? "expense" : preview.kind === "cash" ? "cash entry" : preview.kind === "machinery" ? "machine" : preview.kind === "diesel" ? "diesel entry" : preview.kind === "utilities" ? "utility bill" : preview.kind === "register" ? "payment" : "requisition";
    // Rows with no card named in the sheet fall back to whichever card was chosen
    // on the mapping screen. Show that card's name here too, so the preview never
    // looks blank for rows that will still land on a real card.
    const fallbackCardName = preview.kind === "cash" && mapping && mapping.fallbackCardId
      ? ((cards||[]).find(c => c.id === mapping.fallbackCardId) || {}).name || ""
      : "";
    const totalChanges = preview.toAdd.filter((_,n)=>!skip.has("a"+n)).length
                       + preview.toUpdate.filter((_,n)=>!skip.has("u"+n)).length
                       + (preview.duplicates||[]).filter((_,n)=>forceAdd.has("d"+n)).length;
    const skippedByHand = skip.size;
    return (
      <div>
        <button onClick={()=>setPreview(null)}
          style={{ display:"flex", alignItems:"center", gap:6, marginBottom:16, fontSize:14, fontWeight:600, color:INK, background:"none", border:"none", cursor:"pointer" }}>
          <Icon name="close" size={16} /> Back to column matching
        </button>

        <div style={{ background:SURFACE, borderRadius:16, padding:20, marginBottom:16, border:`1px solid ${SAND}` }}>
          <SectionLabel>Check before importing</SectionLabel>
          <div style={{ fontSize:13, color:MUTED, marginBottom:12 }}>{preview.fileName}</div>
          <ReviewRow label={`New ${label}s to add`} value={preview.toAdd.length} />
          <ReviewRow label="Existing records to update" value={preview.toUpdate.length} />
          <ReviewRow label="Rows skipped" value={preview.errors.length} />
          {(preview.duplicates||[]).length > 0 && (
            <ReviewRow label="Skipped as duplicates" value={preview.duplicates.length} />
          )}
          {preview.cashTotals && (
            <div style={{ marginTop:12, paddingTop:12, borderTop:`1px solid ${SAND}` }}>
              <div style={{ fontSize:11.5, fontWeight:700, color:AMBER, textTransform:"uppercase",

                Check these against your sheet
              </div>
              <div style={{ display:"flex", justifyContent:"space-between", fontSize:13.5, padding:"3px 0" }}>
                <span style={{ color:MUTED }}>Total credit ({preview.cashTotals.creditRows} rows)</span>
                <span className="num" style={{ fontWeight:700, color:GREEN }}>{fmtINR(preview.cashTotals.credit)}</span>
              </div>
              <div style={{ display:"flex", justifyContent:"space-between", fontSize:13.5, padding:"3px 0" }}>
                <span style={{ color:MUTED }}>Total debit ({preview.cashTotals.debitRows} rows)</span>
                <span className="num" style={{ fontWeight:700, color:INK }}>{fmtINR(preview.cashTotals.debit)}</span>
              </div>
              <div style={{ display:"flex", justifyContent:"space-between", fontSize:15,
                paddingTop:8, marginTop:4, borderTop:`2px solid ${INK}` }}>
                <span style={{ fontWeight:700, color:INK }}>Cash in hand</span>
                <span className="num" style={{ fontWeight:800, color:INK }}>{fmtINR(preview.cashTotals.net)}</span>
              </div>
              <div style={{ fontSize:12, color:MUTED, marginTop:8, lineHeight:1.55 }}>
                If these do not match your sheet, stop and check the skipped rows below before importing.
              </div>
            </div>
          )}
          {preview.kind === "requisitions" && preview.paidCount > 0 && (
            <ReviewRow label="Already paid → Payment Register" value={preview.paidCount} />
          )}
        </div>

        {(preview.duplicates||[]).length > 0 && (() => {
          const back = preview.duplicates.filter((_,n)=>forceAdd.has("d"+n)).length;
          return (
          <div style={{ background:SURFACE, borderRadius:16, padding:16, marginBottom:16, border:`1.5px solid ${AMBER}` }}>
            <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", gap:10, marginBottom:6 }}>
              <div style={{ fontWeight:700, color:AMBER, fontSize:14 }}>
                Skipped as duplicates ({preview.duplicates.length}{back ? ` · ${back} brought back` : ""})
              </div>
              <button onClick={()=>setForceAdd(prev => {
                  const n = new Set(prev);
                  const allOn = preview.duplicates.every((_,x)=>n.has("d"+x));
                  if (allOn) preview.duplicates.forEach((_,x)=>n.delete("d"+x));
                  else preview.duplicates.forEach((_,x)=>n.add("d"+x));
                  return n;
                })}
                style={{ fontSize:12.5, fontWeight:700, color:AMBER, background:"none", border:"none", cursor:"pointer", padding:0 }}>
                {preview.duplicates.every((_,x)=>forceAdd.has("d"+x)) ? "Skip all" : "Import all"}
              </button>
            </div>
            <div style={{ fontSize:12, color:MUTED, marginBottom:10, lineHeight:1.55 }}>
              These look like something already recorded, so they are left out. Two real payments can
              still look alike - a second load, a second week's labour. Tick any that are genuine and
              they will be brought in.
            </div>
            {preview.duplicates.map((d,i) => {
              const on = forceAdd.has("d"+i);
              return (
                <div key={i} onClick={()=>setForceAdd(prev => {
                    const n = new Set(prev); n.has("d"+i) ? n.delete("d"+i) : n.add("d"+i); return n;
                  })}
                  style={{ display:"flex", alignItems:"flex-start", gap:10, padding:"8px 0", cursor:"pointer",
                    borderTop: i ? `1px solid ${SAND}` : "none", fontSize:13, color:INK,
                    opacity: on ? 1 : 0.55 }}>
                  <div style={{ width:19, height:19, borderRadius:5, flexShrink:0, marginTop:1,
                    display:"flex", alignItems:"center", justifyContent:"center",
                    background: on ? GREEN : SURFACE,
                    border:`2px solid ${on ? GREEN : "#C7D0DE"}` }}>
                    {on && <Icon name="check" size={11} color="#fff" />}
                  </div>
                  <div style={{ flex:1, minWidth:0 }}>
                    <div>
                      {d.rowNum ? `Row ${d.rowNum}: ` : ""}
                      <strong>{d.data.name || d.data.description || d.data.vendorName || "—"}</strong>
                      {d.data.amount ? ` · ₹${fmtINR(d.data.amount)}` : ""}
                      {d.data.date ? ` · ${fmtDate(d.data.date)}` : ""}
                    </div>
                    <div style={{ fontSize:11.5, color:MUTED, marginTop:2 }}>
                      {d.why}{on ? " · will be imported anyway" : ""}
                    </div>
                  </div>
                </div>
              );
            })}
          </div>
          ); })()}

        {preview.kind === "requisitions" && preview.paidCount > 0 && (
          <div style={{ background:"#E6F7F2", border:`1px solid ${GREEN}`, borderRadius:16, padding:16, marginBottom:16, fontSize:13, color:INK, lineHeight:1.6 }}>
            <strong>{preview.paidCount} row(s) read as already paid.</strong> Where your Payment Status column
            held a date, that date is used as the payment date and the entry goes straight into the
            Payment Register instead of sitting in Requisitions.
          </div>
        )}

        {totalChanges === 0 && (
          <div style={{ background:"#FDECEE", border:`1.5px solid ${RED}`, borderRadius:16, padding:16, marginBottom:16, fontSize:13, color:INK, lineHeight:1.6 }}>
            Nothing can be imported from this file yet. Go back and check the column matching —
            usually the Name or Amount column is pointing at the wrong column, or the header row number is wrong.
          </div>
        )}

        {preview.toAdd.length > 0 && (() => {
          const keptCount = preview.toAdd.filter((_,n)=>!skip.has("a"+n)).length;
          const allOn = keptCount === preview.toAdd.length;
          return (
          <div style={{ background:SURFACE, borderRadius:16, padding:16, marginBottom:16, border:`1px solid ${SAND}` }}>
            <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", gap:10, marginBottom:4 }}>
              <div style={{ fontWeight:700, color:GREEN, fontSize:14 }}>
                Will be added ({keptCount}{keptCount !== preview.toAdd.length ? ` of ${preview.toAdd.length}` : ""})
              </div>
              <button onClick={()=>setSkip(prev => {
                  const n = new Set(prev);
                  if (allOn) preview.toAdd.forEach((_,x)=>n.add("a"+x));
                  else preview.toAdd.forEach((_,x)=>n.delete("a"+x));
                  return n;
                })}
                style={{ fontSize:12.5, fontWeight:700, color:AMBER, background:"none", border:"none", cursor:"pointer", padding:0 }}>
                {allOn ? "Untick all" : "Tick all"}
              </button>
            </div>
            <div style={{ fontSize:12, color:MUTED, marginBottom:10, lineHeight:1.5 }}>
              Untick anything you do not want brought in.
            </div>
            {preview.toAdd.map((a,i) => (
              <div key={i} onClick={()=>setSkip(prev => {
                  const n = new Set(prev); n.has("a"+i) ? n.delete("a"+i) : n.add("a"+i); return n;
                })}
                style={{ display:"flex", alignItems:"flex-start", gap:10, padding:"8px 0", cursor:"pointer",
                  borderTop: i? `1px solid ${SAND}`:"none", fontSize:13, color:INK,
                  opacity: skip.has("a"+i) ? 0.4 : 1 }}>
                <div style={{ width:19, height:19, borderRadius:5, flexShrink:0, marginTop:1,
                  display:"flex", alignItems:"center", justifyContent:"center",
                  background: skip.has("a"+i) ? SURFACE : AMBER,
                  border:`2px solid ${skip.has("a"+i) ? "#C7D0DE" : AMBER}` }}>
                  {!skip.has("a"+i) && <Icon name="check" size={11} color="#fff" />}
                </div>
                <div style={{ flex:1, minWidth:0, textDecoration: skip.has("a"+i) ? "line-through" : "none" }}>
                {preview.kind==="utilities"
                  ? <span><strong>{a.data.utilityType}</strong> · {a.data.site} · {monthLabel(a.data.month)} · ₹{fmtINR(a.data.billAmount)}
                      {Number(a.data.cardCharge||0) ? <span style={{color:AMBER}}> +₹{fmtINR(a.data.cardCharge)} charge</span> : null}
                    </span>
                  : preview.kind==="machinery"
                  ? <span><strong>{a.data.name}</strong> · {a.data.ownership}{a.data.regNo?` · ${a.data.regNo}`:""}{a.data.site?` · ${a.data.site}`:""}</span>
                  : preview.kind==="diesel"
                  ? <span><strong>{a.data.type}</strong> · {a.data.litres} L · {fmtDate(a.data.date)} · {a.data.site}
                      {a.data.__machineName ? ` · ${a.data.__machineName}` : ""}
                      {a.data.type==="Purchase" && a.data.amount ? ` · ₹${fmtINR(a.data.amount)}` : ""}
                    </span>
                  : preview.kind==="cash"
                  ? <span><strong>{a.data.vendorName || a.data.description || a.data.type}</strong> · ₹{fmtINR(a.data.amount)} · {fmtDate(a.data.date)} · {a.data.__cardName || fallbackCardName || "—"}
                      {a.data.type==="Spend" && !a.data.hasBill ? <span style={{ color:RED, fontWeight:600 }}> · no bill</span> : null}
                    </span>
                  : preview.kind==="expenses"
                  ? <span><strong>{a.data.description || a.data.expenseType}</strong> · ₹{fmtINR(a.data.amount)}
                      {a.data.date ? ` · ${fmtDate(a.data.date)}` : " · no date"} · {a.data.paidBy}
                      {a.data.paidDate ? <span style={{color:GREEN, fontWeight:600}}> · settled {fmtDate(a.data.paidDate)}</span> : null}
                    </span>
                  : preview.kind==="employees"
                  ? <span><strong>{a.data.name}</strong>{a.data.empCode?` · ${a.data.empCode}`:""}{a.data.designation?` · ${a.data.designation}`:""}{a.data.salary?` · ₹${fmtINR(a.data.salary)}`:""}</span>
                  : preview.kind==="recurring"
                  ? <span><strong>{a.data.name}</strong> · ₹{fmtINR(a.data.amount)} · {a.data.frequency} · due {fmtDate(a.data.nextDueDate)}
                      {a.data.payTo ? <span style={{ color:MUTED }}> · {a.data.payTo}</span> : null}
                    </span>
                  : preview.kind==="vendors"
                  ? <span><strong>{a.data.name}</strong> · {a.data.ledgerType||"Vendor"}{(a.data.sites||[]).length?` · ${(a.data.sites||[]).join(", ")}`:" · all sites"}{a.data.accNo?` · A/c ${a.data.accNo}`:""}</span>
                  : <span><strong>{a.data.name}</strong> · ₹{fmtINR(a.data.amount)}
                      {a.data.dateFromPayment ? <span style={{ color:AMBER, fontWeight:600 }}> · date taken from payment</span> : null} · {fmtDate(a.data.date)} · {a.data.site}
                      {a.data.paidFromDateColumn ? <span style={{ color:GREEN, fontWeight:600 }}> · read as paid from the Payment Date column</span> : null}
                      {a.data.paidDateAssumed ? <span style={{ color:AMBER, fontWeight:600 }}> · marked Paid with no date, so the entry date is used</span> : null}
                      {a.data.paymentStatus==="Paid" && a.data.paymentDate
                        ? <span style={{ color:GREEN, fontWeight:600 }}> · paid {fmtDate(a.data.paymentDate)}</span>
                        : null}
                    </span>}
                </div>
              </div>
            ))}
          </div>
          ); })()}

        {preview.toUpdate.length > 0 && (
          <div style={{ background:SURFACE, borderRadius:16, padding:16, marginBottom:16, border:`1.5px solid ${AMBER}` }}>
            <div style={{ fontWeight:700, color:AMBER, fontSize:14, marginBottom:6 }}>Already exists — will be updated ({preview.toUpdate.length})</div>
            <div style={{ fontSize:12, color:MUTED, marginBottom:10, lineHeight:1.5 }}>
              Matched {preview.kind==="vendors" ? "on GSTIN or name" : preview.kind==="recurring" ? "on name" : preview.kind==="employees" ? "on employee code or name" : preview.kind==="machinery" ? "on registration number or name" : "on Ref No."}. Blank cells in your sheet are ignored, so nothing already saved gets wiped.
            </div>
            <button onClick={()=>setSkip(prev => {
                const n = new Set(prev);
                const allOn = preview.toUpdate.every((_,x)=>!n.has("u"+x));
                if (allOn) preview.toUpdate.forEach((_,x)=>n.add("u"+x));
                else preview.toUpdate.forEach((_,x)=>n.delete("u"+x));
                return n;
              })}
              style={{ fontSize:12.5, fontWeight:700, color:AMBER, background:"none", border:"none",
                cursor:"pointer", padding:0, marginBottom:8 }}>
              {preview.toUpdate.every((_,x)=>!skip.has("u"+x)) ? "Untick all" : "Tick all"}
            </button>
            {preview.toUpdate.map((u,i) => (
              <div key={i} onClick={()=>setSkip(prev => {
                  const n = new Set(prev); n.has("u"+i) ? n.delete("u"+i) : n.add("u"+i); return n;
                })}
                style={{ display:"flex", alignItems:"center", gap:10, padding:"7px 0", cursor:"pointer",
                  fontSize:13, color:INK, opacity: skip.has("u"+i) ? 0.4 : 1,
                  textDecoration: skip.has("u"+i) ? "line-through" : "none" }}>
                <div style={{ width:19, height:19, borderRadius:5, flexShrink:0,
                  display:"flex", alignItems:"center", justifyContent:"center",
                  background: skip.has("u"+i) ? SURFACE : AMBER,
                  border:`2px solid ${skip.has("u"+i) ? "#C7D0DE" : AMBER}` }}>
                  {!skip.has("u"+i) && <Icon name="check" size={11} color="#fff" />}
                </div>
                <span>Row {u.rowNum}: <strong>{u.data.name || u.existing.name}</strong>
                  {u.data.amount ? ` · ₹${fmtINR(u.data.amount)}` : ""}</span>
              </div>

/* ================= PAYMENT REGISTER + UTR IMPORT ================= */
function autoMapHeaders(headers, tpl){
  const map = {};
  tpl.forEach(f => {
    const hit = headers.find(h => f.headers.some(cand => normKey(cand) === normKey(h)));
    map[f.key] = hit || "";
  });
  return map;
}
function mapRowGeneric(row, tpl, map){
  const out = {}; const problems = [];
  tpl.forEach(f => {
    const col = map[f.key];
    let val = col ? row[col] : "";
    if (f.date) val = excelToDateStr(val);
    else if (f.number) {
      const n = Number(String(val).replace(/[^0-9.\-]/g,""));
      val = isNaN(n) ? "" : n;
    } else {
      val = String(val ?? "").trim();
      if (f.upper) val = val.toUpperCase();
    }
    if (f.required && (val === "" || val === null)) problems.push(f.headers[0]);
    out[f.key] = val;
  });
  return { out, problems };
}
// Same date + same payee + same amount is treated as the same payment.
// A requisition sheet often leaves the entry date blank. Since a requisition is
// cleared in the same month it is raised, the payment date tells us the month,
// so we use it as the entry date rather than throwing the row away.
function settleRequisitionDates(out){
  if (!String(out.name||"").trim()) out.name = UNNAMED_PAYEE;
  if (out.paymentStatus && !STATUS_OPTIONS.includes(out.paymentStatus)) {
    const asDate = excelToDateStr(out.paymentStatus);
    const looksDone = /^(done|paid|yes|y|complete|completed|settled)$/i.test(String(out.paymentStatus).trim());
    if (asDate) { out.paymentDate = out.paymentDate || asDate; out.paymentStatus = "Paid"; }
    else if (looksDone) { out.paymentStatus = "Paid"; out.paymentDate = out.paymentDate || out.date; }
    else out.paymentStatus = "Pending";
  }
  if (!STATUS_OPTIONS.includes(out.paymentStatus)) out.paymentStatus = "Pending";

  // A sheet often carries the payment date in its own column and leaves the
  // status blank or says Pending out of habit. A real payment date is the
  // stronger evidence, so the entry counts as paid.
  if (out.paymentDate && out.paymentStatus !== "On Hold" && out.paymentStatus !== "Paid") {
    out.paymentStatus = "Paid";
    out.paidFromDateColumn = true;
  }

  // Marked Paid with no date anywhere. It clearly happened, so the entry date
  // stands in - otherwise it sits in To Pay forever waiting for a date nobody has.
  if (out.paymentStatus === "Paid" && !out.paymentDate && out.date) {
    out.paymentDate = out.date;
    out.paidDateAssumed = true;
  }

  if (!out.date && out.paymentDate) { out.date = out.paymentDate; out.dateFromPayment = true; }
  return out;
}

// The same amount to the same party on the same day is a normal thing to see
// twice - once for each site. Only a repeat within one site is a duplicate.
function dupKey(r){
  return [String(r.date||"").trim(),
          String(r.site||"").trim().toLowerCase(),
          String(r.name||"").trim().toLowerCase(),
          Number(r.amount||0)].join("|");
}
// Stricter than dupKey, for deciding what to skip on import. Two real payments
// can share a date, site, payee and amount - a second tipper load, a second
// week's labour - so the description and reference are part of the test too.
// dupKey stays as it is for the review panel, which only suggests a look.
function importDupKey(r){
  return [dupKey(r),
          String(r.description||"").trim().toLowerCase(),
          String(r.refNo||"").trim().toLowerCase(),
          String(r.utr||"").trim().toLowerCase()].join("|");
}
function normKey(k){ return String(k||"").toLowerCase().replace(/[^a-z0-9]/g,""); }
function pickCol(row, candidates){
  const keys = Object.keys(row);
  for (const cand of candidates) {
    const hit = keys.find(k => normKey(k) === normKey(cand));
    if (hit) return hit;
  }
  return null;
}
function excelToDateStr(v){
  if (v === undefined || v === null || v === "") return "";
  if (typeof v === "number") {              // Excel serial date
    const d = new Date(Math.round((v - 25569) * 86400 * 1000));
    return isNaN(d) ? "" : d.toISOString().slice(0,10);
  }
  const str = String(v).trim();
  if (/^\d{5}(\.\d+)?$/.test(str)) {          // Excel serial that arrived as text
    const d = new Date(Math.round((Number(str) - 25569) * 86400 * 1000));
    if (!isNaN(d)) return d.toISOString().slice(0,10);
  }
  const iso = str.match(/^(\d{4})-(\d{2})-(\d{2})/);
  if (iso) return `${iso[1]}-${iso[2]}-${iso[3]}`;
  const dmy = str.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})$/);
  if (dmy) {
    let [, d, m, y] = dmy;
    if (y.length === 2) y = "20" + y;
    return `${y}-${String(m).padStart(2,"0")}-${String(d).padStart(2,"0")}`;
  }
  const parsed = new Date(str);
  return isNaN(parsed) ? "" : parsed.toISOString().slice(0,10);
}
