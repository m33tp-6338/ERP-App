/* ================= VENDORS ================= */
function VendorsTab({ vendors, setVendors, reqs, lists, setLists, showToast, goTo, openImport }){
  const [query, setQuery] = useState("");
  const [editing, setEditing] = useState(null);
  const [showForm, setShowForm] = useState(false);
  const [ledgerVendor, setLedgerVendor] = useState(null);
  const [sortKey, setSortKey] = useState("name");
  const [sideFilter, setSideFilter] = useState("All");
  const [desc, setDesc] = useState(false);
  const LEDGER_SORTS = [
    { k:"name",     label:"Name",        get:v=>String(v.name||"").toLowerCase() },
    { k:"type",     label:"Type",        get:v=>v.ledgerType||"Vendor" },
    { k:"category", label:"Category",    get:v=>v.category||"" },
    { k:"spend",    label:"Total paid",  get:v=>ledgerPosition(v, reqs).paid },
    { k:"owed",     label:"We owe",      get:v=>ledgerPosition(v, reqs).payable },
    { k:"due",      label:"They owe us", get:v=>ledgerPosition(v, reqs).receivable },
  ];
  const [selected, setSelected] = useState(new Set());
  const [bulkOpen, setBulkOpen] = useState(false);

  const [siteFilter, setSiteFilter] = useState("All");

  const [typeFilter, setTypeFilter] = useState("All");
  const allSites = (lists && lists.sites) ? lists.sites : [];
  const ledgerTypeOptions = (lists && lists.ledgerTypes) ? lists.ledgerTypes : DEFAULT_LISTS.ledgerTypes;
  const typesInUse = [...new Set(vendors.map(v => v.ledgerType || "Vendor"))];
  const typeChips = [...new Set([...ledgerTypeOptions.filter(t => typesInUse.includes(t)), ...typesInUse])];

  const filteredRaw = vendors.filter(v => {
    const q = (String(v.name||"")+String(v.gstin||"")+String(v.category||"")).toLowerCase();
    if (!q.includes(query.toLowerCase())) return false;
    if (typeFilter !== "All" && (v.ledgerType || "Vendor") !== typeFilter) return false;
    if (siteFilter === "All") return true;
    if (siteFilter === "Common") return !(v.sites||[]).length;
    if (sideFilter !== "All" && ledgerPosition(v, reqs).side !== sideFilter) return false;
    return (v.sites||[]).includes(siteFilter) || !(v.sites||[]).length;
  });
  const filtered = sortBy(filteredRaw, (LEDGER_SORTS.find(x=>x.k===sortKey)||LEDGER_SORTS[0]).get, desc);

  function exportLedgers(){
    if (vendors.length === 0) { showToast("No ledgers to export", "error"); return; }
    const wb = XLSX.utils.book_new();
    const cols = [{wch:24},{wch:14},{wch:20},{wch:14},{wch:30},{wch:16},{wch:16},{wch:16},{wch:18},{wch:22},{wch:16},{wch:20}];
    const toRow = (v) => ({
      "Name":v.name||"", "Ledger Type":v.ledgerType||"Vendor",
      "GSTIN":v.gstin||"", "PAN":v.pan||"", "Address":v.address||"", "State":v.state||"",
      "Category":v.category||"", "Sites":(v.sites||[]).length ? (v.sites||[]).join(", ") : "All sites",
      "Bank Name":v.bankName||"", "A/c No.":v.accNo||"", "IFSC Code":v.ifsc||"",
      "Legal Name":v.legalName||"",
    });
    // one sheet per ledger type, so everything stays separated
    const groups = {};
    vendors.forEach(v => {
      const k = v.ledgerType || "Vendor";
      (groups[k] = groups[k] || []).push(v);
    });
    Object.keys(groups).sort().forEach(k => {
      const ws = XLSX.utils.json_to_sheet(groups[k].map(toRow));
      ws["!cols"] = cols;
      XLSX.utils.book_append_sheet(wb, ws, String(k).slice(0,28));
    });
    // plus a combined sheet
    const all = XLSX.utils.json_to_sheet(vendors.map(toRow));
    all["!cols"] = cols;
    XLSX.utils.book_append_sheet(wb, all, "All Ledgers");
    XLSX.writeFile(wb, `Ledgers_${todayStr()}.xlsx`);
    showToast(`Exported ${vendors.length} ledger(s)`);
  }

  function openNew(){ setEditing({...emptyVendor, id:uid()}); setShowForm(true); }
  function openEdit(v){ setEditing({...v}); setShowForm(true); }
  function saveVendor(v){
    if (!v.name.trim()) { showToast("Name is required","error"); return; }
    const exists = vendors.some(x=>x.id===v.id);
    const next = exists ? vendors.map(x=>x.id===v.id?v:x) : [...vendors, v];
    setVendors(next);
    setShowForm(false);
    showToast("Ledger saved");
  }
  function deleteVendor(id){ setVendors(vendors.filter(v=>v.id!==id)); showToast("Ledger removed"); }

  function toggleSel(id){
    setSelected(prev => { const n = new Set(prev); n.has(id) ? n.delete(id) : n.add(id); return n; });
  }
  function bulkDeleteVendors(){
    const picked = vendors.filter(v => selected.has(v.id));
    const inUse = picked.filter(v => reqs.some(r => r.vendorId === v.id || r.name === v.name));
    const msg = inUse.length
      ? `Delete ${picked.length} ledger(s)?\n\n${inUse.length} of them are used by existing requisitions. Those requisitions are not deleted, but they will lose their link to the ledger.\n\nThis cannot be undone.`
      : `Delete ${picked.length} ledger(s)? This cannot be undone.`;
    if (!confirm(msg)) return;
    setVendors(vendors.filter(v => !selected.has(v.id)));
    setSelected(new Set());
    showToast(`${picked.length} removed`);
  }
  function bulkExportVendors(){
    const picked = vendors.filter(v => selected.has(v.id));
    if (!picked.length) return;
    const ws = XLSX.utils.json_to_sheet(picked.map(v => ({
      Name:v.name||"", "Ledger Type":v.ledgerType||"Vendor", GSTIN:v.gstin||"", PAN:v.pan||"",
      Address:v.address||"", State:v.state||"", Category:v.category||"",
      Sites:(v.sites||[]).length ? (v.sites||[]).join(", ") : "All sites",
      "Bank Name":v.bankName||"", "A/c No.":v.accNo||"", "IFSC Code":v.ifsc||"",
    })));
    ws["!cols"] = [{wch:24},{wch:14},{wch:20},{wch:14},{wch:30},{wch:16},{wch:16},{wch:20},{wch:18},{wch:22},{wch:14}];
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, "Ledgers");
    XLSX.writeFile(wb, `Ledgers_Selected_${todayStr()}.xlsx`);
    showToast(`Exported ${picked.length}`);
  }

  if (showForm) return <VendorForm vendor={editing} lists={lists} setLists={setLists} onCancel={()=>setShowForm(false)} onSave={saveVendor} />;
  if (ledgerVendor) {
    const live = vendors.find(v => v.id === ledgerVendor.id) || ledgerVendor;
    return <VendorLedger vendor={live} reqs={reqs} showToast={showToast}
      onBack={()=>setLedgerVendor(null)}
      onEdit={()=>{ setLedgerVendor(null); openEdit(live); }}
      onDelete={()=>{
        if (!confirm(`Delete "${live.name}"? This cannot be undone.`)) return;
        deleteVendor(live.id); setLedgerVendor(null);
      }} />;
  }

  return (
    <div>
      <div style={{ position:"relative", marginBottom:16 }}>
        <span style={{ position:"absolute", left:14, top:"50%", transform:"translateY(-50%)", color:MUTED }}><Icon name="search" size={18} /></span>
        <input style={{ ...inputStyle, paddingLeft:40 }} placeholder="Search by name, GSTIN, category" value={query} onChange={e=>setQuery(e.target.value)} />
      </div>
      {typeChips.length > 1 && (
        <div style={{ display:"flex", gap:8, marginBottom:10, overflowX:"auto", paddingBottom:4 }}>
          {["All", ...typeChips].map(x => (
            <button key={x} onClick={()=>setTypeFilter(x)}
              style={{ padding:"8px 14px", borderRadius:12, fontSize:14, fontWeight:600, whiteSpace:"nowrap", cursor:"pointer",
                background: typeFilter===x?AMBER:"#fff", color: typeFilter===x?"#fff":INK, border:`1px solid ${typeFilter===x?AMBER:SAND}` }}>

          ))}
        </div>
      )}

      {allSites.length > 0 && (
        <div style={{ display:"flex", gap:8, marginBottom:14, overflowX:"auto", paddingBottom:4 }}>
          {["All","Common",...allSites].map(x => (

      <div style={{ display:"flex", flexDirection:"column", gap:10 }}>
        <BigButton icon="plus" label="Add New Ledger" onClick={openNew} tone="amber" full />

        {vendors.length > 0 && (

      {vendors.length > 0 && (

      {(() => {

            <div style={{ display:"flex", justifyContent:"space-between", marginTop:12, paddingTop:10,
              borderTop:`1px solid ${SAND}`, fontSize:13.5 }}>
              <span style={{ fontWeight:700, color:INK }}>Net position</span>
              <span className="num" style={{ fontWeight:800, color: owe-due >= 0 ? AMBER : GREEN }}>
                ₹{fmtINR(Math.abs(owe-due))} {owe-due >= 0 ? "payable" : "receivable"}

            </div>
          </div>

      })()}

      <div style={{ display:"flex", gap:8, marginBottom:10, overflowX:"auto", paddingBottom:4 }}>
        {["All","Creditor","Debtor","Settled"].map(x => {
          const on = sideFilter === x;
          const n = x === "All" ? vendors.length
            : vendors.filter(v => ledgerPosition(v, reqs).side === x).length;
          return (
            <button key={x} onClick={()=>setSideFilter(x)}

      <SelectAllBar count={selected.size} total={filtered.length}

      <div style={{ marginTop:4, display:"flex", flexDirection:"column", gap:12, marginBottom: selected.size ? 90 : 0 }}>

async function shareVendor(v){
  const text = `Ledger Details\nName: ${v.name}\nGSTIN: ${v.gstin||"—"}\nPAN: ${v.pan||"—"}\nAddress: ${v.address||"—"}\nState: ${v.state||"—"}\nCategory: ${v.category||"—"}\nBank: ${v.bankName||"—"}\nA/c No.: ${v.accNo||"—"}\nIFSC: ${v.ifsc||"—"}`;
  if (navigator.share) {
    try { await navigator.share({ title: v.name, text }); return; }
    catch(e) { if (e && e.name === "AbortError") return; }
  }
  if (navigator.clipboard) {
    try { await navigator.clipboard.writeText(text); alert("Copied to clipboard — paste it anywhere you like."); return; }
    catch(e) { /* fall through */ }
  }
  alert(text);
}

                <input style={inputStyle} value={v.department||""} onChange={e=>set("department",e.target.value)} />
              </Field>
            </div>
            <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:12 }}>
              <Field label="Date of Joining">
                <input type="date" style={inputStyle} value={v.doj||""} onChange={e=>set("doj",e.target.value)} />
              </Field>
              <Field label="Monthly Salary">
                <input type="number" inputMode="decimal" style={inputStyle} value={v.salary||""} onChange={e=>set("salary",e.target.value)} />
              </Field>
            </div>
            {v.empStatus === "Left" && (
              <Field label="Date of Leaving">
                <input type="date" style={inputStyle} value={v.dol||""} onChange={e=>set("dol",e.target.value)} />
              </Field>
            )}
            <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:12 }}>
              <Field label="Phone">
                <input style={inputStyle} value={v.phone||""} onChange={e=>set("phone",e.target.value)} inputMode="tel" />
              </Field>
              <Field label="Email">
                <input style={inputStyle} value={v.email||""} onChange={e=>set("email",e.target.value)} />
              </Field>
            </div>
            <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:12 }}>
              <Field label="UAN (PF)">
                <input style={inputStyle} value={v.uan||""} onChange={e=>set("uan",e.target.value)} />
              </Field>
              <Field label="ESIC No.">
                <input style={inputStyle} value={v.esic||""} onChange={e=>set("esic",e.target.value)} />
              </Field>
            </div>
          </React.Fragment>
        )}

        <div style={{ margin:"20px 0", borderTop:`1px dashed ${SAND}` }} />
        <SectionLabel>Bank Details (auto-fills payment sheets)</SectionLabel>
        <Field label="Bank Name"><input style={inputStyle} value={v.bankName} onChange={e=>set("bankName",e.target.value)} /></Field>
        <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:12 }}>
          <Field label="Account No."><input style={inputStyle} value={v.accNo} onChange={e=>set("accNo",e.target.value)} /></Field>
          <Field label="IFSC Code"><input style={inputStyle} value={v.ifsc} onChange={e=>set("ifsc", e.target.value.toUpperCase())} /></Field>
        </div>
        <div style={{ marginTop:8 }}>
          <BigButton icon="check" label="Save Ledger" onClick={()=>onSave(v)} tone="green" full />
        </div>
      </div>
    </div>
  );
}

/* ---------- Vendor Ledger (sub-page) ---------- */
function VendorLedger({ vendor, reqs, showToast, onBack, onEdit, onDelete }){
  const rows = useMemo(() => {
    return reqs.filter(r => r.vendorId === vendor.id || r.name === vendor.name)
      .sort((a,b) => b.createdAt - a.createdAt);
  }, [reqs, vendor]);

  const totals = useMemo(() => {
    const t = { Pending:0, Approved:0, Paid:0, "On Hold":0 };
    rows.forEach(r => { t[r.paymentStatus] = (t[r.paymentStatus]||0) + Number(r.amount||0); });
    return t;
  }, [rows]);
  const grandTotal = Object.values(totals).reduce((a,b)=>a+b,0);

  return (
    <div>
      <button onClick={onBack} style={{ display:"flex", alignItems:"center", gap:6, marginBottom:16, fontSize:14, fontWeight:600, color:INK, background:"none", border:"none", cursor:"pointer" }}>
        <Icon name="close" size={16} /> Back to vendors
      </button>
      <div style={{ background:SURFACE, borderRadius:16, padding:20, marginBottom:16, border:`1px solid ${SAND}` }}>
        <div style={{ fontWeight:700, fontSize:18, color:INK }}>{vendor.name}</div>
        {vendor.gstin && <div style={{ fontSize:12, color:MUTED, marginTop:2 }}>GSTIN: {vendor.gstin}</div>}
        {(vendor.accNo || vendor.ifsc) && (
          <div style={{ fontSize:12, color:MUTED, marginTop:4 }}>A/c {vendor.accNo||"—"} · IFSC {vendor.ifsc||"—"}</div>
        )}
        <div style={{ marginTop:14, fontSize:22, fontWeight:700, color:INK }}>₹{fmtINR(grandTotal)} <span style={{ fontSize:12, fontWeight:400, color:MUTED }}>total across {rows.length} requisition(s)</span></div>
      </div>

      {(() => {
        const pos = ledgerPosition(vendor, reqs);
        if (!pos.rows.length) return null;
        const tone = pos.side === "Creditor" ? AMBER : pos.side === "Debtor" ? GREEN : MUTED;
        return (
          <div style={{ background:GRAD_INK, borderRadius:22, padding:20, marginBottom:16, boxShadow:SHADOW_LG }}>
            <div style={{ fontSize:11.5, fontWeight:600, color:"#8FA0BC", textTransform:"uppercase", letterSpacing:"0.08em" }}>
              {pos.side === "Creditor" ? "We owe them"
                : pos.side === "Debtor" ? "They owe us"
                : "Nothing outstanding"}
            </div>
            <div className="num" style={{ fontSize:30, fontWeight:800, color:"#fff", marginTop:6 }}>
              ₹{fmtINR(Math.abs(pos.net))}
            </div>
            <span style={{ display:"inline-block", marginTop:9, fontSize:11.5, fontWeight:700,
              padding:"4px 11px", borderRadius:999,
              background: pos.side === "Settled" ? "rgba(255,255,255,0.12)" : tone, color:"#fff" }}>
              {pos.side}
            </span>

            <div style={{ marginTop:16, display:"flex", flexDirection:"column", gap:7 }}>
              <div style={{ display:"flex", justifyContent:"space-between", fontSize:13 }}>
                <span style={{ color:"#8FA0BC" }}>Billed to us</span>
                <span className="num" style={{ color:"#fff", fontWeight:600 }}>₹{fmtINR(pos.billed)}</span>
              </div>
              <div style={{ display:"flex", justifyContent:"space-between", fontSize:13 }}>
                <span style={{ color:"#8FA0BC" }}>Paid</span>
                <span className="num" style={{ color:"#fff", fontWeight:600 }}>₹{fmtINR(pos.paid)}</span>
              </div>
              {pos.payable > 0 && (
                <div style={{ display:"flex", justifyContent:"space-between", fontSize:13 }}>
                  <span style={{ color:"#8FA0BC" }}>Still to pay them</span>
                  <span className="num" style={{ color:"#FFC98A", fontWeight:700 }}>₹{fmtINR(pos.payable)}</span>
                </div>
              )}
              {pos.receivable > 0 && (
                <div style={{ display:"flex", justifyContent:"space-between", fontSize:13 }}>
                  <span style={{ color:"#8FA0BC" }}>Overpaid, due back</span>
                  <span className="num" style={{ color:"#8FE3C4", fontWeight:700 }}>₹{fmtINR(pos.receivable)}</span>
                </div>
              )}
              {pos.onHold > 0 && (
                <div style={{ display:"flex", justifyContent:"space-between", fontSize:13 }}>
                  <span style={{ color:"#8FA0BC" }}>On hold, not counted</span>
                  <span className="num" style={{ color:"#8FA0BC", fontWeight:600 }}>₹{fmtINR(pos.onHold)}</span>
                </div>
              )}
            </div>

            {pos.both && (
              <div style={{ marginTop:12, paddingTop:12, borderTop:"1px solid rgba(255,255,255,0.14)",
                fontSize:12, color:"#8FA0BC", lineHeight:1.6 }}>
                This one is both. We owe ₹{fmtINR(pos.payable)} and they owe ₹{fmtINR(pos.receivable)},
                so the net is what matters. Settling one against the other leaves ₹{fmtINR(Math.abs(pos.net))}.
              </div>
            )}
          </div>
        );
      })()}

      <div style={{ background:SURFACE, borderRadius:16, padding:"4px 20px 16px", marginBottom:16, border:`1px solid ${SAND}` }}>
        <div style={{ paddingTop:16 }}><SectionLabel>Details</SectionLabel></div>
        <DetailRow label="GSTIN" value={vendor.gstin} copyable showToast={showToast} mono />
        <DetailRow label="PAN" value={vendor.pan} copyable showToast={showToast} mono />
        <DetailRow label="Legal Name" value={vendor.legalName} />
        <DetailRow label="Address" value={vendor.address} copyable showToast={showToast} />
        <DetailRow label="State" value={vendor.state} />
        <DetailRow label="Ledger Type" value={vendor.ledgerType || "Vendor"} />
        {(vendor.ledgerType === "Employee") && (
          <div style={{ fontSize:12, color:MUTED, padding:"6px 0 2px", lineHeight:1.5 }}>
            Set automatically because salary payments are recorded against this ledger. You can change it by editing.
          </div>
        )}
        <DetailRow label="Category" value={vendor.category} />
        <DetailRow label="Sites" value={(vendor.sites||[]).length ? (vendor.sites||[]).join(", ") : "All sites (common)"} />
        {vendor.ledgerType === "Employee" && (
          <React.Fragment>
            <DetailRow label="Emp. Code" value={vendor.empCode} copyable showToast={showToast} />
            <DetailRow label="Status" value={vendor.empStatus} />
            <DetailRow label="Roll Type" value={vendor.rollType || "On Roll"} />
            <DetailRow label="Designation" value={vendor.designation} />
            <DetailRow label="Department" value={vendor.department} />
            <DetailRow label="Joined" value={fmtDate(vendor.doj)} />
            {vendor.dol && <DetailRow label="Left" value={fmtDate(vendor.dol)} />}
            <DetailRow label="Salary" value={vendor.salary ? `₹${fmtINR(vendor.salary)} / month` : ""} />
            <DetailRow label="Phone" value={vendor.phone} copyable showToast={showToast} />
            <DetailRow label="Email" value={vendor.email} copyable showToast={showToast} />
            <DetailRow label="UAN" value={vendor.uan} copyable showToast={showToast} />
            <DetailRow label="ESIC" value={vendor.esic} copyable showToast={showToast} />
          </React.Fragment>
        )}
        <DetailRow label="Bank" value={vendor.bankName} />
        <DetailRow label="A/c No." value={vendor.accNo} copyable showToast={showToast} mono />
        <DetailRow label="IFSC" value={vendor.ifsc} copyable showToast={showToast} mono />
      </div>

      <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:10, marginBottom:10 }}>
        <BigButton icon="share" label="Share" onClick={()=>shareVendor(vendor)} tone="ink" full />
        <BigButton icon="edit" label="Edit" onClick={onEdit} tone="amber" full />
      </div>
      <div style={{ marginBottom:16 }}>
        <BigButton icon="trash" label="Delete Ledger" onClick={onDelete} tone="red" full />
      </div>

      <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:12, marginBottom:16 }}>
        {Object.entries(totals).filter(([,v])=>v>0).map(([status, amt]) => (
          <div key={status} style={{ background:SURFACE, borderRadius:18, padding:14, border:`1px solid ${SAND}`, boxShadow:SHADOW }}>
            <div style={{ fontSize:11, fontWeight:600, color:STATUS_COLOR[status] }}>{status}</div>
            <div style={{ fontSize:16, fontWeight:700, color:INK }}>₹{fmtINR(amt)}</div>
          </div>
        ))}
      </div>

      <div style={{ fontWeight:700, marginBottom:8, color:INK, fontSize:14 }}>Transaction History</div>
      {rows.length===0 ? <EmptyState text="No requisitions recorded for this vendor yet." /> : (
        <div style={{ display:"flex", flexDirection:"column", gap:8 }}>
          {rows.map(r => (
            <div key={r.id} style={{ background:SURFACE, borderRadius:16, padding:14, border:`1px solid ${SAND}`, boxShadow:SHADOW }}>
              <div style={{ display:"flex", justifyContent:"space-between" }}>
                <div style={{ fontSize:12, color:MUTED }}>{fmtDate(r.date)} · {r.site}</div>
                <div style={{ fontWeight:700, color:INK }}>₹{fmtINR(r.amount)}</div>
              </div>
              <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginTop:6 }}>
                <span style={{ fontSize:12, color:MUTED }}>{r.category}{r.subCategory?" / "+r.subCategory:""}</span>
                <span style={{ fontSize:11, fontWeight:600, padding:"2px 8px", borderRadius:999, color:"#fff", background:STATUS_COLOR[r.paymentStatus] }}>{r.paymentStatus}</span>
              </div>
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

/* ================= REQUISITION FORM (single screen) ================= */
function RequisitionForm({ vendors, setVendors, reqs, setReqs, expenses, setExpenses, lists, setLists, goTo, openImport, showToast, editItem=null, onDone=null }){
  const [form, setForm] = useState(editItem ? { ...editItem } : { ...emptyReq, id:uid(), date:todayStr() });
  const [linked, setLinked] = useState(new Set());
  const [showPicker, setShowPicker] = useState(false);
  const [pickType, setPickType] = useState("All");
  const [pickFrom, setPickFrom] = useState("");
  const [pickTo, setPickTo] = useState("");
  const [pickQuery, setPickQuery] = useState("");
  const [pickOwedOnly, setPickOwedOnly] = useState(false);
  const L = lists || DEFAULT_LISTS;

  // Expenses somebody has paid for out of their own pocket and not yet been repaid.
  // Every expense is offered, not only the unsettled ones. Showing nothing at all
  // when everything happens to be settled just looks broken.
  const claimable = useMemo(() => (expenses||[]), [expenses]);
  const stillOwed = useMemo(() => claimable.filter(e => !expenseSettled(e)), [claimable]);
  const claimTypes = useMemo(
    () => [...new Set(claimable.map(e => e.expenseType).filter(Boolean))].sort(),
    [claimable]);
  const pickList = useMemo(() => claimable
    .filter(e => pickType === "All" || e.expenseType === pickType)
    .filter(e => !pickOwedOnly || !expenseSettled(e))
    .filter(e => matches(pickQuery, dateTerms(e.date, e.paidDate), e.description, e.expenseType, e.paidBy, e.site,
                         e.category, e.amount, e.claimRef))
    .sort((a,b) => String(b.date||"").localeCompare(String(a.date||""))
                || String(a.paidBy||"").localeCompare(String(b.paidBy||""))),
    [claimable, pickType, pickOwedOnly, pickQuery]);

  const linkedRows = useMemo(() => (expenses||[]).filter(e => linked.has(e.id)), [expenses, linked]);
  const linkedTotal = linkedRows.reduce((a,e)=>a+Number(e.amount||0), 0);
  const linkedPeople = [...new Set(linkedRows.map(e => e.paidBy || "Unassigned"))];

  // One requisition pays one person, so the amount and payee follow the selection.
  function toggleExpense(e){
    setLinked(prev => {
      const n = new Set(prev);
      n.has(e.id) ? n.delete(e.id) : n.add(e.id);
      const rows = (expenses||[]).filter(x => n.has(x.id));
      const total = rows.reduce((a,x)=>a+Number(x.amount||0), 0);
      const people = [...new Set(rows.map(x => x.paidBy || "Unassigned"))];
      const types = [...new Set(rows.map(x => x.expenseType).filter(Boolean))];
      setForm(f => ({
        ...f,
        amount: rows.length ? total : (linked.size ? "" : f.amount),
        name: people.length === 1 ? people[0] : f.name,
        vendorId: people.length === 1
          ? ((vendors.find(v => String(v.name||"").trim().toLowerCase() === String(people[0]).trim().toLowerCase())||{}).id || "")
          : f.vendorId,
        category: rows.length ? (f.category || REIMB_CATEGORY) : f.category,
        subCategory: rows.length && types.length === 1 ? types[0] : f.subCategory,
        description: rows.length
          ? `Reimbursement - ${rows.length} expense(s)${types.length ? ": " + types.join(", ") : ""}`
          : f.description,
      }));
      return n;
    });
  }
  // list values, plus anything already used in past entries so nothing is ever missing
  const siteOptions = useMemo(()=>{
    const used = reqs.map(r=>r.site).filter(Boolean);
    return [...new Set([...L.sites, ...used])].sort();
  }, [L.sites, reqs]);
  const categoryOptions = useMemo(()=>{
    const used = reqs.map(r=>r.category).filter(Boolean);
    return [...new Set([...L.categories, ...used])].sort();
  }, [L.categories, reqs]);
  const vendorGroups = useMemo(()=>{
    const sorted = [...vendors].sort((a,b)=>String(a.name||"").localeCompare(String(b.name||"")));
    if (!form.site) return [{ label:"", items: sorted }];
    const forSite = sorted.filter(v => (v.sites||[]).includes(form.site));
    const common  = sorted.filter(v => !(v.sites||[]).length);
    const others  = sorted.filter(v => (v.sites||[]).length && !(v.sites||[]).includes(form.site));
    const groups = [];
    if (forSite.length) groups.push({ label:`${form.site}`, items:forSite });
    if (common.length)  groups.push({ label:"All sites", items:common });
    if (others.length)  groups.push({ label:"Other sites", items:others });
    return groups.length ? groups : [{ label:"", items: sorted }];
  }, [vendors, form.site]);
  const subCategoryOptions = useMemo(()=>{
    const forCat = form.category ? ((L.subCategories||{})[form.category] || []) : [];
    const used = reqs.filter(r=>!form.category || r.category===form.category).map(r=>r.subCategory).filter(Boolean);
    return [...new Set([...forCat, ...used])].sort();
  }, [L.subCategories, reqs, form.category]);

  function set(field, value){ setForm(prev => ({...prev, [field]:value})); }
  function pickVendor(id){
    const vend = vendors.find(v=>v.id===id);
    if (!vend) { setForm(prev=>({...prev, vendorId:""})); return; }
    setForm(prev => ({...prev, vendorId:vend.id, name:vend.name, accNo:vend.accNo, ifsc:vend.ifsc}));
  }
  function save(){
    if (!form.site.trim()) return showToast("Please enter a site","error");
    if (!form.name.trim()) return showToast("Please select or enter a vendor name","error");
    if (!form.amount || Number(form.amount)<=0) return showToast("Enter a valid amount","error");
    if (form.paymentStatus === "Paid" && !form.paymentDate) return showToast("Enter the payment date","error");
    if (form.paymentStatus === "Paid" && !form.paymentMode) return showToast("Choose the payment mode","error");
    const promoted = setVendors ? promoteSalaryLedgers(vendors, [form]) : null;
    if (promoted) {
      setVendors(promoted.vendors);
      showToast(`${promoted.names.join(", ")} set as Employee`);
    }
    if (!editItem) {
      const clash = reqs.filter(r => duplicateKeyOf(r) === duplicateKeyOf(form));
      if (clash.length && !confirm(
        `This looks like a payment you already have.\n\n` +
        `${form.name} · ₹${fmtINR(form.amount)} · ${fmtDate(form.date)}\n` +
        `Already on file as ${clash.map(r=>r.refNo||"no ref").join(", ")}\n\n` +
        `Add it anyway?`
      )) return;
    }
    if (editItem) {
      setReqs(reqs.map(r => r.id===form.id ? { ...form } : r));
      if (!promoted) showToast("Requisition updated");
      if (onDone) onDone();
    } else {
      if (linked.size && linkedPeople.length > 1 && !form.name.trim()) {
        showToast("Enter who is being paid", "error");
        return;
      }
      const ref = form.refNo || nextRefNo(reqs, form.date);
      const claimId = linked.size ? uid() : "";
      const record = { ...form, refNo: ref, createdAt: Date.now(), exported:false };
      if (linked.size) {
        record.isReimbursement = true;
        record.claimId = claimId;
        record.paidBy = "Company";
      }
      setReqs([...reqs, record]);
      if (linked.size) {
        setExpenses((expenses||[]).map(e => linked.has(e.id)
          ? { ...e, claimId, claimRef: ref, settledTo: record.name || e.paidBy || "" }
          : e));
        showToast(`${ref} raised, covering ${linked.size} expense(s)`);
      } else if (!promoted) showToast("Requisition added");
      setLinked(new Set());
      setShowPicker(false);
      setForm({ ...emptyReq, id:uid(), date:todayStr() });
    }
  }

  return (
    <div>
      {editItem && (
        <button onClick={onDone} style={{ display:"flex", alignItems:"center", gap:6, marginBottom:16, fontSize:14, fontWeight:600, color:INK, background:"none", border:"none", cursor:"pointer" }}>
          <Icon name="close" size={16} /> Cancel edit
        </button>
      )}

      {!editItem && claimable.length > 0 && (
        <div style={{ background:SURFACE, borderRadius:20, padding:18, marginBottom:14,
          border:`1.5px solid ${linked.size ? AMBER : SAND}`, boxShadow:SHADOW }}>
          <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", gap:10 }}>
            <div style={{ minWidth:0 }}>
              <div style={{ fontWeight:700, color:INK, fontSize:15 }}>Paying back an expense?</div>
              <div style={{ fontSize:12.5, color:MUTED, marginTop:3, lineHeight:1.5 }}>
                {linked.size
                  ? `${linked.size} expense(s) attached to this requisition`
                  : `${stillOwed.length} waiting to be repaid, ${claimable.length} in total`}
              </div>
            </div>
            <button onClick={()=>setShowPicker(!showPicker)}
              style={{ flexShrink:0, padding:"10px 14px", borderRadius:12, fontSize:13, fontWeight:700,
                background: showPicker ? INK : AMBER, color:"#fff", border:"none", cursor:"pointer" }}>
              {showPicker ? "Done" : linked.size ? "Change" : "Choose"}
            </button>
          </div>

          {linked.size > 0 && (
            <div style={{ background:"#EEF0FE", borderRadius:14, padding:13, marginTop:12 }}>
              <div style={{ display:"flex", justifyContent:"space-between", fontSize:13, marginBottom:5 }}>
                <span style={{ color:MUTED }}>Pay to</span>
                <span style={{ fontWeight:700, color: linkedPeople.length > 1 ? RED : INK }}>
                  {linkedPeople.join(", ")}
                </span>
              </div>
              <div style={{ display:"flex", justifyContent:"space-between", fontSize:15,
                paddingTop:7, borderTop:`1px solid ${SAND}` }}>
                <span style={{ fontWeight:700, color:INK }}>Total</span>
                <span className="num" style={{ fontWeight:800, color:INK }}>₹{fmtINR(linkedTotal)}</span>
              </div>
              {linkedPeople.length > 1 && (
                <div style={{ background:SURFACE, borderRadius:11, padding:10, marginTop:9 }}>
                  <div style={{ fontSize:11.5, color:MUTED, fontWeight:600, marginBottom:5 }}>Spent by</div>
                  {linkedPeople.map(n => {
                    const t = linkedRows.filter(x => (x.paidBy||"Unassigned") === n)
                                        .reduce((a,x)=>a+Number(x.amount||0), 0);
                    return (
                      <div key={n} style={{ display:"flex", justifyContent:"space-between", fontSize:12.5, padding:"2px 0" }}>
                        <span style={{ color:INK }}>{n}</span>
                        <span className="num" style={{ fontWeight:600, color:INK }}>₹{fmtINR(t)}</span>
                      </div>
                    );
                  })}
                  <div style={{ fontSize:12, color:INK, marginTop:8, lineHeight:1.5 }}>
                    One payment can cover several people's spending. Set <strong>Pay to</strong> below to
                    whoever actually receives the money.
                  </div>
                </div>
              )}
              <div style={{ fontSize:12, color:MUTED, marginTop:9, lineHeight:1.5 }}>
                These expenses are locked to this requisition when you save, so they can never be claimed twice.
              </div>
            </div>
          )}

          {showPicker && (
            <div style={{ marginTop:12 }}>
              <SearchBox value={pickQuery} onChange={setPickQuery}
                placeholder="Search date, description, person, amount" />

              <div style={{ display:"flex", gap:7, marginBottom:10 }}>
                {[[true,`Still owed (${stillOwed.length})`],[false,`Everything (${claimable.length})`]].map(([v,lbl]) => {
                  const on = pickOwedOnly === v;
                  return (
                    <button key={String(v)} onClick={()=>setPickOwedOnly(v)}
                      style={{ flex:1, padding:"8px 6px", borderRadius:11, fontSize:12, fontWeight:600, cursor:"pointer",
                        background: on?INK:SURFACE, color: on?"#fff":INK, border:`1px solid ${on?INK:SAND}` }}>
                      {lbl}
                    </button>
                  );
                })}
                {pickQuery && (
                  <button onClick={()=>setPickQuery("")}
                    style={{ padding:"8px 12px", borderRadius:11, fontSize:12, fontWeight:600, cursor:"pointer",
                      background:SAND, color:INK, border:"none" }}>
                    Clear
                  </button>
                )}
              </div>

              {claimTypes.length > 1 && (
                <div style={{ display:"flex", gap:7, marginBottom:10, overflowX:"auto", paddingBottom:4 }}>
                  {["All", ...claimTypes].map(t => {
                    const on = pickType === t;
                    return (
                      <button key={t} onClick={()=>setPickType(t)}
                        style={{ padding:"7px 12px", borderRadius:11, fontSize:12.5, fontWeight:600,
                          whiteSpace:"nowrap", cursor:"pointer",
                          background: on?INK:SURFACE, color: on?"#fff":INK, border:`1px solid ${on?INK:SAND}` }}>
                        {t}
                      </button>
                    );
                  })}
                </div>
              )}
              <div style={{ maxHeight:320, overflowY:"auto", border:`1px solid ${SAND}`, borderRadius:14 }}>
                {pickList.map((e, idx) => {
                  const on = linked.has(e.id);
                  const blocked = !!e.claimId;
                  return (
                    <div key={e.id} onClick={()=>{ if (!blocked) toggleExpense(e); }}
                      style={{ display:"flex", alignItems:"center", gap:10, padding:"11px 12px",
                        borderTop: idx ? `1px solid ${SAND}` : "none",
                        background: on ? "#EEF0FE" : SURFACE,
                        opacity: blocked ? 0.4 : 1,
                        cursor: blocked ? "default" : "pointer" }}>
                      <div style={{ width:20, height:20, borderRadius:6, flexShrink:0,
                        display:"flex", alignItems:"center", justifyContent:"center",
                        background: on ? AMBER : SURFACE, border:`2px solid ${on ? AMBER : "#C7D0DE"}` }}>
                        {on && <Icon name="check" size={12} color="#fff" />}
                      </div>
                      <div style={{ flex:1, minWidth:0 }}>
                        <div style={{ fontSize:13.5, fontWeight:600, color:INK, overflow:"hidden",
                          textOverflow:"ellipsis", whiteSpace:"nowrap" }}>
                          {e.description || e.expenseType}
                        </div>
                        <div style={{ fontSize:11.5, color:MUTED, marginTop:2 }}>
                          {e.paidBy || "Unassigned"} · {e.expenseType}
                          {e.date ? ` · ${fmtDate(e.date)}` : ""}
                        </div>
                        {e.claimRef ? (
                          <div style={{ fontSize:11, fontWeight:700, color:AMBER, marginTop:2 }}>
                            already on {e.claimRef}
                          </div>
                        ) : e.paidDate ? (
                          <div style={{ fontSize:11, color:MUTED, marginTop:2 }}>
                            settled {fmtDate(e.paidDate)} - attaching links it here too
                          </div>
                        ) : null}
                      </div>
                      <span className="num" style={{ fontWeight:700, color:INK, flexShrink:0, fontSize:13.5 }}>
                        ₹{fmtINR(e.amount)}
                      </span>
                    </div>
                  );
                })}
                {pickList.length === 0 && (
                  <div style={{ padding:16, fontSize:13, color:MUTED, lineHeight:1.6 }}>
                    Nothing matches. Try <strong>Everything</strong>, widen the dates, or clear the search.
                  </div>
                )}
              </div>
              {linkedPeople.length > 1 && (
                <div style={{ fontSize:12, color:MUTED, marginTop:9, lineHeight:1.5 }}>
                  Spending by more than one person. Set Pay to below to whoever actually receives the money -
                  they are being repaid for the others too.
                </div>
              )}
            </div>
          )}
        </div>
      )}

      {!editItem && goTo && (
        <div style={{ background:SURFACE, borderRadius:16, padding:16, marginBottom:14, border:`1px solid ${SAND}` }}>
          <div style={{ fontSize:13, color:MUTED, lineHeight:1.6, marginBottom:12 }}>
            Adding several at once? Bring them in from a spreadsheet instead of typing each one.
          </div>
          <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:10 }}>
            <button onClick={()=>goTo("import:requisitions")}
              style={{ borderRadius:14, padding:"12px 8px", fontSize:14, fontWeight:600, background:SAND, color:INK, border:"none", cursor:"pointer" }}>
              Import from Excel
            </button>
            <button onClick={()=>goTo("sheets")}
              style={{ borderRadius:14, padding:"12px 8px", fontSize:14, fontWeight:600, background:SAND, color:INK, border:"none", cursor:"pointer" }}>
              From Google Sheets
            </button>
          </div>
          <div style={{ fontSize:12, color:MUTED, marginTop:10, lineHeight:1.55 }}>
            Rows matching an existing entry on date, name and amount are skipped, so nothing is duplicated.
          </div>
        </div>
      )}
      <div style={{ background:SURFACE, borderRadius:20, padding:20, border:`1px solid ${SAND}`, boxShadow:SHADOW }}>
        <Field label="Date" required>
          <input type="date" style={inputStyle} value={form.date} onChange={e=>set("date",e.target.value)} />
        </Field>

        <ManagedSelect
          label="Site" required
          value={form.site} onChange={v=>set("site",v)}
          options={siteOptions}
          onAddOption={(name)=>addToList(L, setLists, "site", name)}
          addPrompt="Name of the new site:"
        />

        <ManagedSelect
          label="Category"
          value={form.category}
          onChange={v=>{ setForm(prev=>({...prev, category:v, subCategory:""})); }}
          options={categoryOptions}
          onAddOption={(name)=>addToList(L, setLists, "category", name)}
          addPrompt="Name of the new category:"
        />

        <ManagedSelect
          label="Sub-Category"
          hint={form.category ? `Sub-categories under ${form.category}` : "Pick a category first for a filtered list"}
          value={form.subCategory} onChange={v=>set("subCategory",v)}
          options={subCategoryOptions}
          onAddOption={(name)=>addToList(L, setLists, "subCategory", name, form.category)}
          addPrompt="Name of the new sub-category:"
        />

        <Field label="Pay to" required hint={`Every ledger is listed${form.site ? `, grouped by site` : ""} — bank details fill in automatically`}>
          <select style={{...inputStyle, marginBottom:8}} value={form.vendorId} onChange={e=>pickVendor(e.target.value)}>
            <option value="">— choose saved ledger —</option>
            {vendorGroups.map((g, gi) => g.label
              ? <optgroup key={gi} label={g.label}>
                  {g.items.map(v=><option key={v.id} value={v.id}>{v.name}</option>)}
                </optgroup>
              : g.items.map(v=><option key={v.id} value={v.id}>{v.name}</option>)
            )}
          </select>
          <input style={inputStyle} value={form.name} onChange={e=>set("name",e.target.value)} placeholder="Name of party being paid" />
        </Field>
        {(form.accNo || form.ifsc) && (
          <div style={{ display:"flex", alignItems:"center", gap:6, fontSize:12, padding:"8px 12px", borderRadius:12, marginBottom:16, background:"#E6F7F2", color:GREEN }}>
            <Icon name="check" size={14} color={GREEN} /> Bank details: A/c {form.accNo||"—"}, IFSC {form.ifsc||"—"}
          </div>
        )}

        <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:12 }}>
          <Field label="Amount" required>
            <input type="number" inputMode="decimal" style={{...inputStyle, fontWeight:700}} value={form.amount} onChange={e=>set("amount",e.target.value)} placeholder="₹ 0" />
          </Field>
          <Field label="A/c No. (editable)">
            <input style={inputStyle} value={form.accNo} onChange={e=>set("accNo",e.target.value)} />
          </Field>
        </div>
        <Field label="IFSC Code (editable)">
          <input style={inputStyle} value={form.ifsc} onChange={e=>set("ifsc", e.target.value.toUpperCase())} />
        </Field>
        <Field label="Description">
          <textarea style={{...inputStyle, resize:"vertical"}} rows={3} value={form.description} onChange={e=>set("description",e.target.value)} placeholder="What is this payment for?" />
        </Field>
        {looksLikeSalary(form.category, form.subCategory) && (
          <div style={{ background:"#EEF0FE", border:`1px solid #3F6CA8`, borderRadius:12, padding:12, marginBottom:14, fontSize:13, color:INK, lineHeight:1.5 }}>
            {form.vendorId
              ? <span>Salary payment — <strong>{form.name}</strong> will be recorded as an <strong>Employee</strong> ledger when you save.</span>
              : <span>Salary payment. Pick a saved ledger above and it will be marked as an <strong>Employee</strong> automatically.</span>}
          </div>
        )}

        {form.refNo && (
          <div style={{ fontSize:12, color:MUTED, marginBottom:14 }}>
            Reference: <strong style={{color:INK}}>{form.refNo}</strong>
          </div>
        )}
        <Field label="Payment Status">
          <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:10 }}>
            {STATUS_OPTIONS.map(s => (
              <button key={s} onClick={()=>set("paymentStatus",s)} type="button"
                style={{ borderRadius:12, padding:"12px 0", fontWeight:600, cursor:"pointer",
                  border:`2px solid ${form.paymentStatus===s?STATUS_COLOR[s]:SAND}`,
                  background: form.paymentStatus===s?STATUS_COLOR[s]:"#fff",
                  color: form.paymentStatus===s?"#fff":INK }}>
                {s}
              </button>
            ))}
          </div>
        </Field>

        {form.paymentStatus === "Paid" && (
          <div style={{ background:"#F7FBF8", border:`1px solid ${SAND}`, borderRadius:12, padding:14, marginBottom:16 }}>
            <SectionLabel>Payment details</SectionLabel>
            <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:12 }}>
              <Field label="Payment Date">
                <input type="date" style={inputStyle} value={form.paymentDate||""} onChange={e=>set("paymentDate",e.target.value)} />
              </Field>
              <Field label="Mode">
                <select style={inputStyle} value={form.paymentMode||""} onChange={e=>set("paymentMode",e.target.value)}>
                  <option value="">— select —</option>
                  {PAYMENT_MODES.map(m => <option key={m} value={m}>{m}</option>)}
                </select>
              </Field>
            </div>
            <Field label="UTR / Transaction Ref" hint="Optional for now — you can add it later or import it from the sheet accounts returns">
              <input style={inputStyle} value={form.utr||""} onChange={e=>set("utr",e.target.value)} />
            </Field>
            <div style={{ fontSize:12, color:GREEN, fontWeight:600 }}>
              With a date and mode set, this entry moves to the Payment Register.
            </div>
          </div>
        )}

        <div style={{ marginTop:8 }}>
          <BigButton icon="check" label={editItem ? "Save Changes" : "Add Requisition"} onClick={save} tone="green" full />
        </div>
      </div>
    </div>
  );
}

/* ---------- share helper ---------- */
function requisitionToText(r){
  return `Date: ${fmtDate(r.date)}\nSite: ${r.site}\nCategory: ${r.category}${r.subCategory?" / "+r.subCategory:""}\nName: ${r.name}\nAmount: ₹${fmtINR(r.amount)}\nStatus: ${r.paymentStatus}\nA/c No.: ${r.accNo||"—"}\nIFSC: ${r.ifsc||"—"}\nDescription: ${r.description||"—"}`;
}

async function shareRequisitions(rows){
  if (!rows || rows.length === 0) return;
  let text;
  if (rows.length === 1) {
    text = `Payment Requisition\n\n${requisitionToText(rows[0])}`;
  } else {
    const total = rows.reduce((s,r)=>s+Number(r.amount||0), 0);
    const body = rows.map((r,i) => `${i+1}.\n${requisitionToText(r)}`).join("\n\n");
    text = `Payment Requisitions (${rows.length} entries)\nTotal: ₹${fmtINR(total)}\n\n${body}`;
  }
  if (navigator.share) {
    try { await navigator.share({ title: "Payment Requisition", text }); return; }
    catch(e) { if (e && e.name === "AbortError") return; }
  }
  if (navigator.clipboard) {
    try { await navigator.clipboard.writeText(text); alert("Copied to clipboard — paste it into WhatsApp, email, or anywhere you like."); return; }
    catch(e) { /* fall through to alert below */ }
  }
  alert(text);
}

/* ================= EXPORT TAB ================= */
function ExportTab({ reqs, setReqs, vendors, setVendors, lists, setLists, expenses, setExpenses, goTo, openImport, showToast }){
  const [selected, setSelected] = useState(new Set());
  const [filterStatus, setFilterStatus] = useState("All");
  const [editingRow, setEditingRow] = useState(null);
  const [detailRow, setDetailRow] = useState(null);
  const [bulkSheet, setBulkSheet] = useState(false);
  const [askPayDate, setAskPayDate] = useState(false);
  const [query, setQuery] = useState("");
  const [sortKey, setSortKey] = useState("created");
  const [desc, setDesc] = useState(true);
  const REQ_SORTS = [
    { k:"created", label:"Recently added", get:r=>Number(r.createdAt||0) },
    { k:"date",    label:"Date",           get:r=>r.date||"" },
    { k:"amount",  label:"Amount",         get:r=>Number(r.amount||0) },
    { k:"name",    label:"Payee",          get:r=>String(r.name||"").toLowerCase() },
    { k:"site",    label:"Site",           get:r=>r.site||"" },
    { k:"status",  label:"Status",         get:r=>r.paymentStatus||"" },
    { k:"ref",     label:"Reference",      get:r=>r.refNo||"" },
  ];

  const sorted = useMemo(()=>sortBy(reqs, (REQ_SORTS.find(x=>x.k===sortKey)||REQ_SORTS[0]).get, desc), [reqs, sortKey, desc]);
  const filtered = useMemo(() => {
    const q = (r) => matches(query, dateTerms(r.date, r.paymentDate), r.name, r.refNo, r.site, r.category, r.subCategory, r.description, r.amount, r.utr);
    if (filterStatus === "In Register") return sorted.filter(r => isInRegister(r) && q(r));
    // "Paid" shows every paid entry, whether or not it has moved to the register
    if (filterStatus === "Paid") return sorted.filter(r => r.paymentStatus === "Paid" && q(r));
    const open = sorted.filter(r => !isInRegister(r) && q(r));
    return filterStatus === "All" ? open : open.filter(r => r.paymentStatus === filterStatus);
  }, [sorted, filterStatus, query]);

  function toggle(id){ setSelected(prev => { const next=new Set(prev); next.has(id)?next.delete(id):next.add(id); return next; }); }
  function selectAll(){ setSelected(selected.size===filtered.length ? new Set() : new Set(filtered.map(r=>r.id))); }

  function exportRows(rows){
    if (rows.length===0) { showToast("Select at least one requisition to export","error"); return; }
    const data = rows.map(r => ({
      "Ref No.":r.refNo||"",
      Date:fmtDate(r.date), Site:r.site, Category:r.category, "Sub-Category":r.subCategory,
      Name:r.name, Amount:Number(r.amount)||0, Description:r.description,
      "Payment Status":r.paymentStatus, "A/c No.":r.accNo, "IFSC Code":r.ifsc,
      "Payment Date":fmtDate(r.paymentDate), "Payment Mode":r.paymentMode||"", "UTR":r.utr||"",
    }));
    const ws = XLSX.utils.json_to_sheet(data);
    ws["!cols"] = [{wch:16},{wch:12},{wch:16},{wch:14},{wch:14},{wch:20},{wch:12},{wch:28},{wch:14},{wch:18},{wch:14},{wch:14},{wch:14},{wch:22}];
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, "Payment Requisition");
    const filename = `Payment_Requisition_${todayStr()}.xlsx`;
    XLSX.writeFile(wb, filename);
    const ids = new Set(rows.map(r=>r.id));
    setReqs(reqs.map(r => ids.has(r.id) ? {...r, exported:true} : r));
    setSelected(new Set());
    showToast(`Exported ${rows.length} row(s) to ${filename}`);
  }
  function exportSelected(){ exportRows(reqs.filter(r=>selected.has(r.id))); }

  function deleteRow(r){
    if (!confirm(`Delete the requisition for ${r.name || "this entry"} (₹${fmtINR(r.amount)})? This cannot be undone.`)) return;
    setReqs(reqs.filter(x=>x.id!==r.id));
    setSelected(prev => { const next=new Set(prev); next.delete(r.id); return next; });
    showToast("Requisition deleted");
  }
  function deleteSelected(){
    if (!confirm(`Delete ${selected.size} selected requisition(s)? This cannot be undone.`)) return;
    setReqs(reqs.filter(r=>!selected.has(r.id)));
    setSelected(new Set());
    showToast("Selected requisitions deleted");
  }

  function duplicate(r){
    const copy = { ...r, id: uid(), refNo: nextRefNo(reqs), paymentStatus:"Pending",
      paymentDate:"", paymentMode:"", utr:"", exported:false, createdAt: Date.now() };
    setReqs([...reqs, copy]);
    setDetailRow(copy);
    showToast("Duplicated — edit the copy as needed");
  }

  if (editingRow) {
    return <RequisitionForm vendors={vendors} setVendors={setVendors} reqs={reqs} setReqs={setReqs} lists={lists} setLists={setLists}
      showToast={showToast} editItem={editingRow}
      onDone={()=>{ setEditingRow(null); }} />;
  }

  if (detailRow) {
    const live = reqs.find(r => r.id === detailRow.id);
    if (!live) { setDetailRow(null); return null; }
    return <RequisitionDetail req={live} vendors={vendors} reqs={reqs} setReqs={setReqs} expenses={expenses} setExpenses={setExpenses} lists={lists} setLists={setLists} goTo={goTo} showToast={showToast}
      onBack={()=>setDetailRow(null)}
      onEdit={()=>{ setEditingRow(live); setDetailRow(null); }}
      onExport={(r)=>exportRows([r])}
      onDuplicate={duplicate} />;
  }

  const selectedRows = reqs.filter(r=>selected.has(r.id));
  const selectedTotal = selectedRows.reduce((s,r)=>s+Number(r.amount||0), 0);

  return (
    <div>
      <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr 1fr", gap:8, marginBottom:14 }}>
        <button onClick={()=>goTo && goTo("requisition")}
          style={{ borderRadius:14, padding:"12px 6px", fontSize:13, fontWeight:700, background:AMBER, color:"#fff", border:"none", cursor:"pointer" }}>
          New
        </button>
        <button onClick={()=>openImport && openImport("requisitions")}
          style={{ borderRadius:14, padding:"12px 6px", fontSize:13, fontWeight:600, background:SAND, color:INK, border:"none", cursor:"pointer" }}>
          From Excel
        </button>
        <button onClick={()=>goTo && goTo("sheets")}
          style={{ borderRadius:14, padding:"12px 6px", fontSize:13, fontWeight:600, background:SAND, color:INK, border:"none", cursor:"pointer" }}>
          From Sheets
        </button>
      </div>

      <div style={{ display:"flex", gap:8, marginBottom:16, overflowX:"auto", paddingBottom:4 }}>
        {["All", ...STATUS_OPTIONS, "In Register"].map(s => (
          <button key={s} onClick={()=>setFilterStatus(s)}
            style={{ padding:"8px 14px", borderRadius:12, fontSize:14, fontWeight:600, whiteSpace:"nowrap", cursor:"pointer",
              background: filterStatus===s?INK:"#fff", color: filterStatus===s?"#fff":INK, border:`1px solid ${filterStatus===s?INK:SAND}` }}>
            {s}
          </button>
        ))}
      </div>
      {filtered.length===0 ? <EmptyState text={filterStatus==="In Register"
          ? "No payments have been completed yet. Mark a requisition Paid and enter the payment details to move it here."
          : "No requisitions match this filter."} /> : (
        <React.Fragment>
          <SearchBox value={query} onChange={setQuery} placeholder="Search date, payee, reference, site, description" />
          <SortBar sortKey={sortKey} onSortKey={setSortKey} options={REQ_SORTS} desc={desc} onDesc={setDesc} />
          <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:12 }}>
            <button onClick={selectAll} style={{ fontSize:14, fontWeight:600, color:AMBER, background:"none", border:"none", cursor:"pointer" }}>
              {selected.size===filtered.length ? "Deselect all" : `Select all (${filtered.length})`}
            </button>
            <span style={{ fontSize:12, color:MUTED }}>Tap an entry to open it</span>
          </div>
          <div style={{ display:"flex", flexDirection:"column", gap:8, marginBottom: selected.size>0 ? 170 : 100 }}>
            {filtered.map(r => (
              <div key={r.id} onClick={()=>setDetailRow(r)}
                style={{ background:SURFACE, borderRadius:16, padding:16, display:"flex", alignItems:"flex-start", gap:12, cursor:"pointer",
                  border:`1.5px solid ${selected.has(r.id)?AMBER:SAND}` }}>
                <div onClick={(e)=>{ e.stopPropagation(); toggle(r.id); }}
                  style={{ width:22,height:22,borderRadius:6,marginTop:2,display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0,cursor:"pointer",
                  background: selected.has(r.id)?AMBER:"#fff", border:`2px solid ${selected.has(r.id)?AMBER:"#C7D0DE"}` }}>
                  {selected.has(r.id) && <Icon name="check" size={13} color="#fff" />}
                </div>
                <div style={{ flex:1, minWidth:0 }}>
                  <div style={{ display:"flex", justifyContent:"space-between", gap:8 }}>
                    <div style={{ fontWeight:700, color:INK, overflow:"hidden", textOverflow:"ellipsis", whiteSpace:"nowrap" }}>{r.name||"Unnamed"}</div>
                    <div style={{ fontWeight:700, color:INK, flexShrink:0 }}>₹{fmtINR(r.amount)}</div>
                  </div>
                  <div style={{ fontSize:12, color:MUTED, marginTop:2 }}>{fmtDate(r.date)} · {r.site} · {r.category}</div>
                  <div style={{ display:"flex", alignItems:"center", gap:8, marginTop:8 }}>
                    <span style={{ fontSize:11, fontWeight:600, padding:"2px 8px", borderRadius:999, color:"#fff", background:STATUS_COLOR[r.paymentStatus] }}>{r.paymentStatus}</span>
                    {r.exported && <span style={{ fontSize:11, fontWeight:500, padding:"2px 8px", borderRadius:999, background:SAND, color:INK }}>Exported</span>}
                    {r.paymentStatus==="Paid" && !isInRegister(r) && (
                      <span style={{ fontSize:11, fontWeight:600, padding:"2px 8px", borderRadius:999, background:"#EEF0FE", color:AMBER }}>Needs payment details</span>
                    )}
                    {isInRegister(r) && (
                      <span style={{ fontSize:11, fontWeight:600, padding:"2px 8px", borderRadius:999, background:"#E6F7F2", color:GREEN }}>In Register</span>
                    )}
                  </div>
                </div>
                <Icon name="chevron" size={18} color="#B6C2D4" />
              </div>
            ))}
          </div>
        </React.Fragment>
      )}

      {/* bulk action bar */}
      {selected.size > 0 && (
        <div style={{ position:"fixed", bottom:140, left:0, right:0, padding:"0 16px", zIndex:30 }}>
          <div style={{ maxWidth:720, margin:"0 auto", background:INK, borderRadius:16, padding:"12px 14px", display:"flex", alignItems:"center", gap:10, boxShadow:"0 4px 14px rgba(0,0,0,0.2)" }}>
            <div style={{ flex:1, minWidth:0 }}>
              <div style={{ color:"#fff", fontWeight:700, fontSize:14 }}>{selected.size} selected</div>
              <div style={{ color:"#8FA0BC", fontSize:12 }}>₹{fmtINR(selectedTotal)}</div>
            </div>
            <button onClick={()=>setBulkSheet(true)}
              style={{ padding:"10px 16px", borderRadius:12, fontWeight:700, fontSize:14, background:AMBER, color:"#fff", border:"none", cursor:"pointer" }}>
              Options
            </button>
          </div>
        </div>
      )}

      <div style={{ position:"fixed", bottom:76, left:0, right:0, padding:"0 16px", zIndex:30 }}>
        <div style={{ maxWidth:720, margin:"0 auto" }}>
          <BigButton icon="download" label={`Export ${selected.size||""} to Excel`.trim()} onClick={exportSelected} tone="green" full />
        </div>
      </div>

      {/* bulk action sheet */}
      {askPayDate && (() => {
        const rows = selectedRows;
        const already = rows.filter(isInRegister);
        const info = (
          <div style={{ background:"#F1F4F9", borderRadius:14, padding:14, marginBottom:16 }}>
            <div style={{ display:"flex", justifyContent:"space-between", fontSize:13, marginBottom:5 }}>
              <span style={{ color:MUTED }}>Requisitions</span>
              <span style={{ fontWeight:700, color:INK }}>{rows.length}</span>
            </div>
            <div style={{ display:"flex", justifyContent:"space-between", fontSize:15,
              paddingTop:8, borderTop:`1px solid ${SAND}` }}>
              <span style={{ fontWeight:700, color:INK }}>Total</span>
              <span className="num" style={{ fontWeight:800, color:INK }}>₹{fmtINR(selectedTotal)}</span>
            </div>
            {already.length > 0 && (
              <div style={{ fontSize:12.5, color:AMBER, fontWeight:600, marginTop:10, lineHeight:1.5 }}>
                {already.length} of these already has a payment date. It will be replaced.
              </div>
            )}
            <div style={{ fontSize:12, color:MUTED, marginTop:9, lineHeight:1.5 }}>
              Each one is marked Paid on this date and moves into the Payment Register.
            </div>
          </div>
        );
        return (
          <DatePickModal
            title="Date these were paid"
            subtitle="One date applied to every requisition you selected."
            label="Payment date"
            initial={todayStr()}
            confirmLabel={`Mark ${rows.length} as paid`}
            extra={info}
            onCancel={()=>setAskPayDate(false)}
            onConfirm={(iso)=>{
              setReqs(reqs.map(r => selected.has(r.id)
                ? { ...r, paymentStatus:"Paid", paymentDate: iso,
                    paymentMode: r.paymentMode || "NEFT" }
                : r));
              setAskPayDate(false);
              setBulkSheet(false);
              setSelected(new Set());
              showToast(`${rows.length} marked paid on ${fmtDate(iso)}`);
            }}
          />
        );
      })()}

      {bulkSheet && (
        <ActionSheet
          title={`${selected.size} entries selected`}
          subtitle={`Total ₹${fmtINR(selectedTotal)}`}
          onClose={()=>setBulkSheet(false)}
          actions={[
            { label:"Set the date these were paid", icon:"check", onPress: ()=>setAskPayDate(true) },
            { label:`Share all ${selected.size}`, icon:"share", onPress: ()=>shareRequisitions(selectedRows) },
            { label:"Export to Excel", icon:"download", onPress: ()=>exportRows(selectedRows) },
            { label:"Clear selection", icon:"close", onPress: ()=>setSelected(new Set()) },
            { label:`Delete all ${selected.size}`, icon:"trash", danger:true, onPress: deleteSelected },
          ]}
        />
      )}
    </div>
  );
}

/* ================= RECURRING RENTALS & INSTALLMENTS ================= */
function RecurringTab({ vendors, setVendors, recurring, setRecurring, reqs, setReqs, lists, setLists, showToast, goTo, openImport }){
  const [editing, setEditing] = useState(null);
  const [showForm, setShowForm] = useState(false);
  const [openItem, setOpenItem] = useState(null);
  const [groupFilter, setGroupFilter] = useState("All");
  const [stateFilter, setStateFilter] = useState("Live");
  const [siteFilter, setSiteFilter] = useState("All");
  const [selected, setSelected] = useState(new Set());
  const [bulkOpen, setBulkOpen] = useState(false);
  const [sortKey, setSortKey] = useState("due");
  const [desc, setDesc] = useState(false);
  const [query, setQuery] = useState("");
  const REC_SORTS = [
    { k:"due",     label:"Next due",   get:r=>r.nextDueDate||"" },
    { k:"amount",  label:"Amount",     get:r=>Number(r.amount||0) },
    { k:"month",   label:"Per month",  get:r=>Number(r.amount||0)*monthlyFactor(r.frequency).factor },
    { k:"name",    label:"Name",       get:r=>String(r.name||"").toLowerCase() },
    { k:"payee",   label:"Pay to",     get:r=>String(r.ownerName||"").toLowerCase() },
    { k:"group",   label:"Rent / EMI", get:r=>costGroupOf(r) },
    { k:"owed",    label:"Still owed", get:r=>{ const t=Number(r.totalInstallments||0),pd=Number(r.installmentsPaid||0);
                                                return t>0 ? Math.max(0,t-pd)*Number(r.amount||0) : 0; } },
  ];

  const rSites = useMemo(
    () => [...new Set(recurring.map(r=>r.site).filter(Boolean))].sort(), [recurring]);

  const sortedRaw = useMemo(() => [...recurring]
    .filter(r => {
      if (groupFilter !== "All" && costGroupOf(r) !== groupFilter) return false;
      if (siteFilter !== "All" && (r.site||"") !== siteFilter) return false;
      if (!matches(query, dateTerms(r.nextDueDate), r.name, r.ownerName, r.type, r.site, r.category, r.amount)) return false;
      const done = instalmentDone(r);
      if (stateFilter === "Live")      return r.active !== false && !done;
      if (stateFilter === "Due soon")  return r.active !== false && !done && daysUntil(r.nextDueDate) <= 7;
      if (stateFilter === "Overdue")   return r.active !== false && !done && daysUntil(r.nextDueDate) < 0;
      if (stateFilter === "Paused")    return r.active === false;
      if (stateFilter === "Completed") return done;
      return true;
    }), [recurring, groupFilter, stateFilter, siteFilter]);
  const sorted = useMemo(
    () => sortBy(sortedRaw, (REC_SORTS.find(x=>x.k===sortKey)||REC_SORTS[0]).get, desc),
    [sortedRaw, sortKey, desc]);

  const filteredMonthly = sorted.reduce(
    (s,r) => s + Number(r.amount||0) * monthlyFactor(r.frequency).factor, 0);


  function openNew(){ setEditing({ ...emptyRecurring, id: uid(), nextDueDate: todayStr() }); setShowForm(true); }
  function openEdit(item){ setEditing({ ...item }); setShowForm(true); }
  function save(item){
    if (!item.name.trim()) { showToast("Give this a name, e.g. 'Office Rent'", "error"); return; }
    if (!item.nextDueDate) { showToast("Set the next due date", "error"); return; }
    if (!item.amount || Number(item.amount) <= 0) { showToast("Enter a valid amount", "error"); return; }
    const exists = recurring.some(r => r.id === item.id);
    const next = exists ? recurring.map(r => r.id===item.id ? item : r) : [...recurring, item];
    setRecurring(next);
    setShowForm(false);
    showToast("Saved");
  }
  function remove(id){ setRecurring(recurring.filter(r => r.id !== id)); showToast("Removed"); }

  function toggleSel(id){
    setSelected(prev => { const n = new Set(prev); n.has(id) ? n.delete(id) : n.add(id); return n; });
  }

  function rowsFor(list){
    return list.map(r => {
      const mf = monthlyFactor(r.frequency);
      const total = Number(r.totalInstallments||0), paid = Number(r.installmentsPaid||0);
      const left = total > 0 ? Math.max(0, total - paid) : "";
      const owner = vendors.find(x => x.id === r.vendorId);
      return {
        "Counts As": costGroupOf(r),
        Name: r.name || "",
        Type: r.type || "",
        "Pay To": r.ownerName || (owner ? owner.name : ""),
        Amount: Number(r.amount)||0,
        Frequency: r.frequency || "",
        "Per Month": +(Number(r.amount||0) * mf.factor).toFixed(2),
        "Frequency Assumed": mf.assumed ? "Yes - please check" : "",
        "Next Due": fmtDate(r.nextDueDate),
        "Total Instalments": total || "",
        "Paid": total ? paid : "",
        "Left": left,
        "Still Owed": total ? left * Number(r.amount||0) : "",
        Site: r.site || "",
        Category: r.category || "",
        "Sub-Category": r.subCategory || "",
        "A/c No.": r.accNo || "",
        "IFSC Code": r.ifsc || "",
        Status: instalmentDone(r) ? "Completed" : (r.active === false ? "Paused" : "Active"),
      };
    });
  }

  function exportRecurring(list, tag){
    if (!list.length) { showToast("Nothing to export", "error"); return; }
    const cols = [{wch:12},{wch:28},{wch:20},{wch:22},{wch:13},{wch:13},{wch:13},{wch:18},{wch:12},
                  {wch:15},{wch:8},{wch:8},{wch:14},{wch:16},{wch:14},{wch:14},{wch:20},{wch:14},{wch:12}];
    const wb = XLSX.utils.book_new();
    const groups = { Rent:[], Instalment:[], Other:[] };
    list.forEach(r => groups[costGroupOf(r)].push(r));
    Object.entries(groups).forEach(([g, arr]) => {
      if (!arr.length) return;
      const ws = XLSX.utils.json_to_sheet(rowsFor(arr));
      ws["!cols"] = cols;
      XLSX.utils.book_append_sheet(wb, ws, g === "Instalment" ? "Instalments" : g);
    });
    const all = XLSX.utils.json_to_sheet(rowsFor(list));
    all["!cols"] = cols;
    XLSX.utils.book_append_sheet(wb, all, "All");

    const sp = commitmentSplit(list);
    const sum = [
      { Head:"Rent - per month", Items:sp.rents.length, Amount:sp.rentMonthly },
      { Head:"Instalments - per month", Items:sp.emis.length, Amount:sp.emiMonthly },
      { Head:"Other - per month", Items:sp.others.length, Amount:sp.otherMonthly },
      { Head:"TOTAL PER MONTH", Items:"", Amount:sp.totalMonthly },
      { Head:"", Items:"", Amount:"" },
      { Head:"Instalments still owed", Items:"", Amount:sp.emiOutstanding },
      { Head:"One-time due (not monthly)", Items:sp.oneTime.length, Amount:sp.oneTimeTotal },
    ];
    const sws = XLSX.utils.json_to_sheet(sum);
    sws["!cols"] = [{wch:32},{wch:10},{wch:18}];
    XLSX.utils.book_append_sheet(wb, sws, "Summary");
    XLSX.writeFile(wb, `Rent_EMI_${tag}_${todayStr()}.xlsx`);
    showToast(`Exported ${list.length} item(s)`);
  }

  function bulkSetActive(val){
    const ids = selected;
    setRecurring(recurring.map(r => ids.has(r.id) ? { ...r, active: val } : r));
    setSelected(new Set());
    showToast(val ? "Resumed" : "Paused");
  }
  function bulkDelete(){
    if (!confirm(`Delete ${selected.size} item(s)? This cannot be undone.`)) return;
    setRecurring(recurring.filter(r => !selected.has(r.id)));
    setSelected(new Set());
    showToast("Deleted");
  }
  function bulkGenerate(){
    const list = recurring.filter(r => selected.has(r.id) && r.active !== false && !instalmentDone(r));
    if (!list.length) { showToast("Nothing eligible in the selection", "error"); return; }
    if (!confirm(`Create ${list.length} payment requisition(s) now?`)) return;
    let curReqs = reqs, curRec = recurring;
    list.forEach(item => {
      const live = curRec.find(x => x.id === item.id) || item;
      const record = {
        ...emptyReq, id: uid(), refNo: nextRefNo(curReqs), date: todayStr(), site: live.site,
        category: live.category || live.type, subCategory: live.subCategory,
        vendorId: live.vendorId, name: live.ownerName || live.name, amount: live.amount,
        description: `Recurring - ${live.type}${live.frequency!=="One-time" ? " ("+live.frequency+")" : ""}`,
        paymentStatus: "Pending", accNo: live.accNo, ifsc: live.ifsc,
        exported: false, createdAt: Date.now(), recurringId: live.id,
      };
      curReqs = [...curReqs, record];
      const upd = { ...live };
      if (live.frequency === "One-time") upd.active = false;
      else upd.nextDueDate = addInterval(live.nextDueDate, live.frequency);
      if (isInstalment(live) && live.installmentsPaid !== "") {
        upd.installmentsPaid = (Number(live.installmentsPaid)||0) + 1;
        if (Number(live.totalInstallments) && upd.installmentsPaid >= Number(live.totalInstallments)) upd.active = false;
      }
      curRec = curRec.map(x => x.id === live.id ? upd : x);
    });
    setReqs(curReqs);
    setRecurring(curRec);
    setSelected(new Set());
    showToast(`${list.length} requisition(s) created`);
  }

  // Anything with a payee name but no ledger behind it gets one created now.
  const missingLedgers = useMemo(() => recurring.filter(r => {
    const nm = String(r.ownerName || "").trim();
    if (!nm) return false;
    return !vendors.some(v => v.id === r.vendorId
      || String(v.name||"").trim().toLowerCase() === nm.toLowerCase());
  }), [recurring, vendors]);

  function createMissingLedgers(){
    if (missingLedgers.length === 0) return;
    const made = [];
    const findAny = (nm) => {
      const t = nm.trim().toLowerCase();
      return vendors.find(v => String(v.name||"").trim().toLowerCase() === t)
          || made.find(v => String(v.name||"").trim().toLowerCase() === t) || null;
    };
    const owners = [], financiers = [];
    missingLedgers.forEach(r => {
      const nm = String(r.ownerName||"").trim();
      if (findAny(nm)) return;
      const group = costGroupOf(r);
      const type = group === "Instalment" ? "Financier" : "Owner";
      const v = { ...emptyVendor, id: uid(), name: nm, ledgerType: type,
                  accNo: r.accNo || "", ifsc: r.ifsc || "", category: r.type || "" };
      made.push(v);
      (type === "Owner" ? owners : financiers).push(nm);
    });
    if (made.length === 0) { showToast("Every payee already has a ledger"); return; }
    if (!confirm(
      `Create ${made.length} missing ledger(s)?\n\n` +
      `Owners (rent): ${owners.length}\n` +
      `Financiers (instalments): ${financiers.length}\n\n` +
      `Instalments are paid to banks and finance companies, so those go under Financier and stay out of your Owners list.`
    )) return;
    const nextV = [...vendors, ...made];
    setVendors(nextV);
    // link each entry to its ledger and pick up bank details
    setRecurring(recurring.map(r => {
      const nm = String(r.ownerName||"").trim();
      if (!nm) return r;
      const v = nextV.find(x => String(x.name||"").trim().toLowerCase() === nm.toLowerCase());
      if (!v) return r;
      return { ...r, vendorId: v.id, accNo: r.accNo || v.accNo || "", ifsc: r.ifsc || v.ifsc || "" };
    }));
    showToast(`${made.length} ledger(s) created`);
  }
  function toggleActive(item){ setRecurring(recurring.map(r => r.id===item.id ? {...r, active: !r.active} : r)); }

  if (showForm) return <RecurringForm item={editing} vendors={vendors} lists={lists} setLists={setLists} reqs={reqs} onCancel={()=>setShowForm(false)} onSave={save} />;

  if (openItem) {
    const live = recurring.find(r => r.id === openItem.id);
    if (!live) { setOpenItem(null); return null; }
    return <CommitmentDetail item={live} reqs={reqs} vendors={vendors} showToast={showToast}
      onBack={()=>setOpenItem(null)}
      onEdit={()=>{ setOpenItem(null); openEdit(live); }}
      onToggle={()=>toggleActive(live)}
      onGenerate={()=>generateRequisitionFromRecurring(live, reqs, setReqs, recurring, setRecurring, showToast)} />;
  }

  return (
    <div>
      <button onClick={()=>goTo("dashboard")} style={{ display:"flex", alignItems:"center", gap:6, marginBottom:16, fontSize:14, fontWeight:600, color:INK, background:"none", border:"none", cursor:"pointer" }}>
        <Icon name="close" size={16} /> Back to dashboard
      </button>
      {missingLedgers.length > 0 && (
        <div style={{ background:"#EEF0FE", border:`1.5px solid ${AMBER}`, borderRadius:18, padding:16, marginBottom:14 }}>
          <div style={{ fontWeight:700, color:INK, fontSize:14, marginBottom:6 }}>
            {missingLedgers.length} payee(s) have no ledger
          </div>
          <div style={{ fontSize:13, color:INK, lineHeight:1.6, marginBottom:12 }}>
            {missingLedgers.slice(0,5).map(r=>r.ownerName).join(", ")}
            {missingLedgers.length > 5 ? ` and ${missingLedgers.length-5} more` : ""}.
            Landlords will be added as Owners; anyone paid an instalment goes in as a Financier.
          </div>
          <BigButton icon="check" label="Create the missing ledgers" onClick={createMissingLedgers} tone="amber" full />
        </div>
      )}

      {(() => {
        const sp = commitmentSplit(recurring);
        if (sp.liveCount === 0) return null;
        return (
          <div style={{ background:SURFACE, borderRadius:20, padding:18, marginBottom:14, border:`1px solid ${SAND}`, boxShadow:SHADOW }}>
            <SectionLabel>What this costs</SectionLabel>
            <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:10 }}>
              <div style={{ background:"#F1F4F9", borderRadius:14, padding:14 }}>
                <div style={{ fontSize:11, fontWeight:700, color:AMBER, textTransform:"uppercase", letterSpacing:"0.06em" }}>Rent</div>
                <div className="num" style={{ fontSize:19, fontWeight:700, color:INK, marginTop:4 }}>₹{fmtINR(sp.rentMonthly)}</div>
                <div style={{ fontSize:11, color:MUTED }}>per month · {sp.rents.length} item(s)</div>
              </div>
              <div style={{ background:"#F1F4F9", borderRadius:14, padding:14 }}>
                <div style={{ fontSize:11, fontWeight:700, color:GREEN, textTransform:"uppercase", letterSpacing:"0.06em" }}>Instalments</div>
                <div className="num" style={{ fontSize:19, fontWeight:700, color:INK, marginTop:4 }}>₹{fmtINR(sp.emiMonthly)}</div>
                <div style={{ fontSize:11, color:MUTED }}>per month · {sp.emis.length} item(s)</div>
              </div>
            </div>

            {sp.otherMonthly > 0 && (
              <div style={{ display:"flex", justifyContent:"space-between", padding:"10px 0 0", fontSize:13 }}>
                <span style={{ color:MUTED }}>Other · {sp.others.length}</span>
                <span className="num" style={{ fontWeight:700, color:INK }}>₹{fmtINR(sp.otherMonthly)} / month</span>
              </div>
            )}

            <div style={{ display:"flex", justifyContent:"space-between", marginTop:12, paddingTop:12, borderTop:`1px solid ${SAND}` }}>
              <span style={{ fontWeight:700, color:INK, fontSize:14 }}>Total monthly outgo</span>
              <span className="num" style={{ fontWeight:800, color:INK, fontSize:16 }}>₹{fmtINR(sp.totalMonthly)}</span>
            </div>

            {sp.emiOutstanding > 0 && (
              <div style={{ display:"flex", justifyContent:"space-between", marginTop:8, fontSize:13 }}>
                <span style={{ color:MUTED }}>Instalments still owed</span>
                <span className="num" style={{ fontWeight:700, color:AMBER }}>₹{fmtINR(sp.emiOutstanding)}</span>
              </div>
            )}
            {sp.oneTimeTotal > 0 && (
              <div style={{ display:"flex", justifyContent:"space-between", marginTop:6, fontSize:13 }}>
                <span style={{ color:MUTED }}>One-time due (not in monthly)</span>
                <span className="num" style={{ fontWeight:700, color:INK }}>₹{fmtINR(sp.oneTimeTotal)}</span>
              </div>
            )}

            <div style={{ fontSize:11, color:MUTED, marginTop:12, lineHeight:1.6 }}>
              Quarterly, half-yearly and yearly items are shown as their monthly equivalent.
              Finished instalments and paused items are excluded.
              {sp.emisWithoutSchedule > 0 && ` ${sp.emisWithoutSchedule} instalment(s) have no total count set, so the amount still owed cannot include them.`}
            </div>
          </div>
        );
      })()}

      <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr 1fr", gap:8 }}>
        <button onClick={openNew}
          style={{ borderRadius:14, padding:"12px 6px", fontSize:13, fontWeight:700, background:GRAD, color:"#fff", border:"none", cursor:"pointer" }}>
          Add New
        </button>
        <button onClick={()=>openImport("recurring")}
          style={{ borderRadius:14, padding:"12px 6px", fontSize:13, fontWeight:600, background:SAND, color:INK, border:"none", cursor:"pointer" }}>
          Import
        </button>
        <button onClick={()=>exportRecurring(sorted, "Filtered")}
          style={{ borderRadius:14, padding:"12px 6px", fontSize:13, fontWeight:700, background:GREEN, color:"#fff", border:"none", cursor:"pointer" }}>
          Export
        </button>
      </div>
      <div style={{ display:"flex", gap:8, marginTop:16, marginBottom:8, overflowX:"auto", paddingBottom:4 }}>
        {["All", ...COST_GROUPS].map(g => {
          const on = groupFilter === g;
          const n = g === "All" ? recurring.length : recurring.filter(r=>costGroupOf(r)===g).length;
          return (
            <button key={g} onClick={()=>setGroupFilter(g)}
              style={{ padding:"8px 14px", borderRadius:12, fontSize:14, fontWeight:600, whiteSpace:"nowrap", cursor:"pointer",
                background: on?AMBER:SURFACE, color: on?"#fff":INK, border:`1px solid ${on?AMBER:SAND}` }}>
              {g} ({n})
            </button>
          );
        })}
      </div>

      <div style={{ display:"flex", gap:8, marginBottom:8, overflowX:"auto", paddingBottom:4 }}>
        {["Live","Due soon","Overdue","Paused","Completed","All"].map(x => {
          const on = stateFilter === x;
          return (
            <button key={x} onClick={()=>setStateFilter(x)}
              style={{ padding:"8px 13px", borderRadius:12, fontSize:13.5, fontWeight:600, whiteSpace:"nowrap", cursor:"pointer",
                background: on?INK:SURFACE, color: on?"#fff":INK, border:`1px solid ${on?INK:SAND}` }}>
              {x}
            </button>
          );
        })}
      </div>

      {rSites.length > 1 && (
        <div style={{ display:"flex", gap:8, marginBottom:8, overflowX:"auto", paddingBottom:4 }}>
          {["All", ...rSites].map(x => {
            const on = siteFilter === x;
            return (
