        if (sh.tab && sh.tab.trim()) url += (url.indexOf("?")>=0 ? "&" : "?") + "sheet=" + encodeURIComponent(sh.tab.trim());
        const data = await jsonpFetch(url, 25000);
        if (!data || data.ok === false) throw new Error((data && data.error) || "The script reported an error");
        (data.rows || []).forEach(r => collected.push({ row:r, source: r.__folder || r.__file || sh.name }));
        if (data.files) fileReport.push(...data.files);
        if (data.skipped && data.skipped.length) skippedFiles.push(...data.skipped);
        if (data.seen) seenFiles.push(...data.seen);
        if (data.notes) notes.push(...data.notes);
        statusById[sh.id] = {
          status: (data.rows || []).length > 0 ? "active" : "empty",
          lastCheck: new Date().toISOString(),
          lastError: "",
          siteStats: siteStatsFrom(data),
          rowCount: (data.rows || []).length,
        };
      } catch (err) {
        failures.push({ name: sh.name, why: err.message || String(err) });
        statusById[sh.id] = {
          status: "failed",
          lastCheck: new Date().toISOString(),
          lastError: err.message || String(err),
        };
      }
    }
    setBusy("");
    if (Object.keys(statusById).length) {
      setSheets(sheets.map(x => statusById[x.id] ? { ...x, ...statusById[x.id] } : x));
    }
    if (collected.length === 0) {
      showToast(failures.length ? failures[0].why : "No rows could be read — see the details", "error");
      setPreview({ toAdd:[], duplicates:[], errors:[], failures, fileReport, skippedFiles, seenFiles, notes, list });
      return;
    }
    buildPreview(collected, failures, list, fileReport, skippedFiles, seenFiles, notes);
  }

  function buildPreview(collected, failures, list, fileReport, skippedFiles, seenFiles, notes){
    const kind = (list[0] && list[0].kind) || "requisitions";
    const tpl = kind === "expenses" ? EXPENSE_TEMPLATE : REQ_TEMPLATE;
    const headers = [...new Set(collected.flatMap(c => Object.keys(c.row)))]
      .filter(h => h !== "__file" && h !== "__folder");
    const map = autoMapHeaders(headers, tpl);
    const missing = tpl.filter(f => f.required && !map[f.key]);
    const toAdd = [], duplicates = [], errors = [];

    if (kind === "expenses") {
      // Mirrors ImportTab's own "expenses" row handling (see ImportTab.buildPreview),
      // kept as its own copy here since this tab intentionally stays append-only —
      // simpler than the update-merge logic Import from Excel supports.
      const etypes = (lists && lists.expenseTypes) ? lists.expenseTypes : DEFAULT_LISTS.expenseTypes;
      const existingKeys = new Set((expenses||[]).map(e =>
        [e.date || e.periodText, String(e.paidBy||"").toLowerCase(), Number(e.amount||0),
         String(e.description||"").toLowerCase(), String(e.subCategory||"").toLowerCase()].join("|")));
      const seenKeys = new Set();

      collected.forEach((c, i) => {
        const { out, problems } = mapRowGeneric(c.row, tpl, map);
        if (problems.length) { errors.push({ source:c.source, rowNum:i+2, why:`missing ${problems.join(", ")}` }); return; }

        const raw = String(out.dateRaw || "").trim();
        delete out.dateRaw;
        const parsedDate = excelToDateStr(raw);
        out.date = parsedDate || "";
        out.periodText = parsedDate ? "" : raw;

        if (!out.expenseType || !etypes.includes(out.expenseType)) {
          const t = String(out.expenseType||"").toLowerCase();
          out.expenseType = t.indexOf("travel")>=0 ? "Travel"
            : t.indexOf("office")>=0 ? "Office"
            : (t.indexOf("purchase")>=0 || t.indexOf("site")>=0) ? "Site Purchase"
            : (out.expenseType || etypes[0] || "Site Purchase");
        }
        if (out.paidDate && !String(out.settledTo||"").trim()) out.settledTo = out.paidBy || "";
        if (!out.site) out.site = c.source;

        const k = [out.date || out.periodText, String(out.paidBy||"").toLowerCase(), Number(out.amount||0),
                   String(out.description||"").toLowerCase(), String(out.subCategory||"").toLowerCase()].join("|");
        if (existingKeys.has(k)) { duplicates.push({ data:out, source:c.source, why:"already in the app" }); return; }
        if (seenKeys.has(k)) { duplicates.push({ data:out, source:c.source, why:"repeated inside this sync" }); return; }
        seenKeys.add(k);
        toAdd.push({ data:out, source:c.source });
      });

      setPreview({ kind, toAdd, duplicates, errors, failures, missing, map, headers, list, fileReport, skippedFiles, seenFiles, notes });
      return;
    }

    // Nothing already recorded gets added again. A sheet source rarely carries
    // its own Ref No or UTR (those get assigned once a row lands in the app), so
    // comparing on those — like importDupKey does for a one-off Excel import —
    // would never match on a re-sync and let the same row back in every time.
    // Match on date + site + name + amount + description instead, which is what
    // a repeated sync of the same sheet will actually reproduce.
    const sheetDupKey = (r) => [dupKey(r), String(r.description||"").trim().toLowerCase()].join("|");
    const existingKeys = new Set(reqs.map(sheetDupKey));
    const seenKeys = new Set();
    // A row that syncs in already paid, and whose Name matches exactly one active
    // Rent & EMI item, also settles that item — same as generating it by hand
    // would (advances the due date, counts an instalment). Skipped whenever the
    // name is ambiguous or matches nothing, so this never guesses wrong.
    const activeRecurring = (recurring||[]).filter(r => r.active !== false);

    collected.forEach((c, i) => {
      const { out, problems } = mapRowGeneric(c.row, tpl, map);
      if (problems.length) { errors.push({ source:c.source, rowNum:i+2, why:`missing ${problems.join(", ")}` }); return; }

      settleRequisitionDates(out);
      if (!out.site) out.site = c.source;

      const k = sheetDupKey(out);
      if (existingKeys.has(k)) { duplicates.push({ data:out, source:c.source, why:"already in the app" }); return; }
      if (seenKeys.has(k)) { duplicates.push({ data:out, source:c.source, why:"repeated inside this sync" }); return; }
      seenKeys.add(k);

      if (out.paymentStatus === "Paid") {
        const nameMatches = activeRecurring.filter(r =>
          String(r.name||"").trim().toLowerCase() === String(out.name||"").trim().toLowerCase());
        if (nameMatches.length === 1) out.__recurringMatchId = nameMatches[0].id;
      }
      toAdd.push({ data:out, source:c.source });
    });

    setPreview({ kind, toAdd, duplicates, errors, failures, missing, map, headers, list, fileReport, skippedFiles, seenFiles, notes });
  }

  async function testConnection(sh){
    setBusy(sh.name);
    try {
      let url = sh.url.trim();
      if (sh.tab && sh.tab.trim()) url += (url.indexOf("?")>=0 ? "&" : "?") + "sheet=" + encodeURIComponent(sh.tab.trim());
      const data = await jsonpFetch(url, 25000);
      if (!data || data.ok === false) throw new Error((data && data.error) || "The script reported an error");
      const rowCount = (data.rows || []).length;
      setSheets(sheets.map(x => x.id === sh.id ? {
        ...x,
        status: rowCount > 0 ? "active" : "empty",
        lastCheck: new Date().toISOString(),
        lastError: "",
        siteStats: siteStatsFrom(data),
        rowCount,
      } : x));
      showToast(rowCount > 0 ? `Connected — ${rowCount} row(s) available` : "Connected, but no rows found", rowCount > 0 ? "ok" : "error");
    } catch (err) {
      setSheets(sheets.map(x => x.id === sh.id ? {
        ...x, status:"failed", lastCheck:new Date().toISOString(), lastError: err.message || String(err),
      } : x));
      showToast("Not connected — see the reason on the card", "error");
    } finally {
      setBusy("");
    }
  }

  function applyPreview(){
    if (!preview || preview.toAdd.length === 0) return;
    const stamp = new Date().toISOString();

    if (preview.kind === "expenses") {
      const added = preview.toAdd.map((a, idx) => ({
        ...emptyExpense, ...a.data, id: uid(), claimId:"", claimRef:"", createdAt: Date.now() + idx,
      }));
      setExpenses([...(expenses||[]), ...added]);

      const L = lists || DEFAULT_LISTS;
      const nl = { ...L, sites:[...(L.sites||[])], categories:[...(L.categories||[])],
                   expenseTypes:[...(L.expenseTypes||DEFAULT_LISTS.expenseTypes)], people:[...(L.people||[])] };
      added.forEach(d => {
        if (d.site && !nl.sites.includes(d.site)) nl.sites.push(d.site);
        if (d.category && !nl.categories.includes(d.category)) nl.categories.push(d.category);
        if (d.expenseType && !nl.expenseTypes.includes(d.expenseType)) nl.expenseTypes.push(d.expenseType);
        if (d.paidBy && !nl.people.includes(d.paidBy)) nl.people.push(d.paidBy);
      });
      nl.sites.sort(); nl.categories.sort(); nl.people.sort();
      setLists(nl);

      setSheets(sheets.map(x => (preview.list || []).some(l => l.id === x.id) ? { ...x, lastSync: stamp } : x));
      showToast(`${added.length} expense(s) brought in`);
      setPreview(null);
      return;
    }

    const added = [];
    const recurringUpdates = [];
    preview.toAdd.forEach((a, idx) => {
      const d = { ...a.data };
      const recurMatchId = d.__recurringMatchId;
      delete d.__recurringMatchId;
      const vend = vendors.find(v => String(v.name||"").trim().toLowerCase() === String(d.name).trim().toLowerCase());
      added.push({
        ...emptyReq, ...d,
        id: uid(),
        refNo: d.refNo || nextRefNo([...reqs, ...added], d.date),
        vendorId: vend ? vend.id : "",
        accNo: d.accNo || (vend ? vend.accNo : ""),
        ifsc: d.ifsc || (vend ? vend.ifsc : ""),
        site: d.site || a.source,
        exported: false,
        createdAt: Date.now() + idx,
        recurringId: recurMatchId || "",
      });
      if (recurMatchId) {
        const item = (recurring||[]).find(r => r.id === recurMatchId);
        if (item && !recurringUpdates.some(u => u.id === item.id)) {
          const upd = { ...item };
          if (item.frequency === "One-time") upd.active = false;
          else upd.nextDueDate = addInterval(item.nextDueDate, item.frequency);
          if (isInstalment(item) && item.installmentsPaid !== "") {
            upd.installmentsPaid = (Number(item.installmentsPaid)||0) + 1;
            if (Number(item.totalInstallments) && upd.installmentsPaid >= Number(item.totalInstallments)) upd.active = false;
          }
          recurringUpdates.push(upd);
        }
      }
    });
    setReqs([...reqs, ...added]);
    if (recurringUpdates.length) {
      setRecurring(recurring.map(r => recurringUpdates.find(u => u.id === r.id) || r));
    }

    const promoted = promoteSalaryLedgers(vendors, added);
    if (promoted) setVendors(promoted.vendors);

    const L = lists || DEFAULT_LISTS;
    const nl = { ...L, sites:[...(L.sites||[])], categories:[...(L.categories||[])], subCategories:{...(L.subCategories||{})} };
    added.forEach(d => {
      if (d.site && !nl.sites.includes(d.site)) nl.sites.push(d.site);
      if (d.category && !nl.categories.includes(d.category)) nl.categories.push(d.category);
      if (d.category && d.subCategory) {
        const cur = nl.subCategories[d.category] || [];
        if (!cur.includes(d.subCategory)) nl.subCategories[d.category] = [...cur, d.subCategory].sort();
      }
    });
    nl.sites.sort(); nl.categories.sort();
    setLists(nl);

    setSheets(sheets.map(x => (preview.list || []).some(l => l.id === x.id) ? { ...x, lastSync: stamp } : x));
    showToast(`${added.length} requisition(s) brought in${recurringUpdates.length ? ` · ${recurringUpdates.length} Rent & EMI item(s) updated` : ""}`);
    setPreview(null);
  }

  /* ---------- setup guide ---------- */
  if (showSetup) {
    return (
      <div>
        <button onClick={()=>setShowSetup(false)}
          style={{ display:"flex", alignItems:"center", gap:6, marginBottom:16, fontSize:14, fontWeight:600, color:INK, background:"none", border:"none", cursor:"pointer" }}>
          <Icon name="close" size={16} /> Back
        </button>

        <div style={{ background:SURFACE, borderRadius:16, padding:20, marginBottom:16, border:`1px solid ${SAND}` }}>
          <SectionLabel>Setting this up from your phone</SectionLabel>
          <p style={{ fontSize:13, color:MUTED, lineHeight:1.7 }}>
            One script covers both site folders, so you do this once. Allow about twenty minutes.
            Paste your folder links below and the script comes out ready — nothing to edit by hand.
          </p>
          <div style={{ background:"#EEF0FE", border:`1.5px solid #3F6CA8`, borderRadius:12, padding:14, marginTop:14, fontSize:13, color:INK, lineHeight:1.6 }}>
            <strong>Excel files work, with one extra step.</strong> Google Sheets are read directly.
            Excel files must be converted first, so you have to switch on the Drive API service in
            Apps Script — it is step 3 below, and skipping it is why a sync comes back empty.
          </div>

          <div style={{ background:"#FDECEE", border:`1.5px solid ${RED}`, borderRadius:12, padding:14, marginTop:14, fontSize:13, color:INK, lineHeight:1.6 }}>
            <strong>Keep backups elsewhere.</strong> Only give it folders holding site sheets. It cannot
            read .json files at all and skips anything named "backup" or "ERP-Data", but a separate
            folder is the real protection.
          </div>
        </div>

        <div style={{ background:SURFACE, borderRadius:16, padding:20, marginBottom:16, border:`1px solid ${SAND}` }}>
          <SectionLabel>Step 1 — name each site and paste its folder</SectionLabel>
          <p style={{ fontSize:13, color:MUTED, lineHeight:1.6, marginBottom:14 }}>
            Type the site name <strong>exactly as you use it in the app</strong> — that is what gets
            written into the Site column, so it must match your existing entries. Then get the folder
            link: <strong>Drive app</strong> → open that site's folder → <strong>three dots</strong> →
            <strong> Copy link</strong>.
          </p>

          {folderRows.map((row, i) => (
            <div key={i} style={{ background:"#F1F4F9", borderRadius:14, padding:14, marginBottom:12 }}>
              <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:10 }}>
                <span style={{ fontSize:12, fontWeight:700, color:AMBER, textTransform:"uppercase", letterSpacing:0.4 }}>
                  Site {i+1}
                </span>
                {folderRows.length > 1 && (
                  <button onClick={()=>setFolderRows(folderRows.filter((_,x)=>x!==i))}
                    style={{ background:"none", border:"none", cursor:"pointer", padding:4 }}>
                    <Icon name="close" size={14} color={MUTED} />
                  </button>
                )}
              </div>

              <Field label="Site name">
                <input style={inputStyle} value={row.site}
                  onChange={e=>{ const n=[...folderRows]; n[i]={...n[i], site:e.target.value}; setFolderRows(n); }}
                  placeholder="e.g. Bhopal Plant" />
              </Field>

              <Field label="Drive folder link">
                <textarea style={{...inputStyle, resize:"vertical", fontSize:13}} rows={2} value={row.link}
                  onChange={e=>{ const n=[...folderRows]; n[i]={...n[i], link:e.target.value}; setFolderRows(n); }}
                  placeholder="https://drive.google.com/drive/folders/..." />
                {row.link && !folderIds[i] && (
                  <div style={{ fontSize:13, fontWeight:600, color:RED, marginTop:6, lineHeight:1.5 }}>
                    That is not a folder link — it should contain <span style={{fontFamily:"monospace"}}>/folders/</span>.
                    Make sure you copied the folder, not a sheet inside it.
                  </div>
                )}
                {folderIds[i] && !row.site.trim() && (
                  <div style={{ fontSize:13, fontWeight:600, color:AMBER, marginTop:6 }}>
                    Folder recognised — now add the site name above.
                  </div>
                )}
                {folderIds[i] && row.site.trim() && (
                  <div style={{ fontSize:13, fontWeight:600, color:GREEN, marginTop:6 }}>
                    Ready — rows from here will be tagged {row.site.trim()}
                  </div>
                )}
              </Field>
            </div>
          ))}

          <button onClick={()=>setFolderRows([...folderRows, { site:"", link:"" }])}
            style={{ fontSize:13, fontWeight:700, color:AMBER, background:"none", border:"none", cursor:"pointer", padding:0 }}>
            + Add another site
          </button>

          {readyRows.length > 0 && (
            <div style={{ background:"#E6F7F2", border:`1px solid ${GREEN}`, borderRadius:12, padding:12, marginTop:14, fontSize:13, color:INK, lineHeight:1.55 }}>
              {readyRows.length} site{readyRows.length===1?"":"s"} ready: {readyRows.map(r=>r.site).join(", ")}.
              The script below is filled in — just copy it.
            </div>
          )}
        </div>

        <div style={{ background:SURFACE, borderRadius:16, padding:20, marginBottom:16, border:`1px solid ${SAND}` }}>
          <SectionLabel>Step 2 — create and publish</SectionLabel>
          <ol style={{ fontSize:14, color:INK, lineHeight:1.95, paddingLeft:20, margin:0 }}>
            <li>Copy the script below.</li>
            <li>In Chrome, open <strong>script.google.com</strong>.</li>
            <li>the Chrome <strong>three dots</strong> menu → tick <strong>Desktop site</strong>. The page reloads wider —
                this step matters, the buttons are unreachable otherwise.</li>
            <li>Turn your phone sideways.</li>
            <li>Tap <strong>New project</strong>.</li>
            <li>Tap in the code area, select all, delete, then paste the script.</li>
            <li><strong>If your site files are Excel (.xlsx), do this or nothing will be read:</strong>
                in the left sidebar find <strong>Services</strong>, click the <strong>+</strong>, choose
                <strong> Drive API</strong>, click <strong>Add</strong>. Excel files have to be converted
                before they can be read, and this permits that.</li>
            <li>Tap <strong>Deploy</strong> (top right) → <strong>New deployment</strong>.</li>
            <li>Tap the gear beside "Select type" → <strong>Web app</strong>.</li>
            <li>Execute as: <strong>Me</strong>. Who has access: <strong>Anyone</strong>.</li>
            <li>Tap <strong>Deploy</strong> → <strong>Authorize access</strong> → choose your Google account.</li>
            <li>On "Google hasn't verified this app", tap <strong>Advanced</strong> →
                <strong> Go to (project name)</strong> → <strong>Allow</strong>. Normal for your own scripts.</li>
            <li>Copy the <strong>Web app URL</strong> shown at the end.</li>
            <li>Come back here → <strong>Add Folder Link</strong> → paste it → Save.</li>
          </ol>
          <div style={{ background:"#F1F4F9", borderRadius:12, padding:12, marginTop:14, fontSize:13, color:MUTED, lineHeight:1.6 }}>
            All your sites arrive through that one link, so you add just <strong>one</strong> entry in the app.
            Each row is tagged with the site name you typed above, used when a row has no Site of its own.
          </div>
        </div>

        <div style={{ background:SURFACE, borderRadius:16, padding:20, marginBottom:16, border:`1px solid ${SAND}` }}>
          <SectionLabel>The script{readyRows.length ? " — ready to paste" : ""}</SectionLabel>

          <div style={{ background:"#EEF0FE", border:`1px solid #3F6CA8`, borderRadius:12, padding:12, marginBottom:12, fontSize:13, color:INK, lineHeight:1.6 }}>
            The Copy button often fails on a phone, because a page opened from a file is not allowed to
            touch the clipboard. If it does, use <strong>Select All</strong> below, then tap
            <strong> Copy</strong> in the bar your phone pops up. That always works.
          </div>

          <textarea
            id="erp-script-box"
            value={readyScript}
            onChange={()=>{}}
            spellCheck={false}
            onFocus={(e)=>e.target.setSelectionRange(0, 0)}
            style={{ width:"100%", height:220, borderRadius:12, border:`2px solid ${SAND}`,
              padding:12, fontSize:11, lineHeight:1.5, color:INK, background:"#F1F4F9",
              fontFamily:"ui-monospace, SFMono-Regular, Menlo, monospace",
              whiteSpace:"pre", overflowWrap:"normal", overflowX:"auto", resize:"vertical" }} />

          <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:10, marginTop:10 }}>
            <button onClick={()=>{
                const el = document.getElementById("erp-script-box");
                if (!el) return;
                el.focus();
                el.select();
                el.setSelectionRange(0, (readyScript||"").length);
                showToast("Selected — now tap Copy");
              }}
              style={{ borderRadius:16, padding:"14px 10px", fontSize:15, fontWeight:700,
                background:AMBER, color:"#fff", border:"none", cursor:"pointer" }}>
              Select All
            </button>
            <button onClick={()=>copyText(readyScript, "Script", showToast)}
              style={{ borderRadius:16, padding:"14px 10px", fontSize:15, fontWeight:700,
                background:INK, color:"#fff", border:"none", cursor:"pointer" }}>
              Try Copy
            </button>
          </div>

          <div style={{ marginTop:10 }}>
            <button onClick={()=>{ downloadText(readyScript, "ERP_Sheet_Script.txt"); showToast("Saved to Downloads"); }}
              style={{ width:"100%", borderRadius:16, padding:"14px 10px", fontSize:15, fontWeight:600,
                background:SAND, color:INK, border:"none", cursor:"pointer" }}>
              Save script as a file instead
            </button>
            <div style={{ fontSize:12, color:MUTED, marginTop:8, lineHeight:1.6 }}>
              Saves to Downloads. Open it with any notes or text app, select all there and copy —
              useful if this page will not let you select.
            </div>
          </div>

          {!readyRows.length && (
            <div style={{ fontSize:12, color:AMBER, fontWeight:600, marginTop:12, lineHeight:1.5 }}>
              Fill in the site names and folder links above first, otherwise you will have to edit the
              script by hand in Apps Script.
            </div>
          )}
        </div>

        <div style={{ background:SURFACE, borderRadius:16, padding:20, marginBottom:16, border:`1px solid ${SAND}` }}>
          <SectionLabel>If pasting into Apps Script misbehaves</SectionLabel>
          <p style={{ fontSize:13, color:MUTED, lineHeight:1.7 }}>
            The Apps Script editor is a code editor, and on a phone it fights you — it auto-inserts
            brackets and quotes as you paste, which corrupts the script.
          </p>
          <ol style={{ fontSize:14, color:INK, lineHeight:1.95, paddingLeft:20, margin:"10px 0 0" }}>
            <li>Make sure <strong>Desktop site</strong> is ticked in the Chrome three-dots menu.</li>
            <li>Tap inside the code area, then <strong>select everything already there and delete it</strong> —
                paste on top of existing code is what usually breaks.</li>
            <li>Long-press in the empty editor → <strong>Paste</strong>.</li>
            <li>Check the first line reads <span style={{fontFamily:"monospace"}}>/** ---- YOUR SITES ----</span>
                and the last character is a single <span style={{fontFamily:"monospace"}}>&#125;</span>.</li>
            <li>If extra brackets appeared at the end, delete them until it matches.</li>
          </ol>
          <div style={{ background:"#F1F4F9", borderRadius:12, padding:12, marginTop:12, fontSize:13, color:MUTED, lineHeight:1.6 }}>
            Still fighting it? This whole page is optional. The Excel route on the previous screen gets
            the same data in with none of this.
          </div>
        </div>

        <div style={{ background:"#EEF0FE", border:`1px solid ${AMBER}`, borderRadius:16, padding:16, fontSize:13, color:INK, lineHeight:1.6 }}>
          <strong>"Who has access: Anyone" sounds risky.</strong> It means anyone holding that exact long
          URL can read the sheets in those folders — nothing can be written or changed, and no other
          folder is reachable. The folder IDs are fixed inside the script, so the link cannot be edited
          to point somewhere else. Treat it like a password; if it leaks, deploy a new version in Apps
          Script and the old link stops working.
        </div>
      </div>
    );
  }

  /* ---------- preview ---------- */
  if (preview) {
    return (
      <div>
        <button onClick={()=>setPreview(null)}
          style={{ display:"flex", alignItems:"center", gap:6, marginBottom:16, fontSize:14, fontWeight:600, color:INK, background:"none", border:"none", cursor:"pointer" }}>
          <Icon name="close" size={16} /> Cancel
        </button>

        <div style={{ background:SURFACE, borderRadius:16, padding:20, marginBottom:16, border:`1px solid ${SAND}` }}>
          <SectionLabel>Check before importing</SectionLabel>
          <ReviewRow label={preview.kind === "expenses" ? "New expenses" : "New requisitions"} value={preview.toAdd.length} />
          <ReviewRow label="Skipped as duplicates" value={preview.duplicates.length} />
          <ReviewRow label="Rows with problems" value={preview.errors.length} />
          {preview.kind !== "expenses" && preview.toAdd.some(a=>a.data.__recurringMatchId) && (
            <ReviewRow label="Will also update Rent & EMI"
              value={preview.toAdd.filter(a=>a.data.__recurringMatchId).length} />
          )}
        </div>

        {preview.notes && preview.notes.length > 0 && (
          <div style={{ background:"#EEF0FE", border:`1.5px solid ${AMBER}`, borderRadius:16, padding:16, marginBottom:16 }}>
            <div style={{ fontWeight:700, color:AMBER, fontSize:14, marginBottom:8 }}>Notes from the script</div>
            {preview.notes.map((n,i) => (
              <div key={i} style={{ fontSize:13, color:INK, padding:"4px 0", lineHeight:1.6 }}>{n}</div>
            ))}
          </div>
        )}

        {preview.toAdd.length === 0 && preview.seenFiles && preview.seenFiles.length > 0 && (
          <div style={{ background:SURFACE, borderRadius:16, padding:16, marginBottom:16, border:`1.5px solid ${RED}` }}>
            <div style={{ fontWeight:700, color:RED, fontSize:14, marginBottom:6 }}>
              Everything found in your folders ({preview.seenFiles.length})
            </div>
            <div style={{ fontSize:12, color:MUTED, marginBottom:10, lineHeight:1.55 }}>
              Only Google Sheets and Excel files can be read. If your file is listed here but produced no
              rows, the first row may not be the column headings.
            </div>
            {preview.seenFiles.slice(0,40).map((f,i) => (
              <div key={i} style={{ display:"flex", justifyContent:"space-between", fontSize:13, padding:"4px 0", color:INK, gap:10 }}>
                <span style={{ overflow:"hidden", textOverflow:"ellipsis", whiteSpace:"nowrap" }}>{f.name}</span>
                <span style={{ color:MUTED, flexShrink:0 }}>{f.type}</span>
              </div>
            ))}
          </div>
        )}

        {preview.fileReport && preview.fileReport.length > 0 && (
          <div style={{ background:SURFACE, borderRadius:16, padding:16, marginBottom:16, border:`1px solid ${SAND}` }}>
            <div style={{ fontWeight:700, color:INK, fontSize:14, marginBottom:8 }}>Files read ({preview.fileReport.length})</div>
            {preview.fileReport.map((f,i) => (
              <div key={i} style={{ display:"flex", justifyContent:"space-between", fontSize:13, padding:"5px 0", color:INK }}>
                <span style={{ overflow:"hidden", textOverflow:"ellipsis", whiteSpace:"nowrap", paddingRight:10 }}>
                  {f.name}{f.folder ? <span style={{ color:MUTED }}> · {f.folder}</span> : null}
                </span>
                <span style={{ color:MUTED, flexShrink:0 }}>{f.rows} row(s)</span>
              </div>
            ))}
          </div>
        )}

        {preview.skippedFiles && preview.skippedFiles.length > 0 && (
          <div style={{ background:"#E6F7F2", border:`1px solid ${GREEN}`, borderRadius:16, padding:16, marginBottom:16, fontSize:13, color:INK, lineHeight:1.6 }}>
            <strong>Backup files left alone:</strong> {preview.skippedFiles.join(", ")}
          </div>
        )}

        {preview.failures && preview.failures.length > 0 && (
          <div style={{ background:"#FDECEE", border:`1.5px solid ${RED}`, borderRadius:16, padding:16, marginBottom:16 }}>
            <div style={{ fontWeight:700, color:RED, fontSize:14, marginBottom:8 }}>Could not reach</div>
            {preview.failures.map((f,i) => (
              <div key={i} style={{ fontSize:13, color:INK, padding:"4px 0", lineHeight:1.5 }}>
                <strong>{f.name}</strong> — {f.why}
              </div>
            ))}
          </div>
        )}

        {preview.missing && preview.missing.length > 0 && (
          <div style={{ background:"#FDECEE", border:`1.5px solid ${RED}`, borderRadius:16, padding:16, marginBottom:16, fontSize:13, color:INK, lineHeight:1.6 }}>
            Could not find a column for <strong>{preview.missing.map(f=>f.headers[0]).join(", ")}</strong> in
            these sheets. Ask the sites to use those exact headings, or bring the file in through
            Import from Excel where you can match columns by hand.
          </div>
        )}

        {preview.toAdd.length > 0 && (
          <div style={{ background:SURFACE, borderRadius:16, padding:16, marginBottom:16, border:`1px solid ${SAND}` }}>
            <div style={{ fontWeight:700, color:GREEN, fontSize:14, marginBottom:10 }}>Will be added ({preview.toAdd.length})</div>
            {preview.toAdd.slice(0,30).map((a,i) => (
              <div key={i} style={{ padding:"7px 0", borderTop: i? `1px solid ${SAND}`:"none", fontSize:13, color:INK }}>
                {preview.kind === "expenses"
                  ? <React.Fragment>
                      <strong>{a.data.description || a.data.expenseType}</strong> · ₹{fmtINR(a.data.amount)}
                      {a.data.date || a.data.periodText ? ` · ${a.data.date ? fmtDate(a.data.date) : a.data.periodText}` : " · no date"}
                      <span style={{ color:MUTED }}> · {a.data.paidBy || "no payer"}</span>
                    </React.Fragment>
                  : <React.Fragment>
                      <strong>{a.data.name}</strong> · ₹{fmtINR(a.data.amount)} · {fmtDate(a.data.date) || "no date"}
                      <span style={{ color:MUTED }}> · {a.data.site || a.source}</span>
                      {a.data.dateFromPayment && (
                        <span style={{ color:AMBER, fontWeight:600 }}> · date taken from payment</span>
                      )}
                      {a.data.__recurringMatchId && (
                        <span style={{ color:GREEN, fontWeight:600 }}> · settles Rent & EMI</span>
                      )}
                    </React.Fragment>}
              </div>
            ))}
            {preview.toAdd.length > 30 && <div style={{ fontSize:12, color:MUTED, marginTop:8 }}>…and {preview.toAdd.length-30} more</div>}
          </div>
        )}

        {preview.duplicates.length > 0 && (
          <div style={{ background:SURFACE, borderRadius:16, padding:16, marginBottom:16, border:`1.5px solid ${AMBER}` }}>
            <div style={{ fontWeight:700, color:AMBER, fontSize:14, marginBottom:6 }}>Skipped as duplicates ({preview.duplicates.length})</div>
            <div style={{ fontSize:12, color:MUTED, marginBottom:10, lineHeight:1.5 }}>
              Same date, same name and same amount as something already recorded, so these are not added again.
            </div>
            {preview.duplicates.slice(0,20).map((d,i) => (
              <div key={i} style={{ fontSize:13, color:INK, padding:"4px 0" }}>
                {preview.kind === "expenses" ? (d.data.description || d.data.expenseType) : d.data.name} · ₹{fmtINR(d.data.amount)}
                {d.data.date ? ` · ${fmtDate(d.data.date)}` : ""} <span style={{color:MUTED}}>— {d.why}</span>
              </div>
            ))}
            {preview.duplicates.length > 20 && <div style={{ fontSize:12, color:MUTED, marginTop:8 }}>…and {preview.duplicates.length-20} more</div>}
          </div>
        )}

        {preview.errors.length > 0 && (
          <div style={{ background:SURFACE, borderRadius:16, padding:16, marginBottom:16, border:`1.5px solid ${RED}` }}>
            <div style={{ fontWeight:700, color:RED, fontSize:14, marginBottom:6 }}>Rows with problems ({preview.errors.length})</div>
            {preview.errors.slice(0,20).map((e,i) => (
              <div key={i} style={{ fontSize:13, color:INK, padding:"4px 0" }}>
                {e.source} row {e.rowNum}: {e.why}
              </div>
            ))}
          </div>
        )}

        <BigButton icon="check"
          label={preview.toAdd.length
            ? `Import ${preview.toAdd.length} ${preview.kind === "expenses" ? "Expense" : "Requisition"}(s)`
            : "Nothing new to import"}
          onClick={applyPreview} tone="green" full disabled={preview.toAdd.length===0} />
      </div>
    );
  }

  /* ---------- add / edit a sheet ---------- */
  if (editing) {
    return (
      <div>
        <button onClick={()=>setEditing(null)}
          style={{ display:"flex", alignItems:"center", gap:6, marginBottom:16, fontSize:14, fontWeight:600, color:INK, background:"none", border:"none", cursor:"pointer" }}>
          <Icon name="close" size={16} /> Cancel
        </button>
        <div style={{ background:SURFACE, borderRadius:20, padding:20, border:`1px solid ${SAND}`, boxShadow:SHADOW }}>
          <SectionLabel>Connected folder</SectionLabel>
          <Field label="Name" required hint="A label for you, e.g. Site Requisitions">
            <input style={inputStyle} value={editing.name}
              onChange={e=>setEditing({...editing, name:e.target.value})} placeholder="e.g. Site Requisitions" />
          </Field>
          <Field label="Web app URL" required hint="Ends in /exec — Apps Script gives you this at the end of Deploy">
            <textarea style={{...inputStyle, resize:"vertical", fontSize:13,
                borderColor: editing.url && urlProblem(editing.url) ? RED : SAND}} rows={3} value={editing.url}
              onChange={e=>setEditing({...editing, url:e.target.value})}
              placeholder="https://script.google.com/macros/s/..../exec" />
            {editing.url && urlProblem(editing.url) && (
              <div style={{ background:"#FDECEE", border:`1px solid ${RED}`, borderRadius:12, padding:12, marginTop:8,
                fontSize:13, color:INK, lineHeight:1.55 }}>
                {urlProblem(editing.url)}
              </div>
            )}
            {editing.url && !urlProblem(editing.url) && (
              <div style={{ fontSize:13, fontWeight:600, color:GREEN, marginTop:8 }}>Looks right</div>
            )}
          </Field>
          <Field label="Tab name inside each sheet" hint="Leave blank to use the first tab of every sheet">
            <input style={inputStyle} value={editing.tab || ""}
              onChange={e=>setEditing({...editing, tab:e.target.value})} placeholder="e.g. Requisitions" />
          </Field>
          <Field label="Syncs into" hint={editing.kind === "expenses"
              ? "Rows land in Expenses — use this for a sheet like Office Master (Date, Expense Type, Paid By, Amount, ...)."
              : "Rows land in Requisitions — a date in Payment Status sends that row straight to the Payment Register, same as Import from Excel."}>
            <select style={inputStyle} value={editing.kind || "requisitions"}
              onChange={e=>setEditing({...editing, kind:e.target.value})}>
              <option value="requisitions">Requisitions (Payment to be done)</option>
              <option value="expenses">Expenses (Office Master)</option>
            </select>
          </Field>
          <BigButton icon="check" label="Save Folder" onClick={()=>saveSheet(editing)} tone="green" full
            disabled={!editing.name.trim() || !!urlProblem(editing.url)} />
          {(!editing.name.trim() || !!urlProblem(editing.url)) && (
            <div style={{ fontSize:12, color:MUTED, marginTop:8, textAlign:"center", lineHeight:1.5 }}>
              Save becomes active once the name and URL are both correct.
            </div>
          )}
        </div>
      </div>
    );
  }

  /* ---------- main ---------- */
  return (
    <div>
      <button onClick={()=>goTo("dashboard")}
        style={{ display:"flex", alignItems:"center", gap:6, marginBottom:16, fontSize:14, fontWeight:600, color:INK, background:"none", border:"none", cursor:"pointer" }}>
        <Icon name="close" size={16} /> Back to dashboard
      </button>

      {busy && (
        <div style={{ background:"#EEF0FE", border:`1px solid #3F6CA8`, borderRadius:16, padding:16, marginBottom:14, fontSize:14, fontWeight:600, color:INK }}>
          Reading {busy}…
        </div>
      )}

      {sheets.length > 0 && (() => {
        const active = sheets.filter(x => x.status === "active").length;
        const failed = sheets.filter(x => x.status === "failed").length;
        const untested = sheets.filter(x => !x.status || x.status === "untested").length;
        const tone = failed ? RED : untested ? MUTED : active === sheets.length ? GREEN : AMBER;
        const bg = failed ? "#FDECEE" : untested ? "#F1F4F9" : active === sheets.length ? "#E6F7F2" : "#EEF0FE";
        return (
          <div style={{ background:bg, border:`1.5px solid ${tone}`, borderRadius:16, padding:16, marginBottom:14,
            display:"flex", alignItems:"center", gap:10 }}>
            <span style={{ width:12, height:12, borderRadius:"50%", background:tone, flexShrink:0 }} />
            <div style={{ flex:1 }}>
              <div style={{ fontSize:14, fontWeight:700, color:INK }}>
                {failed ? `${failed} connection${failed===1?"":"s"} not working`
                  : untested === sheets.length ? "Status unknown"
                  : `${active} of ${sheets.length} connection${sheets.length===1?"":"s"} active`}
              </div>
              <div style={{ fontSize:12, color:MUTED, marginTop:2 }}>
                {untested ? "Tap Check status to test without importing anything." : "Green means the link works and rows are available."}
              </div>
            </div>
          </div>
        );
      })()}

      {sheets.length === 0 && (
        <div style={{ background:SURFACE, borderRadius:16, padding:20, marginBottom:16, border:`1.5px solid ${GREEN}` }}>
          <SectionLabel>Simplest way — start here</SectionLabel>
          <p style={{ fontSize:13, color:MUTED, lineHeight:1.7, marginBottom:12 }}>
            No setup, works right now, about thirty seconds per sheet. Do this until the automatic
            sync is worth the trouble.
          </p>
          <ol style={{ fontSize:14, color:INK, lineHeight:1.95, paddingLeft:20, margin:"0 0 14px" }}>
            <li>Open the site's sheet in the <strong>Google Sheets app</strong>.</li>
            <li>Tap <strong>three dots</strong> → <strong>Share &amp; export</strong> → <strong>Save as</strong>.</li>
            <li>Choose <strong>Excel (.xlsx)</strong>. It lands in Downloads.</li>
            <li>Come back → <strong>Import from Excel</strong> → Payment Requisitions → pick the file.</li>
          </ol>
          <BigButton icon="download" label="Go to Import from Excel" onClick={()=>goTo("import:requisitions")} tone="green" full />
          <p style={{ fontSize:12, color:MUTED, lineHeight:1.6, marginTop:12 }}>
            You still get column matching, the preview, and duplicate protection — the same checks as
            automatic sync. Only the fetching is manual.
          </p>
        </div>
      )}

      {sheets.length === 0 ? (
        <div style={{ marginBottom:16 }}>
          <div style={{ background:SURFACE, borderRadius:20, padding:20, border:`1px solid ${SAND}`, boxShadow:SHADOW }}>
            <SectionLabel>Automatic sync — optional</SectionLabel>
            <p style={{ fontSize:13, color:MUTED, lineHeight:1.7 }}>
              A one-time Google Apps Script that pulls every site sheet with one tap. It is genuinely
              fiddly on a phone and needs about twenty minutes. Worth it if you are doing this weekly
              across both sites — not worth it otherwise. Nothing here is required.
            </p>
          </div>
        </div>
      ) : (
        <div style={{ display:"flex", flexDirection:"column", gap:10, marginBottom:16 }}>
          {sheets.map(sh => {
            const st = sh.status || "untested";
            const look = {
              active:   { dot:GREEN,   label:"Active",        bg:"#E6F7F2", text:GREEN },
              empty:    { dot:AMBER,   label:"No rows found", bg:"#EEF0FE", text:AMBER },
              failed:   { dot:RED,     label:"Not working",   bg:"#FDECEE", text:RED },
              untested: { dot:"#9AA7BC", label:"Not checked yet", bg:"#F1F4F9", text:MUTED },
            }[st];
            return (
              <div key={sh.id} style={{ background:SURFACE, borderRadius:16, padding:16, border:`1.5px solid ${st==="active"?GREEN:st==="failed"?RED:SAND}` }}>
                <div style={{ display:"flex", justifyContent:"space-between", alignItems:"flex-start", gap:10 }}>
                  <div style={{ flex:1, minWidth:0 }}>
                    <div style={{ fontWeight:700, color:INK }}>{sh.name}</div>
                    <div style={{ fontSize:12, color:MUTED, marginTop:3 }}>
                      Syncs into {(sh.kind||"requisitions") === "expenses" ? "Expenses" : "Requisitions"} · {sh.tab ? `Tab: ${sh.tab} · ` : ""}Last sync {sh.lastSync ? friendlyTime(sh.lastSync) : "never"}
                    </div>
                  </div>
                  <div style={{ display:"flex", gap:8, flexShrink:0 }}>
                    <button onClick={()=>setEditing(sh)} style={{ padding:8, borderRadius:12, background:SAND, border:"none", cursor:"pointer" }}>
                      <Icon name="edit" size={15} color={INK} />
                    </button>
                    <button onClick={()=>removeSheet(sh)} style={{ padding:8, borderRadius:12, background:"#FDECEE", border:"none", cursor:"pointer" }}>
                      <Icon name="trash" size={15} color={RED} />
                    </button>
                  </div>
                </div>

                <div style={{ display:"flex", alignItems:"center", gap:8, marginTop:12, padding:"9px 12px",
                  borderRadius:12, background:look.bg }}>
                  <span style={{ width:10, height:10, borderRadius:"50%", background:look.dot, flexShrink:0 }} />
                  <span style={{ fontSize:13, fontWeight:700, color:look.text }}>{look.label}</span>
                  {sh.lastCheck && (
                    <span style={{ fontSize:12, color:MUTED, marginLeft:"auto" }}>
                      checked {friendlyTime(sh.lastCheck)}
                    </span>
                  )}
                </div>

                {st === "failed" && sh.lastError && (
                  <div style={{ marginTop:8, fontSize:12, color:INK, lineHeight:1.55, background:"#FDECEE",
                    borderRadius:12, padding:"10px 12px" }}>
                    {sh.lastError}
                  </div>
                )}

                {st === "empty" && (
                  <div style={{ marginTop:8, fontSize:12, color:INK, lineHeight:1.55, background:"#EEF0FE",
                    borderRadius:12, padding:"10px 12px" }}>
                    The link works but returned nothing. Usually the Drive API service is not switched on
                    in Apps Script, so Excel files cannot be read — or the folders hold no sheets yet.
                  </div>
                )}

                {(sh.siteStats && sh.siteStats.length > 0) && (
                  <div style={{ marginTop:10, borderTop:`1px solid ${SAND}`, paddingTop:10 }}>
                    <div style={{ fontSize:11, fontWeight:700, color:MUTED, textTransform:"uppercase", letterSpacing:0.4, marginBottom:6 }}>
                      Folders reached
                    </div>
                    {sh.siteStats.map(x => (
                      <div key={x.site} style={{ display:"flex", justifyContent:"space-between", alignItems:"center", fontSize:13, padding:"4px 0", gap:10 }}>
                        <span style={{ display:"flex", alignItems:"center", gap:7, minWidth:0 }}>
                          <span style={{ width:8, height:8, borderRadius:"50%", flexShrink:0,
                            background: x.rows > 0 ? GREEN : AMBER }} />
                          <span style={{ color:INK, overflow:"hidden", textOverflow:"ellipsis", whiteSpace:"nowrap" }}>{x.site}</span>
                        </span>
                        <span style={{ color:MUTED, flexShrink:0 }}>
                          {x.files} file{x.files===1?"":"s"} · {x.rows} row{x.rows===1?"":"s"}
                        </span>
                      </div>
                    ))}
                  </div>
                )}

                <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:8, marginTop:12 }}>
                  <button onClick={()=>testConnection(sh)} disabled={!!busy}
                    style={{ padding:"11px 0", borderRadius:12, fontSize:14, fontWeight:600,
                      background:SAND, color:INK, border:"none", cursor: busy ? "default":"pointer" }}>
                    Check status
                  </button>
                  <button onClick={()=>syncSheets([sh])} disabled={!!busy}
                    style={{ padding:"11px 0", borderRadius:12, fontSize:14, fontWeight:700,
                      background: busy ? SAND : GREEN, color: busy ? INK : "#fff", border:"none", cursor: busy ? "default":"pointer" }}>
                    Sync now
                  </button>
                </div>
              </div>
            );
          })}
        </div>
      )}

      <div style={{ display:"flex", flexDirection:"column", gap:10 }}>
        {["requisitions","expenses"].map(k => {
          const group = sheets.filter(x => (x.kind||"requisitions") === k);
          if (group.length < 2) return null;
          return (
            <BigButton key={k} icon="download"
              label={`Sync all ${k==="expenses" ? "Expense" : "Requisition"} sources (${group.length})`}
              onClick={()=>syncSheets(group)} tone="green" full disabled={!!busy} />
          );
        })}
        <BigButton icon="plus" label="Add Folder"
          onClick={()=>setEditing({ id: uid(), name:"Site Sheets", url:"", tab:"", kind:"requisitions", lastSync:null })} tone="amber" full />
        <BigButton icon="settings" label="Set up automatic sync (advanced)" onClick={()=>setShowSetup(true)} tone="ink" full />
      </div>
    </div>
  );
}

/* ================= REIMBURSABLE EXPENSES ================= */
function ExpensesTab({ expenses, setExpenses, reqs, setReqs, lists, setLists, showToast, goTo, openImport }){
  const L = lists || DEFAULT_LISTS;
  const [editing, setEditing] = useState(null);
  const [selected, setSelected] = useState(new Set());
  const [personFilter, setPersonFilter] = useState("All");
  const [view, setView] = useState("unclaimed");   // unclaimed | claimed
  const [sortKey, setSortKey] = useState("entry");
  const [desc, setDesc] = useState(false);
  const [query, setQuery] = useState("");
  const [groupBy, setGroupBy] = useState("none");
  const [showAnalysis, setShowAnalysis] = useState(false);
  const [askDate, setAskDate] = useState(null);   // "settle" | "claim" | "register"
  const [bulkOpen, setBulkOpen] = useState(false);
  const EXP_SORTS = [
    { k:"entry",  label:"As entered", get:e=>Number(e.seq||0) || Number(e.createdAt||0) },
    { k:"date",   label:"Date",     get:e=>e.date||"" },
    { k:"amount", label:"Amount",   get:e=>Number(e.amount||0) },
    { k:"type",   label:"Type",     get:e=>e.expenseType||"" },
    { k:"person", label:"Paid by",  get:e=>e.paidBy||"" },
    { k:"site",   label:"Site",     get:e=>e.site||"" },
  ];

  const people = L.people && L.people.length ? L.people : [];
  const expenseTypes = L.expenseTypes || DEFAULT_LISTS.expenseTypes;

  const sorted = useMemo(()=>sortBy(expenses, (EXP_SORTS.find(x=>x.k===sortKey)||EXP_SORTS[0]).get, desc), [expenses, sortKey, desc]);
  const visible = useMemo(() => sorted.filter(e => {
    const done = expenseSettled(e);
    if (view === "unclaimed" && done) return false;
    if (view === "claimed" && !done) return false;
    if (personFilter !== "All" && e.paidBy !== personFilter) return false;
    if (!matches(query, dateTerms(e.date, e.paidDate), e.description, e.expenseType, e.category, e.subCategory, e.site, e.paidBy, e.settledTo, e.claimRef, e.amount)) return false;
    return true;
  }), [sorted, view, personFilter]);

  const unclaimed = sorted.filter(e => !expenseSettled(e));

  const sections = useMemo(() => {
    if (groupBy === "none") return [{ key:"__all", label:"", rows:visible, total:visible.reduce((a,e)=>a+Number(e.amount||0),0) }];
    const label = (e) => groupBy === "person" ? (e.paidBy || "Unassigned")
      : groupBy === "type" ? (e.expenseType || "Not set")
      : groupBy === "site" ? (e.site || "No site")
      : groupBy === "month" ? ((e.date||"").slice(0,7) || "No date")
      : (e.category || "Not set");
    const gs = groupRows(visible, label, e=>Number(e.amount||0));
    if (groupBy === "month") gs.sort((a,b)=>String(b.key).localeCompare(String(a.key)));
    else gs.sort((a,b)=>b.total-a.total);
    return gs.map(g => ({ ...g, label: groupBy === "month" ? (monthLabel(g.key) || g.key) : g.key }));
  }, [visible, groupBy]);

  const breakdown = useMemo(() => {
    const m = {};
    visible.forEach(e => {
      const k = groupBy === "person" ? (e.category || e.expenseType || "Unclassified") : (e.paidBy || "Unassigned");
      m[k] = (m[k]||0) + Number(e.amount||0);
    });
    return Object.entries(m).sort((a,b)=>b[1]-a[1]).slice(0,8);
  }, [visible, groupBy]);
  const owedByPerson = useMemo(() => {
    const map = {};
    unclaimed.forEach(e => { const k = e.paidBy || "Unassigned"; map[k] = (map[k]||0) + Number(e.amount||0); });
    return Object.entries(map).sort((a,b)=>b[1]-a[1]);
  }, [unclaimed]);

  const selectedRows = expenses.filter(e => selected.has(e.id));
  const selectedTotal = selectedRows.reduce((s,e)=>s+Number(e.amount||0), 0);
  const selectedPeople = [...new Set(selectedRows.map(e => e.paidBy || "Unassigned"))];

  function toggle(id){
    setSelected(prev => { const n = new Set(prev); n.has(id) ? n.delete(id) : n.add(id); return n; });
  }
  function selectAllVisible(){
    const ids = visible.map(e => e.id);
    setSelected(selected.size === ids.length ? new Set() : new Set(ids));
  }

  function save(exp){
    if (!exp.date) return showToast("Enter the date", "error");
    if (!exp.amount || Number(exp.amount) <= 0) return showToast("Enter a valid amount", "error");
    if (!exp.paidBy) return showToast("Choose who paid", "error");
    const exists = expenses.some(e => e.id === exp.id);
    setExpenses(exists ? expenses.map(e => e.id===exp.id ? exp : e) : [...expenses, { ...exp, createdAt: Date.now() }]);
    setEditing(null);
    showToast(exists ? "Expense updated" : "Expense added");
  }
  function remove(e){
    if (e.claimId) { showToast("Already claimed — unlink the claim first", "error"); return; }
    if (!confirm(`Delete this ₹${fmtINR(e.amount)} expense?`)) return;
    setExpenses(expenses.filter(x => x.id !== e.id));
    setSelected(prev => { const n = new Set(prev); n.delete(e.id); return n; });
    showToast("Expense deleted");
  }

  /* ---- the double-counting guard lives here ---- */
  function createClaim(){
    if (selectedRows.length === 0) return showToast("Select the expenses to claim", "error");
    const already = selectedRows.filter(e => e.claimId);
    if (already.length) return showToast("Some selected expenses are already claimed", "error");
    if (selectedPeople.length > 1) {
      return showToast("Select expenses paid by one person only — one claim pays one person", "error");
    }
    const person = selectedPeople[0];
    const total = selectedTotal;
    const byType = {};
    selectedRows.forEach(e => { byType[e.expenseType] = (byType[e.expenseType]||0) + Number(e.amount||0); });
    const breakdown = Object.entries(byType).map(([k,v]) => `${k} ₹${fmtINR(v)}`).join(", ");
    setAskDate("claim");
  }

  function applyClaim(iso){
    const person = selectedPeople[0];
    const total = selectedTotal;
    const byType = {};
    selectedRows.forEach(e => { byType[e.expenseType] = (byType[e.expenseType]||0) + Number(e.amount||0); });
    const breakdown = Object.entries(byType).map(([k,v]) => `${k} ₹${fmtINR(v)}`).join(", ");
    const count = selectedRows.length;

    const claimId = uid();
    const ref = nextRefNo(reqs);
    const requisition = {
      ...emptyReq,
      id: uid(), refNo: ref, date: iso,
      site: REIMB_SITE, category: REIMB_CATEGORY, subCategory: REIMB_CATEGORY,
      name: person, amount: total,
      description: `Reimbursement - ${count} expense(s): ${breakdown}`,
      paymentStatus: "Pending",
      paidBy: "Company",
      isReimbursement: true, claimId,
      exported: false, createdAt: Date.now(),
    };
    setReqs([...reqs, requisition]);
    setExpenses(expenses.map(e => selected.has(e.id)
      ? { ...e, claimId, claimRef: ref, settledTo: e.settledTo || person } : e));
    setAskDate(null);
    setSelected(new Set());
    setView("claimed");
    showToast(`${ref} created for ₹${fmtINR(total)} covering ${count} expense(s)`);
  }

  // Expenses already paid for, but with no entry in the Payment Register.
  // This puts one payment in for the lot, so the register shows the money going out.
  function addToRegister(){
    if (selectedRows.length === 0) return showToast("Select the expenses first", "error");
    const already = selectedRows.filter(e => e.claimId);
    if (already.length) return showToast("Some are already on a requisition", "error");
    setAskDate("register");
  }

  function applyRegisterEntry(iso){
    const rows = selectedRows;
    const total = rows.reduce((a,e)=>a+Number(e.amount||0), 0);
    const spenders = [...new Set(rows.map(e => e.paidBy || "Unassigned"))];
    const paidTo = rows.map(e => e.settledTo).find(Boolean) || spenders[0];
    const byType = {};
    rows.forEach(e => { byType[e.expenseType] = (byType[e.expenseType]||0) + Number(e.amount||0); });
    const breakdown = Object.entries(byType).map(([k,v]) => `${k} ₹${fmtINR(v)}`).join(", ");
    const claimId = uid();
    const ref = nextRefNo(reqs, iso);
    const record = {
      ...emptyReq, id: uid(), refNo: ref, date: iso,
      site: REIMB_SITE, category: REIMB_CATEGORY, subCategory: REIMB_CATEGORY,
      name: paidTo, amount: total,
      description: `Reimbursement already paid - ${rows.length} expense(s): ${breakdown}`,
      paymentStatus: "Paid", paymentDate: iso,
      paidBy: "Company", isReimbursement: true, claimId,
      exported: true, createdAt: Date.now(),
    };
    setReqs([...reqs, record]);
    setExpenses(expenses.map(e => selected.has(e.id)
      ? { ...e, claimId, claimRef: ref, paidDate: e.paidDate || iso, settledTo: e.settledTo || paidTo }
      : e));
    setAskDate(null);
    setSelected(new Set());
    setView("claimed");
    showToast(`${ref} added to the register for ₹${fmtINR(total)}`);
  }

  function unsettleSelected(){
    const rows = selectedRows.filter(expenseSettled);
    if (!rows.length) return;
    const claimed = rows.filter(e => e.claimRef);
    if (!confirm(
      `Put ${rows.length} expense(s) back to waiting to be repaid?\n\n` +
      (claimed.length ? `${claimed.length} of these are attached to ${[...new Set(claimed.map(e=>e.claimRef))].join(", ")}. They will be detached from it.\n\n` : "") +
      `The payment itself is not changed.`
    )) return;
    setExpenses(expenses.map(e => selected.has(e.id)
      ? { ...e, paidDate:"", claimId:"", claimRef:"" } : e));
    setSelected(new Set());
    setBulkOpen(false);
    showToast(`${rows.length} back to waiting`);
  }

  function deleteSelected(){
    const rows = selectedRows;
    if (!rows.length) return;
    const claimed = rows.filter(e => e.claimId);
    const total = rows.reduce((a,e)=>a+Number(e.amount||0), 0);
    const refs = [...new Set(claimed.map(e => e.claimRef).filter(Boolean))];
    if (!confirm(
      `Delete ${rows.length} expense(s) totalling ₹${fmtINR(total)}?\n\n` +
      (claimed.length
        ? `${claimed.length} of these are attached to ${refs.join(", ") || "a payment"}. ` +
          `That payment stays as it is, but will no longer show what it covered.\n\n`
        : "") +
      `This cannot be undone.`
    )) return;
    setExpenses(expenses.filter(e => !selected.has(e.id)));
    setSelected(new Set());
    setBulkOpen(false);
    showToast(`${rows.length} expense(s) deleted`);
  }

  function exportSelected(){
    const rows = selectedRows;
    if (!rows.length) return;
    const ws = XLSX.utils.json_to_sheet(rows.map(e => ({
      Date: e.date ? fmtDate(e.date) : "", "Expense Type":e.expenseType||"", "Paid By":e.paidBy||"",
      Amount:Number(e.amount)||0, Site:e.site||"", Category:e.category||"",
      "Sub-Category":e.subCategory||"", Description:e.description||"",
      "Paid To":e.settledTo||"", "Payment Date": e.paidDate ? fmtDate(e.paidDate) : "",
      "Claimed In":e.claimRef||"",
    })));
    ws["!cols"] = [{wch:12},{wch:15},{wch:16},{wch:12},{wch:14},{wch:16},{wch:16},{wch:38},{wch:16},{wch:14},{wch:16}];
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, "Expenses");
    XLSX.writeFile(wb, `Expenses_selected_${todayStr()}.xlsx`);
    showToast(`Exported ${rows.length} expense(s)`);
  }

  function markSettled(){
    if (selectedRows.length === 0) return showToast("Select the expenses first", "error");
    const already = selectedRows.filter(expenseSettled);
    if (already.length) return showToast("Some are already settled", "error");
    setAskDate("settle");
  }

  function applySettlement(iso){
    const n = selectedRows.length;
    setExpenses(expenses.map(e => selected.has(e.id)
      ? { ...e, paidDate: iso, settledTo: e.settledTo || e.paidBy || "" } : e));
    setAskDate(null);
    setSelected(new Set());
    showToast(`${n} marked paid on ${fmtDate(iso)}`);
  }

  function unlinkClaim(e){
    const ref = e.claimRef;
    const linked = expenses.filter(x => x.claimId === e.claimId);
    if (!confirm(
      `Unlink all ${linked.length} expense(s) from ${ref}?\n\nThe requisition itself is not deleted — remove it separately if it was raised in error, otherwise the amount will be counted twice.`
    )) return;
    setExpenses(expenses.map(x => x.claimId === e.claimId ? { ...x, claimId:"", claimRef:"" } : x));
    showToast("Unlinked — remember to handle the requisition");
  }

  function exportSupportSheets(){
    const rows = view === "claimed" ? visible : (selectedRows.length ? selectedRows : unclaimed);
    if (rows.length === 0) { showToast("Nothing to export", "error"); return; }
    const toRow = (e) => ({
      ID: e.id,
      Date: e.date ? fmtDate(e.date) : "",
      "Expense Type":e.expenseType || "",
      "Paid By":e.paidBy || "",
      Amount:Number(e.amount)||0,
      Site:e.site || "",
      Category:e.category || "",
      "Sub-Category":e.subCategory || "",
      Description:e.description || "",
      "Paid To": e.settledTo || "",
      "Payment Date": e.paidDate ? fmtDate(e.paidDate) : "",
      "Passed On To": e.onwardTo || "",
      "Passed On Date": e.onwardDate ? fmtDate(e.onwardDate) : "",
      "Claimed In": e.claimRef || "",
    });
    const cols = [{wch:14},{wch:12},{wch:14},{wch:16},{wch:12},{wch:14},{wch:16},{wch:20},{wch:38},{wch:16},{wch:14},{wch:16},{wch:14},{wch:16}];
    const wb = XLSX.utils.book_new();
    const groups = {};
    rows.forEach(e => { (groups[e.expenseType] = groups[e.expenseType] || []).push(e); });
    Object.keys(groups).sort().forEach(k => {
      const ws = XLSX.utils.json_to_sheet(groups[k].map(toRow));
      ws["!cols"] = cols;
      XLSX.utils.book_append_sheet(wb, ws, String(k).slice(0,28));
    });
    const all = XLSX.utils.json_to_sheet(rows.map(toRow));
    all["!cols"] = cols;
    XLSX.utils.book_append_sheet(wb, all, "All Expenses");
    // Every figure below is worked out from the same rows written above,
    // so the summary can never drift from the sheets.
    const sum = (list, pick) => list.reduce((a,e)=>a+(pick?pick(e):Number(e.amount||0)),0);
    const isSettled = (e) => expenseSettled(e);
    const line = (label, list) => ({
      "Expense Type":label, "Entries":list.length,
      "Amount":sum(list),
      "Settled":sum(list.filter(isSettled)),
      "Still Owed":sum(list.filter(e=>!isSettled(e))),
    });
    const summary = Object.entries(groups).map(([k, list]) => line(k, list));
    summary.push(line("TOTAL", rows));
    const sws = XLSX.utils.json_to_sheet(summary);
    sws["!cols"] = [{wch:20},{wch:12},{wch:16},{wch:16},{wch:16}];
    XLSX.utils.book_append_sheet(wb, sws, "Summary");

    // Who is owed what - the figure that actually decides the next payment.
    const people = {};
    rows.forEach(e => { const k = e.paidBy || "Not set"; (people[k] = people[k] || []).push(e); });
    const byPerson = Object.entries(people)
      .map(([k, list]) => ({
        "Paid By":k, "Entries":list.length, "Amount":sum(list),
        "Settled":sum(list.filter(isSettled)),
        "Still Owed":sum(list.filter(e=>!isSettled(e))),
      }))
      .sort((a,b)=>b["Still Owed"]-a["Still Owed"] || b.Amount-a.Amount);
    byPerson.push({ "Paid By":"TOTAL", "Entries":rows.length, "Amount":sum(rows),
      "Settled":sum(rows.filter(isSettled)), "Still Owed":sum(rows.filter(e=>!isSettled(e))) });
    const pws = XLSX.utils.json_to_sheet(byPerson);
    pws["!cols"] = [{wch:22},{wch:12},{wch:16},{wch:16},{wch:16}];
    XLSX.utils.book_append_sheet(wb, pws, "By Person");
    XLSX.writeFile(wb, `Expense_Support_${todayStr()}.xlsx`);
    showToast(`Exported ${rows.length} expense(s)`);
  }

  if (editing) {
    return <ExpenseForm exp={editing} lists={L} setLists={setLists} reqs={reqs}
      onCancel={()=>setEditing(null)} onSave={save}
      onDelete={(row)=>{
        if (!confirm(
          `Delete this expense?\n\n${row.description || row.expenseType} - ₹${fmtINR(row.amount)}\n` +
          (row.claimRef ? `\nAttached to ${row.claimRef}. That payment stays as it is, but will no longer show what it covered.\n` : "") +
          `\nThis cannot be undone.`
        )) return;
        setExpenses(expenses.filter(x => x.id !== row.id));
        setEditing(null);
        showToast("Expense deleted");
      }} />;
  }

  return (
    <div>
      <button onClick={()=>goTo("dashboard")}
        style={{ display:"flex", alignItems:"center", gap:6, marginBottom:16, fontSize:14, fontWeight:600, color:INK, background:"none", border:"none", cursor:"pointer" }}>
        <Icon name="close" size={16} /> Back to dashboard
      </button>

      <div style={{ background:SURFACE, borderRadius:16, padding:20, marginBottom:14, border:`1.5px solid ${unclaimed.length ? AMBER : SAND}` }}>
        <div style={{ fontSize:12, fontWeight:600, color:MUTED }}>Spent, not yet claimed</div>
        <div style={{ fontSize:26, fontWeight:700, color: unclaimed.length ? AMBER : INK }}>
          ₹{fmtINR(unclaimed.reduce((s,e)=>s+Number(e.amount||0),0))}
        </div>
        <div style={{ fontSize:12, color:MUTED, marginTop:2 }}>{unclaimed.length} expense(s)</div>
        {owedByPerson.length > 0 && (
          <div style={{ marginTop:14, paddingTop:14, borderTop:`1px solid ${SAND}` }}>
            {owedByPerson.map(([who, amt]) => (
              <div key={who} style={{ display:"flex", justifyContent:"space-between", fontSize:14, padding:"5px 0" }}>
                <span style={{ fontWeight:500, color:INK }}>{who}</span>
                <span style={{ fontWeight:700, color:INK }}>₹{fmtINR(amt)}</span>
              </div>
            ))}
          </div>
        )}
      </div>

      <div style={{ display:"grid", gridTemplateColumns:"2fr 1fr", gap:10 }}>
        <BigButton icon="plus" label="Add"
          onClick={()=>setEditing({ ...emptyExpense, id: uid(), date: todayStr(),
            paidBy: people.length === 1 ? people[0] : "", expenseType: expenseTypes[0] })}
          tone="amber" full />
        <BigButton icon="download" label="Import" onClick={()=>openImport("expenses")} tone="ink" full />
      </div>

      <div style={{ display:"flex", gap:8, margin:"14px 0 10px" }}>
        <button onClick={()=>{ setView("unclaimed"); setSelected(new Set()); }}
          style={{ flex:1, padding:"9px 0", borderRadius:12, fontSize:14, fontWeight:600, cursor:"pointer",
            background: view==="unclaimed"?INK:"#fff", color: view==="unclaimed"?"#fff":INK, border:`1px solid ${view==="unclaimed"?INK:SAND}` }}>
          To settle ({unclaimed.length})
        </button>
        <button onClick={()=>{ setView("claimed"); setSelected(new Set()); }}
          style={{ flex:1, padding:"9px 0", borderRadius:12, fontSize:14, fontWeight:600, cursor:"pointer",
            background: view==="claimed"?INK:"#fff", color: view==="claimed"?"#fff":INK, border:`1px solid ${view==="claimed"?INK:SAND}` }}>
          Settled ({expenses.length - unclaimed.length})
        </button>
      </div>

      {people.length > 1 && (
        <div style={{ display:"flex", gap:8, marginBottom:12, overflowX:"auto", paddingBottom:4 }}>
          {["All", ...people].map(x => (
            <button key={x} onClick={()=>{ setPersonFilter(x); setSelected(new Set()); }}
              style={{ padding:"7px 13px", borderRadius:12, fontSize:13, fontWeight:600, whiteSpace:"nowrap", cursor:"pointer",
                background: personFilter===x?AMBER:"#fff", color: personFilter===x?"#fff":INK, border:`1px solid ${personFilter===x?AMBER:SAND}` }}>
              {x}
            </button>
          ))}
        </div>
      )}

      <SearchBox value={query} onChange={setQuery} placeholder="Search description, type, person" />
      {(() => {
        const pos = partnerPositions(expenses);
        if (pos.length === 0) return null;
        const spent = pos.reduce((a,p)=>a+p.spent,0);
        const owed = pos.reduce((a,p)=>a+p.owed,0);
        const done = pos.filter(p=>p.status==="Fully reconciled").length;
        return (
          <div style={{ background:SURFACE, borderRadius:20, padding:18, marginBottom:12,
            border:`1px solid ${SAND}`, boxShadow:SHADOW }}>
            <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:4 }}>
              <SectionLabel>Where each person stands</SectionLabel>
              <span style={{ fontSize:11.5, color:MUTED, fontWeight:600 }}>
                {done} of {pos.length} clear
              </span>
            </div>
            <div style={{ fontSize:12.5, color:MUTED, lineHeight:1.55, marginBottom:12 }}>
              Spent out of their own pocket, against what has been squared up either on a payment or directly.
            </div>

            {pos.map(p => {
              const pct = p.spent > 0 ? Math.round((p.settled / p.spent) * 100) : 100;
              const tone = p.owed < 0.5 ? GREEN : p.settled > 0.5 ? AMBER : RED;
              return (
                <div key={p.person} style={{ padding:"11px 0", borderTop:`1px solid ${SAND}` }}>
                  <div style={{ display:"flex", justifyContent:"space-between", alignItems:"baseline", gap:8 }}>
                    <span style={{ fontWeight:700, color:INK, fontSize:14 }}>{p.person}</span>
                    <span className="num" style={{ fontWeight:700, color:INK, fontSize:14 }}>₹{fmtINR(p.spent)}</span>
                  </div>
                  <div style={{ height:7, borderRadius:999, background:SAND, marginTop:7, overflow:"hidden" }}>
                    <div style={{ height:7, width:`${Math.min(100,pct)}%`, background:tone, borderRadius:999 }} />
                  </div>
                  <div style={{ display:"flex", justifyContent:"space-between", marginTop:6, fontSize:11.5 }}>
                    <span style={{ color:MUTED }}>
                      {p.count} expense(s) · settled ₹{fmtINR(p.settled)}
                      {p.viaClaim > 0 ? ` (₹${fmtINR(p.viaClaim)} on payments)` : ""}
                    </span>
                    <span style={{ fontWeight:700, color:tone }}>
                      {p.owed < 0.5 ? "Fully reconciled" : `₹${fmtINR(p.owed)} still owed`}
                    </span>
                  </div>
                </div>
              );
            })}

            <div style={{ display:"flex", justifyContent:"space-between", marginTop:12, paddingTop:11,
              borderTop:`2px solid ${INK}` }}>
              <span style={{ fontWeight:700, color:INK, fontSize:14 }}>Still owed in total</span>
              <span className="num" style={{ fontWeight:800, color: owed > 0.5 ? AMBER : GREEN, fontSize:16 }}>
                ₹{fmtINR(owed)}
              </span>
            </div>
            <div style={{ fontSize:11.5, color:MUTED, marginTop:5 }}>
              of ₹{fmtINR(spent)} spent by everyone
            </div>
          </div>
        );
      })()}

      <button onClick={()=>setShowAnalysis(!showAnalysis)}
        style={{ width:"100%", marginBottom:10, padding:"11px 0", borderRadius:13, fontSize:13.5, fontWeight:600,
          background: showAnalysis ? INK : SURFACE, color: showAnalysis ? "#fff" : INK,
          border:`1px solid ${showAnalysis ? INK : SAND}`, cursor:"pointer" }}>
        {showAnalysis ? "Hide the breakdown" : "Show the breakdown"}
      </button>

      {showAnalysis && (() => {
        const roll = (get) => {
          const m = {};
          visible.forEach(e => { const k = get(e) || "Not set"; m[k] = (m[k]||0) + Number(e.amount||0); });
          return Object.entries(m).sort((a,b)=>b[1]-a[1]).slice(0,10);
        };
        const byCat = roll(e=>e.category);
        const byType = roll(e=>e.expenseType);
        const byPerson = roll(e=>e.paidBy);
        const bySite = roll(e=>e.site);
        const blocks = [["By person", byPerson, AMBER], ["By type", byType, GREEN],
                        ["By category", byCat, INK], ["By site", bySite, MUTED]];
        return (
          <div style={{ marginBottom:12 }}>
            {blocks.filter(([,d])=>d.length > 1).map(([title, data, colour]) => (
              <div key={title} style={{ background:SURFACE, borderRadius:18, padding:16, marginBottom:10,
                border:`1px solid ${SAND}`, boxShadow:SHADOW }}>
                <div style={{ fontWeight:700, marginBottom:10, color:INK, fontSize:14 }}>{title}</div>
                <BarList data={data} color={colour} />
              </div>
            ))}
          </div>
        );
      })()}

      <GroupBar value={groupBy} onChange={setGroupBy} options={[
        {k:"none",label:"No grouping"},{k:"person",label:"Person"},{k:"type",label:"Type"},
        {k:"category",label:"Category"},{k:"site",label:"Site"},{k:"month",label:"Month"}]} />

      {visible.length > 0 && (
        <SortBar sortKey={sortKey} onSortKey={setSortKey} options={EXP_SORTS} desc={desc} onDesc={setDesc} />
      )}

      {visible.length > 0 && (
        <button onClick={selectAllVisible}
          style={{ fontSize:14, fontWeight:600, color:AMBER, background:"none", border:"none", cursor:"pointer", marginBottom:10, padding:0 }}>
          {selected.size === visible.length ? "Deselect all" : `Select all (${visible.length})`}
        </button>
      )}

      {visible.length === 0 ? (
        <EmptyState text={view==="unclaimed"
          ? "Nothing outstanding. Add expenses as you spend, then settle or claim them."
          : "Nothing settled yet."} />
      ) : (
        <React.Fragment>
          {breakdown.length > 1 && (
            <div style={{ background:SURFACE, borderRadius:20, padding:18, marginBottom:12, border:`1px solid ${SAND}`, boxShadow:SHADOW }}>
              <div style={{ fontWeight:700, marginBottom:12, color:INK }}>
                {groupBy === "person" ? "By category" : "By person"}
              </div>
              <BarList data={breakdown} color={AMBER} />
            </div>
          )}

          <div style={{ display:"flex", flexDirection:"column", gap:6, marginBottom: selected.size ? 150 : 24 }}>
            {sections.map(g => (
              <React.Fragment key={g.key}>
                {g.key !== "__all" && <GroupHead label={g.label} count={g.rows.length} total={g.total} />}
                {g.rows.map(e => {
                  const done = expenseSettled(e);
                  return (
                    <div key={e.id} onClick={()=>setEditing(e)}
                      style={{ background:SURFACE, borderRadius:14, padding:"12px 14px", display:"flex", gap:11,
                        alignItems:"center", cursor:"pointer",
                        border:`1.5px solid ${selected.has(e.id) ? AMBER : SAND}`,
                        borderLeft:`4px solid ${done ? GREEN : AMBER}`, boxShadow:SHADOW }}>
                      <SelectCheck on={selected.has(e.id)} onToggle={()=>toggle(e.id)} />
                      <div style={{ flex:1, minWidth:0 }}>
                        <div style={{ fontWeight:650, fontSize:14.5, color:INK, overflow:"hidden",
                          textOverflow:"ellipsis", whiteSpace:"nowrap" }}>
                          {e.description || e.expenseType}
                        </div>
                        <div style={{ fontSize:12, color:MUTED, marginTop:2, overflow:"hidden",
                          textOverflow:"ellipsis", whiteSpace:"nowrap" }}>
                          {[groupBy === "person" ? (e.date ? fmtDate(e.date) : "no date") : (e.paidBy || "unassigned"),
                            e.expenseType, e.site, e.category
                          ].filter(Boolean).join(" · ")}
                        </div>
                      </div>
                      <button onClick={(ev)=>{
                          ev.stopPropagation();
                          if (!confirm(
                            `Delete this expense?\n\n${e.description || e.expenseType} - ₹${fmtINR(e.amount)}\n` +
                            (e.claimRef ? `\nAttached to ${e.claimRef}. That payment stays as it is.\n` : "") +
                            `\nThis cannot be undone.`
                          )) return;
                          setExpenses(expenses.filter(x => x.id !== e.id));
                          showToast("Expense deleted");
                        }}
                        style={{ flexShrink:0, padding:6, borderRadius:8, background:"#FDECEE",
                          border:"none", cursor:"pointer", display:"flex", alignItems:"center" }}>
                        <Icon name="trash" size={13} color={RED} />
                      </button>
                      <div style={{ textAlign:"right", flexShrink:0 }}>
                        <div className="num" style={{ fontWeight:750, fontSize:15, color:INK }}>
                          ₹{fmtINR(e.amount)}
                        </div>
                        {e.claimRef
                          ? <div style={{ fontSize:10.5, fontWeight:700, color:GREEN, marginTop:2 }}>{e.claimRef}</div>
                          : e.paidDate
                          ? <div style={{ fontSize:10.5, fontWeight:700, color:GREEN, marginTop:2 }}>
                              paid {fmtDate(e.paidDate)}
                            </div>
                          : <div style={{ fontSize:10.5, fontWeight:700, color:AMBER, marginTop:2 }}>owed</div>}
                      </div>
                      <button onClick={(ev)=>{ev.stopPropagation(); e.claimId ? unlinkClaim(e) : remove(e);}}
                        style={{ padding:5, borderRadius:8, background:"transparent", border:"none", cursor:"pointer", flexShrink:0 }}>
                        <Icon name={e.claimId ? "close" : "trash"} size={14} color="#C7D0DE" />
                      </button>
                    </div>
                  );
                })}
              </React.Fragment>
            ))}
          </div>
        </React.Fragment>
      )}

      <div style={{ marginBottom:20 }}>
        <BigButton icon="download" label="Export Support Sheets" onClick={exportSupportSheets} tone="ink" full />
      </div>

      {askDate && (() => {
        const people = [...new Set(selectedRows.map(e=>e.paidBy||"Unassigned"))];
        const total = selectedRows.reduce((a,e)=>a+Number(e.amount||0), 0);
        const info = (
          <div style={{ background:"#F1F4F9", borderRadius:14, padding:14, marginBottom:16 }}>
            <div style={{ display:"flex", justifyContent:"space-between", fontSize:13, marginBottom:5 }}>
              <span style={{ color:MUTED }}>{askDate === "claim" ? "Pay to" : "Paid to"}</span>
              <span style={{ fontWeight:700, color:INK }}>{people.join(", ")}</span>
            </div>
            <div style={{ display:"flex", justifyContent:"space-between", fontSize:13, marginBottom:5 }}>
              <span style={{ color:MUTED }}>Expenses covered</span>
              <span style={{ fontWeight:700, color:INK }}>{selectedRows.length}</span>
            </div>
            <div style={{ display:"flex", justifyContent:"space-between", fontSize:15,
              paddingTop:8, borderTop:`1px solid ${SAND}` }}>
              <span style={{ fontWeight:700, color:INK }}>Total</span>
              <span className="num" style={{ fontWeight:800, color:INK }}>₹{fmtINR(total)}</span>
            </div>
            {askDate === "claim" && (
              <div style={{ fontSize:12, color:MUTED, marginTop:10, lineHeight:1.5 }}>
                These expenses are locked to the requisition once created, so they can never be claimed twice.
              </div>
            )}
          </div>
        );
        return (
          <DatePickModal
            title={askDate === "claim" ? "Date of the claim"
              : askDate === "register" ? "Date the payment was made"
              : "Date the money was paid back"}
            subtitle={askDate === "claim"
              ? "This becomes the requisition date."
              : askDate === "register"
              ? "One entry goes into the Payment Register, already marked paid on this date."
              : "Pick the day it actually left your account."}
            label="Date"
            initial={todayStr()}
            confirmLabel={askDate === "claim" ? "Create claim"
              : askDate === "register" ? "Add to Payment Register" : "Mark as paid"}
            extra={info}
            onCancel={()=>setAskDate(null)}
            onConfirm={(iso)=> askDate === "claim" ? applyClaim(iso)
              : askDate === "register" ? applyRegisterEntry(iso)
              : applySettlement(iso)}
          />
        );
      })()}

      {selected.size > 0 && (
