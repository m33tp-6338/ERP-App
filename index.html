/* ================= UTILITIES ================= */
function UtilitiesTab({ utilities, setUtilities, cards, lists, setLists, showToast, goTo }){
  const L = lists || DEFAULT_LISTS;
  const [monthFilter, setMonthFilter] = useState("all");
  const [placeFilter, setPlaceFilter] = useState("All");
  const [typeFilter, setTypeFilter] = useState("All");
  const [editing, setEditing] = useState(null);
  const [selected, setSelected] = useState(new Set());
  const [bulkOpen, setBulkOpen] = useState(false);
  const [sortKey, setSortKey] = useState("month");
  const [desc, setDesc] = useState(true);
  const [query, setQuery] = useState("");
  const UTIL_SORTS = [
    { k:"month",   label:"Month",       get:u=>u.month||"" },
    { k:"amount",  label:"Bill amount", get:u=>Number(u.billAmount||0) },
    { k:"due",     label:"Outstanding", get:u=>utilityOutstanding(u) },
    { k:"site",    label:"Site",        get:u=>u.site||"" },
    { k:"type",    label:"Utility",     get:u=>u.utilityType||"" },
    { k:"duedate", label:"Due date",    get:u=>u.dueDate||"" },
  ];

  const utilTypes = L.utilityTypes || DEFAULT_LISTS.utilityTypes;
  const places = useMemo(
    () => [...new Set(["Head Office", ...(L.sites||[]), ...utilities.map(u=>u.site).filter(Boolean)])],
    [L.sites, utilities]);

  const months = useMemo(() => {
    const set = new Set();
    utilities.forEach(u => { if (u.month) set.add(u.month); });
    return [...set].sort().reverse();
  }, [utilities]);

  const visibleRaw = useMemo(() => utilities.filter(u => {
      if (monthFilter !== "all" && u.month !== monthFilter) return false;
      if (placeFilter !== "All" && u.site !== placeFilter) return false;
      if (typeFilter !== "All" && u.utilityType !== typeFilter) return false;
      if (!matches(query, dateTerms(u.dueDate, u.paymentDate), u.month, monthLabel(u.month), u.utilityType, u.provider, u.consumerNo, u.billNo, u.site, u.notes, u.billAmount)) return false;
      return true;
    }), [utilities, monthFilter, placeFilter, typeFilter]);
  const visible = useMemo(
    () => sortBy(visibleRaw, (UTIL_SORTS.find(x=>x.k===sortKey)||UTIL_SORTS[0]).get, desc),
    [visibleRaw, sortKey, desc]);

  const billed  = visible.reduce((s,u)=>s+Number(u.billAmount||0), 0);
  const paid    = visible.reduce((s,u)=>s+Number(u.paidAmount||0), 0);
  const charges = visible.reduce((s,u)=>s+Number(u.cardCharge||0), 0);
  const dues    = visible.reduce((s,u)=>s+utilityOutstanding(u), 0);
  const unpaid  = visible.filter(u => utilityOutstanding(u) > 0);
  const overdue = unpaid.filter(u => u.dueDate && daysUntil(u.dueDate) < 0);

  const byPlace = useMemo(() => {
    const m = {};
    visible.forEach(u => { const k=u.site||"Unassigned"; m[k]=(m[k]||0)+utilityDebited(u); });
    return Object.entries(m).sort((a,b)=>b[1]-a[1]);
  }, [visible]);

  function save(u){
    if (!u.month) return showToast("Choose the bill month", "error");
    if (!u.site) return showToast("Choose the site or office", "error");
    if (!u.billAmount && !u.paidAmount) return showToast("Enter the bill amount", "error");
    const exists = utilities.some(x => x.id === u.id);
    setUtilities(exists ? utilities.map(x => x.id===u.id ? u : x)
                        : [...utilities, { ...u, createdAt: Date.now() }]);
    setEditing(null);
    showToast(exists ? "Updated" : "Added");
  }
  function remove(u){
    if (!confirm(`Delete this ${u.utilityType} bill for ${u.site}?`)) return;
    setUtilities(utilities.filter(x => x.id !== u.id));
    showToast("Deleted");
  }
  function copyToNextMonth(u){
    const [y,m] = String(u.month||"").split("-").map(Number);
    if (!y || !m) return showToast("This entry has no month set", "error");
    const d = new Date(y, m, 1);                     // next month
    const nm = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}`;
    if (utilities.some(x => x.month===nm && x.site===u.site && x.utilityType===u.utilityType)) {
      showToast("That month already has this bill", "error"); return;
    }
    setEditing({ ...u, id: uid(), month: nm, billNo:"", billAmount:"", paidAmount:"", paymentDate:"",
      cardCharge:"", periodFrom:"", periodTo:"", dueDate:"", hasBill:false,
      meterPrev: u.meterCurr || "", meterCurr:"" });
    showToast("Carried over — fill in this month's figures");
  }

  function toggleSel(id){
    setSelected(prev => { const n = new Set(prev); n.has(id) ? n.delete(id) : n.add(id); return n; });
  }
  function bulkDeleteUtil(){
    const picked = utilities.filter(u => selected.has(u.id));
    if (!confirm(`Delete ${picked.length} bill(s)? This cannot be undone.`)) return;
    setUtilities(utilities.filter(u => !selected.has(u.id)));
    setSelected(new Set());
    showToast(`${picked.length} deleted`);
  }
  function bulkMarkPaid(){
    const today = todayStr();
    setUtilities(utilities.map(u => selected.has(u.id)
      ? { ...u, paidAmount: u.paidAmount || u.billAmount, paymentDate: u.paymentDate || today } : u));
    setSelected(new Set());
    showToast("Marked paid in full");
  }

  function exportUtilities(){
    if (utilities.length === 0) { showToast("Nothing to export", "error"); return; }
    const cardOf = id => ((cards||[]).find(c=>c.id===id)||{}).name || "";
    const rows = [...utilities].sort((a,b)=>String(a.month||"").localeCompare(String(b.month||"")))
      .map(u => ({
        Month:u.month||"", "Site / Office":u.site||"", Utility:u.utilityType||"",
        Provider:u.provider||"", "Consumer No":u.consumerNo||"", "Bill No":u.billNo||"",
        "Period From":fmtDate(u.periodFrom), "Period To":fmtDate(u.periodTo), "Due Date":fmtDate(u.dueDate),
        "Bill Amount":Number(u.billAmount)||0, "Amount Paid":Number(u.paidAmount)||0,
        "Outstanding":utilityOutstanding(u),
        "Payment Date":fmtDate(u.paymentDate), "Payment Mode":u.paymentMode||"",
        "Card":cardOf(u.cardId), "Card Charge":Number(u.cardCharge)||0,
        "Total Debited":utilityDebited(u),
        "Meter Previous":u.meterPrev||"", "Meter Current":u.meterCurr||"", "Units":utilityUnits(u)||"",
        "Bill Attached": u.hasBill ? "Yes" : "No", Notes:u.notes||"",
      }));
    const ws = XLSX.utils.json_to_sheet(rows);
    ws["!cols"] = [{wch:10},{wch:16},{wch:14},{wch:18},{wch:16},{wch:14},{wch:12},{wch:12},{wch:12},
                   {wch:14},{wch:14},{wch:13},{wch:13},{wch:14},{wch:16},{wch:12},{wch:14},
                   {wch:13},{wch:13},{wch:9},{wch:12},{wch:24}];
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, "Utilities");

    const summary = {};
    utilities.forEach(u => {
      const k = `${u.month}|${u.site}`;
      if (!summary[k]) summary[k] = { Month:u.month, "Site / Office":u.site, Billed:0, Paid:0, "Card Charges":0, Outstanding:0 };
      summary[k].Billed += Number(u.billAmount||0);
      summary[k].Paid += Number(u.paidAmount||0);
      summary[k]["Card Charges"] += Number(u.cardCharge||0);
      summary[k].Outstanding += utilityOutstanding(u);
    });
    const sws = XLSX.utils.json_to_sheet(Object.values(summary));
    sws["!cols"] = [{wch:10},{wch:18},{wch:14},{wch:14},{wch:14},{wch:14}];
    XLSX.utils.book_append_sheet(wb, sws, "Monthly Summary");
    XLSX.writeFile(wb, `Utilities_${todayStr()}.xlsx`);
    showToast(`Exported ${rows.length} bill(s)`);
  }

  if (editing) {
    return <UtilityForm u={editing} cards={cards} lists={L} setLists={setLists} places={places}
      utilTypes={utilTypes} onCancel={()=>setEditing(null)} onSave={save} />;
  }

  return (
    <div>
      <button onClick={()=>goTo("dashboard")}
        style={{ display:"flex", alignItems:"center", gap:6, marginBottom:16, fontSize:14, fontWeight:600, color:INK, background:"none", border:"none", cursor:"pointer" }}>
        <Icon name="close" size={16} /> Back to dashboard
      </button>

      <div style={{ background:GRAD_INK, borderRadius:22, padding:20, marginBottom:12, boxShadow:SHADOW_LG }}>
        <div style={{ fontSize:11.5, fontWeight:600, color:"#8FA0BC", textTransform:"uppercase", letterSpacing:"0.08em" }}>
          {monthFilter === "all" ? "All months" : monthLabel(monthFilter)}
        </div>
        <div className="num" style={{ fontSize:30, fontWeight:800, color:"#fff", marginTop:6 }}>
          ₹{fmtINR(paid + charges)}
        </div>
        <div style={{ fontSize:12, color:"#8FA0BC", marginTop:2 }}>taken from your account</div>
        <div style={{ display:"flex", gap:14, marginTop:14, flexWrap:"wrap" }}>
          <div><div style={{ fontSize:11, color:"#8FA0BC" }}>Billed</div>
            <div className="num" style={{ fontSize:14, fontWeight:700, color:"#fff" }}>₹{fmtINR(billed)}</div></div>
          <div><div style={{ fontSize:11, color:"#8FA0BC" }}>Paid</div>
            <div className="num" style={{ fontSize:14, fontWeight:700, color:"#fff" }}>₹{fmtINR(paid)}</div></div>
          <div><div style={{ fontSize:11, color:"#8FA0BC" }}>Card charges</div>
            <div className="num" style={{ fontSize:14, fontWeight:700, color: charges ? "#FFC98A" : "#fff" }}>₹{fmtINR(charges)}</div></div>
          <div><div style={{ fontSize:11, color:"#8FA0BC" }}>Still due</div>
            <div className="num" style={{ fontSize:14, fontWeight:700, color: dues ? "#FFB4B4" : "#fff" }}>₹{fmtINR(dues)}</div></div>
        </div>
        {overdue.length > 0 && (
          <div style={{ marginTop:12, fontSize:12.5, fontWeight:700, color:"#FFB4B4" }}>
            {overdue.length} bill(s) past their due date
          </div>
        )}
      </div>

      <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr 1fr", gap:8, marginBottom:12 }}>
        <button onClick={()=>setEditing({ ...emptyUtility, id: uid(),
            month: monthFilter !== "all" ? monthFilter : todayStr().slice(0,7),
            site: placeFilter !== "All" ? placeFilter : "",
            utilityType: typeFilter !== "All" ? typeFilter : utilTypes[0] })}
          style={{ borderRadius:14, padding:"12px 6px", fontSize:13, fontWeight:700, background:GRAD, color:"#fff", border:"none", cursor:"pointer" }}>
          Add Bill
        </button>
        <button onClick={()=>goTo("import:utilities")}
          style={{ borderRadius:14, padding:"12px 6px", fontSize:13, fontWeight:600, background:SAND, color:INK, border:"none", cursor:"pointer" }}>
          Import
        </button>
        <button onClick={exportUtilities}
          style={{ borderRadius:14, padding:"12px 6px", fontSize:13, fontWeight:700, background:GREEN, color:"#fff", border:"none", cursor:"pointer" }}>
          Export
        </button>
      </div>

      <div style={{ display:"grid", gridTemplateColumns:"1fr", gap:8, marginBottom:8 }}>
        <select style={inputStyle} value={monthFilter} onChange={e=>setMonthFilter(e.target.value)}>
          <option value="all">All months</option>
          {months.map(m => <option key={m} value={m}>{monthLabel(m)}</option>)}
        </select>
      </div>

      <div style={{ display:"flex", gap:8, marginBottom:8, overflowX:"auto", paddingBottom:4 }}>
        {["All", ...places].map(x => {
          const on = placeFilter === x;
          return (
            <button key={x} onClick={()=>setPlaceFilter(x)}
              style={{ padding:"8px 13px", borderRadius:12, fontSize:13.5, fontWeight:600, whiteSpace:"nowrap", cursor:"pointer",
                background: on?INK:SURFACE, color: on?"#fff":INK, border:`1px solid ${on?INK:SAND}` }}>
              {x}
            </button>
          );
        })}
      </div>

      <div style={{ display:"flex", gap:8, marginBottom:12, overflowX:"auto", paddingBottom:4 }}>
        {["All", ...utilTypes].map(x => {
          const on = typeFilter === x;
          return (
            <button key={x} onClick={()=>setTypeFilter(x)}
              style={{ padding:"7px 12px", borderRadius:12, fontSize:13, fontWeight:600, whiteSpace:"nowrap", cursor:"pointer",
                background: on?AMBER:SURFACE, color: on?"#fff":INK, border:`1px solid ${on?AMBER:SAND}` }}>
              {x}
            </button>
          );
        })}
      </div>

      {byPlace.length > 1 && (
        <div style={{ background:SURFACE, borderRadius:20, padding:18, marginBottom:12, border:`1px solid ${SAND}`, boxShadow:SHADOW }}>
          <div style={{ fontWeight:700, marginBottom:12, color:INK }}>By site &amp; office</div>
          <BarList data={byPlace} color={AMBER} />
        </div>
      )}

      <SearchBox value={query} onChange={setQuery} placeholder="Search provider, consumer no, bill no" />
      <SortBar sortKey={sortKey} onSortKey={setSortKey} options={UTIL_SORTS} desc={desc} onDesc={setDesc} />
      <SelectAllBar count={selected.size} total={visible.length}
        onToggleAll={()=>setSelected(selected.size===visible.length ? new Set() : new Set(visible.map(u=>u.id)))} />

      {visible.length === 0 ? (
        <EmptyState text="No utility bills for this filter. Add electricity, water, internet and phone bills here each month." />
      ) : (
        <div style={{ display:"flex", flexDirection:"column", gap:8, marginBottom: selected.size ? 100 : 20 }}>
          {visible.map(u => {
            const out = utilityOutstanding(u);
            const late = u.dueDate && daysUntil(u.dueDate) < 0 && out > 0;
            return (
              <div key={u.id} onClick={()=>setEditing(u)}
                style={{ background:SURFACE, borderRadius:16, padding:14, cursor:"pointer",
                  display:"flex", gap:10, alignItems:"flex-start",
                  border:`1.5px solid ${selected.has(u.id) ? AMBER : (late ? RED : SAND)}`, boxShadow:SHADOW }}>
                <SelectCheck on={selected.has(u.id)} onToggle={()=>toggleSel(u.id)} />
                <div style={{ flex:1, minWidth:0 }}>
                <div style={{ display:"flex", justifyContent:"space-between", gap:8 }}>
                  <div style={{ fontWeight:700, color:INK, overflow:"hidden", textOverflow:"ellipsis", whiteSpace:"nowrap" }}>
                    {u.utilityType}{u.provider ? ` · ${u.provider}` : ""}
                  </div>
                  <div className="num" style={{ fontWeight:700, color:INK, flexShrink:0 }}>₹{fmtINR(u.billAmount)}</div>
                </div>
                <div style={{ fontSize:12, color:MUTED, marginTop:3 }}>
                  {monthLabel(u.month)} · {u.site}{u.consumerNo ? ` · ${u.consumerNo}` : ""}
                </div>
                <div style={{ display:"flex", gap:6, marginTop:8, flexWrap:"wrap", alignItems:"center" }}>
                  {out > 0
                    ? <span style={{ fontSize:11, fontWeight:700, padding:"3px 8px", borderRadius:999,
                        background: late ? "#FDECEE" : "#EEF0FE", color: late ? RED : AMBER }}>
                        {late ? "Overdue " : "Due "}₹{fmtINR(out)}
                      </span>
                    : <span style={{ fontSize:11, fontWeight:600, padding:"3px 8px", borderRadius:999, background:"#E6F7F2", color:GREEN }}>
                        Paid
                      </span>}
                  {Number(u.cardCharge||0) > 0 && (
                    <span style={{ fontSize:11, fontWeight:600, padding:"3px 8px", borderRadius:999, background:SAND, color:INK }}>
                      +₹{fmtINR(u.cardCharge)} card charge
                    </span>
                  )}
                  {utilityUnits(u) > 0 && (
                    <span style={{ fontSize:11, color:MUTED }}>{fmtINR(utilityUnits(u))} units</span>
                  )}
                  {!u.hasBill && (
                    <span style={{ fontSize:11, fontWeight:600, color:RED }}>no bill</span>
                  )}
                  <button onClick={(e)=>{e.stopPropagation(); copyToNextMonth(u);}}
                    style={{ marginLeft:"auto", padding:"4px 9px", borderRadius:8, background:SAND, border:"none",
                      cursor:"pointer", fontSize:11, fontWeight:600, color:INK }}>
                    Next month
                  </button>
                  <button onClick={(e)=>{e.stopPropagation(); remove(u);}}
                    style={{ padding:5, borderRadius:8, background:"#FDECEE", border:"none", cursor:"pointer" }}>
                    <Icon name="trash" size={13} color={RED} />
                  </button>
                </div>
                </div>
              </div>
            );
          })}
        </div>
      )}

      <BulkBar count={selected.size}
        subtitle={`Rs ${fmtINR(utilities.filter(u=>selected.has(u.id)).reduce((s,u)=>s+Number(u.billAmount||0),0))} billed`}
        onOptions={()=>setBulkOpen(true)} />
      {bulkOpen && (
        <ActionSheet
          title={`${selected.size} bill(s) selected`}
          onClose={()=>setBulkOpen(false)}
          actions={[
            { label:"Mark paid in full", icon:"check", onPress: bulkMarkPaid },
            { label:"Clear selection", icon:"close", onPress: ()=>setSelected(new Set()) },
            { label:"Delete", icon:"trash", danger:true, onPress: bulkDeleteUtil },
          ]}
        />
      )}
    </div>
  );
}

function UtilityForm({ u, cards, lists, setLists, places, utilTypes, onCancel, onSave }){
  const [v, setV] = useState(u);
  const [showMeter, setShowMeter] = useState(!!(u.meterPrev || u.meterCurr));
  function set(k, val){ setV(prev => ({ ...prev, [k]: val })); }

  const card = (cards||[]).find(c => c.id === v.cardId);
  const bill = Number(v.billAmount||0);
  const paidAmt = Number(v.paidAmount||0);
  const charge = Number(v.cardCharge||0);
  const out = Math.max(0, bill - paidAmt);
  const debited = paidAmt + charge;
  const units = utilityUnits(v);
  const perUnit = units > 0 && bill > 0 ? bill / units : 0;

  function applySurcharge(){
    const pct = Number((card||{}).surchargePct || 0);
    const base = paidAmt || bill;
    if (!pct || !base) { alert("Set a card charge % on the card first, under Cash & Card."); return; }
    setV(prev => ({ ...prev, cardCharge: +(base * pct / 100).toFixed(2) }));
  }

  return (
    <div>
      <button onClick={onCancel}
        style={{ display:"flex", alignItems:"center", gap:6, marginBottom:16, fontSize:14, fontWeight:600, color:INK, background:"none", border:"none", cursor:"pointer" }}>
        <Icon name="close" size={16} /> Cancel
      </button>

      <div style={{ background:SURFACE, borderRadius:20, padding:20, marginBottom:12, border:`1px solid ${SAND}`, boxShadow:SHADOW }}>
        <div style={{ fontSize:15, fontWeight:700, color:INK, marginBottom:14 }}>1. Which bill?</div>

        <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:12 }}>
          <Field label="Bill month" required>
            <input type="month" style={inputStyle} value={v.month} onChange={e=>set("month", e.target.value)} />
          </Field>
          <Field label="Site / office" required>
            <select style={inputStyle} value={v.site} onChange={e=>set("site", e.target.value)}>
              <option value="">— choose —</option>
              {places.map(x => <option key={x} value={x}>{x}</option>)}
            </select>
          </Field>
        </div>

        <ManagedSelect label="Utility" required value={v.utilityType} onChange={x=>set("utilityType", x)}
          options={utilTypes}
          onAddOption={(n)=>addToList(lists, setLists, "utilityType", n)}
          addPrompt="Name of the new utility:" />

        <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:12 }}>
          <Field label="Provider">
            <input style={inputStyle} value={v.provider} onChange={e=>set("provider", e.target.value)}
              placeholder="e.g. MPPKVVCL, Jio" />
          </Field>
          <Field label="Consumer / account no.">
            <input style={inputStyle} value={v.consumerNo} onChange={e=>set("consumerNo", e.target.value)} />
          </Field>
        </div>
      </div>

      <div style={{ background:SURFACE, borderRadius:20, padding:20, marginBottom:12, border:`1px solid ${SAND}`, boxShadow:SHADOW }}>
        <div style={{ fontSize:15, fontWeight:700, color:INK, marginBottom:14 }}>2. The bill</div>

        <Field label="Bill amount" required hint="What the bill says you owe">
          <input type="number" inputMode="decimal" style={{...inputStyle, fontWeight:700, fontSize:20}}
            value={v.billAmount} onChange={e=>set("billAmount", e.target.value)} />
        </Field>

        <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:12 }}>
          <Field label="Bill number">
            <input style={inputStyle} value={v.billNo} onChange={e=>set("billNo", e.target.value)} />
          </Field>
          <Field label="Due date">
            <input type="date" style={inputStyle} value={v.dueDate} onChange={e=>set("dueDate", e.target.value)} />
          </Field>
        </div>

        <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:12 }}>
          <Field label="Period from">
            <input type="date" style={inputStyle} value={v.periodFrom} onChange={e=>set("periodFrom", e.target.value)} />
          </Field>
          <Field label="Period to">
            <input type="date" style={inputStyle} value={v.periodTo} onChange={e=>set("periodTo", e.target.value)} />
          </Field>
        </div>

        <button type="button" onClick={()=>setShowMeter(!showMeter)}
          style={{ width:"100%", padding:"11px 0", borderRadius:12, fontSize:13.5, fontWeight:600, marginBottom:14,
            background: showMeter ? INK : SURFACE, color: showMeter ? "#fff" : INK,
            border:`1px solid ${showMeter ? INK : SAND}`, cursor:"pointer" }}>
          {showMeter ? "Hide meter readings" : "Add meter readings (optional)"}
        </button>

        {showMeter && (
          <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:12 }}>
            <Field label="Previous reading">
              <input type="number" inputMode="decimal" style={inputStyle} value={v.meterPrev}
                onChange={e=>set("meterPrev", e.target.value)} />
            </Field>
            <Field label="Current reading">
              <input type="number" inputMode="decimal" style={inputStyle} value={v.meterCurr}
                onChange={e=>set("meterCurr", e.target.value)} />
            </Field>
          </div>
        )}
        {units > 0 && (
          <div style={{ background:"#F1F4F9", borderRadius:12, padding:12, marginBottom:14, fontSize:13, color:INK }}>
            <strong>{fmtINR(units)} units</strong> used
            {perUnit > 0 ? ` · ₹${perUnit.toFixed(2)} per unit` : ""}
          </div>
        )}
      </div>

      <div style={{ background:SURFACE, borderRadius:20, padding:20, marginBottom:12, border:`1px solid ${SAND}`, boxShadow:SHADOW }}>
        <div style={{ fontSize:15, fontWeight:700, color:INK, marginBottom:14 }}>3. What you paid</div>

        <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:12 }}>
          <Field label="Amount paid" hint="Leave blank if unpaid">
            <input type="number" inputMode="decimal" style={{...inputStyle, fontWeight:700}}
              value={v.paidAmount} onChange={e=>set("paidAmount", e.target.value)} />
          </Field>
          <Field label="Payment date">
            <input type="date" style={inputStyle} value={v.paymentDate} onChange={e=>set("paymentDate", e.target.value)} />
          </Field>
        </div>

        {bill > 0 && paidAmt > 0 && paidAmt !== bill && (
          <div style={{ background: out > 0 ? "#EEF0FE" : "#E6F7F2",
            border:`1px solid ${out > 0 ? AMBER : GREEN}`, borderRadius:12, padding:12, marginBottom:14,
            fontSize:13, color:INK, lineHeight:1.5 }}>
            {out > 0
              ? <span><strong>₹{fmtINR(out)} still to pay</strong> on this bill.</span>
              : <span><strong>₹{fmtINR(paidAmt - bill)} paid over</strong> the bill amount.</span>}
          </div>
        )}

        <Field label="Paid by">
          <select style={inputStyle} value={v.paymentMode} onChange={e=>set("paymentMode", e.target.value)}>
            <option value="">— choose —</option>
            {UTILITY_MODES.map(m => <option key={m} value={m}>{m}</option>)}
          </select>
        </Field>

        {isCardMode(v.paymentMode) && (
          <div style={{ background:"#EEF0FE", border:`1px solid ${AMBER}`, borderRadius:14, padding:14, marginBottom:14 }}>
            <SectionLabel>Card charge</SectionLabel>
            <div style={{ fontSize:12.5, color:MUTED, lineHeight:1.55, marginBottom:12 }}>
              Banks add a surcharge on utility payments by card. Record it here so the real cost is not understated.
            </div>
            {(cards||[]).length > 0 && (
              <Field label="Which card">
                <select style={inputStyle} value={v.cardId} onChange={e=>set("cardId", e.target.value)}>
                  <option value="">— not linked —</option>
                  {(cards||[]).map(c => (
                    <option key={c.id} value={c.id}>
                      {c.name}{c.surchargePct ? ` (${c.surchargePct}%)` : ""}
                    </option>
                  ))}
                </select>
              </Field>
            )}
            <Field label="Charge amount">
              <input type="number" inputMode="decimal" style={inputStyle} value={v.cardCharge}
                onChange={e=>set("cardCharge", e.target.value)} placeholder="0" />
            </Field>
            {card && Number(card.surchargePct||0) > 0 && (
              <button type="button" onClick={applySurcharge}
                style={{ width:"100%", padding:"11px 0", borderRadius:12, fontSize:13.5, fontWeight:700,
                  background:AMBER, color:"#fff", border:"none", cursor:"pointer" }}>
                Work it out at {card.surchargePct}%
              </button>
            )}
          </div>
        )}

        {(paidAmt > 0 || charge > 0) && (
          <div style={{ background:"#F1F4F9", borderRadius:14, padding:14, marginBottom:14 }}>
            <div style={{ display:"flex", justifyContent:"space-between", fontSize:13, marginBottom:4 }}>
              <span style={{ color:MUTED }}>Paid against bill</span>
              <span className="num" style={{ fontWeight:600, color:INK }}>₹{fmtINR(paidAmt)}</span>
            </div>
            {charge > 0 && (
              <div style={{ display:"flex", justifyContent:"space-between", fontSize:13, marginBottom:4 }}>
                <span style={{ color:MUTED }}>Card charge</span>
                <span className="num" style={{ fontWeight:600, color:AMBER }}>+ ₹{fmtINR(charge)}</span>
              </div>
            )}
            <div style={{ display:"flex", justifyContent:"space-between", fontSize:15, paddingTop:8, marginTop:4,
              borderTop:`1px solid ${SAND}` }}>
              <span style={{ fontWeight:700, color:INK }}>Total taken from account</span>
              <span className="num" style={{ fontWeight:800, color:INK }}>₹{fmtINR(debited)}</span>
            </div>
          </div>
        )}

        <div style={{ background: v.hasBill ? "#E6F7F2" : "#FDECEE",
          border:`1px solid ${v.hasBill ? GREEN : RED}`, borderRadius:14, padding:14, marginBottom:14 }}>
          <label style={{ display:"flex", alignItems:"center", gap:10, cursor:"pointer" }}>
            <input type="checkbox" checked={!!v.hasBill} onChange={e=>set("hasBill", e.target.checked)}
              style={{ width:20, height:20 }} />
            <span style={{ fontWeight:700, color:INK, fontSize:14 }}>Bill copy is on file</span>
          </label>
        </div>

        <Field label="Notes">
          <input style={inputStyle} value={v.notes} onChange={e=>set("notes", e.target.value)} />
        </Field>
      </div>

      <BigButton icon="check" label="Save Bill" onClick={()=>onSave(v)} tone="green" full />
    </div>
  );
}

/* ================= DIESEL & MACHINERY ================= */
function DieselTab({ machines, setMachines, diesel, setDiesel, recurring, vendors,
                     lists, setLists, showToast, goTo, openImport }){
  const L = lists || DEFAULT_LISTS;
  const [mode, setMode] = useState("purchase");     // purchase | usage | machines
  const [siteFilter, setSiteFilter] = useState("All");
  const [companyFilter, setCompanyFilter] = useState("All");
  const [showForm, setShowForm] = useState(false);
  const [draft, setDraft] = useState(null);
  const [editingMachine, setEditingMachine] = useState(null);
  const [openMachine, setOpenMachine] = useState(null);

  const sites = useMemo(
    () => [...new Set([...(L.sites||[]), ...diesel.map(d=>d.site).filter(Boolean)])].sort(),
    [L.sites, diesel]);
  const activeMachines = machines.filter(m => m.active !== false);

  const rows = useMemo(() => diesel
    .filter(d => d.type === (mode === "usage" ? "Issue" : "Purchase"))
    .filter(d => siteFilter === "All" || d.site === siteFilter)
    .filter(d => companyFilter === "All" || (d.company||"") === companyFilter)
    .sort((a,b) => String(b.date||"").localeCompare(String(a.date||"")) || (b.createdAt||0)-(a.createdAt||0)),
  [diesel, mode, siteFilter, companyFilter]);

  const scope = diesel
    .filter(d => siteFilter === "All" || d.site === siteFilter)
    .filter(d => companyFilter === "All" || (d.company||"") === companyFilter);
  const purchased = scope.filter(d=>d.type==="Purchase");
  const issued = scope.filter(d=>d.type==="Issue");
  const litresIn = purchased.reduce((s,d)=>s+Number(d.litres||0),0);
  const litresOut = issued.reduce((s,d)=>s+Number(d.litres||0),0);
  const valueIn = purchased.reduce((s,d)=>s+Number(d.amount||0),0);
  const avgRate = litresIn > 0 ? valueIn / litresIn : 0;
  const stock = litresIn - litresOut;
  const noBill = purchased.filter(d=>!d.hasBill);

  function openAdd(type){
    setDraft({ ...emptyDiesel, id: uid(), date: todayStr(), type,
      site: siteFilter !== "All" ? siteFilter : (sites.length === 1 ? sites[0] : "") });
    setShowForm(true);
  }

  function saveEntry(d){
    if (!d.date) return showToast("Enter the date", "error");
    if (!d.site) return showToast("Choose a site", "error");
    if (!d.litres || Number(d.litres) <= 0) return showToast("Enter the litres", "error");
    if (d.type === "Issue" && !d.machineId) return showToast("Choose the machine", "error");
    const rec = { ...d };
    if (rec.type === "Purchase") {
      const lit = Number(rec.litres||0), rate = Number(rec.rate||0), amt = Number(rec.amount||0);
      if (!amt && rate) rec.amount = +(lit * rate).toFixed(2);
      if (!rate && amt && lit) rec.rate = +(amt / lit).toFixed(2);
    }
    const exists = diesel.some(x => x.id === rec.id);
    setDiesel(exists ? diesel.map(x => x.id===rec.id ? rec : x)
                     : [...diesel, { ...rec, createdAt: Date.now() }]);
    setShowForm(false); setDraft(null);
    showToast(exists ? "Entry updated" : "Entry added");
  }
  function removeEntry(d){
    if (!confirm(`Delete this ${d.litres} L entry?`)) return;
    setDiesel(diesel.filter(x => x.id !== d.id));
    showToast("Deleted");
  }
  function saveMachine(m){
    if (!m.name.trim()) return showToast("Give the machine a name", "error");
    const exists = machines.some(x => x.id === m.id);
    setMachines(exists ? machines.map(x => x.id===m.id ? m : x) : [...machines, m]);
    setEditingMachine(null);
    showToast("Machine saved");
  }

  function exportDiesel(){
    if (diesel.length === 0 && machines.length === 0) { showToast("Nothing to export", "error"); return; }
    const nameOf = (id) => (machines.find(m=>m.id===id)||{}).name || "";
    const wb = XLSX.utils.book_new();

    const pRows = diesel.filter(d=>d.type==="Purchase")
      .sort((a,b)=>String(a.date||"").localeCompare(String(b.date||"")))
      .map(d => ({ Date:fmtDate(d.date), Type:"Purchase", Site:d.site||"", Company:d.company||"",
        "Supplier / Pump":d.supplier||"",
        Litres:Number(d.litres)||0, "Rate":Number(d.rate)||0, Amount:Number(d.amount)||0,
        "Bill No":d.billNo||"", "Bill Attached": d.hasBill ? "Yes" : "No",
        "Paid From":d.paidFrom||"", Company:d.company||"", Description:d.description||"" }));
    const pws = XLSX.utils.json_to_sheet(pRows);
    pws["!cols"] = [{wch:12},{wch:10},{wch:16},{wch:22},{wch:10},{wch:10},{wch:14},{wch:14},{wch:13},{wch:18},{wch:28}];
    XLSX.utils.book_append_sheet(wb, pws, "Purchases");

    const uRows = diesel.filter(d=>d.type==="Issue")
      .sort((a,b)=>String(a.date||"").localeCompare(String(b.date||"")))
      .map(d => ({ Date:fmtDate(d.date), Type:"Issue", Site:d.site||"", Company:d.company||"",
        Machine:nameOf(d.machineId),
        Litres:Number(d.litres)||0, "Meter Reading":d.meterReading||"", Operator:d.operator||"",
        Description:d.description||"" }));
    const uws = XLSX.utils.json_to_sheet(uRows);
    uws["!cols"] = [{wch:12},{wch:10},{wch:16},{wch:24},{wch:10},{wch:14},{wch:18},{wch:28}];
    XLSX.utils.book_append_sheet(wb, uws, "Usage");

    const mRows = machines.map(m => {
      const used = diesel.filter(d=>d.type==="Issue" && d.machineId===m.id);
      const eff = machineEfficiency(m.id, diesel, m.meterType);
      return { Machine:m.name, Code:m.code||"", Category:m.category||"", "Reg No":m.regNo||"",
        Ownership:m.ownership||"", Site:m.site||"", "Make / Model":m.makeModel||"",
        "Meter":m.meterType||"", "Rent":m.ownership==="On Rent" ? Number(m.rentAmount)||0 : "",
        "Rent Basis":m.ownership==="On Rent" ? (m.rentBasis||"") : "",
        "Owner":(vendors.find(v=>v.id===m.ownerLedgerId)||{}).name || "",
        "Diesel Issued (L)":used.reduce((s,d)=>s+Number(d.litres||0),0),
        "Efficiency": eff ? `${eff.value.toFixed(2)} ${eff.unit}` : "",
        Status: m.active === false ? "Inactive" : "Active" };
    });
    const mws = XLSX.utils.json_to_sheet(mRows);
    mws["!cols"] = [{wch:24},{wch:12},{wch:16},{wch:16},{wch:16},{wch:16},{wch:20},{wch:12},{wch:12},{wch:14},{wch:22},{wch:18},{wch:16},{wch:12}];
    XLSX.utils.book_append_sheet(wb, mws, "Machinery");

    const sSummary = [...new Set(diesel.map(d=>d.site).filter(Boolean))].map(st => ({
      Site:st,
      "Litres In":diesel.filter(d=>d.type==="Purchase"&&d.site===st).reduce((s,d)=>s+Number(d.litres||0),0),
      "Litres Out":diesel.filter(d=>d.type==="Issue"&&d.site===st).reduce((s,d)=>s+Number(d.litres||0),0),
      "Stock (L)":dieselStock(st, diesel),
      "Value Purchased":diesel.filter(d=>d.type==="Purchase"&&d.site===st).reduce((s,d)=>s+Number(d.amount||0),0),
    }));
    const sws = XLSX.utils.json_to_sheet(sSummary);
    sws["!cols"] = [{wch:18},{wch:12},{wch:12},{wch:12},{wch:18}];
    XLSX.utils.book_append_sheet(wb, sws, "Site Stock");

    XLSX.writeFile(wb, `Diesel_${todayStr()}.xlsx`);
    showToast("Exported");
  }

  /* ---- machine form ---- */
  if (editingMachine) {
    return <MachineForm m={editingMachine} vendors={vendors} recurring={recurring} lists={L} setLists={setLists}
      onCancel={()=>setEditingMachine(null)} onSave={saveMachine} />;
  }

  /* ---- machine detail ---- */
  if (openMachine) {
    const m = machines.find(x => x.id === openMachine.id) || openMachine;
    const used = diesel.filter(d=>d.type==="Issue" && d.machineId===m.id)
      .sort((a,b)=>String(b.date||"").localeCompare(String(a.date||"")));
    const totalL = used.reduce((s,d)=>s+Number(d.litres||0),0);
    const eff = machineEfficiency(m.id, diesel, m.meterType);
    const owner = vendors.find(v=>v.id===m.ownerLedgerId);
    const commit = (recurring||[]).find(r=>r.id===m.commitmentId);
    return (
      <div>
        <button onClick={()=>setOpenMachine(null)}
          style={{ display:"flex", alignItems:"center", gap:6, marginBottom:16, fontSize:14, fontWeight:600, color:INK, background:"none", border:"none", cursor:"pointer" }}>
          <Icon name="close" size={16} /> All machines
        </button>
        <div style={{ background:GRAD_INK, borderRadius:22, padding:22, marginBottom:14, boxShadow:SHADOW_LG }}>
          <div style={{ fontSize:12, fontWeight:600, color:"#8FA0BC", textTransform:"uppercase", letterSpacing:"0.06em" }}>
            {m.ownership}{m.category ? " · "+m.category : ""}
          </div>
          <div style={{ fontSize:20, fontWeight:700, color:"#fff", marginTop:6 }}>{m.name}</div>
          {m.regNo && <div style={{ fontSize:13, color:"#8FA0BC", marginTop:4 }}>{m.regNo}</div>}
          <div className="num" style={{ fontSize:28, fontWeight:800, color:"#fff", marginTop:14 }}>
            {fmtINR(totalL)} <span style={{ fontSize:14, fontWeight:500, color:"#8FA0BC" }}>litres issued</span>
          </div>
          {eff && (
            <div style={{ marginTop:8, fontSize:13, color:"#fff", fontWeight:600 }}>
              {eff.value.toFixed(2)} {eff.unit} over {fmtINR(eff.span)} {m.meterType === "Kilometres" ? "km" : "hours"}
            </div>
          )}
        </div>

        <div style={{ background:SURFACE, borderRadius:20, padding:"4px 20px 16px", marginBottom:14, border:`1px solid ${SAND}`, boxShadow:SHADOW }}>
          <div style={{ paddingTop:16 }}><SectionLabel>Details</SectionLabel></div>
          <DetailRow label="Code" value={m.code} />
          <DetailRow label="Site" value={m.site} />
          <DetailRow label="Make / Model" value={m.makeModel} />
          <DetailRow label="Meter" value={m.meterType} />
          {m.ownership === "On Rent" && (
            <React.Fragment>
              <DetailRow label="Rent" value={m.rentAmount ? `₹${fmtINR(m.rentAmount)} ${m.rentBasis||""}` : ""} />
              <DetailRow label="Owner" value={owner ? owner.name : ""} />
            </React.Fragment>
          )}
          {commit && <DetailRow label="Linked to" value={`${commit.name} · ₹${fmtINR(commit.amount)} ${commit.frequency}`} />}
          <DetailRow label="Notes" value={m.notes} />
        </div>

        <div style={{ background:SURFACE, borderRadius:20, padding:16, marginBottom:14, border:`1px solid ${SAND}`, boxShadow:SHADOW }}>
          <div style={{ fontWeight:700, color:INK, fontSize:14, marginBottom:10 }}>Diesel issued ({used.length})</div>
          {used.length === 0 ? (
            <div style={{ fontSize:13, color:MUTED }}>Nothing issued to this machine yet.</div>
          ) : used.slice(0,30).map((d,i) => (
            <div key={d.id} style={{ padding:"8px 0", borderTop: i? `1px solid ${SAND}`:"none",
              display:"flex", justifyContent:"space-between", gap:8 }}>
              <div>
                <div style={{ fontSize:13, fontWeight:600, color:INK }}>{fmtDate(d.date)}</div>
                <div style={{ fontSize:12, color:MUTED, marginTop:2 }}>
                  {d.meterReading ? `meter ${d.meterReading}` : "no meter reading"}{d.operator ? " · "+d.operator : ""}
                </div>
              </div>
              <div className="num" style={{ fontWeight:700, color:INK }}>{d.litres} L</div>
            </div>
          ))}
        </div>

        <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:10 }}>
          <BigButton icon="edit" label="Edit" onClick={()=>{ setOpenMachine(null); setEditingMachine(m); }} tone="amber" full />
          <BigButton icon="plus" label="Issue Diesel" onClick={()=>{
            setOpenMachine(null); setMode("usage");
            setDraft({ ...emptyDiesel, id: uid(), date: todayStr(), type:"Issue", machineId:m.id, site:m.site||"" });
            setShowForm(true);
          }} tone="green" full />
        </div>
      </div>
    );
  }

  /* ---- main screen ---- */
  return (
    <div>
      <button onClick={()=>goTo("dashboard")}
        style={{ display:"flex", alignItems:"center", gap:6, marginBottom:16, fontSize:14, fontWeight:600, color:INK, background:"none", border:"none", cursor:"pointer" }}>
        <Icon name="close" size={16} /> Back to dashboard
      </button>

      <div style={{ display:"flex", gap:8, marginBottom:14 }}>
        {[["purchase","Purchases"],["usage","Usage"],["machines","Machines"]].map(([k,lbl]) => (
          <button key={k} onClick={()=>{ setMode(k); setShowForm(false); }}
            style={{ flex:1, padding:"11px 0", borderRadius:12, fontSize:14, fontWeight:mode===k?700:600, cursor:"pointer",
              background: mode===k?INK:SURFACE, color: mode===k?"#fff":INK, border:`1px solid ${mode===k?INK:SAND}` }}>
            {lbl}
          </button>
        ))}
      </div>

      {mode !== "machines" && (
        <React.Fragment>
          <div style={{ background:GRAD_INK, borderRadius:20, padding:18, marginBottom:14, boxShadow:SHADOW_LG }}>
            <div style={{ fontSize:12, color:"#8FA0BC", fontWeight:600 }}>
              Stock in hand{siteFilter !== "All" ? ` · ${siteFilter}` : " · all sites"}
            </div>
            <div className="num" style={{ fontSize:28, fontWeight:800, color: stock < 0 ? "#FFB4B4" : "#fff", marginTop:4 }}>
              {fmtINR(stock)} <span style={{ fontSize:14, fontWeight:500, color:"#8FA0BC" }}>litres</span>
            </div>
            <div style={{ display:"flex", gap:16, marginTop:12, flexWrap:"wrap" }}>
              <div><div style={{ fontSize:11, color:"#8FA0BC" }}>Purchased</div>
                <div className="num" style={{ fontSize:14, fontWeight:700, color:"#fff" }}>{fmtINR(litresIn)} L</div></div>
              <div><div style={{ fontSize:11, color:"#8FA0BC" }}>Issued</div>
                <div className="num" style={{ fontSize:14, fontWeight:700, color:"#fff" }}>{fmtINR(litresOut)} L</div></div>
              <div><div style={{ fontSize:11, color:"#8FA0BC" }}>Avg rate</div>
                <div className="num" style={{ fontSize:14, fontWeight:700, color:"#fff" }}>₹{fmtINR(avgRate)}</div></div>
            </div>
            {stock < 0 && (
              <div style={{ marginTop:10, fontSize:12, fontWeight:600, color:"#FFB4B4" }}>
                More issued than purchased — a purchase entry is probably missing.
              </div>
            )}
          </div>

          {(() => {
            const comps = [...new Set(diesel.map(d=>d.company).filter(Boolean))].sort();
            if (comps.length < 2) return null;
            return (
              <div style={{ display:"flex", gap:8, marginBottom:12, overflowX:"auto", paddingBottom:4 }}>
                {["All", ...comps].map(x => {
                  const on = companyFilter === x;
                  const t = x === "All" ? null : diesel
                    .filter(d => d.company === x && d.type === (mode === "usage" ? "Issue" : "Purchase"))
                    .reduce((a,d)=>a+Number(d.litres||0), 0);
                  return (
                    <button key={x} onClick={()=>setCompanyFilter(x)}
                      style={{ padding:"8px 13px", borderRadius:12, fontSize:13, fontWeight:600,
                        whiteSpace:"nowrap", cursor:"pointer",
                        background: on?GREEN:SURFACE, color: on?"#fff":INK, border:`1px solid ${on?GREEN:SAND}` }}>
                      {x === "All" ? "All companies" : x}{t !== null ? ` · ${fmtINR(t)} L` : ""}
                    </button>
                  );
                })}
              </div>
            );
          })()}

          {sites.length > 0 && (
            <div style={{ display:"flex", gap:8, marginBottom:12, overflowX:"auto", paddingBottom:4 }}>
              {["All", ...sites].map(x => (
                <button key={x} onClick={()=>setSiteFilter(x)}
